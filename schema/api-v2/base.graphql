  Since v86.0.0: deletes a series, an account playlist or a universe playlist (never WATCH_LATER: INVALID_REQUEST); its videos stay.
  PLAYLIST_NOT_FOUND, PLAYLIST_NOT_ALLOWED. True once done.
  """
  deletePlaylist(playlistId: ID!, requestId: ID!): Boolean

  """
  Since v86.0.0: adds a post with a video at a position (none: at the end; "Watch later": playlistId of
  playlistsHub.watchLater) in a section of a course (sectionId). PLAYLIST_FULL (500), PLAYLIST_VIDEO_INVALID,
  PLAYLIST_NOT_ALLOWED. A video already there is moved. Notifies SERIES_EPISODE to the followers of a series
  when added at its end (since v86.1.0, never for a PRIVATE series); never anything for an account playlist
  (since v86.2.0), which takes a post with a video of any author, never of a private universe
  (PLAYLIST_VIDEO_INVALID). Since v87.1.0 (D-264): an account playlist takes a video of a private universe the
  caller is a member of (a video the caller cannot read: PLAYLIST_VIDEO_INVALID); a course takes a post with text
  or images and no video (kind POST; outside a course: PLAYLIST_VIDEO_INVALID), counted among the 500
  (PLAYLIST_FULL), never notified as an episode. Since v87.2.0: a video of a private universe added to a PUBLIC or
  UNLISTED account playlist that holds no other video of that universe needs revealMembership true
  (PLAYLIST_REVEALS_MEMBERSHIP, errorInfo { universes }): it shows that the caller is a member of it. Since v91.1.0:
  passageStartMs and passageEndMs add a passage of a long video (both or none; PLAYLIST_PASSAGE_INVALID when the end
  is not after the start, beyond the length, under 1 second, or the video is not a long video), an item of its own,
  so that a video may be in a playlist as several passages; a MONTAGE takes passages of the caller's own long videos
  only (MONTAGE_OWN_VIDEOS_ONLY). Since v92.1.0: stageIndex ties the item to a stage of the route of a playlist of
  the form ROUTE (INVALID_REQUEST for another form or an index out of its stages). Since v101.3.0 (routes.feature):
  stageIndex is the position, from 0, of the stage in the stages the caller sees (PlaylistItem.stageIndex);
  INVALID_REQUEST for a stage another item is already tied to, and while the caller may no longer read the route of the
  playlist; position is not used with a stageIndex, the item taking the place of its stage in the order of the
  stages. To untie an item: removeFromPlaylist, then addToPlaylist without stageIndex (the item was already there:
  the client sends revealMembership true).
  """
  addToPlaylist(playlistId: ID!, postId: ID!, position: Int, sectionId: ID, revealMembership: Boolean, passageStartMs: Int, passageEndMs: Int, stageIndex: Int, requestId: ID!): Playlist

  """
  Since v91.1.0: records a montage view of the caller, once it played the MONTAGE 30 seconds; counted once per
  account, per montage and per day (a second call that day changes nothing). PLAYLIST_NOT_FOUND;
  MONTAGE_NOT_ALLOWED for a playlist that is not a MONTAGE. Returns the playlist (montageViewCount).
  """
  recordMontageView(playlistId: ID!, requestId: ID!): Playlist

  """
  Since v92.1.0 (routes.feature): creates or changes a route (input.id). The rules of a route of a universe event
  (ROUTE_INVALID: 2 to 100 points placed point by point, or 1,000 points drawn by hand, 500 kilometres at most); ROUTE_NAME_TAKEN for a name the owner already uses;
  ROUTE_NOT_FOUND; a universe route by its leadership only (LEADERSHIP_ONLY). Returns the route.
  """
  saveMapRoute(input: MapRouteInput!, requestId: ID!): MapRoute

  """
  Since v92.1.0: deletes a route of the caller (or of its universe, by its leadership); the universe events that
  carry it keep a copy of its line. ROUTE_NOT_FOUND. Returns true.
  """
  deleteMapRoute(id: ID!, requestId: ID!): Boolean

  """
  Since v92.1.0: "Do this route": copies a route the caller reads into its own routes, PRIVATE, crediting the original
  (copiedFrom). ROUTE_NOT_FOUND, ROUTE_NAME_TAKEN (name: the name of the copy, the original's when not given).
  Returns the copy.
  """
  copyMapRoute(id: ID!, name: String, requestId: ID!): MapRoute

  """
  Since v92.1.0: imports a GPX file (its text, 2 MB at most) as a PRIVATE route of the caller: its track simplified,
  keeping its shape, to at most 1,000 points, its waypoints as stages (60 at most). ROUTE_GPX_INVALID, ROUTE_NAME_TAKEN. Returns the route.
  """
  importGpxRoute(gpx: String!, name: String!, mode: RouteMode!, requestId: ID!): MapRoute

  """
  Since v92.1.0: sets the privacy zones of the caller, 0 to 3 (ROUTE_PRIVACY_ZONES_INVALID beyond, or a radius other
  than 200, 500 or 1,000 metres). Returns them.
  """
  setRoutePrivacyZones(zones: [RoutePrivacyZoneInput!]!, requestId: ID!): [RoutePrivacyZone!]

  """
  Since v87.5.0 (D-268): adds a course link to a course (form CHAPTERS; another form, WATCH_LATER included:
  PLAYLIST_ITEM_INVALID), by who changes the playlist (PLAYLIST_NOT_ALLOWED). Its destination is read once and
  reviewed like the destination of an ad (contracts/advertising.md § Formats): https, no redirect chain to another
  domain, no value per reader (LINK_DESTINATION_INVALID, errorInfo { reason }); its link preview built then (as
  linkPreview; none: preview null). PLAYLIST_FULL (500 playlist items), PLAYLIST_NOT_FOUND, PLAYLIST_TAG_LIMIT,
  PLAYLIST_TAG_INVALID, INVALID_REQUEST (a title out of 1 to 80 visible characters, an unknown sectionId). Never
  notified. Returns the playlist.
  """
  addLinkToPlaylist(playlistId: ID!, input: PlaylistLinkInput!, requestId: ID!): Playlist

  """
  Since v87.5.0 (D-268): a signed form to upload the file of a course document (POST the fields, then the file, to
  url), by who changes the course (PLAYLIST_NOT_ALLOWED; not a course: PLAYLIST_ITEM_INVALID):
  DOCUMENT_FORMAT_NOT_ALLOWED (not application/pdf nor text/markdown), DOCUMENT_TOO_LARGE (a PDF document over 20
  MB, a markdown document over 200 KB; errorInfo { max } in bytes), DOCUMENT_LIMIT (errorInfo { max }: 50 course
  documents per account, 100 with X2, 500 with X10, whatever their versions; a human never pays to go beyond;
  checked here for a new course document and again by addDocumentToPlaylist). 24 hours to use it, as
  requestMediaUpload. Once uploaded, the file goes through the malware scan and the media review before it is
  served. Since v87.6.0 (D-269): input.playlistId absent, the file of a post document (PostDocumentInput), under the
  same format and size rules; DOCUMENT_LIMIT then counts the post documents of the account (50, 100 with X2, 500
  with X10), a separate count from the course documents, each file counted once from this upload until its post or
  post draft is deleted, or the upload expires unused after 24 hours.
  """
  requestDocumentUpload(input: DocumentUploadInput!, requestId: ID!): MediaUpload

  """
  Since v87.5.0 (D-268): adds a course document to a course, or gives a new file to one (input.itemId: a new
  version), from a file uploaded with requestDocumentUpload for that playlist (INVALID_REQUEST otherwise).
  DOCUMENT_RIGHTS_REQUIRED (rightsConfirmed false), DOCUMENT_MALICIOUS (the malware scan already found the file
  malicious), DOCUMENT_LIMIT, PLAYLIST_ITEM_INVALID (not a course), PLAYLIST_FULL, PLAYLIST_NOT_ALLOWED,
  PLAYLIST_NOT_FOUND, PLAYLIST_TAG_LIMIT, PLAYLIST_TAG_INVALID. The item, or its new version, stays CHECKING until
  its malware scan and its media review are done, then READY, or REFUSED (the uploader notified, DOCUMENT_REFUSED;
  a new version refused leaves the version before served). Its bytes count in the consumption of the account of
  its uploader. Returns the playlist.
  """
  addDocumentToPlaylist(playlistId: ID!, input: PlaylistDocumentInput!, requestId: ID!): Playlist

  """
  Since v87.5.0 (D-268): changes a course link or a course document of a course (itemId: PlaylistCourseItem.id), by
  who changes the playlist (PLAYLIST_NOT_ALLOWED): its title, the URL of a course link (LINK_DESTINATION_INVALID),
  its place, its playlist tags (PLAYLIST_TAG_LIMIT, PLAYLIST_TAG_INVALID). INVALID_REQUEST when the item is not in
  the playlist, for url on a DOCUMENT, and for a removed item. Returns the playlist.
  """
  updatePlaylistCourseItem(playlistId: ID!, itemId: ID!, input: PlaylistCourseItemChangeInput!, requestId: ID!): Playlist

  """
  Since v87.5.0 (D-268): removes a course link, a course document (its file deleted; it no longer counts against
  DOCUMENT_LIMIT) or a removed item from a course, by who changes the playlist (PLAYLIST_NOT_ALLOWED). True once
  done, also when it was not there.
  """
  removePlaylistCourseItem(playlistId: ID!, itemId: ID!, requestId: ID!): Boolean

  """
  Since v87.5.0 (D-268): checks a course link or a course document for the caller: a course link once opened from
  the course, a PDF document once opened, a markdown document once scrolled to 90 % of it (the app calls it then).
  PLAYLIST_NOT_FOUND; INVALID_REQUEST when the item is not in the playlist, is a removed item or a course document
  not READY. With ordered playback, a course link or a course document is an item before like a video; a removed
  item is skipped. True once done, also when already checked.
  """
  checkPlaylistCourseItem(playlistId: ID!, itemId: ID!, requestId: ID!): Boolean

  """
  Since v86.0.0: removes a video from a playlist. True once done, also when it was not there.
  """
  removeFromPlaylist(playlistId: ID!, postId: ID!, requestId: ID!): Boolean

  """
  Since v86.0.0: moves a video of a playlist to a position (from 1) and, in a course, a section.
  PLAYLIST_NOT_ALLOWED, INVALID_REQUEST for a position out of the playlist. Since v101.3.0: in a playlist of the
  form ROUTE, INVALID_REQUEST for a move that breaks the order of the stages of its items tied to stages; an item
  tied to no stage moves freely.
  """
  movePlaylistItem(playlistId: ID!, postId: ID!, position: Int!, sectionId: ID, requestId: ID!): Playlist

  """
  Since v86.0.0: follows (true) or unfollows (false) a series, an account playlist (since v86.2.0) or a
  universe playlist (never WATCH_LATER:
  INVALID_REQUEST). PLAYLIST_ADDRESS_INVALID, PLAYLIST_NOT_FOUND, PLAYLIST_RESERVED. Since v86.1.0: a PUBLIC or
  UNLISTED playlist is followed by whoever reads it; a PRIVATE one by nobody (its owner: INVALID_REQUEST;
  anyone else: PLAYLIST_NOT_FOUND); unfollowing (false) always succeeds, even once the playlist is no longer readable.
  """
  setPlaylistFollow(address: String!, following: Boolean!, requestId: ID!): Playlist

  """
  Since v86.0.0: pins (true) or unpins (false) a universe playlist on the page of its universe, by its
  leadership. PINNED_PLAYLIST_LIMIT (3), PLAYLIST_NOT_ALLOWED.
  """
  pinPlaylist(playlistId: ID!, pinned: Boolean!, requestId: ID!): Playlist

  """
  Since v86.0.0: records where the caller is in a long video (postId) and, when played from a playlist, its
  playlistId: the second, every 30 seconds of play and at a stop; watched true once played to its last 10 % (since
  v87.1.0: to 90 % of its length; with playlistId, it checks the item in that playlist, on every playlist form).
  The start of a video of a course with ordered playback whose video before is not watched:
  PLAYLIST_ORDER_REQUIRED. One write per call, kept 1 year. Returns true.
  """
  recordPlayback(postId: ID!, playlistId: ID, seconds: Int!, watched: Boolean, requestId: ID!): Boolean

  """
  Since v87.1.0 (D-264): checks a post (kind POST) of a course for the caller, once opened from it. A video is checked by recordPlayback. PLAYLIST_NOT_FOUND,
  INVALID_REQUEST when the post is not in the playlist. True once done, also when already checked.
  """
  checkPlaylistItem(playlistId: ID!, postId: ID!, requestId: ID!): Boolean

  """
  Since v87.1.0: clears every checkmark of the caller in a playlist, every playlist track together; the resume
  point stays. PLAYLIST_NOT_FOUND. True once done.
  """
  resetPlaylistProgress(playlistId: ID!, requestId: ID!): Boolean

  """
  Since v87.1.0: shows (true) or hides (false) the checkmarks of a SIMPLE playlist for the caller
  (PLAYLIST_CHECKMARKS_NOT_HIDDEN for another form; showing always succeeds). PLAYLIST_NOT_FOUND. Returns the playlist.
  """
  setPlaylistCheckmarks(playlistId: ID!, shown: Boolean!, requestId: ID!): Playlist

  """
  Since v87.1.0: sets the playlist tags of an item of a playlist, all at once (empty: none), by who changes the
  playlist (PLAYLIST_NOT_ALLOWED). PLAYLIST_TAG_LIMIT (8 per playlist, errorInfo { max }), PLAYLIST_TAG_INVALID,
  INVALID_REQUEST when the post is not in the playlist. Returns the playlist.
  """
  setPlaylistItemTags(playlistId: ID!, postId: ID!, tags: [String!]!, requestId: ID!): Playlist

  """
  Since v87.1.0: the caller picks the playlist track of a playlist (its track name; none: back to the track by
  default), kept with the resume point. PLAYLIST_TRACK_INVALID for an unknown track name. Returns the playlist.
  """
  setPlaylistTrack(playlistId: ID!, track: String, requestId: ID!): Playlist

  """
  Since v87.1.0: sets the playlist tracks of a playlist, all at once, in order (empty: none), by who changes the
  playlist (PLAYLIST_NOT_ALLOWED). PLAYLIST_TRACK_LIMIT (10, errorInfo { max }), PLAYLIST_TRACK_INVALID,
  PLAYLIST_TAG_INVALID. A track a reader chose that is removed: back to the track by default. Returns the playlist.
  """
  setPlaylistTracks(playlistId: ID!, tracks: [PlaylistTrackInput!]!, requestId: ID!): Playlist

  """
  Since v86.0.0 (long-videos.feature): sets the chapters of a long video of the caller, all at once (empty:
  none). CHAPTERS_INVALID, CHAPTERS_NOT_ALLOWED. Returns the long video.
  """
  setChapters(postId: ID!, chapters: [ChapterInput!]!, requestId: ID!): LongVideo
}
