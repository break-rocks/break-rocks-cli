  by: AccountRef
  """
  Whether it is the default text of the platform.
  """
  isDefault: Boolean!
  """
  The text as written.
  """
  text: String
  """
  Its version, which grows at each publication.
  """
  version: Int!
}

"""
A page of the versions of a text of a universe, the most recent first.
"""
type UniverseTextPage {
  """
  The universe text items of this page.
  """
  items: [UniverseText!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
The welcome wall of a public universe (welcome-wall.feature): its new residents of the last 7 days ("count"),
the most recent first.
"""
type WelcomeWall {
  """
  The new residents on the wall.
  """
  count: Int!
  """
  The welcome wall items of this page.
  """
  items: [NewResident!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}
