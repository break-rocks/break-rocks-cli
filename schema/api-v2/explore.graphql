"""
Since v128.0.0 (D-408, posts/explore-search.feature; contracts/map.md § The explore filter): the explore filter, as
exploreSearch, randomHighlight and, since D-419, universeFilterChoices read it. area: the area shown; null for randomHighlight only, the whole world (the map
under the zoom 3); exploreSearch answers INVALID_REQUEST without it. query: the words, 2 to 200 characters, as search
takes them; null: no words, for randomHighlight only (exploreSearch answers INVALID_REQUEST without words: without
them the apps count what the map shows); an address alone is landed by the app (D-246), and an address of a public
universe followed by words is sent as mapFilter and query. when: the time window, DAYS
when not given. days: with DAYS only, 1 to 90, 7 when not given (INVALID_REQUEST otherwise; the time slider sends DAYS
and its days). kinds: the map kinds chosen, every one when not given (since D-437, every one of before D-437: EXPERIENCES is never implied, so
that an app built before D-437 never receives EXPERIENCES, EXPERIENCE, EXPERIENCE_RUN, GROUP_RUNS nor ROUTE_EXPERIENCES;
EXPERIENCES counts only when named in kinds, by a caller signed in, while the experiences are open); PEOPLE is ignored (the app holds the people it
shows and adds them); since D-478, UNIVERSE results whatever kinds (AREA: the universe filter only). families: the keys of the event families chosen (EventFamily.key, as universeEvents takes them),
every one when not given; since v129.0.0 (D-410), the apps keep the event families chosen while EVENTS is not among
the kinds, without effect: given with kinds that leave out EVENTS, families is ignored.
mapFilter: the map filter, an address of at most one public universe and its tags ("%paris#market", "#market"), as the
link carries it: its universe is the universe filter of the explore filter (the where of the explore filter until
D-419; since D-419, apart from where, which holds places only: area), its tags are a part of what; null: none; an invalid
part is left out; with words, a result carries one of its tags and the words. scope: AREA (the default) or EVERYWHERE
(randomHighlight ignores it). order: in the area, HIGHLIGHTS only (the order of the map highlights among what matches,
the default there); everywhere, RELEVANCE (the default there) or DATE, as the reader orders them; another order answers
INVALID_REQUEST. access: since D-415 (map/route-findability.feature), the route accessibility filter, the route
accessibility boxes chosen: only the routes that have every one of them ticked (MapRoute.access), the other kinds
unchanged; null or empty: none; given with kinds that leave out ROUTES, ignored, as families without EVENTS. Since
D-415, the words also find a route by its route context and its route description (§ The route context).
experienceDuration and experienceCompany: since D-437 (posts/explore-things-to-do.feature), the experience duration
filter and the experience company filter (null: "All"); given with kinds that leave out EXPERIENCES, ignored, as access
without ROUTES. HOUR, DAY and LONGER keep the simple challenges whose experience template sets the hours of an experience
instance (challenge.endsWithinHours, the default of an experience parameter) to at most 1, at most 24, or more than 24,
and the group experience instances of those; a route experience stays whatever the duration (it keeps no time). SOLO
keeps the route experiences and the simple challenges; GROUP keeps the group experience instances (EXPERIENCE_RUN) the
caller may join now (MapExperienceRun.canJoin true, D-442 (Q19)); without experienceCompany, those it may not join are
answered too, with canJoin false (D-442 (Q15)).
"""
input ExploreFilterInput {
  area: ExploreAreaInput
  query: String
  when: ExploreWhen
  days: Int
  kinds: [MapKind!]
  families: [String!]
  mapFilter: String
  scope: ExploreScope
  order: ExploreOrder
  access: [RouteAccess!]
  experienceDuration: ExperienceDuration
  experienceCompany: ExperienceCompany
}

"""
Since D-437 (posts/explore-things-to-do.feature): the experience duration filter (ExploreFilterInput.experienceDuration):
HOUR "1 hour at most", DAY "1 day at most", LONGER "Longer", on the hours of an experience instance of a simple
challenge; "All" is null.
"""
enum ExperienceDuration {
  DAY
  HOUR
  LONGER
}

"""
Since D-437 (posts/explore-things-to-do.feature): the experience company filter (ExploreFilterInput.experienceCompany):
SOLO "Alone" (the route experiences and the simple challenges, started alone at once), GROUP "In a group" (the group
experience instances the caller may join now, MapExperienceRun.canJoin, D-442 (Q19)); "All" is null.
"""
enum ExperienceCompany {
  GROUP
  SOLO
}

"""
Since v128.0.0 (D-408): the area shown, as the files of the map highlights read it: mapCells, the H3 cells of one
resolution (0 to 9) that cover it, 1 to 7 (INVALID_REQUEST otherwise), and band, its zoom band. Never the position of
the device.
"""
input ExploreAreaInput {
  mapCells: [String!]!
  band: ZoomBand!
}

"""
Since v128.0.0 (D-408): a zoom band (map-highlights.feature): COUNTRY under the zoom 9, CITY from 9 to under 12,
NEIGHBOURHOOD from 12 to under 15, STREET from 15.
"""
enum ZoomBand {
  CITY
  COUNTRY
  NEIGHBOURHOOD
  STREET
}

"""
Since v128.0.0 (D-408): the time window of the explore filter, in the times of the area shown: NOW the next 60 minutes;
TONIGHT from 6 p.m. today (from now when later) to 6 a.m. the next day; WEEKEND from Friday 6 p.m. to Sunday midnight
(from now during it); DAYS from now to ExploreFilterInput.days days: an event type on the map of Explore within that
number of days, and a universe event shown beyond its universe (D-383) within 30 days for a window of 7 days or more,
within the window for a shorter one (so a longer window never shows less). It narrows the universe events (in progress
at a moment of the window) and the live shares only.
"""
enum ExploreWhen {
  DAYS
  NOW
  TONIGHT
  WEEKEND
}

"""
Since v128.0.0 (D-408): AREA, what the explore filter finds in the area shown ("In the area"); EVERYWHERE, what it finds
without the area ("Everywhere"), the search of the social platform included (accounts, universe discussions, playlists,
tags).
"""
enum ExploreScope {
  AREA
  EVERYWHERE
}

"""
Since v128.0.0 (D-408): the order of the results: HIGHLIGHTS, the order of the map highlights among what matches (the
list of the map says the same as the map; in the area only); RELEVANCE, as search ranks, and DATE, the most recent
first (everywhere only, as the reader orders them).
"""
enum ExploreOrder {
  DATE
  HIGHLIGHTS
  RELEVANCE
}

"""
Since v128.0.0 (D-408, posts/explore-search.feature): an explore reason, what a result tells of why it is there:
IN_TIME_WINDOW (it takes place in the time window), IN_AREA (it is in the area), CROSSES_AREA (a route that crosses the
area), TERRITORY_IN_AREA (a universe whose universe territory meets the area; since D-478, only the universe of the
universe filter, in the area), WORD_IN_NAME (a word is in its name, its
title or its display name; since D-418, for a route, its name or its route title), WORD_IN_TEXT (a word is in the text of a post), WORD_IN_SEARCH_WORDS (a word is a universe
search word or a platform search word of a universe), CARRIES_TAG (it carries a tag of the words or of the map filter).
Since D-415 (map/route-findability.feature), for a route: PASSES_BY (a crossed place of its route context holds every
word, "passes by the Étangs de Cergy"), STARTS_IN (its route start area holds every word, "starts in Cergy, Port
Cergy"), THROUGH_ENVIRONMENT (a route environment, named in the language of the caller or in English, "through
forest"), CROSSES_TERRITORY (the address of a universe whose universe territory it crosses, "crosses the territory of
%cergy"), WORD_IN_DESCRIPTION (a word is in its route description), DECLARED_ACCESS (a route accessibility box of the
route accessibility filter that it has ticked, "declared accessible with a pram"). The order the apps show them: the
time window, the place, the words (WORD_IN_NAME, WORD_IN_TEXT, WORD_IN_SEARCH_WORDS, PASSES_BY, STARTS_IN,
THROUGH_ENVIRONMENT, CROSSES_TERRITORY, WORD_IN_DESCRIPTION), the tags, then DECLARED_ACCESS. Since D-414, the apps
show them as icons on the result card and in words under "Why?" (posts/explore-search.feature): PASSES_BY the icon of the
kind of the crossed place, "Passes by <value>, a place your words name"; STARTS_IN the start flag, "Starts in <value>, an
area your words name"; THROUGH_ENVIRONMENT the icon of the environment, "<value> on at least 20 % of its length, a word
you searched"; CROSSES_TERRITORY the monogram of the universe, "Crosses the territory of <value>, a universe your words
name"; WORD_IN_DESCRIPTION the icon of a description, "<value> is in its description, a word you searched"; DECLARED_ACCESS the icon of the box,
"Declared accessible with <value> by its author, the box chosen in what"; in the language of the app. Never a reason
about the reader.
"""
enum ExploreReason {
  CARRIES_TAG
  CROSSES_AREA
  CROSSES_TERRITORY
  DECLARED_ACCESS
  IN_AREA
  IN_TIME_WINDOW
  PASSES_BY
  STARTS_IN
  TERRITORY_IN_AREA
  THROUGH_ENVIRONMENT
  WORD_IN_DESCRIPTION
  WORD_IN_NAME
  WORD_IN_SEARCH_WORDS
  WORD_IN_TEXT
}

"""
Since v128.0.0 (D-408): one explore reason of a result, in the order the apps show them (the time window, the place,
the words, the tags).
"""
type ExploreResultReason {
  """
  The explore reason.
  """
  reason: ExploreReason!
  """
  What matched, as written: the word for WORD_IN_NAME, WORD_IN_TEXT and WORD_IN_SEARCH_WORDS, the tag with its sign
  ("#jazz") for CARRIES_TAG; since D-415, the name of the crossed place in the language of the caller for PASSES_BY,
  the route start area ("Cergy, Port Cergy") for STARTS_IN, the RouteEnvironment value for THROUGH_ENVIRONMENT, the
  universe ("%cergy") for CROSSES_TERRITORY, the word for WORD_IN_DESCRIPTION, the RouteAccess value for
  DECLARED_ACCESS; null for the others.
  """
  value: String
}

"""
Since v128.0.0 (D-408): what a result of Explore is: a placed or unplaced post (POST), a post with a clip or a long video
(VIDEO), a place with a place experience (PLACE), a universe event (EVENT), a route (ROUTE), a public universe (UNIVERSE; since
D-478, in the area only the universe of the universe filter, none without one: map/map-universe-filter.feature), and,
everywhere only, an account (ACCOUNT), a universe discussion (DISCUSSION), a playlist (PLAYLIST) or a tag (TAG). Since
D-437 (posts/explore-things-to-do.feature): an experience (EXPERIENCE: a public route experience, in the area or
everywhere, or a public simple challenge, everywhere only) and a group experience instance of a universe event
(EXPERIENCE_RUN), both in ExploreResult.experience, answered only when the filter names EXPERIENCES in kinds.
"""
enum ExploreResultKind {
  ACCOUNT
  DISCUSSION
  EVENT
  EXPERIENCE
  EXPERIENCE_RUN
  PLACE
  PLAYLIST
  POST
  ROUTE
  TAG
  UNIVERSE
  VIDEO
}

"""
Since v128.0.0 (D-408, posts/explore-search.feature): a result of Explore, in the area or everywhere: its kind, its point
when it has a place, the object of its kind (one field set, the others null) and its explore reasons. A result with a
point moves the map over it when touched among the results everywhere (the app, at the zoom 16).
"""
type ExploreResult {
  """
  Its kind; the field of that kind is set.
  """
  kind: ExploreResultKind!
  """
  Its point on the map: the place of a placed post or a placed video, the point of interest of a place, the point of a
  universe event (the center of its zone), the start of a route as the caller sees its route start marker, the nearest
  point of the universe territory of a universe to the center of the area; null without a place (an unplaced post, an
  account, a universe discussion, a playlist, a tag, a universe without a universe territory).
  """
  point: Point
  """
  POST or VIDEO: the post as the caller reads it; null otherwise.
  """
  post: Post
  """
  POST or VIDEO placed on the map: what its map marker needs, as mapPosts answers it; null for an unplaced post and
  for the other kinds.
  """
  mapPost: MapPost
  """
  PLACE: the place with a place experience, as mapPlaceFeats answers it; null otherwise.
  """
  place: MapPlaceFeats
  """
  EVENT: the universe event as the caller reads it; null otherwise.
  """
  event: UniverseEvent
  """
  ROUTE: the route in its light form, as mapRouteMarkers answers it; null otherwise.
  """
  route: MapRouteMarker
  """
  UNIVERSE: the public universe, with its universe territory and its primary color as the list by AREA answers them;
  null otherwise. Since D-478, among the results everywhere, never moving the map; since D-479, a touch applies it as
  the universe filter, and "Go" (a signed-in caller) lands in it on its focus posts.
  """
  universe: ExploreUniverse
  """
  ACCOUNT: the account, as search answers it; null otherwise.
  """
  account: Account
  """
  DISCUSSION: the universe discussion; null otherwise.
  """
  discussion: UniverseDiscussion
  """
  PLAYLIST: the public playlist; null otherwise.
  """
  playlist: Playlist
  """
  TAG: the tag, with its sign ("#jazz"); null otherwise.
  """
  tag: String
  """
  Since D-437: EXPERIENCE or EXPERIENCE_RUN, the experience in its light form, as mapExperiences answers it (with run for
  EXPERIENCE_RUN); null otherwise. Its explore reasons: IN_TIME_WINDOW for a group experience instance, IN_AREA (a route
  experience whose route start lies in the area, a group experience instance whose universe event does), WORD_IN_NAME (a
  word in its title or its name).
  """
  experience: MapExperience
  """
  Its explore reasons, 1 at least for a result of exploreSearch; empty for the result of randomHighlight and
  highlightOfTheDay.
  """
  reasons: [ExploreResultReason!]!
}

"""
Since v128.0.0 (D-408): what a child cell of the area holds of one map kind among the results, for the density marks
of the map with words (they count only what carries the words).
"""
type ExploreDensity {
  """
  The child cell (H3), of the resolution the files of the map highlights use for the density of that zoom band.
  """
  mapCell: String!
  """
  The map kind; since D-437, EXPERIENCES only when the filter names it in kinds.
  """
  kind: MapKind!
  """
  The number of results of that map kind in that cell.
  """
  count: Int!
}

"""
Since v128.0.0 (D-408, posts/explore-search.feature): the results of the explore filter, one page of its scope, and the
two counts the list of results shows.
"""
type ExploreSearchResults {
  """
  "In the area · N": the number of results in the area shown (the people the app shows not counted: the app adds
  them). Without words, the apps do not read exploreSearch: "In the area · N" counts what the map shows, and
  "Everywhere · —" shows no number.
  """
  inArea: Int!
  """
  "Everywhere · M": the number of results without the area, counted as search counts (500 posts at most); when the
  posts reach that bound, the apps show "Everywhere · 500+".
  """
  everywhere: Int!
  """
  The results of the page, in the order asked.
  """
  items: [ExploreResult!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
  """
  AREA, first page only: what the area holds among the results beyond the page answered (the results the map draws
  one by one), by child cell and map kind, for the density marks; empty otherwise.
  """
  density: [ExploreDensity!]!
  """
  AREA, when inArea is 0: the nearest activity that carries the words (map-highlights.feature, D-353), within 500
  kilometres of the center of the area (the app shows its direction and its distance); null otherwise and when nothing
  is within 500 kilometres.
  """
  nearest: ExploreResult
  """
  The state of the search engine of the posts (with words), as search answers it; READY without words.
  """
  postsStatus: SearchPostsStatus!
  """
  While the engine of the posts starts, the seconds to wait before reading again; null otherwise.
  """
  retryAfterSeconds: Int
}

"""
Since D-414 (posts/explore-search.feature): the counts of the area summary of the area shown, the parts the apps put in
its sentence ("Tonight in the Marais: 3 concerts, 12 photos, 3 routes"), with the time they were computed.
"""
type AreaSummary {
  """
  The parts, at most 6, in the order the sentence shows them, the apps taking the first 3: the universe events (by event
  type when they all have one, else one part of all), since D-437 the experiences, the photos, the videos, the feats,
  the routes; with EXPERIENCES alone among kinds, GROUP_RUNS and ROUTE_EXPERIENCES, the most numerous first; with one map kind
  alone among kinds, its parts are its kinds, the most numerous first (the universe events by event type, the routes by
  main travel mode). A part at 0 is never answered; empty when the area holds nothing of the filter.
  """
  parts: [AreaSummaryPart!]!
  """
  When the counts were computed (the oldest of the cells read), shown by "How is it computed?".
  """
  computedAt: AWSDateTime!
}

"""
Since D-414: what an AreaSummaryPart counts: EVENTS, the universe events of the time window (in progress at a moment of
it); PHOTOS, the placed posts with a photo of the last 24 hours; VIDEOS, the placed videos of the last 24 hours; FEATS,
the experience feats published in the last 24 hours; ROUTES, the routes that cross the area. Since D-437
(posts/explore-things-to-do.feature): EXPERIENCES, the public route experiences whose route start lies in the area and
the group experience instances planned at universe events of the area (STARTED), their start within the time window; with EXPERIENCES alone among the
map kinds, its kinds: GROUP_RUNS, the group experience instances, and ROUTE_EXPERIENCES, the route experiences; each from
3 distinct accounts at least in each map cell before the cells are added up (D-428 (a); the experience owners, the
experience organizers, a universe counting as one account); answered only when the filter names EXPERIENCES in kinds.
"""
enum AreaSummaryKind {
  EVENTS
  EXPERIENCES
  FEATS
  GROUP_RUNS
  PHOTOS
  ROUTE_EXPERIENCES
  ROUTES
  VIDEOS
}

"""
Since D-414: one part of the area summary, a number and what it counts. Touching it in the app chooses its map kind
alone (PHOTOS: POSTS; EVENTS of one event type: EVENTS and its event family).
"""
type AreaSummaryPart {
  """
  What it counts.
  """
  kind: AreaSummaryKind!
  """
  EVENTS: the key of the event type they all have (the apps name it in the language of the app, from the event
  catalog); null when they are of several event types, and for the other kinds.
  """
  eventType: String
  """
  EVENTS with eventType: the key of its event family; null otherwise.
  """
  eventFamily: String
  """
  ROUTES, with ROUTES alone among the map kinds: the main travel mode of the routes it counts (D-413: the travel mode of the longest share of their length); null otherwise.
  """
  mode: RouteMode
  """
  The number, 1 at least.
  """
  count: Int!
}

"""
Since v128.0.0 (D-408): the number of public contents of one map kind.
"""
type MapKindCount {
  """
  The map kind: POSTS, VIDEOS, FEATS or EVENTS.
  """
  kind: MapKind!
  """
  The number.
  """
  count: Int!
}

"""
Since v128.0.0 (D-408): the activity of a map cell of about 1 kilometre (H3 resolution 8): its public contents of a
period (the last 7 days, for randomHighlight), a content of a private universe never counted, nor what the map keeps
out (map-highlights.feature).
"""
type MapCellActivity {
  """
  The map cell (H3, resolution 8).
  """
  mapCell: String!
  """
  The name of its place: the point of interest of the result when it has one, else the locality of the map cell from
  the cartography ("Vieux-Port, Marseille"); null when the cartography gives none.
  """
  name: String
  """
  The number of its public contents of the period: placed posts, placed videos, published experience feats and
  universe events in progress or held there.
  """
  contents: Int!
  """
  That number by map kind, the most numerous first; a map kind with none is not answered.
  """
  kinds: [MapKindCount!]!
}

"""
Since v128.0.0 (D-408, map-highlights.feature): the result of a random jump: the map highlight drawn, the activity of
its very lively map cell, and the number of very lively map cells it was drawn from (the first step of the draw).
"""
type RandomHighlight {
  """
  The map highlight drawn: a placed post, a placed video, a place with a place experience or a universe event (POST, VIDEO,
  PLACE or EVENT), with its point; reasons empty. Since D-437, never an experience (EXPERIENCES in kinds is ignored by
  randomHighlight).
  """
  result: ExploreResult!
  """
  The activity of its map cell over the last 7 days.
  """
  activity: MapCellActivity!
  """
  The number of very lively map cells of the explore filter it was drawn from.
  """
  candidates: Int!
}

"""
Since v128.0.0 (D-408, universes/explore.feature): the highlight of the day of a country.
"""
type HighlightOfTheDay {
  """
  The map highlight with the highest highlight score among the placed posts and the placed videos of the last 24 hours
  in the country (POST or VIDEO), with its point and its author (mapPost.author); reasons empty; since D-437, never an
  experience.
  """
  result: ExploreResult!
  """
  When it was computed (every hour).
  """
  computedAt: AWSDateTime!
}

"""
Since D-419 (map/map-universe-filter.feature): what "Universe" shows, answered by universeFilterChoices in one read:
the universe chosen and the favorite universes of the caller that are public universes, each with its counts.
"""
type UniverseFilterChoices {
  """
  The universe chosen (the universe filter), null when none was given, or when it is unknown, private or the root
  universe.
  """
  chosen: UniverseFilterChoice
  """
  "My universes": the favorite universes of the caller that are public universes, other than the root universe and the
  universe chosen, 20 at most, in the order of the account; empty for a visitor not signed in and for an account
  without one.
  """
  mine: [UniverseFilterChoice!]!
}

"""
Since D-419 (map/map-universe-filter.feature): one universe offered by "Universe", with its counts for the area shown
and the time window ("14 linked places · 3 in the area · 3,120 residents").
"""
type UniverseFilterChoice {
  """
  The full path of the universe ("paris/jazz"); the apps add the sign.
  """
  universe: String!
  """
  Its linked places, "See its places · N": the distinct points of what is linked to it (universeFilterChoices); 0: "no
  linked place", and "See its places" is not offered. Since D-469, the place of a placed channel is no longer one of
  them (map.md § The map never opens a universe nor a universe discussion).
  """
  linkedPlaces: Int!
  """
  Those of its linked places in the area shown (its universe territory when it meets the area); 0: "none in the
  area", and the list of results offers "See its places" when linkedPlaces is above 0.
  """
  inArea: Int!
  """
  The number of its residents, as the universe shows it.
  """
  residents: Int!
  """
  The bounds of its linked places, which "See its places" fits the map to (at the zoom 16 at most); answered for the
  universe chosen only, null for the favorite universes and when it has no linked place.
  """
  bounds: MapBounds
}

"""
Since D-419 (map/map-universe-filter.feature): a box on the map (WGS 84), as BoundsInput takes one.
"""
type MapBounds {
  """
  The southern latitude.
  """
  south: Float!
  """
  The western longitude.
  """
  west: Float!
  """
  The northern latitude.
  """
  north: Float!
  """
  The eastern longitude.
  """
  east: Float!
}

"""
Since D-437 (posts/explore-things-to-do.feature): what the resume band of Explore shows, read by exploreResume: the
experience instances the caller has in progress and the universe events of the day the caller attends.
"""
type ExploreResume {
  """
  The experience instances in which the experience result of the caller is IN_PROGRESS, the soonest end first (a route
  experience after those with an end), 20 at most, each with myParticipation (its progress: the counter, the timer, the
  stages of a visit experience); the route guidance of a route experience is read on the device. Empty while the
  experiences are not open.
  """
  runs: [ExperienceRun!]!
  """
  The number of those experience instances (the apps show 2 lines at most, then "and N others").
  """
  runCount: Int!
  """
  The universe events of the day, in the time zone of their place, that the caller attends and that have not ended, the
  soonest first, 20 at most; the apps compute their distance on the device.
  """
  events: [UniverseEvent!]!
  """
  The number of those universe events.
  """
  eventCount: Int!
}
