  label codes, since v80.4.0 the codes of the frame document, FRAME_DOCUMENT_MISSING); a delegated agent: DELEGATED_AGENT_NOT_ALLOWED for its operator's own settings. Returns
  every setting.
  """
  setSettings(input: SettingsInput!, requestId: ID!): Settings

