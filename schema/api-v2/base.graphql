  Since v84.0.0 (D-248): the point of the map presence of the caller, every 5 minutes at most
  (MAP_PRESENCE_TOO_SOON); MAP_PRESENCE_NOT_FOUND without one.
  """
  updateMapPresence(point: PointInput!, requestId: ID!): MyMapPresence

