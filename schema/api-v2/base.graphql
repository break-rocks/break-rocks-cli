  Since v86.0.0 (playlists.feature): creates a series of the caller, an account playlist of the caller (since
  v86.2.0, kind ACCOUNT: ACCOUNT_PLAYLIST_LIMIT, errorInfo { max }; since v87.1.0, it may be a course) or a universe
  playlist (by the leadership of its universe; by an adopted PLAYLIST proposal, the platform creates it). PLAYLIST_NAME_INVALID,
  PLAYLIST_NAME_TAKEN, PLAYLIST_NOT_ALLOWED, PLAYLIST_RESERVE_NOT_ALLOWED, COURSE_SECTION_LIMIT; WATCH_LATER:
  INVALID_REQUEST; since v86.1.0, a visibility for a universe playlist: PLAYLIST_VISIBILITY_NOT_ALLOWED. Since
  v87.1.0: a form (PLAYLIST_FORM_NOT_ALLOWED) and sections (PLAYLIST_SECTION_NAME_INVALID,
  PLAYLIST_SECTION_NAME_TAKEN). Returns the playlist.
  """
  createPlaylist(input: PlaylistInput!, requestId: ID!): Playlist

  """
  Since v86.0.0: changes a playlist (a field not given stays). The errors of createPlaylist, PLAYLIST_NOT_FOUND.
  Since v87.2.0: a PRIVATE account playlist holding videos of private universes made PUBLIC or UNLISTED needs
  input.revealMembership true (PLAYLIST_REVEALS_MEMBERSHIP, errorInfo { universes }).
  """
  updatePlaylist(playlistId: ID!, input: PlaylistChangeInput!, requestId: ID!): Playlist

