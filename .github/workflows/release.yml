name: Release

# The single executables of the CLI (README § Binaires): on a tag v<version> (the version of
# package.json), each target builds its executable with Node SEA (npm run build:sea), checks that it
# answers --version, and the release of the tag gets every executable and its SHA-256, with the
# completion scripts of bash, zsh, fish and PowerShell (README § Autocomplétion) and the installers
# install.sh and install.ps1 (README § Installation). Then the npm package is published, only
# when the secret NPM_TOKEN and the variable NPM_PUBLISH=true exist (README § Publication npm). Run
# by hand (workflow_dispatch), it builds and checks the five targets and keeps them as artifacts,
# without a release. No signature yet (macOS notarization, Windows Authenticode: later).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-14 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag is the version of package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm run build:sea
      - name: The executable answers
        shell: bash
        env:
          BREAKROCKS_CONFIG_DIR: ${{ runner.temp }}/breakrocks-config
        run: |
          bin="$(ls build/sea/breakrocks-* | grep -v '\.sha256$' | grep -v '\.cjs$' | head -1)"
          test "$("$bin" --version)" = "$(node -p "require('./package.json').version")"
          "$bin" schema all --json > /dev/null
          "$bin" --env dev operator keygen --json | grep -q fingerprint
      - name: The completion scripts, once (the same on every system)
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          npm run build
          npm run gen:completions
          bash -n completions/breakrocks.bash
          grep -q 'Register-ArgumentCompleter' completions/breakrocks.ps1
          grep -q '^complete -c breakrocks' completions/breakrocks.fish
          grep -q '^#compdef breakrocks' completions/breakrocks.zsh
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux-x64'
        with:
          name: breakrocks-completions
          path: completions/
          if-no-files-found: error
      - name: The installers, once
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          shellcheck -s sh scripts/install.sh
          mkdir -p build/installers
          cp scripts/install.sh scripts/install.ps1 build/installers/
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux-x64'
        with:
          name: breakrocks-installers
          path: build/installers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: breakrocks-${{ matrix.target }}
          path: |
            build/sea/breakrocks-*
            !build/sea/breakrocks.cjs
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The release of the tag, with the executables and their SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat breakrocks-*.sha256 > SHA256SUMS
          sha256sum breakrocks.bash breakrocks.zsh breakrocks.fish breakrocks.ps1 install.sh install.ps1 >> SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "breakrocks $GITHUB_REF_NAME" --generate-notes breakrocks-* breakrocks.bash breakrocks.zsh breakrocks.fish breakrocks.ps1 install.sh install.ps1 SHA256SUMS

  npm:
    # The npm package, after the release; published only when both the secret NPM_TOKEN (an
    # automation token of the npm account that owns the name breakrocks) and the repository variable
    # NPM_PUBLISH = true exist (the CLI goes public at the opening of production to the public;
    # until then NPM_PUBLISH is absent and nothing is published, even with the secret).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH: ${{ secrets.NPM_TOKEN != '' && vars.NPM_PUBLISH == 'true' }}
    steps:
      - name: Without NPM_TOKEN and NPM_PUBLISH=true, nothing is published
        if: env.PUBLISH != 'true'
        run: echo "::notice title=npm::NPM_TOKEN or NPM_PUBLISH=true is missing; the package breakrocks is not published to npm (README § Publication npm)"
      - uses: actions/checkout@v7
        if: env.PUBLISH == 'true'
      - uses: actions/setup-node@v7
        if: env.PUBLISH == 'true'
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - if: env.PUBLISH == 'true'
        run: npm ci
      - name: The tag is the version of package.json
        if: env.PUBLISH == 'true'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Publish (prepack builds dist/ and the completion scripts)
        if: env.PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
