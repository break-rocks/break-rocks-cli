  ACTIVE
  PENDING
}

"""
Since D-474: the proof of a trusted device (deviceId): assertion, its signature over the challenge (of the act
confirmation request, or of startTrustedDeviceChallenge), made after its own means of access (user verification).
"""
input TrustedDeviceProofInput {
  deviceId: ID!
  assertion: AWSJSON!
}
