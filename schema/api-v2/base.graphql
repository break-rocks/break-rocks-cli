  """
  verifySellerIdentity(returnPath: String, requestId: ID!): PaymentPage

  """
  The owner withdraws a tier: its paying members keep it until the end of their paid period. Errors:
  ONLY_OWNER_OFFERS_SUBSCRIPTION_TIERS, LAST_SUBSCRIPTION_TIER, SUBSCRIPTION_TIER_NOT_FOUND.
  """
  withdrawSubscriptionTier(tierId: ID!, universe: String!, requestId: ID!): SubscriptionTier

  """
  Advertising: a campaign DRAFT of a human (not a minor) or a verified organization. Errors: ADS_NOT_OPEN,
  ADVERTISER_NOT_ALLOWED, AD_TARGETING_INVALID (a universe private, without ads or unknown; a bound),
  AD_BID_BELOW_FLOOR, AD_FORMAT_NOT_OFFERED. Since v87.3.0 (D-266): AD_BID_BELOW_FLOOR also for a maxCpc under the
  floor per click; AD_TARGETING_INVALID also for no universe and no universe group, a universe group unknown, a
  CPC campaign without maxCpc, ad interests while ads.declaredInterests is off, a bid kind changed outside DRAFT
  or PAUSED.
  """
  createAdCampaign(input: AdCampaignInput!, requestId: ID!): AdCampaign

  """
  Advertising: the budget of a campaign prepaid by card (a page of the payment provider) or from the
  universe cash of "universe" by its leadership; 10 EUR at least. Errors: AD_CAMPAIGN_NOT_FOUND,
  AD_BUDGET_TOO_LOW, PROVIDER_NOT_AVAILABLE, CURRENCY_NOT_SUPPORTED, RETURN_PATH_INVALID.
  """
  payAdBudget(campaignId: ID!, amount: Float!, currency: String!, source: AdBudgetSource!, universe: String, returnPath: String, requestId: ID!): AdBudgetPayment

  """
  Advertising: a click on an ad slot; answers the destination. AD_SLOT_EXPIRED. Since v87.3.0 (D-266): a click
  counted at most once per reader and per campaign per day, what a CPC campaign is charged for.
  """
  recordAdClick(token: ID!, requestId: ID!): AWSURL

  """
  Advertising: an impression of an ad slot (50 percent visible for 1 second), counted once. AD_SLOT_EXPIRED.
  """
  recordAdImpression(token: ID!, requestId: ID!): Boolean

  """
  Advertising: pause, resume or end a campaign. Errors: AD_CAMPAIGN_NOT_FOUND, AD_CAMPAIGN_ENDED,
  AD_CAMPAIGN_NOT_APPROVED.
  """
  setAdCampaignState(campaignId: ID!, state: AdCampaignState!, requestId: ID!): AdCampaign

