"""
A rectification request: what the caller asks to correct. Since specs v103.3.0 (D-328): field, the field to correct
(absent: OTHER, as an app before v103.3.0 sends); value, the value asked, required for a field but OTHER (COUNTRY an ISO
3166-1 alpha-2 code; BIRTH_DATE YYYY-MM-DD, a past date of at most 130 years; EMAIL an email address; DISPLAY_NAME 1 to 50
visible characters), absent for OTHER; text, the free text of OTHER (1 to 2,000 visible characters), absent otherwise;
comment, optional, at most 2,000 visible characters. Errors of requestRectification: RECTIFICATION_VALUE_MISSING,
RECTIFICATION_VALUE_INVALID, RECTIFICATION_TEXT_EMPTY, RECTIFICATION_TEXT_TOO_LONG.
"""
input RectificationInput {
  """
  Since specs v103.3.0 (D-328): an optional comment, at most 2,000 visible characters.
  """
  comment: String
  """
  Since specs v103.3.0 (D-328): the field to correct; absent: OTHER.
  """
  field: RectificationField
  """
  The free text of a request of another field (OTHER), as written; absent for a named field (since specs v103.3.0; until
  then required, the only content of the request).
  """
  text: String
  """
  Since specs v103.3.0 (D-328): the value asked for a named field; absent for OTHER.
  """
  value: String
}

"""
Since specs v103.3.0 (D-328): the field a rectification request names. BIRTH_DATE (never kept: no value now), COUNTRY,
DISPLAY_NAME and EMAIL (changed by the person themselves: the platform team answers where to change it), OTHER (described
by a text).
"""
enum RectificationField {
  BIRTH_DATE
  COUNTRY
  DISPLAY_NAME
  EMAIL
  OTHER
}

