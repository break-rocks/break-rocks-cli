# Long videos, playlists and address parameters (since v86.0.0, D-257, D-260, D-261): additions only.
# features/posts/long-videos.feature, playlists.feature, address-parameters.feature; contracts/urls.md.
# Cost at rest (expand only): a playlist is one item plus one per video; a resume point one item per account and
# video (expires after 1 year); the video quota one counter per account and hour; nothing scheduled, nothing
# polled. Address parameters are parsed, never stored apart from the text that carries them.
# Since v86.1.0 (playlists.feature, additions only): the playlist visibility (one attribute of the playlist item; the
# profile tab and the search index read the public series only), the total duration and the cover kept on the
# playlist item when its videos change, and the playlist card of a message, built for each reader when read (one
# read of the playlist by its id, cached with the message page), never stored with the message.
# Since v86.2.0 (D-263, playlists.feature, additions only): the kind ACCOUNT, an account playlist (videos of any
# author); the series and the account playlists of an account share one name space (the existing name key); the
# count of account playlists is one counter on the account, checked against 50/100/500 by the tier of the account
# in the write of createPlaylist (a conditional increment, decremented by deletePlaylist); the profile tab and the
# search index read the PUBLIC series and account playlists.
# Since v87.1.0 (D-264, playlists.feature, additions and relaxations only): the playlist form, the playlist sections,
# the playlist tags and the playlist tracks are attributes of the playlist item (the tags of an item on its item);
# the checkmarks of a reader are one item per account, playlist and checked item, the chosen playlist track and the
# hidden checkmarks one attribute of the resume item (one per account and playlist), so resetting the progress is a
# query on one partition; the progress is computed when read (500 items at most), never stored apart. A locked item
# keeps only the name of its universe when found by search, read when the page is built.
# Since v87.5.0 (D-268, playlists.feature, additions only): a course link and a course document are items of the
# playlist item of their course (one item each, keyed by their own id, beside the videos and posts); the file of a
# course document is one object in the media bucket per version (the previous one deleted once the new one is
# served, kept with a report as its evidence), scanned by the malware scan in the bucket (an object event, never
# polled) and served by a URL signed for 1 hour; the count of course documents is one counter on the account
# (a conditional increment, as the account playlists), checked against 50/100/500 by the tier of the account; the
# link preview of a course link is built once when it is added or changed (linkPreview) and kept with the item.
# Since v87.6.0 (D-269, post-documents.feature, additions and one relaxation): interface Document, implemented by
# PlaylistDocument (fields unchanged) and PostDocument (posts.graphql); DocumentUploadInput.playlistId optional
# (none: the file of a post document, a relaxation that no existing call notices).

"""
The long video of a post (long-videos.feature): horizontal, more than 3 minutes and at most 4 hours, on the
media CDN: url is its HLS playlist (master), posterUrl its cover frame. Counted against the video quota.
"""
type LongVideo {
  """
  Whether an area of it was hidden after posting (since v92.0.0, D-284, masks-after-posting.feature): shown with
  the mention "area hidden after posting"; false otherwise.
  """
  maskedAfterPosting: Boolean!
  """
  Whether a masked version is being made (since v92.0.0): the original is served until it is ready; false otherwise.
  """
  maskPending: Boolean!
  """
  Its chapters, in order; empty when it has none. Proposed chapters are never here before the author accepts
  them (setChapters).
  """
  chapters: [Chapter!]!
  """
  Its length, in milliseconds.
  """
  durationMs: Int!
  """
  Its height, in pixels.
  """
  height: Int!
  """
  The identifier of the long video.
  """
  id: ID!
  """
  Where the caller stopped it, in seconds, kept 1 year on every device; null when never played or watched
  to its end.
  """
  myPositionSeconds: Int
  """
  The cover frame, generated by the platform.
  """
  posterUrl: String!
  """
  Its subtitles, as for a clip (ClipSubtitles); null in the same cases.
  """
  subtitles: ClipSubtitles
  """
  Its URL.
  """
  url: String!
  """
  Its width, in pixels.
  """
  width: Int!
}

"""
A chapter of a long video: at most 100, the first at 0 seconds, each at least 10 seconds after the one before.
"""
type Chapter {
  """
  Its start, in seconds.
  """
  startSeconds: Int!
  """
  Its title, 1 to 80 visible characters.
  """
  title: String!
}

"""
A chapter to set (setChapters): its start in seconds and its title.
"""
input ChapterInput {
  startSeconds: Int!
  title: String!
}

"""
The playlist visibility of a playlist (since v86.1.0, playlists.feature). A series and, since v86.2.0, an account
playlist: PUBLIC (the default until v91.0.0; since v91.0.0, D-282, PRIVATE is the default; on the tab
"Playlists" of its profile and found by search), UNLISTED (read by whoever has its address or its URL, never listed
nor found by search) or PRIVATE (read by its owner only, followed by nobody). WATCH_LATER: always PRIVATE. A universe
playlist has the playlist visibility of its universe, never set apart: PUBLIC for a public universe, PRIVATE for a
private universe (read by its members; reserved: by the members of the private universe on subscription).
"""
enum PlaylistVisibility {
  PRIVATE
  PUBLIC
  UNLISTED
}

"""
The kind of a playlist (playlists.feature): WATCH_LATER, "Watch later" of the caller; SERIES, a series (the own long
videos of its account, as episodes, followers notified of each new episode); UNIVERSE, a universe playlist; since
v86.2.0 (D-263), ACCOUNT, an account playlist (public videos of any author, long videos or clips, made by its
account alone; its followers notified of nothing). A client shows an unknown kind as a plain playlist.
"""
enum PlaylistKind {
  ACCOUNT
  SERIES
  UNIVERSE
  WATCH_LATER
}

"""
The playlist form of a playlist (since v87.1.0, D-264, playlists.feature), chosen and changed by its owner: SIMPLE, a
flat list (the default; WATCH_LATER always: PLAYLIST_FORM_NOT_ALLOWED); SECTIONS, its items in titled playlist
sections; CHAPTERS, a course: numbered playlist sections, ordered playback if required, posts with text or images beside its videos.
Every kind takes every form. A client shows an unknown form as SIMPLE.
"""
enum PlaylistForm {
  CHAPTERS
  MONTAGE
  ROUTE
  SECTIONS
  SIMPLE
}

"""
The kind of a playlist item (since v87.1.0): VIDEO, a post with a long video or a clip; POST, a post with text,
images and no video, in a course only. Since v87.5.0 (D-268), in a course only (PlaylistCourseItem): LINK, a course
link; DOCUMENT, a course document. A client shows an unknown kind as a post.
"""
enum PlaylistItemKind {
  DOCUMENT
  LINK
  POST
  VIDEO
}

"""
The format of a course document (since v87.5.0, D-268): PDF (application/pdf, 20 MB at most, 20,971,520 bytes) or
MARKDOWN (text/markdown, UTF-8, 200 KB at most, 204,800 bytes; shown by the app with the restricted Markdown of
contracts/text.md § Markdown document). Any other type: DOCUMENT_FORMAT_NOT_ALLOWED. A client shows an unknown
format as a file to download.
"""
enum DocumentFormat {
  MARKDOWN
  PDF
}

"""
Where the file of a course document stands (since v87.5.0): CHECKING, its malware scan or its media review is not
done (seen only by who changes the playlist; a reader sees the version before, or nothing for a new course
document); READY, served; REFUSED, found malicious (DOCUMENT_MALICIOUS) or refused by the media review, never
served, seen only by who changes the playlist until it is removed or replaced (its uploader is notified,
DOCUMENT_REFUSED).
"""
enum DocumentStatus {
  CHECKING
  READY
  REFUSED
}

"""
A document (since v87.6.0, D-269): the file of a course document (PlaylistDocument) or of a post document
(PostDocument), with the same rules (playlists.feature, post-documents.feature): a PDF document or a markdown
document, uploaded with requestDocumentUpload, served once its malware scan and its media review are done, by a
URL signed for the caller and valid 1 hour. The fields each kind adds are on its own type.
"""
interface Document {
  """
  Its size, in bytes.
  """
  bytes: Int!
  """
  Its format.
  """
  format: DocumentFormat!
  """
  Where its file stands; a reader other than who may change it sees READY only.
  """
  status: DocumentStatus!
  """
  When its file was uploaded.
  """
  updatedAt: AWSDateTime!
  """
  The URL of the file served, signed for the caller and valid 1 hour (urlExpiresAt); null when not READY.
  """
  url: String
  """
  When url stops working; null when url is null.
  """
  urlExpiresAt: AWSDateTime
}

"""
The file of a course document (since v87.5.0, D-268), as the caller reads it. Since v87.6.0 (D-269), it implements
Document, its fields unchanged.
"""
type PlaylistDocument implements Document {
  """
  Its size, in bytes.
  """
  bytes: Int!
  """
  Its format.
  """
  format: DocumentFormat!
  """
  Where its last version stands; a reader other than who changes the playlist sees READY only.
  """
  status: DocumentStatus!
  """
  When its version was uploaded.
  """
  updatedAt: AWSDateTime!
  """
  The URL of the file served, signed for the caller and valid 1 hour (urlExpiresAt); null when not READY.
  """
  url: String
  """
  When url stops working; null when url is null.
  """
  urlExpiresAt: AWSDateTime
  """
  Its version, from 1, one more at each new file (addDocumentToPlaylist with itemId).
  """
  version: Int!
}

"""
A course link or a course document of a course (since v87.5.0, D-268, PlaylistEntry.courseItem).
"""
type PlaylistCourseItem {
  """
  When it was added.
  """
  addedAt: AWSDateTime!
  """
  Whether the caller checked it (checkPlaylistCourseItem): a course link once opened from the course, a PDF
  document once opened, a markdown document once scrolled to 90 % of it.
  """
  checked: Boolean!
  """
  Its file (DOCUMENT); null for a LINK.
  """
  document: PlaylistDocument
  """
  The identifier of the item (itemId of the operations of course items, and of report).
  """
  id: ID!
  """
  Its kind: LINK or DOCUMENT.
  """
  kind: PlaylistItemKind!
  """
  The position, from 1.
  """
  position: Int!
  """
  The link preview of a course link, built when it was added or changed; null without one, and for a DOCUMENT.
  """
  preview: LinkPreview
  """
  The id of its playlist section; null outside a section.
  """
  sectionId: ID
  """
  Its playlist tags; empty when none.
  """
  tags: [String!]!
  """
  Its title, 1 to 80 visible characters.
  """
  title: String!
  """
  The destination of a course link (https, 2,048 characters at most, reviewed: LINK_DESTINATION_INVALID); null for
  a DOCUMENT.
  """
  url: String
}

"""
A removed item (since v87.5.0, D-268): a course link or a course document removed by the platform team, kept in
its place without anything of its content; left out of the progress, never opened; removed by who changes the
playlist (removePlaylistCourseItem).
"""
type PlaylistRemovedItem {
  """
  The identifier of the item (removePlaylistCourseItem).
  """
  id: ID!
  """
  The kind of the item removed: LINK or DOCUMENT; since v91.1.0, VIDEO for a passage whose source is removed,
  deleted or no longer readable ("passage removed", to the owner only).
  """
  kind: PlaylistItemKind!
  """
  The position, from 1.
  """
  position: Int!
  """
  The id of its playlist section; null outside a section.
  """
  sectionId: ID
}

"""
A course link to add (addLinkToPlaylist, since v87.5.0): title (1 to 80 visible characters, INVALID_REQUEST
otherwise), url (https, 2,048 characters at most, reviewed: LINK_DESTINATION_INVALID), position (none: at the end),
sectionId (none: outside a section) and tags (its playlist tags; PLAYLIST_TAG_LIMIT, PLAYLIST_TAG_INVALID).
"""
input PlaylistLinkInput {
  position: Int
  sectionId: ID
  tags: [String!]
  title: String!
  url: String!
}

"""
A file of a course document to upload (requestDocumentUpload, since v87.5.0): contentType (application/pdf or
text/markdown; DOCUMENT_FORMAT_NOT_ALLOWED), size in bytes (DOCUMENT_TOO_LARGE) and the course (playlistId) where it
goes. Since v87.6.0 (D-269): playlistId absent, the file of a post document (createPost, quote, savePostDraft with
PostDocumentInput), under the same rules.
"""
input DocumentUploadInput {
  contentType: String!
  playlistId: ID
  size: Int!
}

"""
A course document to add, or a new file of one (addDocumentToPlaylist, since v87.5.0): uploadId (the id of
requestDocumentUpload); rightsConfirmed, true when the caller confirms they have the right to share it, on every
file (DOCUMENT_RIGHTS_REQUIRED otherwise); itemId, a course document of the playlist to give a new file (a new
version: its place, its playlist tags and the checkmarks of its readers kept; title, position, sectionId and tags
then ignored); otherwise a new course document with title (1 to 80 visible characters), position (none: at the
end), sectionId and tags.
"""
input PlaylistDocumentInput {
  itemId: ID
  position: Int
  rightsConfirmed: Boolean!
  sectionId: ID
  tags: [String!]
  title: String
  uploadId: ID!
}

"""
The changes of a course link or a course document (updatePlaylistCourseItem, since v87.5.0): a field not given
stays. title (1 to 80 visible characters); url, a course link only (reviewed again: LINK_DESTINATION_INVALID; its
link preview built again); position, with sectionId (none: outside a section), as movePlaylistItem; tags, all at
once (empty: none).
"""
input PlaylistCourseItemChangeInput {
  position: Int
  sectionId: ID
  tags: [String!]
  title: String
  url: String
}

"""
A playlist section (since v87.1.0): a group of items of a playlist of the form SECTIONS or CHAPTERS, at most 50.
"""
type PlaylistSection {
  """
  The identifier of the section.
  """
  id: ID!
  """
  Its section name, by the rules of a channel name, unique in its playlist: the value of the address parameter sec.
  """
  name: String!
  """
  Its number in a course (CHAPTERS), from 1; null in a playlist of the form SECTIONS.
  """
  number: Int
  """
  Its title, 1 to 80 visible characters.
  """
  title: String!
}

"""
A playlist section to set (createPlaylist, updatePlaylist): id (to keep; none: a new one), name (its section name;
PLAYLIST_SECTION_NAME_INVALID, PLAYLIST_SECTION_NAME_TAKEN) and title (1 to 80 visible characters).
"""
input PlaylistSectionInput {
  id: ID
  name: String!
  title: String!
}

"""
A playlist track (since v87.1.0): a selection of the items of a playlist; an item is in it when it has at least one
of its tags, an item without a playlist tag is in every track. At most 10 per playlist.
"""
type PlaylistTrack {
  """
  Its track name, by the rules of a channel name, unique in its playlist: the value of the address parameter track.
  """
  name: String!
  """
  Its playlist tags, at least 1.
  """
  tags: [String!]!
  """
  Its title, 1 to 80 visible characters ("High level + low level").
  """
  title: String!
}

"""
A playlist track to set (setPlaylistTracks): name, title and tags (at least 1; PLAYLIST_TRACK_INVALID,
PLAYLIST_TAG_INVALID).
"""
input PlaylistTrackInput {
  name: String!
  tags: [String!]!
  title: String!
}

"""
The playlist progress of the caller in a playlist track (since v87.1.0), private to the caller: of the items of the
track the caller can read (locked items left out), those checked. Since v87.5.0, the course links and the course
documents served count as items; a removed item, and a course document not READY, are left out.
"""
type PlaylistProgress {
  """
  The number of its items checked ("7 of 12 watched": checkedCount of itemCount).
  """
  checkedCount: Int!
  """
  The playlist sections whose items of the track are all checked (a section with no item of the track left out).
  """
  completedSectionIds: [ID!]!
  """
  The number of its items in the track that the caller can read.
  """
  itemCount: Int!
  """
  checkedCount of itemCount as a whole percentage, rounded down; 0 when itemCount is 0.
  """
  percent: Int!
  """
  The track name; null for every item (a playlist without a track).
  """
  track: String
}

"""
A locked item (since v87.1.0): in an account playlist, a video of a private universe the caller cannot read. Nothing
of the video: neither its post, its title, its image, its author nor its duration.
"""
type PlaylistLockedItem {
  """
  The position, from 1.
  """
  position: Int!
  """
  The id of its playlist section; null outside a section.
  """
  sectionId: ID
  """
  The address of its private universe ("%team-fra."), when that universe is found by search; null otherwise.
  """
  universeAddress: String
}

"""
An entry of a playlist (since v87.1.0, Playlist.entries): exactly one of item and locked is given. Since v87.5.0
(D-268): exactly one of item, locked, courseItem and removed; a client that does not know courseItem nor removed
skips an entry where item and locked are both null.
"""
type PlaylistEntry {
  """
  Since v87.5.0: a course link or a course document the caller reads; null otherwise.
  """
  courseItem: PlaylistCourseItem
  """
  The item the caller reads; null for a locked item.
  """
  item: PlaylistItem
  """
  The locked item; null for an item the caller reads.
  """
  locked: PlaylistLockedItem
  """
  Since v87.5.0: a removed item; null otherwise.
  """
  removed: PlaylistRemovedItem
}

"""
A page of the entries of a playlist.
"""
type PlaylistEntryPage {
  """
  The entries of the page.
  """
  entries: [PlaylistEntry!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
A playlist (playlists.feature): "Watch later" (private, no address), a series of an account
("@erin>journey"), since v86.2.0 an account playlist ("@alice>best-runs") or a universe playlist ("%marathon>new-york-2026-09"). At most 500 videos.
"""
type Playlist {
  """
  Its address ("@erin>journey"); null for WATCH_LATER.
  """
  address: String
  """
  Its route (since v92.1.0, the form ROUTE), as the caller may read it; null otherwise, and when the caller may not
  read it (the playlist then read as SIMPLE). Since v101.3.0: null too once the route is deleted, the playlist read
  as SIMPLE with every stageIndex null; no copy of its line is kept (unlike a universe event).
  """
  route: MapRoute
  """
  Its montage views (since v91.1.0, recordMontageView), shown to every reader of a MONTAGE; null for another
  playlist form. They never count as views of its sources.
  """
  montageViewCount: Int
  """
  Its course settings; null when it is not a course (never for WATCH_LATER). Since v87.1.0, derived from form
  CHAPTERS (an ACCOUNT playlist too); deprecated: form, sections, orderedPlayback and myProgress.
  """
  course: Course @deprecated(reason: "Use form, sections, orderedPlayback and myProgress (since v87.1.0).")
  """
  Its description, 0 to 500 visible characters.
  """
  description: String
  """
  The cover of the playlist card (since v86.1.0): the cover frame of its first video the caller can read; null when
  the caller can read none.
  """
  coverUrl: String
  """
  The total duration of its videos the caller can read, in milliseconds (since v86.1.0, the playlist card).
  """
  durationMs: Int!
  """
  Since v87.1.0: its items in order, the locked items in their place (an ACCOUNT playlist only), for the playlist
  track track (its track name; none: the track chosen by the caller, or by default; unknown: every item of the
  default). limit: from 1 to 100 (50 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  A deleted item, or one of an author who blocked the caller, is left out.
  """
  entries(after: String, limit: Int, track: String): PlaylistEntryPage
  """
  Since v87.1.0: its playlist form.
  """
  form: PlaylistForm!
  """
  Whether the caller follows it (SERIES, ACCOUNT and UNIVERSE).
  """
  followed: Boolean!
  """
  The number of its followers.
  """
  followerCount: Int!
  """
  The identifier of the playlist.
  """
  id: ID!
  """
  The number of its videos the caller can read.
  """
  itemCount: Int!
  """
  Its videos, in order. limit: from 1 to 100 (50 by default; LIMIT_INVALID otherwise); after: the next of the
  page before. A video the caller cannot read is left out. Since v87.1.0, the posts of a course too, every track
  together; a locked item is left out here (entries gives it). Since v87.5.0, the course links, the course documents
  and the removed items are left out here too (entries gives them).
  """
  items(after: String, limit: Int): PlaylistItemPage
  """
  Its kind.
  """
  kind: PlaylistKind!
  """
  Since v87.1.0: whether the caller sees the checkmarks (true by default; false only in a SIMPLE playlist,
  setPlaylistCheckmarks).
  """
  myCheckmarksShown: Boolean!
  """
  Since v87.1.0: the playlist progress of the caller in the playlist track track (its track name; none: the track
  chosen by the caller, or by default, the first, or every item when there is none).
  """
  myProgress(track: String): PlaylistProgress!
  """
  Where the caller left it: the position (1-based) and the second; null when never played.
  """
  myResume: PlaylistResume
  """
  Since v87.1.0: the playlist track the caller chose (setPlaylistTrack); null when none is chosen (the first track
  by default, or every item).
  """
  myTrack: PlaylistTrack
  """
  Its playlist name (after ">", since v93.0.0; "!" before); "watch-later" for WATCH_LATER.
  """
  name: String!
  """
  The account of a series, of an account playlist or of "Watch later"; null for a universe playlist.
  """
  ownerAccount: Account
  """
  The universe of a universe playlist; null otherwise.
  """
  ownerUniverse: Universe
  """
  Since v87.1.0: whether a video opens only once the one before in the chosen track is checked (CHAPTERS only;
  PLAYLIST_ORDER_REQUIRED).
  """
  orderedPlayback: Boolean!
  """
  Whether it is pinned on the page of its universe (UNIVERSE only).
  """
  pinned: Boolean!
  """
  Whether it is reserved to the members of its private universe on subscription (UNIVERSE only).
  """
  reserved: Boolean!
  """
  Since v87.1.0: its playlist sections in order, 50 at most; empty for the form SIMPLE.
  """
  sections: [PlaylistSection!]!
  """
  Since v87.1.0: the playlist tags put on its items, 8 at most, in the order of first use.
  """
  tags: [String!]!
  """
  Since v87.1.0: its playlist tracks in order, 10 at most; the first is the track by default.
  """
  tracks: [PlaylistTrack!]!
  """
  When it was last changed.
  """
  updatedAt: AWSDateTime!
  """
  Its canonical URL ("/a/erin/l/journey"); null for WATCH_LATER.
  """
  url: AWSURL
  """
  Its playlist visibility (since v86.1.0).
  """
  visibility: PlaylistVisibility!
}

"""
A video of a playlist.
"""
type PlaylistItem {
  """
  When it was added.
  """
  addedAt: AWSDateTime!
  """
  Since v87.1.0: whether the caller checked it (its checkmark, on every playlist): a VIDEO watched to 90 % of its
  length, a POST opened from the course (checkPlaylistItem).
  """
  checked: Boolean!
  """
  Since v87.1.0: its kind.
  """
  kind: PlaylistItemKind!
  """
  Since v87.1.0: its playlist tags (setPlaylistItemTags); empty when none.
  """
  tags: [String!]!
  """
  Whether the caller watched it to its last 10 % (the checkmark of a course). Since v87.1.0, the same as checked.
  """
  watched: Boolean! @deprecated(reason: "Use checked (since v87.1.0).")
  """
  The position, from 1.
  """
  position: Int!
  """
  The post with the video (a long video or a clip) or, since v87.1.0 in a course, the post with text or images
  (kind POST); its universe is its origin, shown when it is not the universe of the playlist.
  """
  post: Post!
  """
  The id of its section in a course; null otherwise.
  """
  sectionId: ID
  """
  The start of its passage, in milliseconds (since v91.1.0: a kept passage of a long video, or a passage of a
  MONTAGE); null for the whole video.
  """
  passageStartMs: Int
  """
  The end of its passage, in milliseconds, after its start and within the length of its video; null for the whole
  video.
  """
  passageEndMs: Int
  """
  The index of the stage of the route it is tied to (since v92.1.0, the form ROUTE); null otherwise. Since v101.3.0
  (routes.feature): the position, from 0, of that stage in the stages the caller sees (Playlist.route.route.stages),
  not the index of its point; null for a stage that the privacy zones of the author of the route hide from the
  caller, and for every item while the caller may not read the route (the playlist then read as SIMPLE). One item at
  most is tied to a stage.
  """
  stageIndex: Int
}

"""
The timeline of a playlist in continuous play (since v91.1.0, playlistTimeline), computed for the caller: the items
the caller may read, in order, each a chapter, as if the playlist held nothing else (no count of the others);
never stored. A MONTAGE always plays so.
"""
type PlaylistTimeline {
  """
  The segments, in their order.
  """
  segments: [PlaylistSegment!]!
  """
  Its total duration, in milliseconds.
  """
  durationMs: Int!
}

"""
A segment of a playlist timeline (since v91.1.0): one item, or one passage of a MONTAGE, shown as a chapter with the
title and the author of its source.
"""
type PlaylistSegment {
  """
  The position of its item in the playlist, from 1.
  """
  position: Int!
  """
  The title of the chapter: the title of its item (its post).
  """
  title: String!
  """
  Its source: the post with the video, with its author.
  """
  post: Post!
  """
  Where it starts in its video, in milliseconds.
  """
  startMs: Int!
  """
  Where it ends in its video, in milliseconds.
  """
  endMs: Int!
  """
  Where it starts in the timeline, in milliseconds.
  """
  offsetMs: Int!
}

"""
A page of the videos of a playlist.
"""
type PlaylistItemPage {
  """
  The videos of the page.
  """
  items: [PlaylistItem!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
A page of playlists.
"""
type PlaylistPage {
  """
  The playlists of the page.
  """
  items: [Playlist!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
Where the caller left a playlist.
"""
type PlaylistResume {
  """
  The position of the video, from 1.
  """
  position: Int!
  """
  The second in that video.
  """
  seconds: Int!
}

"""
The course settings of a playlist (a course): its sections, the progress of the caller, ordered playback. Since
v87.1.0, deprecated (Playlist.course): Playlist.form CHAPTERS, sections, orderedPlayback and myProgress say the same;
watchedCount is myProgress.checkedCount for every item.
"""
type Course {
  """
  Whether a video opens only once the one before is watched (PLAYLIST_ORDER_REQUIRED).
  """
  orderedPlayback: Boolean!
  """
  The number of its videos the caller watched ("7 of 12 watched": watchedCount of itemCount).
  """
  watchedCount: Int!
  """
  Its sections, in order, 50 at most.
  """
  sections: [CourseSection!]!
}

"""
A section of a course.
"""
type CourseSection {
  """
  The identifier of the section.
  """
  id: ID!
  """
  Since v87.1.0: its section name (PlaylistSection.name).
  """
  name: String!
  """
  Its title, 1 to 80 visible characters.
  """
  title: String!
}

"""
The course settings to set (updatePlaylist): orderedPlayback, and the sections in order (50 at most,
COURSE_SECTION_LIMIT), each with an id to keep or none to create, and its title. Since v87.1.0, deprecated: form
CHAPTERS, sections and orderedPlayback of PlaylistInput and PlaylistChangeInput; a course given sets the form
CHAPTERS (with a form other than CHAPTERS, or with sections: INVALID_REQUEST), and a section without a name takes a
section name derived from its title (made unique by a number).
"""
input CourseInput {
  orderedPlayback: Boolean!
  sections: [CourseSectionInput!]!
}

"""
A section to set: id (to keep; none: a new one) and title (1 to 80 visible characters).
"""
input CourseSectionInput {
  id: ID
  title: String!
}

"""
A playlist to create (createPlaylist): kind SERIES or ACCOUNT (since v86.2.0; the caller's) or UNIVERSE (universe: its universe, by its
leadership); name: a playlist name; description: 0 to 500 visible characters; reserved: UNIVERSE of a private
universe on subscription only (PLAYLIST_RESERVE_NOT_ALLOWED); course: none for a plain playlist (deprecated since
v87.1.0, see CourseInput; since v87.1.0 an ACCOUNT playlist too may be a course); visibility (since
v86.1.0): SERIES and ACCOUNT only, PRIVATE when not given since v91.0.0 (D-282; PUBLIC before) (UNIVERSE: PLAYLIST_VISIBILITY_NOT_ALLOWED). Since v87.1.0:
form (SIMPLE when not given), sections (SECTIONS and CHAPTERS, 50 at most: COURSE_SECTION_LIMIT; with SIMPLE:
INVALID_REQUEST), orderedPlayback (CHAPTERS only, false when not given; otherwise INVALID_REQUEST).
"""
input PlaylistInput {
  course: CourseInput
  description: String
  form: PlaylistForm
  kind: PlaylistKind!
  name: String!
  orderedPlayback: Boolean
  reserved: Boolean
  sections: [PlaylistSectionInput!]
  universe: String
  visibility: PlaylistVisibility
  """
  Since v92.1.0 (routes.feature): the route of a playlist of the form ROUTE (ROUTE_NOT_FOUND; INVALID_REQUEST with
  another form). Since v101.3.0: required with the form ROUTE (INVALID_REQUEST without it); a route the caller may
  read (ROUTE_NOT_FOUND otherwise): one of its own, or a route read by its URL (mapRouteByUrl), a universe route
  included. A playlist of the form ROUTE has no sections (INVALID_REQUEST).
  """
  routeId: ID
}

"""
The changes of a playlist (updatePlaylist): a field not given stays; clearCourse true makes it a plain playlist;
visibility (since v86.1.0): a series or an account playlist only (WATCH_LATER or UNIVERSE: PLAYLIST_VISIBILITY_NOT_ALLOWED).
Since v87.1.0: clearCourse and course deprecated (clearCourse true is form SIMPLE); form (WATCH_LATER other than
SIMPLE, or a playlist holding posts without a video, since v87.5.0 course links, course documents or removed
items, made other than CHAPTERS: PLAYLIST_FORM_NOT_ALLOWED; made SIMPLE,
its sections are removed, its items kept in order); sections, all at once, in order (an item of a section removed
stays, outside a section); orderedPlayback (CHAPTERS only).
"""
input PlaylistChangeInput {
  clearCourse: Boolean
  course: CourseInput
  description: String
  form: PlaylistForm
  name: String
  orderedPlayback: Boolean
  reserved: Boolean
  """
  Since v87.2.0: the caller confirms that the new visibility shows the private universes of its videos
  (PLAYLIST_REVEALS_MEMBERSHIP otherwise).
  """
  revealMembership: Boolean
  sections: [PlaylistSectionInput!]
  """
  Since v92.1.0: the route of a playlist of the form ROUTE. Since v101.3.0: the rules of PlaylistInput.routeId, with
  the form given or kept (INVALID_REQUEST for another form; form ROUTE given without routeId on a playlist that has
  no route: INVALID_REQUEST). A form other than ROUTE removes the route. A new route keeps the stageIndex of the
  items recorded without counting them (every stageIndex reads null) until the former route comes back; the order
  of the items is not computed again when the stages of the route change (a known limit).
  """
  routeId: ID
  visibility: PlaylistVisibility
}

"""
The playlist card of a message (since v86.1.0, playlists.feature, contracts/text.md § Playlist card): the first
playlist address or playlist URL of its text, built for the caller when read. playlist null: "not available" (no
such playlist, or one the caller cannot read: PRIVATE, reserved, a private universe), shown without anything of it.
"""
type PlaylistCard {
  """
  The playlist address as written in the text, its address parameters included ("@erin>journey;from=3").
  """
  address: String!
  """
  Its address parameters kept (keys sorted).
  """
  parameters: [AddressParameter!]!
  """
  The playlist as the caller reads it: name, ownerAccount or ownerUniverse, itemCount, durationMs, coverUrl; null
  when not available.
  """
  playlist: Playlist
}

"""
The playlists hub of the caller (playlists.feature): "Watch later", the followed playlists, its own.
"""
type PlaylistsHub {
  """
  The playlists the caller follows, the most recently changed first (the first 20; followedPlaylists for more);
  since v86.1.0, a followed playlist the caller can no longer read (made PRIVATE) is left out.
  """
  followed: [Playlist!]!
  """
  The series and, since v86.2.0, the account playlists of the caller, whatever their playlist visibility (the first 20; Account.playlists for more).
  """
  mine: [Playlist!]!
  """
  The "Watch later" of the caller.
  """
  watchLater: Playlist!
}

"""
An address parameter, parsed (address-parameters.feature): its key of the registry and its value.
"""
type AddressParameter {
  """
  The key: t, list, from or msg; since v87.1.0, sec or track; since v88.0.0 (D-276), tab; since v91.0.0 (D-282), end.
  """
  key: String!
  """
  The value, as written in canonical form.
  """
  value: String!
}

"""
An experience kind of the registry (since v101.0.0, D-301, contracts/urls.md § Experience kinds): its name and its
version; "event" 0 is the universe event, "route" 0 the route.
"""
type ExperienceKind {
  """
  Its name ("event", "route").
  """
  name: String!
  """
  Its version (0).
  """
  version: Int!
}

"""
An address resolved (resolveAddress): its canonical address and URL, its kept address parameters (keys sorted,
each once, at most 5, the ignored left out), and, for a playlist address, the playlist.
"""
type ResolvedAddress {
  """
  The canonical address, parameters included ("@erin>journey;from=3;t=30").
  """
  address: String!
  """
  The address parameters kept.
  """
  parameters: [AddressParameter!]!
  """
  The playlist, for a playlist address; null otherwise.
  """
  playlist: Playlist
  """
  The experience kind of an experience instance address of the registry (since v101.0.0, D-301,
  experience-kinds.feature); null otherwise.
  """
  experienceKind: ExperienceKind
  """
  The universe event of an instance address of the kind "event" ("%paris*event!id=<id>", since v101.0.0); null
  otherwise.
  """
  universeEvent: UniverseEvent
  """
  The route of an instance address of the kind "route" ("@alice*route!id=<id>", since v101.0.0); null otherwise.
  """
  mapRoute: MapRoute
  """
  The canonical URL, the parameters as its query ("/a/erin/l/journey?from=3&t=30").
  """
  url: AWSURL!
}

"""
The video quota of the caller (long-videos.feature): the minutes of long videos over 30 days.
"""
type VideoQuota {
  """
  The minutes allowed over 30 days, by the highest tier of the caller.
  """
  limitMinutes: Int!
  """
  The minutes left.
  """
  minutesLeft: Int!
  """
  When the next minutes come back; null when none is used.
  """
  nextReturnAt: AWSDateTime
}
