  reason: String!
  """
  Since v81.11.0 (D-244): whether the caller starred it (starTheme).
  """
  starred: Boolean!
  """
  Its screenshots.
  """
  screenshots: [String!]!
  """
  The theme.
  """
  theme: Theme!
  """
  The number of universes that use it.
  """
  universeCount: Int!
  """
  The variant shown in the catalog (day or night).
  """
  variant: ThemeVariant!
}

