"""
type RecommendationSettings {
  """
  Whether the recommendations are on.
  """
  enabled: Boolean!
}

"""
The recommendations setting to change (a delegated agent: DELEGATED_AGENT_NOT_ALLOWED).
"""
input RecommendationSettingsInput {
  enabled: Boolean!
}

"""
Who can send connection requests to the caller. The values stay in lowercase, as stored.
"""
enum RequestPolicy {
  everyone
  following
  followers
  nobody
}

"""
Every personal setting of the caller, read at once (G-5).
"""
type Settings {
  """
  The settings of direct messages and group chats.
  """
  messaging: MessagingSettings!
  """
  The notification settings.
  """
  notifications: NotificationSettings!
  """
  The translation settings.
  """
  translation: TranslationSettings!
  """
  The recommendations setting.
  """
  recommendations: RecommendationSettings!
  """
  The nearby label the caller chose (contracts/nearby.md); null: its handle is shown.
  """
  nearbyLabel: String
  """
  The subtitles setting (automatic-subtitles.feature, since v78.0.0, D-214): whether the subtitles of every clip
  are shown as it plays, automatic or corrected; off by default; kept with the account, and on the device by
  the apps.
  """
  subtitles: Boolean!
  """
  The gesture tips already shown to the account (contracts/layouts.md § Gesture tips, since v78.2.0).
  """
