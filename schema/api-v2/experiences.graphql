  generationId: ID!
  constraints: VisitConstraintsInput!
  document: AWSJSON!
  instruction: String!
  language: String!
}

"""
Since v139.1.0 (D-439, contracts/experiences.md § The visit generator): a visit generation, accepted at once and run
after it, as the proposal check of D-422; read by visitGeneration, told by the real-time event visit.generation.
"""
type VisitGeneration {
  """
  Its identifier, given to createExperience to save its draft, or to correctVisitDraft.
  """
  generationId: ID!
  """
  Its outcome so far.
  """
  status: VisitGenerationStatus!
  """
  Why a REFUSED visit request was refused; null otherwise.
  """
  ground: VisitRefusalGround
  """
  The generated visit draft, READY and for 1 hour after it is ready; null otherwise.
  """
  draft: GeneratedVisitDraft
  """
  The visit generations of the day of the caller, this one counted when it counts.
  """
  allowance: VisitGenerationAllowance!
}

"""
Since v139.1.0: the outcomes of a visit generation: GENERATING; READY (a generated visit draft, counted); REFUSED (the
visit request or the instruction contrary to the platform rules or the law, counted; only a count of it is kept);
NOTHING_FOUND (fewer than 2 candidate places, not counted); FAILED (the model, the places service, the check of the
output or the 2 minutes, not counted).
"""
enum VisitGenerationStatus {
  GENERATING
  READY
  REFUSED
  NOTHING_FOUND
  FAILED
}

"""
Since v139.1.0 (D-449): the ground of a refused visit request: PLATFORM_RULES (contrary to the platform rules), LAW
(contrary to the law).
"""
enum VisitRefusalGround {
  PLATFORM_RULES
  LAW
}

"""
Since v139.1.0 (D-439, visit-generator.feature): a generated visit draft, private to the human who asked for it,
readable by visitGeneration for 1 hour after it is ready (the app holds it on the device): saved only by
createExperience with its generationId, within 7 days, once.
"""
type GeneratedVisitDraft {
  """
  The identifier of its visit generation, given to createExperience to save it, or to correctVisitDraft.
  """
  generationId: ID!
  """
  The experience template (breakrocks.experience/4) of a visit experience of 2 to 30 visit stages owned by the caller:
  its title, instruction and notes in language and in English, the English made by the automatic translation of the
  platform when language is not English (as the experience template requires); its visit stages with keys s1 to sN,
  named as the map names their place, each with its placeId (a candidate place); order.mode SUGGESTED, in the order of
  the stage order function; radiusMetres 50; spanDays as asked; no routeId and no parameters; the experience warnings
  its visit stages and constraints call for. It passes checkExperience for the caller at the answer.
  """
  document: AWSJSON!
  """
  The language of the visit request (ISO 639-1), else the language given: the language its texts were written in,
  besides their English.
  """
  language: String!
  """
  Why each visit stage was chosen, in the order of the visit stages of document.
  """
  stages: [GeneratedVisitStage!]!
  """
  What a visit draft correction changed from the draft it corrected; empty for a generation.
  """
  changes: [VisitDraftChange!]!
  """
  The area and the structured constraints it was made from, to send back with a visit draft correction.
  """
  constraints: VisitConstraints!
}

"""
Since v139.1.0 (D-439): a visit stage of a generated visit draft and its visit stage reason, from the visit decision
model.
"""
type GeneratedVisitStage {
  """
  The key of the visit stage in the document.
  """
  key: String!
  """
  Why the visit decision model chose it.
  """
  reason: VisitStageReason!
}

"""
Since v139.1.0 (D-439): why the visit decision model chose a visit stage: THEME_MATCH (its category matches the theme or
the categories asked), NAMED_IN_REQUEST (named in the visit request or the instruction), POPULAR_PLACE (among the most
active public places of the area), ON_THE_WAY (it fills the time between two visit stages), KEPT_FROM_DRAFT (a visit
draft correction kept it).
"""
enum VisitStageReason {
  THEME_MATCH
  NAMED_IN_REQUEST
  POPULAR_PLACE
  ON_THE_WAY
  KEPT_FROM_DRAFT
}

"""
Since v139.1.0 (D-439): one change a visit draft correction made.
"""
type VisitDraftChange {
  """
  What changed.
  """
  kind: VisitDraftChangeKind!
  """
  The key of the visit stage added or removed (a removed one: its key in the draft corrected); null for ORDER_CHANGED,
  TEXTS_CHANGED and CONSTRAINTS_CHANGED.
  """
  stageKey: String
}

"""
Since v139.1.0 (D-439): the kinds of a change of a visit draft correction: STAGE_ADDED, STAGE_REMOVED (one per visit
stage), ORDER_CHANGED, TEXTS_CHANGED, CONSTRAINTS_CHANGED (the days, the minutes a day, the travel mode, the theme or the
number of visit stages).
"""
enum VisitDraftChangeKind {
  STAGE_ADDED
  STAGE_REMOVED
  ORDER_CHANGED
  TEXTS_CHANGED
  CONSTRAINTS_CHANGED
}

"""
Since v139.1.0 (D-439 (6)): the visit generations of the day (00:00 to 24:00 UTC) of the caller.
"""
type VisitGenerationAllowance {
  """
  The visit generations free a day: 3.
  """
  limit: Int!
  """
  The visit generations counted today, from 0 to limit.
  """
  used: Int!
  """
  The visit requests and visit draft corrections that may be accepted a day, whatever their outcome: 10.
  """
  acceptedLimit: Int!
  """
  The visit requests and visit draft corrections accepted today, from 0 to acceptedLimit.
  """
  accepted: Int!
  """
  When the next day starts (00:00 UTC).
  """
  resetsAt: AWSDateTime!
}

"""
Since v139.1.0 (D-439): the area and the structured constraints of a generated visit draft, as the language model read
them and the constraints given apart set them; never kept by the platform, sent back by a visit draft correction.
"""
type VisitConstraints {
  """
  The south of the area (WGS 84).
  """
  south: Float!
  """
  The west of the area.
  """
  west: Float!
  """
  The north of the area.
  """
  north: Float!
  """
  The east of the area.
  """
  east: Float!
  """
  The days.
  """
  spanDays: Int!
  """
  The minutes a day.
  """
  minutesPerDay: Int!
  """
  FOOT or BICYCLE.
  """
  travelMode: RouteMode!
  """
  The theme; null when none.
  """
  theme: String
  """
  The number of visit stages at most.
  """
  stagesAtMost: Int!
  """
  The categories of places asked, among the closed list of the version of the visit decision model, 10 at most; empty
  when none.
  """
  categories: [String!]!
  """
  The placeId of the places named to include, 5 at most; empty when none.
  """
  includePlaceIds: [String!]!
  """
  The placeId of the places named to avoid, 10 at most; empty when none.
  """
  avoidPlaceIds: [String!]!
  """
  The placeId of the first visit stage of the draft, kept by a correction unless its instruction removes it.
  """
  startPlaceId: String!
  """
  The seal of the platform over the other fields and the generationId (HMAC-SHA-256, base64url): a correction sends the
  constraints back unchanged (VISIT_REQUEST_INVALID CONSTRAINTS_ALTERED otherwise).
  """
  seal: String!
}

"""
Since v139.1.0 (D-439): VisitConstraints sent back by a visit draft correction, unchanged: their seal is checked
(VISIT_REQUEST_INVALID CONSTRAINTS_ALTERED otherwise), so that every value is one the platform made and checked.
"""
input VisitConstraintsInput {
  south: Float!
  west: Float!
  north: Float!
  east: Float!
  spanDays: Int!
  minutesPerDay: Int!
  travelMode: RouteMode!
  theme: String
  stagesAtMost: Int!
  categories: [String!]!
  includePlaceIds: [String!]!
  avoidPlaceIds: [String!]!
  startPlaceId: String!
  seal: String!
}

"""
Since D-437 (posts/explore-things-to-do.feature; contracts/map.md § The things to do in Explore): an experience on the map
of Explore and on its result card, in a light form (no experience template, no experience opinion but its likes): a
public route experience at its route start, a public simple challenge (everywhere only, without a point), or a group
experience instance of a universe event (run set).
"""
type MapExperience {
  """
  The identifier of the experience.
  """
  id: ID!
  """
  Its address ("@alice*canal-banks").
  """
  address: String!
  """
  Its title in the language of the caller, else in English.
  """
  title: String!
  """
  Its engine and its version (route/1 or challenge/1).
  """
  engine: ExperienceEngine!
  """
  Its experience owner as an address: "@alice" for an account, "%paris" for a universe, "*" for the social platform.
  """
  owner: String!
  """
  Its experience owner as the result card names it (the canvas: "by Alice"): the display name of an account; the name of
  a universe without its sign ("paris"), which the apps draw after the icon of the sign (the reserved-sign icon rule:
  the icon, never the sign typed); "break.rocks" for the social platform (set while writing).
  """
  ownerName: String!
  """
  The number of accounts whose experience opinion of it is LIKE (ExperienceOpinions.likeCount), the counter of the
  experience item; the apps show it with a heart from 1, never order by it. Never the number of dislikes, never who.
  """
  likeCount: Int!
  """
  Its point: the route start of a route experience as the readers other than its author see it (the privacy zones of
  its author applied, D-415; the same for its author, set while writing), the point of the universe event of a group
  experience instance; null for a simple challenge, which has no place.
  """
  point: Point
  """
  A route experience (or a group experience instance of one): its route in its light form, as mapRouteMarkers answers
  it to a reader other than its author (the length, the mode); null otherwise. The apps never show a duration nor a time
  for it. The experience warnings and the likes of the sheet a touch on its experience marker opens are read with
  experience(id), the detail read, at that touch.
  """
  route: MapRouteMarker
  """
  A route experience: the number of the stages of its route the caller sees (the privacy zones of its author applied);
  null otherwise.
  """
  stages: Int
  """
  A simple challenge (or a group experience instance of one): its engine block (what it measures, its unit, its target,
  its hours); null otherwise.
  """
  challenge: ChallengeSetup
  """
  A group experience instance of a universe event (EXPERIENCE_RUN); null for an experience.
  """
  run: MapExperienceRun
}

"""
Since D-437 (posts/explore-things-to-do.feature; D-442 (Q6, Q15)): a group experience instance planned at a universe event,
as Explore shows it to whoever reads the universe event: when it starts, its universe event and whether the caller may
join it now; its number of experience participants to whoever reads it; never its experience participants, their
experience results nor their proofs, which the experience instance shows to the attendees of its universe event only
(contracts/experiences.md § Visibility).
"""
type MapExperienceRun {
  """
  The identifier of the experience instance.
  """
  id: ID!
  """
  STARTED (waiting for its scheduled start): D-442 (Q6) counts the group experience instances planned at a universe
  event; one in progress is not answered (decided by the user on 2026-11-18, D-449 (2)), but IN_PROGRESS to
  mapExperiences(inProgress: true), the universe marker card (D-473 (3)).
  """
  state: ExperienceRunState!
  """
  When it starts, which the time window reads (shown when it lies within the time window).
  """
  startsAt: AWSDateTime!
  """
  The identifier of its universe event; the apps take its title, its place and its time from the universe events they
  already read for the map.
  """
  eventId: ID!
  """
  The number of its experience participants (50 at most), served to every caller who reads it, never their names
  (decided by the user on 2026-11-18; from v137.2.0 to v139.1.0, to an attendee of its universe event only, D-449 (1)).
  Kept nullable for the apps built on those versions; null, with the single meaning "not served to this caller" (P-8),
  is no longer answered.
  """
  participants: Int
  """
  True when the caller attends its universe event, takes no part in it, has no experience instance of that experience
  in progress, and it holds fewer than 50 experience participants: the result card offers "Join" (joinExperienceRun after
  its experience warnings); false otherwise: no direct action, the result card opens the event sheet.
  """
  canJoin: Boolean!
}

