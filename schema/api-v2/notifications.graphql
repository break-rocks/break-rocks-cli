"""
The data request of a notification of My data (since v68.1.0): DATA_COPY_READY its "expiresAt" and
number of "parts"; BULK_ERASURE_DONE its "scope" and "kept"; DATA_REQUEST_ANSWERED the "answer" of
the platform team to a rectification request.
"""
type NotificationDataRequest {
  """
  The answer of the platform team to a rectification; null otherwise.
  """
  answer: String
  """
  When it expires.
  """
  expiresAt: AWSDateTime
  """
  The identifier of the notification data request.
  """
  id: ID!
  """
  What is kept after a bulk erasure, and why; null otherwise.
  """
  kept: [KeptData!]
  """
  The kind of the notification data request.
  """
  kind: DataRequestKind!
  """
  The number of parts of a data copy ready; null otherwise.
  """
  parts: Int
  """
  The scope of a bulk erasure; null otherwise.
  """
  scope: BulkErasureScope
}

"""
The kind of a notification (contracts/notifications.md). An unknown kind is shown as a generic notification,
so that new kinds can be added. Since v84.0.0 (D-248): MAP_STALKING_ALERT, an account (actor) viewed the
position of the reader beyond the stalking alert threshold within 24 hours, never how many times exactly.
Since v84.4.0: TERMS_CHANGED, a version of the terms of use or of the platform rules published ("subject":
"terms" or "rules", "message" the version and when it applies; contracts/platform-measures.md).
Since v86.0.0: SERIES_EPISODE, a new episode of a followed series ("subject" the playlist address, "postId" the
episode). Since v87.5.0 (D-268): DOCUMENT_REFUSED, to the uploader of a file of a course document found malicious by
the malware scan or refused by the media review, never served ("subject" the playlist address, "message" the
title of the course document and the reason: malicious or the rule of the media review); category PLAYLISTS.
Since v87.6.0 (D-269): also to the author of a post document refused ("subject" the address of the post, the post
staying without its document card).
Since v92.0.0 (D-284): MASK_REQUESTED, a person shown in a media of the caller asks to hide an area; SANCTION_MEDIA_MASK, a moderator masked a media of the caller (category moderation).
Since v99.1.0: PLATFORM_APPEAL_OVERDUE (M-12, M-14), a platform appeal of the reader without a decision 14 days
after it was filed: an out-of-court dispute settlement body can be asked (category moderation, mandatory);
REPORT_DECIDED (M-09), the platform team decided a report of the reader (category moderation).
"""
enum NotificationKind {
  APPEAL_DECIDED
  BULK_ERASURE_DONE
  CHANNEL_MENTION
  CHANNEL_MESSAGE
  CHANNEL_RESPONSE
  CONNECTION_ACCEPTED
  CONNECTION_REQUEST
  DATA_COPY_READY
  DATA_REQUEST_ANSWERED
  DELEGATED_AGENTS_DEACTIVATED
  DIRECT_MESSAGE
  DOCUMENT_REFUSED
  EVENT_CANCELLED
  EVENT_CHANGED
  EVENT_PLACE_REVEALED
  EVENT_REMINDER
  FOLLOW
  GROUP_INVITATION
  GROUP_MENTION
  GROUP_MESSAGE
  INVITATION_SIGN_UP
  JUROR_DRAWN
  LIKE
  MAP_STALKING_ALERT
  MASK_REQUESTED
  MEET_UP_SOON
  MENTION
  MODERATOR_DESIGNATED
  PASSWORD_RESET
  PLATFORM_APPEAL_DECIDED
  PLATFORM_APPEAL_OVERDUE
  PLATFORM_MEASURE
  POST_DRAFT_EXPIRES_SOON
  PRIVATE_POST_REPOSTED
  PROJECT_NOTE
  PROJECT_REPORTED_DONE
  QUOTE
  REPLY
  REPORT_DECIDED
  REPOST
  REPOST_REQUEST
  REPOST_REQUEST_ANSWERED
  SANCTION_CHANNEL_MESSAGE_REMOVAL
  SANCTION_MEDIA_MASK
  SANCTION_POSTING_BAN
  SANCTION_POST_REMOVAL
  SANCTION_WRITING_BAN
  SCHEDULED_POST_FAILED
  SERIES_EPISODE
  SIGNED_OUT_EVERYWHERE
  SUBSCRIPTION_ENDED
  SUBSCRIPTION_ENDS_SOON
  SUBSCRIPTION_PAYMENT_FAILED
  TERMS_CHANGED
  TIER_PRICE_CHANGE
  UNIVERSE_ACCESS_OPENED
  UNIVERSE_ANNOUNCEMENT
  UNIVERSE_DEBATE_OPENED
  UNIVERSE_DECLARATION_REJECTED
  UNIVERSE_DELETED
  UNIVERSE_INACTIVE
  UNIVERSE_INVITATION
  UNIVERSE_JOIN_ACCEPTED
  UNIVERSE_JOIN_REQUEST
  UNIVERSE_LEVEL_CHANGED
  UNIVERSE_PROJECT_DONE
  UNIVERSE_PROPOSAL_ANNULLED
  UNIVERSE_SECOND_ROUND
  UNIVERSE_SUBSCRIPTION_OPENED
  UNIVERSE_SUCCESSOR
  UNIVERSE_TRANSFER
  UNIVERSE_TRANSFER_DECLINED
  UNIVERSE_VOTE_OPENED
  UNIVERSE_VOTE_RESULT
  VOTES_FIRST_RECEIVED
}

"""
A sanction received (SANCTION_POST_REMOVAL, SANCTION_POSTING_BAN): its id (mySanctions, where
it is appealed), the articles of the charter it cites (none for an automatic posting ban
without one), a posting ban's days and end, when its appeal closes.
A platform measure received (PLATFORM_MEASURE, since v49.8.0): what was done ("action":
UNIVERSE_TERRITORY_REMOVAL, the removal of the universe territory of "universe", named in
"subject"), the article of the platform rules applied, the statement of reasons, and whether it
was decided automatically (false: a human decided it).
"""
type NotificationMeasure {
  """
  The measure taken.
  """
  action: String!
  """
  The article of the platform rules cited; null when none.
  """
  article: Int
  """
  Whether the measure was taken by automated means.
  """
  automated: Boolean!
  """
  The statement of reasons.
  """
  statement: String!
  """
  Since v84.4.0: the measure in myPlatformMeasures, where its whole statement of reasons is read; null for a
  measure on a universe territory.
  """
  measureId: ID
  """
  Since v84.4.0: CONTENT_REMOVAL, POSTING_BAN, SUSPENSION, BAN or AGENT_SUSPENSION; null for a measure on a
  universe territory.
  """
  kind: PlatformMeasureKind
  """
  Since v84.4.0: when it ends; null for a removal and a ban.
  """
  endsAt: AWSDateTime
  """
  Since v84.4.0: when a platform appeal can be filed until; null when none can.
  """
  appealableUntil: AWSDateTime
  """
  Since v84.4.0: the counted platform measures of the account within 90 days, this one included; null when it
  does not count.
  """
  countedWithin90Days: Int
  """
  Since v85.0.0 (D-250): the outcome of the platform appeal (PLATFORM_APPEAL_DECIDED); null otherwise.
  """
  appealOutcome: PlatformAppealOutcome
  """
  Since v85.0.0 (D-250): the reasons of the decision of the platform appeal (PLATFORM_APPEAL_DECIDED); null
  otherwise.
  """
  appealReasons: String
  """
  Since v99.1.0 (M-12): when the platform appeal was filed (PLATFORM_APPEAL_OVERDUE); null otherwise.
  """
  appealedAt: AWSDateTime
  """
  Since v99.1.0 (M-12): when the platform appeal became overdue, 14 days after it was filed
  (PLATFORM_APPEAL_OVERDUE); null otherwise.
  """
  overdueSince: AWSDateTime
}

"""
The decision of the platform team on a report of the reader (REPORT_DECIDED, since v99.1.0, M-09,
