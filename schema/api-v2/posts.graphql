"""
The clip of a post or a message (a video of 3 minutes and 512 MB at most), on the media CDN: url
is its HLS playlist (master), posterUrl its first frame (JPEG); its length, its size as shown,
its orientation: VERTICAL and SQUARE full screen in the clip feed, HORIZONTAL and SQUARE in a
player within the post.
"""
type Clip {
  """
  Whether its automatic subtitles are on (automatic-subtitles.feature, since v78.0.0, D-214): false once the
  author of its post turned them off (setAutomaticSubtitles), and for the clip of a message.
  """
  automaticSubtitles: Boolean!
  """
  Its length, in milliseconds.
  """
  durationMs: Int!
  """
  Its height, in pixels.
  """
  height: Int!
  """
  The identifier of the clip.
  """
  id: ID!
  """
  Its orientation.
  """
  orientation: ClipOrientation!
  """
  The cover frame of the clip, generated by the platform.
  """
  posterUrl: String!
  """
  Its subtitles (automatic-subtitles.feature, since v78.0.0, D-214): its automatic subtitles, written on the
  social platform by a platform AI agent in the main language spoken, some cues corrected or not; shown to a reader
  whose subtitles setting is on (Settings.subtitles). Null when nobody speaks in it, before they are written,
  when they are turned off (automaticSubtitles false, or by the owner of its private universe when it was
  posted), beyond the number of texts of the day of the agent, once removed after a report, and for the clip
  of a message.
  """
  subtitles: ClipSubtitles
  """
  Its URL.
  """
  url: String!
  """
  Its width, in pixels.
  """
  width: Int!
}

"""
Detected from the dimensions of a clip (square: sides within 5 %), never chosen.
"""
enum ClipOrientation {
  HORIZONTAL
  SQUARE
  VERTICAL
}

"""
The subtitles of a clip (automatic-subtitles.feature, since v78.0.0, D-214): written by a platform AI agent in
the main language spoken, each subtitle cue keeping what is said in the language it is said; a cue the author
of the post corrected is marked so (SubtitleCue.corrected), the others are marked as written by a platform AI
agent; they transcribe what the author says: a report of them is a report of the post (POST). Shown with the
clip as it plays; translated as the post (translation(kind: CLIP_SUBTITLES, id: the post), Translation.cues).
"""
type ClipSubtitles {
  """
  Its subtitle cues, in the order of the clip.
  """
  cues: [SubtitleCue!]!
  """
  The main language spoken in the clip (ISO 639-1).
  """
  language: String!
}

"""
An image on the media CDN: <url>/<width>.webp, a width among widths (in pixels, at most the original's);
blurhash draws a placeholder of the right colors while it loads. The images of posts, messages,
universes (banner, logo), link previews and avatars (G-10: was PostImage).
"""
type Image {
  """
  The identifier of the image.
  """
  id: ID!
  """
  Its URL.
  """
  url: String!
  """
  The widths served, in pixels, increasing.
  """
  widths: [Int!]!
  """
  The size of the original, in pixels (of its first frame for an animated image).
  """
  width: Int!
  """
  Its height, in pixels.
  """
  height: Int!
  """
  A placeholder of the right colors, drawn while the image loads.
  """
  blurhash: String!
  """
  Its text alternative, as its author wrote it (since v78.0.0, D-214: or accepted or corrected its suggested
  alternative text, or wrote in place of its automatic alternative text); translated as the post
  (translation(kind: IMAGE_ALT, id: the image, container: the post)); null when none.
  """
  alt: String
  """
  Whether alt is the alternative text its author wrote once in place of its automatic alternative text
  (setImageAlt, since v78.0.0, D-214): shown marked as changed, the automatic alternative text kept in the post
  history (Post.mediaVersions); false otherwise.
  """
  altChanged: Boolean!
  """
  Whether alt is its suggested alternative text accepted without a change (since v78.0.0, D-214): shown marked
  as suggested by AI; false for a text the author wrote or corrected, and without alt.
  """
  altSuggested: Boolean!
  """
  Its automatic alternative text (automatic-alternative-text.feature, since v78.0.0, D-214), for an image of a
  post, a reply or a quote posted without an alternative text, at most 1,000 visible characters: its suggested
  alternative text when one was written (one text per image, in the language of the app of the author),
  otherwise written by a platform AI agent when the post is posted, in the language of the post (for a post
  without a language, the language most used by the posts of its universe and its sub-universes in the last 30
  days, English on a tie or without a post), kept when the language of the post is detected again; marked as
  written by a platform AI agent and read so by the screen readers; translated as the post
  (translation(kind: IMAGE_ALT)). Null when the image has an alternative text (alt), before it is written,
  beyond the number of texts of the day of the agent, when the owner of its private universe turned the
  automatic alternative texts off when it was posted, once removed (after a report, or, since v78.1.0, by the
  moderation of the universe with removePlatformAgentText), and for any image but those of the posts.
  """
  automaticAlt: String
  """
  Its variants are animated WebP (an animated GIF or WebP of at most 30 seconds and 300 frames stays
  animated; beyond, its first frame); false for a still image and for every image published before
  2026-10-24.
  """
  animated: Boolean!
}

"""
An image uploaded (requestMediaUpload, kind IMAGE) to attach: its id and its text alternative. In changePost
(since v78.0.0): an image of the post (Image.id) and its new alternative text (none: erased).
"""
input ImageAttachmentInput {
  alt: String
  """
  The identifier of the image attachment input.
  """
  id: ID!
}

"""
The link preview of a post or a message (link-previews.feature): of the first link of its text,
built by the social platform for the sender (linkPreview), never by the reader; "url" the link;
"title" at most 200 characters, "description" 300; "image" copied by the social platform (on the
media CDN, never from the page); "siteName" as the page tells it.
"""
type LinkPreview {
  """
  Its description; null when none.
  """
  description: String
  """
  Its image; null when none.
  """
  image: Image
  """
  The name of the site; null when none.
  """
  siteName: String
  """
  Its title.
  """
  title: String!
  """
  Its URL.
  """
  url: String!
}

"""
The media destination of a media upload (requestMediaUpload, since v78.0.0, D-214), declared when it is
uploaded and kept with the media, which is attached there only (MEDIA_DESTINATION_MISMATCH): POST (a post, a
reply or a quote, with the universe where it goes: requestMediaUpload "address"), DIRECT_MESSAGE,
GROUP_MESSAGE, CHANNEL_MESSAGE, UNIVERSE_IMAGE (the image of a universe, its logo; also the logo of a proposal),
UNIVERSE_BANNER (its banner, day or night), THEME (an image slot of a theme). An avatar has its own upload
(requestAvatarUpload). Only an image of POST gets a suggested alternative text (suggestedAlt).
"""
enum MediaDestination {
  CHANNEL_MESSAGE
  DIRECT_MESSAGE
  GROUP_MESSAGE
  POST
  THEME
  UNIVERSE_BANNER
  UNIVERSE_IMAGE
}

"""
What a media upload is for (requestMediaUpload, C-11): an image of a post, a message or a universe, a
video (the clip of a post or a message), a voice message.
"""
enum MediaKind {
  IMAGE
  VIDEO
  VOICE
}

"""
What to upload (requestMediaUpload, since v78.0.0 in one input, P-5): kind, contentType and size (in bytes),
as before; destination, its media destination (MediaDestination); address, for POST only, the universe where
the post, the reply or the quote goes (a posting address; none: the personal space; a reply: the universe of
its thread). An address for another media destination, or a kind the media destination does not take (VOICE
for POST, VIDEO for UNIVERSE_IMAGE, UNIVERSE_BANNER and THEME): MEDIA_DESTINATION_INVALID.
"""
input MediaUploadInput {
  address: String
  contentType: String!
  destination: MediaDestination!
  kind: MediaKind!
  size: Int!
}

"""
A signed form to upload a media directly to the storage (requestMediaUpload, requestAvatarUpload): POST
the fields, then the file, to url; id names the media where it is used (an image of a post, a clip, a voice
message, the avatar of updateProfile). G-10: one type for the four uploads.
"""
type MediaUpload {
  """
  The identifier of the media upload.
  """
  id: ID!
  """
  Its URL.
  """
  url: String!
  """
  The fields of the form, posted as they are before the file.
  """
  fields: AWSJSON!
}

"""
The lists of posts of My interactions (myPosts, G-9): the posts the caller liked, those it reposted.
"""
enum MyPostsKind {
  LIKED
  REPOSTED
}

"""
The new posts banner (live-posts.feature): the new posts the reader can read since a post or
a time, at most 100 ("99+" from 100), and the authors of the 3 most recent, newest first
(each once).
"""
type NewPosts {
  """
  The authors of the 3 most recent posts counted (for a repost, who reposted), as shown.
  """
  authors: [AccountRef!]!
  """
  The new posts.
  """
  count: Int!
}

"""
A post in a universe.
"""
type Post {
  """
  Its identifier: "<cell>-<requestId>", the cell of its universe and the requestId of the createPost,
  replyTo, quote or repost that created it (R-1, contracts/cells.md § Which cell to call); never parsed by a
  client beyond its prefix.
  """
  id: ID!
  """
  Its author, as shown.
  """
  author: AccountRef!
  """
  The text as written.
  """
  text: String!
  """
  The text as shown (its signs resolved).
  """
  display: String!
  """
  The universe of the post, with its sign ("%paris").
  """
  universe: String!
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  The number of its likes.
  """
  likeCount: Int!
  """
  Whether the caller likes it.
  """
  likedByMe: Boolean!
  """
  Its address, with its signs.
  """
  address: String!
  """
  Written by a platform AI agent and marked so: a daily digest, a debate summary (kind "debate_summary",
  debates.feature), a conversation starter (kind "conversation_starter", conversation-starters.feature, since
  v77.1.0; since v78.1.0, never in the first person, ending with its open question, with at most 1 emoji and
  none when none of the last 20 posts of its universe has one).
  """
  ai: Boolean!
  """
  An announcement of the leadership (kind "announcement", announcements.feature): when it is unpinned (7 days
  after it is posted); null once unpinned, and for any other post.
  """
  announcementPinnedUntil: AWSDateTime
  """
  The role its author had in its universe when they posted (universe-page.feature, since v46.0.0):
  written with the post from the governance of the first level (the leadership, its interim, the
  moderators, the account the governance of the sub-universe was given to; the post of a delegated
  agent: its human's), never recomputed. Served by posts(address) of a public universe and by the
  thread of a post of a public universe; null everywhere else (the personal timeline, Explore, the
  search, My interactions, the private universes).
  """
  authorRole: PostAuthorRole
  """
  A post of a restricted author waiting for the approval of a moderator (seen by its author and the moderators
  only).
  """
  awaitingApproval: Boolean!
  """
  When it was last changed; null when never.
  """
  changedAt: AWSDateTime
  """
  Its clip (never with images).
  """
  clip: Clip
  """
  Whether it is deleted.
  """
  deleted: Boolean!
  """
  A daily digest of the system account, written by a platform AI agent (daily-digest.feature): the day (UTC)
  it sums up; null otherwise.
  """
  digestOf: AWSDate
  """
  Its dislikes: to its author only (null to the others).
  """
  dislikeCount: Int
  """
  Whether the caller dislikes it.
  """
  dislikedByMe: Boolean!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  In a public universe (universe-reputation.feature), recomputed at every read from its weighted
  likes and reports and the residents of its universe: folded (shown folded, as reported
  off-charter), removed from feeds (absent from the fils, reachable by its link).
  """
  folded: Boolean!
  """
  Whether it is hidden.
  """
  hidden: Boolean!
  """
  The hidden replies of its thread (replies.feature: hidden by the author of the post, readable
  behind a link), on its root: those hidden anywhere in it and not deleted; 0 on a reply
  (thread(id, hidden: true) lists those of its root). Kept within seconds; show the link to the
  hidden replies only when above 0.
  """
  hiddenReplyCount: Int!
  """
  Its images, in order; empty when none.
  """
  images: [Image!]!
  """
  The kind of the post.
  """
  kind: PostKind!
  """
  The language of a post or a quote (ISO 639-1), detected by the social platform, not shown; null: undetected,
  a reply, a repost.
  """
  language: String
  """
  The link preview of the first link of its text, placed by its author (never with images or a clip); null
  without.
  """
  link: LinkPreview
  """
  The former alternative texts and subtitles of its media (since v78.0.0, D-214): the automatic alternative
  text its author replaced (setImageAlt) and every correction of its subtitles (correctSubtitles), the oldest
  first. Served to its author, the moderation of its universe and whoever reported the post; null for any
  other reader.
  """
  mediaVersions: [PostMediaVersion!]
  """
  A post of the system account that is a moment of its universe (universe-moments.feature): never deleted;
  null otherwise.
  """
  moment: MomentKind
  """
  The parts of a moment (contracts/living-universes.md § Moments), rendered by the apps in the language of the
  reader; null when "moment" is null.
  """
  momentData: MomentData
  """
  The post a repost or a quote is of; null otherwise.
  """
  original: PostOriginal
  """
  A reply: the author of the post or reply it answers ("Replying to @x").
  """
  parentAuthor: AccountRef
  """
  The post or reply it answers; null for a post.
  """
  parentId: ID
  """
  A project post of the system account (kind "project", projects.feature, since v46.0.0): the action proposal
  it tells; null otherwise.
  """
  projectOf: Proposal
  """
  Whether it is removed from the feeds (reachable by its link).
  """
  removedFromFeeds: Boolean!
  """
  Its number of replies.
  """
  replyCount: Int!
  """
  Who can reply to it.
  """
  replyPolicy: ReplyPolicy!
  """
  The kinds of report the caller already made of this post (empty: none): show "Reported".
  """
  reportedByMe: [ReportKind!]!
  """
  Its number of reposts.
  """
  repostCount: Int!
  """
  The rules post of a public universe (kind "rules", rules-post.feature): what it tells, rendered by the apps
  in the language of the reader; null otherwise.
  """
  rules: RulesPost
  """
  The zones of display: links, mentions, formatting (contracts/text.md).
  """
  spans: [TextSpan!]!
  """
  The tags, with their sign.
  """
  tags: [String!]!
  """
  The temporary rules of a private universe, posted by the system account at its creation
  (pinned-posts.feature).
  """
  temporaryRules: Boolean!
  """
  The root of its thread; null for a post.
  """
  threadId: ID
  """
  Its canonical web URL (contracts/urls.md): to copy or share, never built by a client.
  """
  url: AWSURL!
  """
  Its former texts, when it was changed.
  """
  versions: [PostVersion!]!
  """
  The delegated agent that wrote it for its operator; null otherwise.
  """
  via: PostVia
  """
  The handle of the delegated agent that wrote it, as shown; null otherwise.
  """
  viaHandle: String
  """
  The clip view count (profile-tabs.feature, since v77.0.0, D-210): the number of the clip views of its clip,
  counted within the hour, never for its author, a delegated agent nor an account of less than 30 days
  (contracts/recommendations.md § Clip plays), the same for every reader; served by posts(address, filter:
  CLIPS) only, for the thumbnails of the profile tab "Clips"; null everywhere else, for a post without a
  vertical or square clip and for a post of a private universe.
  """
  viewCount: Int
}

"""
The role badge of a post (universe-page.feature, since v46.0.0): the role its author had in its universe when
they posted.
"""
enum PostAuthorRole {
  LEADERSHIP
  MODERATOR
}

"""
The kind of a post. The values stay in lowercase, as stored.
"""
enum PostKind {
  announcement
  conversation_starter
  debate_summary
  post
  project
  quote
  reply
  repost
  rules
}

"""
A page of posts; "reason" tells why they are shown when they are suggested.
The original copied into a repost or a quote, as it was; "deleted" when its author deleted it.
"""
type PostOriginal {
  """
  Its address, with its signs.
  """
  address: String!
  """
  Its author, as shown.
  """
  author: AccountRef!
  """
  Its clip; null when none.
  """
  clip: Clip
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  Whether it is deleted.
  """
  deleted: Boolean!
  """
  The text as shown, its signs resolved (contracts/text.md).
  """
  display: String!
  """
  The identifier of the post original.
  """
  id: ID!
  """
  Its images, in order; empty when none.
  """
  images: [Image!]!
  """
  The zones of display: links, mentions, formatting (contracts/text.md).
  """
  spans: [TextSpan!]!
  """
  By an account the reader blocked, that blocked it, or that it muted: neither author nor text.
  """
  unavailable: Boolean!
}

"""
A page of posts, newest first.
"""
type PostPage {
  """
  The post items of this page.
  """
  items: [Post!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
  """
  How the posts are ranked, for the suggested posts; null for the other pages.
  """
  reason: String
}

"""
A post by its identifier and its canonical URL (contracts/urls.md), where a whole Post cannot be served.
"""
type PostRef {
  """
  The identifier of the post ref.
  """
  id: ID!
  """
  Its URL.
  """
  url: AWSURL!
}

"""
The feed filters of a public universe of the first level (universe-page.feature, since v46.0.0); ALL by
default. Since v76.0.0 (D-209, profile-tabs.feature), CLIPS and IMAGES filter the posts of an address with
an account, for the profile tabs "Clips" and "Photos": the posts of the account (never its
replies nor its reposts) with a vertical or square clip (CLIPS), or with at least one image (IMAGES), the
most recent first.
"""
enum PostsFilter {
  ALL
  CLIPS
  DISCUSSED
  IMAGES
  LEADERSHIP
  PROJECTS
  SUB_UNIVERSES
}

"""
A version of the post history for its media (Post.mediaVersions, since v78.0.0, D-214): what was there before
a change. ALT: imageId and alt, the automatic alternative text the author replaced. SUBTITLES: cues, the
subtitle cues before a correction.
"""
type PostMediaVersion {
  """
  The former alternative text (ALT): the automatic alternative text replaced; null for SUBTITLES.
  """
  alt: String
  """
  When it was replaced.
  """
  at: AWSDateTime!
  """
  The subtitle cues before the correction (SUBTITLES); null for ALT.
  """
  cues: [SubtitleCue!]
  """
  The image of the alternative text replaced (ALT); null for SUBTITLES.
  """
  imageId: ID
  """
  What was changed.
  """
  kind: PostMediaVersionKind!
}

"""
What a version of the post history for its media is of (PostMediaVersion): the automatic alternative text of
an image, or the subtitles of the clip.
"""
enum PostMediaVersionKind {
  ALT
  SUBTITLES
}

"""
A former text of a post that was changed.
"""
type PostVersion {
  """
  When this text was replaced.
  """
  at: AWSDateTime!
  """
  The text as shown, its signs resolved (contracts/text.md).
  """
  display: String!
  """
  The alternative texts its images had then (since v78.0.0, D-214: changed with changePost), in the order of
  the images; empty for a post without images.
  """
  images: [PostVersionImage!]!
  """
  The zones of display: links, mentions, formatting (contracts/text.md).
  """
  spans: [TextSpan!]!
}

"""
An image of a post as it was in a former version (PostVersion.images, since v78.0.0, D-214): its id and the
alternative text it had then.
"""
type PostVersionImage {
  """
  Its alternative text then; null when none.
  """
  alt: String
  """
  The identifier of the image.
  """
  id: ID!
}

"""
The delegated agent that wrote a post or a message for its operator.
"""
type PostVia {
  """
  The name of the delegated agent.
  """
  agentName: String!
}

"""
Who can reply to a post. The values stay in lowercase, as stored.
"""
enum ReplyPolicy {
  everyone
  following
  mentioned
  nobody
}

"""
A member's request to repost "postId" of its private universe in "target" (a posting address).
"""
type RepostRequest {
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The identifier of the repost request.
  """
  id: ID!
  """
  The identifier of the post.
  """
  postId: ID!
  """
  The repost made once accepted; null before.
  """
  repostId: ID
  """
  Who asked, as shown.
  """
  requester: AccountRef!
  """
  The state of the repost request.
  """
  status: RepostRequestStatus!
  """
  The posting address of the repost (a universe).
  """
  targetUniverse: String!
  """
  The text of the quote asked; null for a repost.
  """
  text: String
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A page of repost requests, the most recent first.
"""
type RepostRequestPage {
  """
  The repost request items of this page.
  """
  items: [RepostRequest!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
The state of a repost request.
"""
enum RepostRequestStatus {
  ACCEPTED
  REFUSED
  WAITING
}

"""
A subtitle of a clip (since v78.0.0, D-214): its text, from startMs to endMs of the clip, at most 200 visible
characters.
"""
type SubtitleCue {
  """
  Whether the author of the post corrected it (correctSubtitles): the text of the author, marked as corrected;
  false: marked as written by a platform AI agent.
  """
  corrected: Boolean!
  """
  When it ends, in milliseconds from the start of the clip.
  """
  endMs: Int!
  """
  When it starts, in milliseconds from the start of the clip.
  """
  startMs: Int!
  """
  The text of the subtitle cue.
  """
  text: String!
}

"""
A subtitle of a clip as the author of the post corrects it (correctSubtitles, since v78.0.0, D-214): its text,
from startMs to endMs of the clip; within the clip, in its order, each ending after it starts, without
overlapping (SUBTITLE_CUES_INVALID); at most 200 visible characters (SUBTITLE_TOO_LONG); at most 1 cue per
second of the clip (SUBTITLES_TOO_MANY) and 10,000 visible characters in all (SUBTITLES_TOO_LONG). A cue whose
text differs from the cue at the same times before, or a new cue, is marked as corrected.
"""
input SubtitleCueInput {
  endMs: Int!
  startMs: Int!
  text: String!
}

"""
A zone of the display text of a post (contracts/text.md).
"""
type TextSpan {
  """
  For a link: the domain shown next to the text; null otherwise.
  """
  domain: String
  """
  Where the zone ends in display (a UTF-16 offset, excluded).
  """
  end: Int!
  """
  The kind of the text span.
  """
  kind: TextSpanKind!
  """
  The number of an item of a numbered list; null otherwise.
  """
  number: Int
  """
  Where the zone starts in display (a UTF-16 offset).
  """
  start: Int!
  """
  What a universe or a tag links to ("%paris/tourisme", "#sport"); null for the other kinds.
  """
  target: String
  """
  The identifier of the account it is about; null otherwise.
  """
  targetId: ID
  """
  The text as written of a link (its URL), an account, a universe, a tag or an address; null for the
  formatting.
  """
  value: String
}

"""
The kind of a zone of the text shown (contracts/text.md § Kinds of span). An unknown kind is shown as plain
text, so that new kinds can be added. The values stay as stored.
"""
enum TextSpanKind {
  bold
  italic
  strike
  code
  quote
  listItem
  orderedItem
  link
  account
  universe
  tag
  address
}

"""
A post and its replies: its root and a page of replies.
"""
type Thread {
  """
  The thread items of this page.
  """
  items: [Post!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
  """
  The post the thread starts from.
  """
  root: Post!
}

"""
The kinds of content translated: a reply is a POST, a debate summary is a POST, a debate message a
CHANNEL_MESSAGE; since v77.1.0 (D-213), PROPOSAL_SUMMARY and VOTE_MINUTES the proposal summary and the vote
minutes of a proposal (id: the proposal), a conversation starter a POST; since v78.0.0 (D-214), IMAGE_ALT
the alternative text of an image of a post, of its author, accepted or automatic (id: the image, container:
the post), and CLIP_SUBTITLES the subtitles of the clip of a post (id: the post), automatic or corrected.
"""
enum TranslatableKind {
  BIO
  CHANNEL_MESSAGE
  CHARTER
  CLIP_SUBTITLES
  DIRECT_MESSAGE
  GROUP_MESSAGE
  IMAGE_ALT
  POST
  PROPOSAL
  PROPOSAL_SUMMARY
  UNIVERSE_DESCRIPTION
  VOTE_MINUTES
}

"""
A content rendered in "language" (one of the 20 languages of the apps) from "from" (the language
detected): "title" for a proposal; "text" and "display" the translated text (its formatting in
"spans", the mentions, addresses, tags and links untranslated at their new offsets, contracts/text.md;
none for a charter, a description or a bio); "version" the version of the content translated.
"""
type Translation {
  """
  The translated subtitle cues of CLIP_SUBTITLES, at the times of the original (since v78.0.0, D-214); null
  for any other kind.
  """
  cues: [SubtitleCue!]
  """
  The text as shown, its signs resolved (contracts/text.md).
  """
  display: String!
  """
  The language detected of the content (ISO 639-1).
  """
  from: String!
  """
  The language it is translated into (ISO 639-1).
  """
  language: String!
  """
  The zones of display: links, mentions, formatting (contracts/text.md).
  """
  spans: [TextSpan!]!
  """
  The translated text.
  """
  text: String!
  """
  The translated title (a proposal); null otherwise.
  """
  title: String
  """
  Its version, which grows at each publication.
  """
  version: String!
}

"""
The voice message of a message (15 minutes at most, sent on its own), on the media CDN: url is
its file (AAC-LC, mono, 64 kbit/s, in MP4: .m4a, read by ranges); its length decoded by the
social platform; "peaks" its waveform, 64 values from 0 to 1 (the loudest is 1).
"""
type Voice {
  """
  Its length, in milliseconds.
  """
  durationMs: Int!
  """
  The identifier of the voice.
  """
  id: ID!
  """
  The peaks of its waveform, from 0 to 1.
  """
  peaks: [Float!]!
  """
  Its URL.
  """
  url: String!
}
