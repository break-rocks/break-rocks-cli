  universeHistoryPaused: Boolean!
  """
  The subtitles setting (automatic-subtitles.feature, since v78.0.0, D-214): whether the subtitles of every clip
  are shown as it plays, automatic or corrected; off by default; kept with the account, and on the device by
  the apps.
  """
  subtitles: Boolean!
  """
  The gesture tips already shown to the account (contracts/layouts.md § Gesture tips, since v78.2.0).
  """
  tips: TipSettings!
  """
  The screen mode of the universe screen and the immersive offer (contracts/layouts.md § The screen modes,
  since v80.0.0).
  """
  universeFrame: UniverseFrameSettings!
  """
  The language of the slash commands (since v81.1.0, D-224), a language code; null: the language of the app.
  The apps turn a localized name into its English name before any call; the API knows the English names only.
  """
  commandLanguage: String
  """
  The private analysis consent (since v85.0.0, D-251; ai-analysis.feature): whether the AI analysis looks at the
  private contents the caller writes; false by default, distinct from the terms of use; always false while the
  platform switch moderation.privateAnalysis of client-config is off.
  """
  privateAnalysisConsent: Boolean!
  """
  The autoplay setting (since v86.0.0, long-videos.feature): on by default; never applied for a minor nor
  from 23:00 to 06:00 local time of the device, whatever its value.
  """
  autoplay: Boolean!
}

"""
The personal settings to change (setSettings), by section: a section or a field not given stays.
"""
input SettingsInput {
  messaging: MessagingSettingsInput
  notifications: NotificationSettingsInput
  translation: TranslationSettingsInput
  recommendations: RecommendationSettingsInput
  """
  The nearby label (1 to 30 visible characters, contracts/nearby.md); clear NEARBY_LABEL goes back to the
  handle.
  """
  nearbyLabel: String
  """
  Pauses (true) or resumes (false) the universe visit history (since v83.0.0, D-247).
  """
  universeHistoryPaused: Boolean
  """
  The subtitles setting (since v78.0.0, D-214).
  """
  subtitles: Boolean
  """
  The gesture tips shown (since v78.2.0): only true is written; a tip shown stays shown.
  """
  tips: TipSettingsInput
  """
  The screen mode of the account or of one device, and the immersive offer made (since v80.0.0); the frame
  document of the custom mode (since v80.4.0).
  """
  universeFrame: UniverseFrameSettingsInput
  """
  The language of the slash commands (since v81.1.0, D-224); clear COMMAND_LANGUAGE goes back to the language
  of the app.
  """
  commandLanguage: String
  """
  Gives (true) or withdraws (false) the private analysis consent (since v85.0.0, D-251); true is refused
  PRIVATE_ANALYSIS_NOT_OFFERED while the platform switch is off; never by a delegated agent.
  """
  privateAnalysisConsent: Boolean
  clear: [SettingsPart!]
  """
  The autoplay setting (since v86.0.0).
  """
  autoplay: Boolean
}

"""
A personal setting to remove (setSettings clear): the nearby label (back to the handle), the
do-not-disturb hours, the screen mode of a device (DEVICE_FRAME_MODE, since v80.0.0: the device named by
universeFrame.device, else the calling device, the header x-device-id, as DEVICE_DISPLAY_MODE of
PersonalThemePart; that device goes back to the screen mode of the account), the frame document (FRAME, since
v80.5.0: the account, and every device whose screen mode is CUSTOM, go back to STANDARD, chosen staying true).
"""
enum SettingsPart {
  NEARBY_LABEL
  DO_NOT_DISTURB
  DEVICE_FRAME_MODE
  FRAME
  COMMAND_LANGUAGE
}

"""
The gesture tips already shown to the account (contracts/layouts.md § Gesture tips; home-modes.feature,
universe-layouts.feature, swipe-to-the-author.feature; since v78.2.0): each false by default, set to true by the
app once its tip is shown, whether or not it is closed, so that another device of the account does not show it
again. Kept with the account, and on the device by the apps.
"""
type TipSettings {
  """
  Whether the gesture tip of the home was shown (the standard key tips.homeGestures).
  """
  homeGestures: Boolean!
  """
  Whether the gesture tip of the universe was shown (the standard key tips.universeGestures).
  """
  universeGestures: Boolean!
  """
  Whether the gesture tip of the clips and posts was shown (the standard key tips.authorSwipe).
  """
  authorSwipe: Boolean!
}

"""
The gesture tips shown, to record (setSettings, since v78.2.0); a field not given stays. The only change is from
false to true: true marks the tip shown; false changes nothing (a tip shown is never shown again).
"""
input TipSettingsInput {
  homeGestures: Boolean
  universeGestures: Boolean
  authorSwipe: Boolean
}

"""
The reader's settings of translation, kept with the account: the languages it added to the language
of the app (any ISO 639-1 code), the automatic translation (off by default), and whether the social
platform may translate its private messages when the device cannot (null: never asked).
"""
type TranslationSettings {
  """
  Whether the texts in other languages are translated automatically.
  """
  auto: Boolean!
  """
  The languages of the caller (ISO 639-1), 20 at most.
  """
  languages: [String!]!
  """
  Whether the reader agreed that the platform translates its direct and group messages when the device cannot
  (asked once): null while not asked, true, false (contracts/translation.md).
  """
  privateByPlatform: Boolean
}

"""
The translation settings to change; a field not given stays (TRANSLATION_LANGUAGES_INVALID: more than 20
languages, or a code that is not ISO 639-1).
"""
input TranslationSettingsInput {
  languages: [String!]
  auto: Boolean
  privateByPlatform: Boolean
}

"""
The screen mode of the universe screen (universe-frame-modes.feature, contracts/layouts.md § The screen modes;
since v80.0.0): "frameMode" the one of the account (STANDARD while never chosen), "deviceFrameMode" the one
of the calling device (the header x-device-id; null: the screen mode of the account), "deviceFrameModes"
all; "chosen" whether the account ever made an explicit choice of a screen mode, STANDARD included, for the
account or for one device; "immersiveOffered" whether the immersive offer was
made to the account, set to true by the app once it is shown, so that another device does not make it again;
"oneHandLeft" (since v80.2.0) the option "left hand" of ONE_HAND, the same on all the devices of the account;
"frame" (since v80.4.0) the frame document of CUSTOM, the same on all the devices of the account.
"""
type UniverseFrameSettings {
  """
  The screen mode of the account.
  """
  frameMode: FrameMode!
  """
  The screen mode of the calling device; null: the screen mode of the account.
  """
  deviceFrameMode: FrameMode
  """
  The screen mode of each device that has one.
  """
  deviceFrameModes: [DeviceFrameMode!]!
  """
  Whether the account ever chose a screen mode, STANDARD included, for the account or for one device (the
  immersive offer is made only while it is false).
  """
  chosen: Boolean!
  """
  Whether the immersive offer was made to the account.
  """
  immersiveOffered: Boolean!
  """
  The option "left hand" of the one-hand mode: its rows mirrored (since v80.2.0); false by default.
  """
  oneHandLeft: Boolean!
  """
  The frame document of the custom mode, format break-rocks-frame/1 (contracts/frame.schema.json; since
  v80.4.0); null while the account never saved one.
  """
  frame: AWSJSON @deprecated(reason: "The custom mode is withdrawn since v96.0.0 (D-289).")
  """
  The setting "Pages bar" of Me › Display, "universe.pagesBar" (since v96.0.0, D-289, bottom-bar-option.feature):
  the pages bar drawn on a phone in the standard, immersive and reading modes; true by default; the same on all
  the devices of the account.
  """
  pagesBar: Boolean!
  """
  What a double tap on the page of the universe in the pages bar does (since v88.1.0, the setting
  "universe.homeDoubleTap", bottom-bar-option.feature): TOP_OF_POSTS by default; the same on all the devices
  of the account.
  """
  homeDoubleTap: HomeDoubleTap!
}

"""
What a double tap on the page of the universe in the pages bar does (since v88.1.0): TOP_OF_POSTS, back to the
top of the focus posts, both bars back (the default); KEEP_POSITION, both bars back, the feed where it was. An
app that does not know a value reads TOP_OF_POSTS.
"""
enum HomeDoubleTap {
  KEEP_POSITION
  TOP_OF_POSTS
}

"""
The screen mode to change (setSettings, since v80.0.0); a field not given stays. frameMode sets the frame
mode of the account; deviceFrameMode sets the one of a device; device names that device for deviceFrameMode
and for clear DEVICE_FRAME_MODE (its identifier; absent, the header x-device-id); frameMode or
deviceFrameMode, whatever their value, marks the account as having chosen (chosen true). A choice in the
identity bar menu or the immersive offer accepted sends frameMode with clear DEVICE_FRAME_MODE.
immersiveOffered: only true is written (an offer made stays made). oneHandLeft (since v80.2.0) sets the option
"left hand" of the one-hand mode for the account; it does not mark the account as having chosen. frame (since
v80.4.0) saves the frame document of the account, checked (FRAME_FORMAT_INVALID, FRAME_TOO_LARGE,
FRAME_POSTS_REQUIRED, FRAME_LIVE_LINE_FOLDED, FRAME_RAILS_INVALID, FRAME_BUTTONS_INVALID); it does not mark the
account as having chosen; frame given as null (since v80.5.0) removes the frame document, as clear FRAME. The
checks come in this order: the size, the schema, the rules outside it (contracts/layouts.md § The custom mode).
CUSTOM in frameMode or deviceFrameMode while the account has no frame document and none is given:
FRAME_DOCUMENT_MISSING. Since v96.0.0 (D-289) the apps send neither frame nor CUSTOM (the custom mode is
withdrawn); the backend keeps accepting them until the minimum version of the apps no longer sends them.
"""
input UniverseFrameSettingsInput {
  frameMode: FrameMode
  device: String
  deviceFrameMode: FrameMode
  immersiveOffered: Boolean
  oneHandLeft: Boolean
  frame: AWSJSON
  """
  Since v88.1.0: the setting "universe.homeDoubleTap"; it does not mark the account as having chosen.
  """
  homeDoubleTap: HomeDoubleTap
  """
  Since v96.0.0 (D-289): the setting "universe.pagesBar"; it does not mark the account as having chosen.
  """
  pagesBar: Boolean
}
