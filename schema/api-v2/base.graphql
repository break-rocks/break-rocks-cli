  MAP_SHARE_RATE_LIMITED, NOT_CONNECTED (a viewer), NOT_A_RESIDENT (a universe).
  """
  startMapPresence(audience: MapPresenceAudienceInput!, duration: MapPresenceDuration!, point: PointInput!, requestId: ID!): MyMapPresence

