  """
  The suggestion matched a former handle, still set aside for its holder (7 days); null otherwise.
  """
  formerHandle: String
  """
  The kind of the suggestion.
  """
  kind: SuggestionKind!
}

"""
What a suggestion is: an account (by its handle, or a former handle still set aside for its holder), a
universe, a tag or a universe discussion (tag and universeDiscussion since v81.1.0, D-223). The values stay
in lowercase, as stored.
"""
