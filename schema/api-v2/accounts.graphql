with agentId and kind (setAgentMandate). The device shows what it names before its means of access.
"""
input TrustedDeviceChallengeInput {
  purpose: TrustedDeviceChallengePurpose!
  deviceId: ID
  agentId: ID
  kind: AgentMandateKind
}

"""
Since D-474: the purposes of a challenge of a trusted device.
"""
enum TrustedDeviceChallengePurpose {
  APPROVE_DEVICE
  GIVE_MANDATE
  REGISTER
}

