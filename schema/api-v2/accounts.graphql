  """
  The identifier of the trusted device.
  """
  id: ID!
  """
  The kind of device.
  """
  kind: TrustedDeviceKind!
  """
  When it last confirmed an act or gave an agent mandate; null never.
  """
  lastUsedAt: AWSDateTime
  """
  The name the human gave it, 1 to 64 visible characters.
  """
  name: String!
  """
  When it was registered.
  """
  registeredAt: AWSDateTime!
  """
  ACTIVE, or PENDING until activeAt (it confirms nothing, gives no agent mandate, approves no device).
  """
  status: TrustedDeviceStatus!
}

"""
Since D-474: a challenge a trusted device signs, valid 2 minutes, used once, bound to its purpose and to what it names.
"""
type TrustedDeviceChallenge {
  """
  The delegated agent it names (GIVE_MANDATE); null otherwise.
  """
