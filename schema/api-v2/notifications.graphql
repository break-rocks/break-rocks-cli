"""
A sanction received (SANCTION_POST_REMOVAL, SANCTION_POSTING_BAN): its id (mySanctions, where
it is appealed), the articles of the charter it cites (none for an automatic posting ban
without one), a posting ban's days and end, when its appeal closes.
A platform measure received (PLATFORM_MEASURE, since v49.8.0): what was done ("action":
UNIVERSE_TERRITORY_REMOVAL, the removal of the universe territory of "universe", named in
"subject"), the article of the platform rules applied, the statement of reasons, and whether it
was decided automatically (false: a human decided it).
"""
type NotificationMeasure {
  """
  The measure taken.
  """
  action: String!
  """
  The article of the platform rules cited; null when none.
  """
  article: Int @deprecated(reason: "Use ruleNumber (since v103.0.0, D-327): the number of a platform rule is a label such as 6.2; 0 when it is not an integer.")
  """
  Since v103.0.0 (D-327): the number of the platform rule applied, a label such as "6.2"; null when none.
  """
  ruleNumber: String
  """
  Since v103.0.0 (D-327): the title of the platform rule applied, in the language of the reader; null when none.
  """
  ruleTitle: String
  """
  Whether the measure was taken by automated means.
  """
  automated: Boolean!
  """
  The statement of reasons.
  """
  statement: String!
  """
  Since v84.4.0: the measure in myPlatformMeasures, where its whole statement of reasons is read; null for a
  measure on a universe territory.
  """
  measureId: ID
  """
  Since v84.4.0: CONTENT_REMOVAL, POSTING_BAN, SUSPENSION, BAN or AGENT_SUSPENSION; null for a measure on a
  universe territory.
  """
  kind: PlatformMeasureKind
  """
  Since v84.4.0: when it ends; null for a removal and a ban.
  """
  endsAt: AWSDateTime
  """
  Since v84.4.0: when a platform appeal can be filed until; null when none can.
  """
  appealableUntil: AWSDateTime
  """
  Since v84.4.0: the counted platform measures of the account within 90 days, this one included; null when it
  does not count.
  """
  countedWithin90Days: Int
  """
  Since v85.0.0 (D-250): the outcome of the platform appeal (PLATFORM_APPEAL_DECIDED); null otherwise.
  """
  appealOutcome: PlatformAppealOutcome
  """
  Since v85.0.0 (D-250): the reasons of the decision of the platform appeal (PLATFORM_APPEAL_DECIDED); null
  otherwise.
  """
  appealReasons: String
  """
  Since v99.1.0 (M-12): when the platform appeal was filed (PLATFORM_APPEAL_OVERDUE); null otherwise.
  """
  appealedAt: AWSDateTime
  """
  Since v99.1.0 (M-12): when the platform appeal became overdue, 14 days after it was filed
  (PLATFORM_APPEAL_OVERDUE); null otherwise.
  """
  overdueSince: AWSDateTime
}

"""
The decision of the platform team on a report of the reader (REPORT_DECIDED, since v99.1.0, M-09,
contracts/reports.md § The decision told to the reporter): never the measure taken against the author. Since v101.12.0
(D-296): only the decisions of the platform team; a decision of the moderators of a universe sends no notification.
"""
type NotificationReport {
  """
  The report, as myReports gives it.
  """
  reportId: ID!
  """
  CONTENT_REMOVED or NO_ACTION.
  """
  status: ReportStatus!
  """
  The article of the platform rules applied; null without one.
  """
  article: Int @deprecated(reason: "Use ruleNumber (since v103.0.0, D-327): the number of a platform rule is a label such as 6.2; 0 when it is not an integer.")
  """
  Since v103.0.0 (D-327): the number of the platform rule applied, a label such as "6.2"; null without one.
  """
  ruleNumber: String
  """
  Since v103.0.0 (D-327): the title of the platform rule applied, in the language of the reader; null without one.
  """
  ruleTitle: String
  """
  The reason written by the member of the platform team for NO_ACTION; null otherwise.
  """
  reason: String
  """
  Whether the decision was taken by automated means.
  """
  automatedDecision: Boolean!
  """
  Since D-463 (8): with a decision NO_ACTION, until when the reporter may file a reporter's platform appeal; null
  otherwise.
  """
  appealableUntil: AWSDateTime
  """
  Since D-463 (8): the outcome of the reporter's platform appeal (REPORT_DECIDED sent again at its decision); null
  otherwise.
  """
  appealOutcome: ReporterAppealOutcome
  """
  Since D-463 (8): the reasons of the decision of the reporter's platform appeal; null otherwise.
  """
  appealReasons: String
  """
  Since D-463 (8): REPORTER_APPEAL_OVERDUE, when the reporter's platform appeal was filed; null otherwise.
  """
  appealedAt: AWSDateTime
  """
  Since D-463 (8): REPORTER_APPEAL_OVERDUE, when the reporter's platform appeal became overdue, 14 days after it was
  filed; null otherwise.
  """
  overdueSince: AWSDateTime
}

"""
A message meet-up where a notification tells it: its time, place and title; a change or a cancellation told as a
message.
"""
type NotificationMeetUp {
  """
  The time of the message meet-up.
  """
  at: AWSDateTime!
  """
  Whether it is cancelled.
  """
  cancelled: Boolean!
  """
  Whether the message meet-up was changed.
  """
  changed: Boolean!
  """
  The place of the message meet-up.
  """
  place: Place!
  """
  Its title; null when none.
  """
  title: String
}

"""
The newest first; "unread": the notifications of the account not read.
"""
type NotificationPage {
  """
  The notification items of this page.
  """
  items: [Notification!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
  """
  The unread messages or items.
  """
  unread: Int!
}

"""
The sanction a notification tells about.
"""
type NotificationSanction {
  """
