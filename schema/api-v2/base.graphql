"""
What can be written. Every root field is a line of the operation table of the backend, counted by the usage
step. Every mutation takes requestId: ID!, the idempotency key of the request: a UUIDv7 made by the app
(REQUEST_ID_INVALID when it is not a UUID, before any function runs), but the four ephemeral signals
typing, sendLivePositions, recordClipPlays and watch, which take none (README.md § Idempotency). A creation
played again with the same requestId answers what it created the first time and creates nothing more; a
toggle or a setting writes the state wanted, so playing it again gives the same state.
"""
type Mutation {
  """
  Cancels a bulk erasure within its 24 hours. Errors: BULK_ERASURE_NOT_CANCELLABLE, DATA_REQUEST_NOT_FOUND.
  """
  cancelBulkErasure(dataRequestId: ID!, requestId: ID!): DataRequest

  """
  Changes the handle of the caller, at most once every 24 hours (HANDLE_CHANGED_RECENTLY); the former handle
  is set aside for its holder 7 days. The handle codes. Returns the account.
  """
  changeHandle(handle: String!, requestId: ID!): Account

  """
  Changes the password (the current one checked by Cognito, its rules applied): every session of
  the account ends ("session.ended", PASSWORD_CHANGED, with "exceptSession" the origin_jti of the
  caller's token): the calling app signs in again with the new password, the others sign out.
  Errors: PASSWORD_WRONG, PASSWORD_INVALID, TOO_MANY_ATTEMPTS.
  """
  changePassword(currentPassword: String!, newPassword: String!, requestId: ID!): Boolean

  """
  The secret of the link of the deletion confirmation ("token" of /me/account/delete), by the
  account signed in: deleted at once and for good, every session ends ("session.ended",
  ACCOUNT_DELETED). Errors: DELETION_CONFIRMATION_EXPIRED (after 24 hours), DELETION_CONFIRMATION_INVALID.
  """
  confirmAccountDeletion(token: String!, requestId: ID!): AccountDeletion

  """
  The code received at the new address: it becomes the account's email address. Errors:
  EMAIL_CHANGE_CODE_INVALID, EMAIL_CHANGE_CODE_EXPIRED, TOO_MANY_ATTEMPTS (5 wrong codes: ask
  again), EMAIL_UNAVAILABLE (another account took it meanwhile).
  """
  confirmEmailChange(code: String!, requestId: ID!): Boolean

  """
  Connects with the account of the NFC token read from its phone (contracts/invitations.md). Returns the state
  of the connection.
  """
  confirmNfcConnection(token: String!, requestId: ID!): NfcConnection

  """
  A command-line sign-in code for the command-line client of the same computer (a human signed
  in: Cognito token): one-time, 5 minutes, bound to the account, its cell and "challenge" (the S256
  of the verifier the command-line client keeps: 43 characters base64url); "label" (at most 64
  visible characters, longer cut) names the device. The command-line client exchanges it through
  the CUSTOM_AUTH flow of the user pool client: InitiateAuth (USERNAME) then RespondToAuthChallenge
  (CUSTOM_CHALLENGE, ANSWER "<code>.<verifier>"); 3 wrong answers invalidate the code; the session
  is an ordinary one (signOutEverywhere closes it). Errors: CLI_CHALLENGE_INVALID,
  TOO_MANY_REQUESTS (10 codes in any hour).
  """
  createCliSignInCode(challenge: String!, label: String, requestId: ID!): CliSignInCode

  """
  An agent operator creates a delegated agent with a name and its restrictions, within its allowance
  (DELEGATED_AGENT_ALLOWANCE_REACHED, DELEGATED_AGENT_CREATIONS_REACHED). Returns its credentials: the private
  key is shown once.
  """
  createDelegatedAgent(interactions: [DelegatedAgentInteraction!], name: String!, universes: [String!], requestId: ID!): DelegatedAgentCredentials

  """
  An agent operator deletes one of its delegated agents (agentId). Returns it as it was.
  """
  deleteDelegatedAgent(agentId: ID!, requestId: ID!): DelegatedAgent

  """
  HELP_GETTING_STARTED_OPENED (the article "getting-started" opened) completes DISCOVER_THE_PLATFORM;
  ADDRESS_VISITED changes nothing since v41.0.0.
  """
  recordOnboardingActivity(address: String, kind: OnboardingActivity!, requestId: ID!): Onboarding

  """
  An agent operator replaces the credentials of one of its delegated agents (agentId): the former key stops
  working. Returns the new credentials: the private key is shown once.
  """
  regenerateDelegatedAgentCredentials(agentId: ID!, requestId: ID!): DelegatedAgentCredentials

  """
  Replaces the personal invitation link of the caller: the former link no longer works. Returns the new link.
  """
  renewPersonalInvitationLink(requestId: ID!): PersonalInvitationLink

  """
  A human asks for the deletion, naming its handle (any case, with or without "@") and, for each
  private universe it owns, the member it appoints as next owner (none: that universe is deleted
  like a private universe deleted by its owner); a deletion confirmation goes to its email
  address, in "locale" (the app's language) when given. Errors: HANDLE_NOT_YOURS,
  NEW_OWNER_MUST_BE_MEMBER, ONLY_OWNER_TRANSFERS, PRIVATE_UNIVERSE_NOT_FOUND, TRANSFER_TO_SELF,
  PRIVATE_UNIVERSES_OWNED_LIMIT, SUCCESSORS_INVALID. An agent operator deletes its account on the agents host.
  """
  requestAccountDeletion(handle: String!, locale: String, successors: [AccountDeletionSuccessorInput!], requestId: ID!): AccountDeletionRequest

  """
  A signed form to upload the avatar of the caller: a JPEG, PNG or WebP image (AVATAR_TYPE_NOT_SUPPORTED);
  then updateProfile with its id as avatar.
  """
  requestAvatarUpload(contentType: String!, requestId: ID!): MediaUpload

  """
  Asks for the bulk erasure of a scope: hidden at once, cancellable 24 hours, then erased for good.
  Errors: RECENT_SIGN_IN_REQUIRED, BULK_ERASURE_IN_PROGRESS (one of the same scope still cancellable).
  """
  requestBulkErasure(scope: BulkErasureScope!, requestId: ID!): DataRequest

  """
  Asks for a data copy, prepared apart; "locale" (BCP 47) the language of its viewer and of its
  email. Errors: RECENT_SIGN_IN_REQUIRED, DATA_COPY_IN_PROGRESS, DATA_COPY_TOO_SOON (errorInfo.availableAt).
  """
  requestDataCopy(locale: String, requestId: ID!): DataRequest

  """
  A new email address: a 6-digit code goes to it (valid 24 hours); the current address stays the
  one that signs in until the code is confirmed. The same answer when another account uses the
  address (its holder is warned by email). Errors: EMAIL_INVALID.
  Since specs v67.0.0 (D-177 (1)): "challenge", the S256 challenge of the verifier the device keeps:
  the email carries the email code link (/auth/change-email#…), and the code is answered
  "<code>.<verifier>" by the session that asked.
  """
  requestEmailChange(challenge: String, email: String!, locale: String, requestId: ID!): Boolean

  """
  A rectification request to the platform team, answered within 1 month. Errors: RECTIFICATION_TEXT_EMPTY,
  RECTIFICATION_TEXT_TOO_LONG.
  """
  requestRectification(input: RectificationInput!, requestId: ID!): DataRequest

  """
  Every session of the caller ends (a human only: Cognito token; delegated agents' sessions
  are not concerned): signed out everywhere, its refresh tokens revoked, and every app of the
  account told by the real-time updates ("session.ended") to close and sign out.
  """
  signOutEverywhere(requestId: ID!): Boolean

  """
  The caller skips the onboarding. Returns the onboarding.
  """
  skipOnboarding(requestId: ID!): Onboarding

  """
  The caller starts the onboarding. Returns the onboarding.
  """
  startOnboarding(requestId: ID!): Onboarding

  """
  Changes the profile of the caller (input), checked against the values the app started from (expected:
  CHANGED_MEANWHILE for a field changed meanwhile, the others change). The profile codes. Returns the account.
  """
  updateProfile(expected: ProfileExpectedInput, input: ProfileUpdateInput!, requestId: ID!): Account

  """
  Follows an address (following true: an account everywhere "@bob", an account in a universe "@bob%paris",
  a universe) or stops (false) (C-2). FOLLOW_SELF, FOLLOW_TAG, FOLLOW_UNIVERSE_ALONE, FOLLOW_NOT_ALLOWED,
  ADDRESS_TWO_UNIVERSES, UNBLOCK_FIRST, INTERACTION_BLOCKED, PRIVATE_UNIVERSE_MEMBERS_ONLY, the universe
  name codes. Returns the follow; null once stopped.
  """
  setFollow(address: String!, following: Boolean!, requestId: ID!): Follow

  """
  Blocks an account (blocked true) or unblocks it (C-2). BLOCK_SELF, ACCOUNT_NOT_FOUND. Returns where the
  caller stands with it.
  """
  setBlock(accountId: ID!, blocked: Boolean!, requestId: ID!): ConnectionState

  """
  Mutes an account (muted true) or unmutes it (C-2): its posts, reposts and replies hidden from the caller
  only. MUTE_SELF, ACCOUNT_NOT_FOUND. Returns where the caller stands with it.
  """
  setMute(accountId: ID!, muted: Boolean!, requestId: ID!): ConnectionState

  """
  Adds an account to the exceptions of who can invite the caller (excepted true; invitePolicy "except",
  1,000 at most) or removes it (C-2). Returns the account.
  """
  setInviteException(accountId: ID!, excepted: Boolean!, requestId: ID!): AccountRef

  """
  Changes a delegated agent of the caller (C-7): its name (the delegated agent name codes), suspended or
  reactivated, its restrictions (DELEGATED_AGENT_UNIVERSES_TOO_MANY). DELEGATED_AGENT_NOT_FOUND,
  DELEGATED_AGENT_DEACTIVATED, DELEGATED_AGENT_CANNOT_MANAGE_AGENTS. Returns the delegated agent.
  """
  changeDelegatedAgent(agentId: ID!, input: DelegatedAgentChangeInput!, requestId: ID!): DelegatedAgent

  """
  A token to connect by NFC (P-2, G-13: was nfcConnectionToken), valid until expiresAt
  (contracts/invitations.md).
  """
  createNfcToken(requestId: ID!): ConnectionToken

  """
  The moderation of a universe answers a request to repost a post of a private universe into it
  (repostRequestId): accept true reposts it. Returns the request.
  """
  answerRepostRequest(accept: Boolean!, repostRequestId: ID!, universe: String!, requestId: ID!): RepostRequest

  """
  A moderator approves the post of a restricted author waiting for approval: it is published. Returns the
  post.
  """
  approvePost(postId: ID!, requestId: ID!): Post

  """
  The author changes the text of its post, as the edit window and its versions allow (versions keeps the
  former texts). images (since v78.0.0, D-214, automatic-alternative-text.feature): the alternative texts of
  its images to change (id: Image.id; alt: its new text, none to erase it), the others unchanged; within the
  same edit window, the post then shown as changed, versions keeping the former alternative texts
  (PostVersion.images); IMAGE_NOT_FOUND (not an image of the post), IMAGE_ALT_TOO_LONG. sources (since v81.8.0,
  D-230): its post sources, the whole list wanted ([] removes them; null keeps them), within the same edit
  window, the former ones kept with its versions (PostVersion.sources); not for a repost. Returns the post.
  """
  changePost(images: [ImageAttachmentInput!], postId: ID!, sources: [PostSourceInput!], text: String!, requestId: ID!): Post

  """
  Posts a text, images (at most 4) or a clip (never both: POST_IMAGES_AND_CLIP), or both a text and media, in
  a universe (universe: a posting address; none: the personal space). clip: a video uploaded with
  requestMediaUpload (VIDEO); longVideo (since v86.0.0): a horizontal video of more than 3 minutes and
  at most 4 hours uploaded with requestMediaUpload (LONG_VIDEO), never with a clip or images (POST_IMAGES_AND_CLIP;
  VIDEO_NOT_HORIZONTAL, LONG_VIDEO_TOO_LONG, VIDEO_QUOTA_EXCEEDED); an address with ">" (since v93.0.0; "!" before): PLAYLIST_ADDRESS_MISUSED; images: uploaded with requestMediaUpload (IMAGE); link: the link whose preview
  the author accepted; replyPolicy: who can reply; announcement: an announcement of the leadership; sources
  (since v81.8.0, D-230): its post sources (PostSourceInput), at most 10, outside the 1,000 visible
  characters. requestId is the idempotency key, and the post is "<cell>-<requestId>" (Post.id). The posting
  codes (contracts/errors.md); a delegated agent in a universe that forbids agents for posts:
  UNIVERSE_AGENTS_FORBIDDEN (since v81.8.0, D-232). document (since v87.6.0, D-269): its post document
  (PostDocumentInput), beside the text and the images, never with a clip or a long video (POST_DOCUMENT_WITH_VIDEO);
  DOCUMENT_RIGHTS_REQUIRED, DOCUMENT_MALICIOUS (the malware scan already found the file malicious); a post with a
  document shows no link preview (link ignored). The post is posted at once; its document is shown to the other
  readers once its malware scan and its media review are done (REFUSED: never shown, the author notified,
  DOCUMENT_REFUSED). Its bytes count in the consumption of the account of its author. Returns the post.
  """
  createPost(announcement: Boolean, clip: ID, document: PostDocumentInput, images: [ImageAttachmentInput!], link: String, longVideo: ID, place: PostPlaceInput, replyPolicy: ReplyPolicy, sources: [PostSourceInput!], text: String!, universe: String, requestId: ID!): Post

  """
