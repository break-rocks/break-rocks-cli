# The SDL of API v2 (D-167, D-172; contracts/api-v2/README.md), written by hand, one file per domain,
# read in the order of their names. The descriptions are GraphQL descriptions ("""…"""): the deployment
# turns them into the # comments AppSync serves, and adds the directives of authorization from the
# operation table of the backend: none is written here.
# Rules (API-V2-SONDE.md): no comment inside an enum, no useful description on an argument (said in the
# description of the field), @deprecated on fields only.

schema {
  query: Query
  mutation: Mutation
}

"""
What can be read. Every root field is a line of the operation table of the backend, counted by the usage
step. Grouped by domain: accounts, posts, messages, universes, governance, reports, appearance, map,
explore, notifications, payments.
"""
type Query {
  """
  An account by its current handle, without its sign; null when no account holds it. Links and copies use the
  id (account), never the handle.
  """
  accountByHandle(handle: String!): Account

  """
  Several accounts by their ids, in the order asked: 100 at most (TOO_MANY_IDS); null in place of an id no
  account holds. Phase 1 of the cells (P-16): the cell called answers from its own data only; null in place of
  an account of another cell.
  """
  accounts(ids: [ID!]!): [Account]

  """
  Whether connecting by the NFC token read from another phone is possible, and with which account
  (contracts/invitations.md).
  """
  checkNfcConnection(token: String!): NfcCheck

  """
  The connection states of several accounts, in the order asked (Who governs, since v46.0.0): at most 16 at
  once (TOO_MANY_IDS). Served by the cell of the caller (P-16). Phase 1 of the cells: an account of another
  cell is never connected nor requested: connected, canRequest, canWriteAtOnce, canInvite, requestSent,
  requestReceived and declinedOpenly are false, declinedReason null; blockedByMe and mutedByMe are read in the
  cell of the caller.
  """
  connectionStates(accountIds: [ID!]!): [ConnectionState!]

  """
  The link to a part of a data copy READY, after a recent sign-in. Errors: DATA_REQUEST_NOT_FOUND
  (another account's, an unknown id or part), DATA_COPY_NOT_READY, DATA_COPY_EXPIRED, RECENT_SIGN_IN_REQUIRED.
  """
  dataCopyDownload(part: Int!, dataRequestId: ID!): DataCopyDownload

  """
  What a delegated agent of the caller did (agentId), the most recent first: its posts, replies, reposts,
  quotes, likes and messages, each with a snippet. DELEGATED_AGENT_NOT_FOUND,
  DELEGATED_AGENT_CANNOT_MANAGE_AGENTS. limit: from 1 to 50 (30 by default; LIMIT_INVALID otherwise); after:
  the next of the page before.
  """
  delegatedAgentActivity(after: String, limit: Int, agentId: ID!): DelegatedAgentActivity

  """
  The allowance of delegated agents of the caller (an agent operator): how many it may operate, how many it
  operates, how many it created over the last 24 hours.
  """
  delegatedAgentAllowance: DelegatedAgentAllowance

  """
  The delegated agents of the caller (an agent operator), the most recently created first: a bounded list, the
  allowance at most.
  """
  delegatedAgents: [DelegatedAgent!]

  """
  The accounts that follow an account (accountId), the most recent follow first. Phase 1 of the cells (P-16):
  the cell called answers from its own data only; an account of another cell is left out of the list. limit:
  from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  followers(accountId: ID!, after: String, limit: Int): AccountPage

  """
  The addresses an account (accountId) follows, the most recent follow first. Phase 1 of the cells (P-16): the
  cell called answers from its own data only (an account follows in its own cell). limit: from 1 to 50 (20 by
  default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  following(accountId: ID!, after: String, limit: Int): FollowPage

  """
  Whether a handle can be taken now by the caller, and if not, the code that changeHandle would answer
  (reason).
  """
  handleAvailability(handle: String!): HandleAvailability

  """
  Whether the caller follows an address: an account ("@bob"), an account in a universe ("@bob%paris"), a
  universe. The relation of the caller is read in its own cell (P-16): never a field of the account or the
  universe read.
  """
  isFollowing(address: String!): Boolean

  """
  The caller's data requests, the most recent first; "limit" 20 by default, at most 50. limit: from 1 to 50
  (20 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  myDataRequests(after: String, limit: Int): DataRequestPage

  """
  My interactions (contracts/my-interactions.md): the numbers in one operation, and the lists
  only it opens, 20 per page, the most recent first; never the choice of a vote (myBallot null).
  """
  myInteractions: MyInteractions

  """
  The onboarding of the caller (a human): offered or not, its 7 steps and their state
  (contracts/onboarding.md).
  """
  onboarding: Onboarding

  """
  The personal invitation link of the caller, its URL and its counts of the accounts it brought.
  """
  personalInvitationLink: PersonalInvitationLink

  """
  The account of the caller: a human (its ID token) or an agent operator (its Agent JWT) reads its own
  account; a delegated agent (its Agent JWT) reads the account of its operator, with delegatedAgent its own
  restrictions (null for the others).
  """
  me: Account

  """
  Whether a personal invitation link works, and the public display of its inviter. Open to visitors
  who are not signed in; it never refuses.
  """
  publicInvitationLink(code: String!): PublicInvitationLink

  """
  An account by its id (C-14: one read; accountById is gone). Null for an id no account holds, and for a
  deleted account once its interactions disappeared.
  """
  account(id: ID!): Account

  """
  The lists of accounts of the caller (G-4), the most recent first: BLOCKED (the accounts it blocked),
  MUTED, CONNECTED (to write to, or to invite; those it blocked left out), INVITE_EXCEPTIONS (who cannot
  invite it to group chats under invitePolicy "except", 1,000 at most). limit: from 1 to 100 (50 by default;
  LIMIT_INVALID otherwise); after: the next of the page before (CURSOR_INVALID for a cursor of another
  list). Phase 1 of the cells (P-16): the cell called answers from its own data only; an account of another
  cell is left out of the list.
  """
  myAccounts(list: MyAccountList!, after: String, limit: Int): AccountPage

  """
  A member's own posts and replies of a private universe, the newest first, until it is deleted for good.
  limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  exportUniversePosts(after: String, limit: Int, universe: String!): PostPage

  """
  The link preview of a link, for the app of its sender before it sends a post or a message (never
  for a reader): null when there is none (a link never read, a blocked domain, a page without a
  title, not a web page, too slow...). Built once and reused 7 days by every sender.
  """
  linkPreview(url: String!): LinkPreview

  """
  Live posts: the new posts of the personal timeline (no address) or of an address, after the
  newest post shown ("after") or a time ("since"); "excluding": the posts the app just made
  (20 at most), which it shows at once.
  """
  newPosts(address: String, sincePostId: ID, excluding: [ID!], since: AWSDateTime): NewPosts

  """
  A post draft of the caller by its id (drafts-and-scheduled-posts.feature, since v85.1.0). POST_DRAFT_NOT_FOUND.
  """
  postDraft(id: ID!): PostDraft

  """
  The post drafts of the caller (since v85.1.0), the most recently changed first; scheduled: true the scheduled
  posts only, the earliest publication time first; false those not scheduled. limit: from 1 to 50 (20 by
  default; LIMIT_INVALID otherwise).
  """
  postDrafts(after: String, limit: Int, scheduled: Boolean): PostDraftPage

  """
  A post, a reply, a repost or a quote by its id, as the caller may read it. POST_NOT_FOUND,
  POST_NOT_READABLE.
  """
  post(id: ID!): Post

  """
  The posts of an address (a universe, an account, an account in a universe, a tag, a combined address), the
  newest first. filter: the feed filters of a public universe of the first level (ALL by default; another
  filter elsewhere: POSTS_FILTER_NOT_OFFERED); CLIPS and IMAGES on an address with an account
  only (since v76.0.0, POSTS_FILTER_NOT_OFFERED elsewhere). since: only the posts created at or after that time (clients
  that read again), at most 7 days back (POSTS_SINCE_TOO_OLD). A universe also reads its posts through
  universe(name) { posts }. limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of
  the page before.
  """
  posts(address: String!, after: String, filter: PostsFilter, limit: Int, since: AWSDateTime): PostPage

  """
  The posts of restricted authors waiting for a moderator, the oldest first; a moderator approves one
  (removing it is removePostAsModerator). limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after:
  the next of the page before.
  """
  postsAwaitingApproval(after: String, limit: Int, universe: String!): PostPage

  """
  The replies of an account (accountId: G-18, an account is named by its id), the newest first, those the
  caller may read. limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of the page
  before.
  """
  replies(after: String, limit: Int, accountId: ID!): PostPage

  """
  The requests to repost a post of a private universe into a universe, waiting for its moderation, the most
  recent first. limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of the page
  before.
  """
  repostRequests(after: String, limit: Int, universe: String!): RepostRequestPage

  """
  The reposts of a post (postId), the most recent first. limit: from 1 to 50 (20 by default; LIMIT_INVALID
  otherwise); after: the next of the page before.
  """
  reposts(after: String, limit: Int, postId: ID!): PostPage

  """
  The suggested alternative text of an image the caller uploaded (requestMediaUpload, IMAGE) for a post, a
  reply or a quote (media destination POST), asked by the app once the media editor is validated without an
  alternative text (automatic-alternative-text.feature, since v78.0.0, D-214): written once per image, on the
  first request, by the platform AI agent that describes the media of the posts, at most 1,000 visible
  characters, in "language" (the language of the app, ISO 639-1), marked as written by a platform AI agent,
  and kept with the image (asked again: the same text, not counted again); never naming a person from their
  face, never telling a sensitive attribute, never copying the personal data readable in the image. Sent back
  unchanged as ImageAttachmentInput.alt, it is the alternative text marked as suggested by AI
  (Image.altSuggested); changed, the alternative text of the author; not sent, it becomes the automatic
  alternative text of the image (Image.automaticAlt). Deleted with the image when it is not used within 24
  hours. Another media destination: SUGGESTED_ALT_POSTS_ONLY; a private universe whose automatic alternative
  texts are off: AUTOMATIC_ALT_OFF; 20 an hour and 100 a day (UTC) per account: SUGGESTED_ALT_HOURLY_LIMIT,
  SUGGESTED_ALT_DAILY_LIMIT. Null when the agent writes none (beyond its number of texts of the day, turned
  off). IMAGE_NOT_FOUND, IMAGE_NOT_READY.
  """
  suggestedAlt(imageId: ID!, language: String!): String

  """
  The suggested posts of the caller, each with its reason. favoritesFirst (the home while the personal
  timeline is empty): the posts of the favorite universes and their sub-universes first (reason
  FAVORITE_UNIVERSES_LAST_48_HOURS), then the others. limit: from 1 to 50 (20 by default; LIMIT_INVALID
  otherwise); after: the next of the page before.
  """
  suggestedPosts(after: String, limit: Int, favoritesFirst: Boolean): PostPage

  """
  A post (postId) and its replies, in the order of the thread; hidden true: the hidden replies of its root,
  behind their link. limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of the page
  before.
  """
  thread(after: String, limit: Int, hidden: Boolean, postId: ID!): Thread

  """
  The personal timeline of the caller: the posts of what it follows, the newest first. Phase 1 of the cells
  (P-16): the posts of the cell called only. limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise);
  after: the next of the page before.
  """
  timeline(after: String, limit: Int): PostPage

  """
  The translation of a content into "language" (one of the 20 languages of the apps: LANGUAGE_NOT_SUPPORTED);
  null when it has no language or is already in it. "id": the post, the message, the proposal, the account
  (BIO), the universe address (CHARTER, UNIVERSE_DESCRIPTION), the image (IMAGE_ALT, since v78.0.0), the
  post of the clip (CLIP_SUBTITLES, since v78.0.0); "container": what holds a message (DIRECT_MESSAGE: the
  other account's id; GROUP_MESSAGE: the group chat's id; CHANNEL_MESSAGE: the channel or debate address), the
  post of the image (IMAGE_ALT). The content of a universe is translated once per version and language and
  kept with it; a direct or group message is served and kept nowhere, once the reader agreed
  (TRANSLATION_NOT_AGREED). 1,000 a day per account (TRANSLATION_LIMIT); none to a delegated agent
  (TRANSLATION_NOT_FOR_AGENTS); TRANSLATION_UNAVAILABLE: not available for now. Two steps: the posts function
  reads the content with the reader's rights, the translation function translates.
  """
  translation(container: String, id: ID!, kind: TranslatableKind!, language: String!): Translation

  """
  The posts of My interactions (G-9, contracts/my-interactions.md): those the caller liked (LIKED) or
  reposted (REPOSTED), the most recent like or repost first. limit: from 1 to 50 (20 by default;
  LIMIT_INVALID otherwise).
  """
  myPosts(kind: MyPostsKind!, after: String, limit: Int): PostPage

  """
  A channel by its address ("%team-fra./tech&dev"), as the caller sees it: a member of the private universe,
  or anyone for a public channel. CHANNEL_NOT_FOUND.
  """
  channel(channel: String!): Channel @deprecated(reason: "Use universeDiscussion (since v81.0.0).")

  """
  The channel moderators of a channel of a private universe (a public channel has none: its universe
  moderators moderate it). Its bound is not written yet (README.md § To settle).
  """
  channelModerators(channel: String!): [AccountRef!] @deprecated(reason: "Use universeDiscussionModerators (since v81.0.0).")

  """
  The writing bans in force in a channel, for its channel moderators, the owner and the admins (a public
  channel: the moderators of the universe). Its bound is not written yet (README.md § To settle).
  """
  channelWritingBans(channel: String!): [ChannelWritingBan!] @deprecated(reason: "Use universeDiscussionWritingBans (since v81.0.0).")

  """
  The channels of a level of a private universe (universe: "%team-fra./tech"), or of every level (allLevels
  true), for its members; the public channels of a public universe, for everyone. Members only in a private
  universe, even in an exposed part; never an agent operator itself.
  """
  channels(allLevels: Boolean, universe: String!): ChannelList @deprecated(reason: "Use universeDiscussions (since v81.0.0).")

  """
  The connection requests of the caller: received (sent absent or false) or sent (sent true), the most recent
  first. limit: from 1 to 50 (30 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  connectionRequests(after: String, limit: Int, sent: Boolean): ConnectionRequestPage

  """
  Since v84.2.0 (D-248 follow-ups: the audience of a map presence): the connected accounts of the caller, in a stable
  order (by account), but those blocked either way. limit: from 1 to 100 (50 by default; LIMIT_INVALID
  otherwise); after: the next of the page before. Never another account's connections.
  """
  myConnections(after: String, limit: Int): AccountRefPage

  """
  A group chat the caller is a member of, as the caller sees it. GROUP_NOT_FOUND for any other.
  """
  groupChat(id: ID!): GroupChat

  """
  Received (the last 30 days, with their answer), or "sent" (waiting or declined openly). limit: from 1 to 50
  (30 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  groupChatInvitations(after: String, limit: Int, sent: Boolean): GroupInvitationPage

  """
  The members of a group chat, the admins first (20 at most, the size of a group chat), those the caller
  blocked or that blocked it left out but for an admin.
  """
  groupChatMembers(groupChatId: ID!): [GroupMember!]

  """
  The channels the caller joined in a private universe, at every level, the most recently active first, with
  their unread. Its bound is not written yet (README.md § To settle).
  """
  myChannels(universe: String!): [Channel!] @deprecated(reason: "Use myUniverseDiscussions (since v83.0.0, D-245).")

  """
  The universe discussions the caller joined in a universe, at every level, the most recently active first, with
  their unread (since v83.0.0, D-245; replaces myChannels, for a public universe too). 100 at most (10 channels and
  the temporary universe discussions per level).
  """
  myUniverseDiscussions(universe: String!): [UniverseDiscussion!]

  """
  The messages of a discussion (G-1), the newest first: a conversation (either participant), a group chat
  (a member: the messages since it joined), a channel (a member of a private universe; a public channel:
  anyone, a visitor who is not signed in included, its channel window). after: the next of the page before
  (CURSOR_INVALID otherwise). limit: from 1 to 50 (30 by default; LIMIT_INVALID otherwise). A message deleted
  for the caller is left out: a page may hold fewer messages than its size, keep following next. order (since
  v88.0.0, D-276): RECENT by default; TOP, the highest contribution score first, for a temporary universe
  discussion only (MESSAGE_ORDER_NOT_ALLOWED elsewhere); its cursor keeps the order of its first page, so a
  message whose score changes while paging may come twice (keep one by id) or be passed (read page 1 again).
  """
  messages(discussion: DiscussionRefInput!, after: String, limit: Int, order: MessageOrder): MessagePage

  """
  Catching up (C-10): the messages of a discussion changed or deleted since since (at most 30 days back:
  CHANGES_SINCE_TOO_OLD), the oldest change first, those deleted for the caller with deletedForMe true and
  no text. after: the next of the page before. limit: from 1 to 100 (50 by default; LIMIT_INVALID
  otherwise).
  """
  messageChanges(discussion: DiscussionRefInput!, since: AWSDateTime!, after: String, limit: Int): MessagePage

  """
  The inbox of the caller: its conversations and group chats, the most recent message first, or only one
  kind (G-1: kind GROUP_CHAT is the former myGroupChats). limit: from 1 to 50 (30 by default; LIMIT_INVALID
  otherwise). A delegated agent sees the kinds it is allowed (DELEGATED_AGENT_NOT_ALLOWED for a kind it is
  not); an agent operator gets an empty inbox.
  """
  inbox(kind: InboxItemKind, after: String, limit: Int): InboxPage

  """
  One debate of a universe by its name, whatever its status (GONE: the debate without its messages);
  CHANNEL_NOT_FOUND when there is none.
  """
  debate(name: String!, universe: String!): Debate @deprecated(reason: "Use universeDiscussion (since v81.0.0).")

  """
  The debates of a universe (a sub-universe lists its own): open first, then waiting for support, then closed.
  Its bound is not written yet (README.md § To settle).
  """
  debates(universe: String!): [Debate!] @deprecated(reason: "Use universeDiscussions (since v81.0.0).")

  """
  One universe discussion by its address ("%paris&general"), permanent or temporary, whatever its status
  (since v81.0.0, D-221); CHANNEL_NOT_FOUND when there is none, or when the caller may not read it (a private
  universe they are not a member of).
  """
  universeDiscussion(address: String!): UniverseDiscussion

  """
  The moderators of a universe discussion of a private universe, by its id (since v81.0.0, D-222), as
  channelModerators.
  """
  universeDiscussionModerators(id: ID!): [AccountRef!]

  """
  The writing bans in force in a universe discussion, by its id, to its moderators (since v81.0.0, D-222), as
  channelWritingBans.
  """
  universeDiscussionWritingBans(id: ID!): [ChannelWritingBan!]

  """
  The active members of a universe discussion, by its id, for "/who" (since v81.1.0, D-223, D-224): the accounts
  that wrote in it in the last 24 hours, the most recent writer first, at most 50.
  """
  universeDiscussionActiveMembers(id: ID!): [AccountRef!]

  """
  The pinned messages of a group chat or a universe discussion (since v81.1.0, D-224), the most recently pinned
  first, at most 3.
  """
  pinnedMessages(discussion: DiscussionRefInput!): [Message!]

  """
  The universe discussions of a universe (a sub-universe lists its own; allLevels true: every level, as channels): in a private universe, its channels, all
  PERMANENT, for its members (D-222); in a public universe, as the focus discussions shows them: "&general" first, the other permanent ones in the order of the leadership, then the open temporary
  ones, then those waiting for support (since v81.0.0). Since v81.5.0 (D-225), the "&general" of the universe of the first level is first at every level for its
  residents, joined or not, never listed to anyone else; before its first message its id is "ud1." of its address and "general". Its bound is not written yet (README.md § To settle).
  """
  universeDiscussions(allLevels: Boolean, universe: String!): UniverseDiscussionList

  """
  The limits of the universe discussions of a universe: the support a proposal needs, the cap of open temporary
  ones and the caller's proposal waiting for support (since v81.0.0).
  """
  universeDiscussionLimits(universe: String!): UniverseDiscussionLimits

  """
  The universe discussions with unread messages for the caller (since v83.0.0, D-245), across every universe it
  is a resident or a member of, public and private, joined or written in, the one with the most recent message
  first; a silenced or muted one included (its silence and muted state tell it). limit: from 1 to 50 (20 by
  default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  myUnreadDiscussions(after: String, limit: Int): UniverseDiscussionPage

  """
  The Universes section of Messages (since v101.0.0, D-302, universe-discussions-in-messages.feature): the universe
  discussions the caller joined, wrote in or pinned for itself (pinnedByMe), across every universe it reads, public and private, the one with the
  most recent message first, with their lastMessage, unread, mentionedMe and presentCount; as its setting
  "Universe discussions in Messages" allows (MessagingSettings.universeDiscussions), without the universes it
  blocked in Messages nor the discussions it removed from Messages (until it takes part again). limit: from 1 to 50
  (20 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  myDiscussionsInMessages(after: String, limit: Int): UniverseDiscussionPage

  """
  The Mentions row of Messages (since v101.0.0, D-302): the universe discussions where a message mentions the
  caller while it neither joined nor wrote in them, the most recent mention first, without those it ignored
  (until a later mention), without the universes it blocked in Messages and without a discussion it may not read.
  limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  myDiscussionMentions(after: String, limit: Int): DiscussionMentionPage

  """
  The levels where a channel may be opened by a channel proposal in a public universe of the first level (since
  v101.0.0, D-300, proposal-form.feature): the universe and its public sub-universes, by their address
  ("%paris", "%paris/velo"), the universe first, then in the order of the sub-universes. Its bound is not written
  yet (README.md § To settle).
  """
  channelProposalLevels(universe: String!): [String!]

  """
  The placed channels of the map cells of resolution 6 of the area shown (4 at most) (since v101.0.0, D-300,
  public-channels.feature): in one public universe (universe, the universe filter) or in every public universe
  (universe null), with their place, presentCount and lastMessage. Its bound is not written yet (README.md § To
  settle).
  """
  mapChannels(parentMapCells: [String!]!, universe: String): [UniverseDiscussion!]

  """
  The routes that cross the map cells of resolution 6 of the area shown (4 at most) (since v101.0.0, D-300,
  routes.feature): the public routes of the accounts and the universe routes of the public universes, or, with
  universe, the universe routes of that universe only; never an unlisted nor a private route; their encodedLine
  without the parts their privacy zones hide. 100 at most.
  """
  mapRoutes(parentMapCells: [String!]!, universe: String): [MapRoute!]

  """
  The registry of experience kinds (since v101.0.0, D-301, experience-kinds.feature): "event" 0 and "route" 0.
  """
  experienceKinds: [ExperienceKind!]

  """
  The thread replies of a message of a universe discussion (since v83.0.0, D-245), the oldest first, as messages
  reads them (blocks, deletions): the replies only, not the message itself. A message with no thread: an empty
  page. Same access as messages on its discussion; MESSAGE_NOT_FOUND. limit: from 1 to 100 (50 by default;
  LIMIT_INVALID otherwise); after: the next of the page before.
  """
  threadMessages(messageId: ID!, after: String, limit: Int): MessagePage


  """
  The join requests waiting in a private universe joined by request, for its owner and admins, the oldest
  first. limit: from 1 to 50 (20 by default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  joinRequests(after: String, limit: Int, universe: String!): JoinRequestPage

  """
  The live line of a universe, since v99.0.0 (D-293) what the time strip shows (universe-layouts.feature); a
  private universe and the root universe (since v46.0.0): its activity only.
  """
  liveLine(universe: String!): LiveLine

  """
  The residences of the caller in public universes, the most recent first. limit: from 1 to 50 (20 by default;
  LIMIT_INVALID otherwise); after: the next of the page before.
  """
  myPresences(after: String, limit: Int): ResidencePage

  """
  The private universes the caller is a member of, the most recently joined first. limit: from 1 to 50 (20 by
  default; LIMIT_INVALID otherwise); after: the next of the page before.
  """
  myUniverses(after: String, limit: Int): MyUniversePage

  """
  The universe visit history of the caller (since v83.0.0, D-247; not recentUniverses, the recent universes of
  Explore), synced on the account: one entry per universe, its
  most recent visit first, 50 at most kept; a sub-universe with its universe of the first level (parent). A
  private universe the caller left, or that was deleted, is not listed. Empty while nothing was recorded; the
