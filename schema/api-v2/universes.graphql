"""
A page of accounts, as shown next to what they did.
"""
type AccountRefPage {
  """
  The account ref items of this page.
  """
  items: [AccountRef!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
A debate: the ephemeral channel of a public universe, read by everyone, opened by a resident or the
leadership, closed at its end, summed up by a platform AI agent.
"""
type Debate {
  """
  Its address, with its signs ("%paris&budget").
  """
  address: String!
  """
  Whether the leadership created it (at once, without support).
  """
  byLeadership: Boolean!
  """
  What closed it, once CLOSED (and GONE after it was open); null while it waits or is open, and for a debate
  closed before 2026-10-15.
  """
  closedBy: DebateClosedBy
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  Whether it was extended (once at most).
  """
  extended: Boolean!
  """
  The identifier of the debate.
  """
  id: ID!
  """
  Its number of messages.
  """
  messageCount: Int!
  """
  The name of the debate.
  """
  name: String!
  """
  Who opened it, as shown.
  """
  openedBy: AccountRef!
  """
  When it opens, or opened.
  """
  opensAt: AWSDateTime!
  """
  The running summary while it is open, from the governance level "village" (debates.feature since v42.1.0):
  its text and when it was written.
  """
  runningSummary: Summary
  """
  The state of the debate.
  """
  status: DebateStatus!
  """
  The subject.
  """
  subject: String!
  """
  Its summary, once written and approved; null otherwise.
  """
  summary: Post
  """
  The answer of the leadership to its summary; null before.
  """
  summaryAnswer: DebateSummaryAnswer
  """
  The final summary before it is posted, to the leadership only (null for others): from the end
  of the debate until the leadership answers it (answerDebateSummary) or it is posted 24 hours
  after the end.
  """
  summaryDraft: Summary
  """
  Its support while it waits for it; null otherwise.
  """
  support: ProposalSupport
  """
  Whether the caller supports it.
  """
  supportedByMe: Boolean!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
What closed a debate: END (its end came), LEADERSHIP (closed early by the leadership), OPENER
(closed early by the resident who asked for it), LEVEL (its universe went below the village).
"""
enum DebateClosedBy {
  END
  LEADERSHIP
  LEVEL
  OPENER
}

"""
A debate of a public universe (debates.feature; contracts/living-universes.md § Debates): an
ephemeral channel ("address": "%paris&quiet-nights"), read by everyone, written by the residents
with the operations of the channels. WAITING_SUPPORT: asked for by a resident ("opensAt": the
request, which expires 7 days later; "support": the 5 supporters needed); CLOSED: read-only, its
messages until "endsAt" + 24 hours; "summary": the debate summary once posted; "summaryAnswer":
the leadership's (APPROVED, DECLINED) once given.
"""
enum DebateStatus {
  CLOSED
  GONE
  OPEN
  WAITING_SUPPORT
}

"""
The answer of the leadership to the summary of a debate.
"""
enum DebateSummaryAnswer {
  APPROVED
  DECLINED
}

"""
The DNS TXT record that proves an own domain: publish "value" at "recordName" before "expiresAt".
"""
type DnsProof {
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The name of the DNS record to publish.
  """
  recordName: String!
  """
  The type of the DNS record to publish (TXT).
  """
  recordType: String!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
  """
  The value of the DNS record to publish.
  """
  value: String!
}

"""
What a non-member may do in an exposed part of a private universe: read, reply, participate.
"""
enum ExposedAccess {
  PARTICIPATE
  READ
  REPLY
}

"""
An exposed part ("universe": its name) with the access of the accounts that are not members.
"""
type ExposedPart {
  """
  What a non-member may do in it.
  """
  access: ExposedAccess!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A request to join a private universe joined by request, waiting for the owner or an admin.
"""
type JoinRequest {
  """
  The account, as shown.
  """
  account: AccountRef!
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A page of join requests, the oldest first.
"""
type JoinRequestPage {
  """
  The join request items of this page.
  """
  items: [JoinRequest!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
Every waiting request answered at once: how many now ("answered"; accepted up to the member tier), how many
still wait.
"""
type JoinRequestsAnswer {
  """
  The join requests answered.
  """
  answered: Int!
  """
  The join requests still waiting.
  """
  waiting: Int!
}

"""
The live line of a universe: what it turns among, in this order (the apps turn it every 6
seconds): the most recent pinned announcement, the open vote that ends soonest, the open poll
with the most votes, the open debate with the most messages, the universe event of the day (the
apps keep it when it is the reader's day); since v46.0.0 never hidden: "activity" when nothing
is under way. A private universe and the root universe (since v46.0.0): "activity" only.
"""
type LiveLine {
  """
  The activity of the universe, when nothing is under way.
  """
  activity: UniverseActivity!
  """
  Whether only the admins write (announcement mode).
  """
  announcement: Post
  """
  The open debate with the most messages; null when none.
  """
  debate: Debate
  """
  The universe event of the day; null when none.
  """
  event: UniverseEvent
  """
  The open poll with the most votes; null when none.
  """
  poll: Poll
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
  """
  The open vote that ends soonest; null when none.
  """
  vote: Proposal
}

"""
The choice of the caller in a public universe: listed on its members page or not.
"""
type MembersListing {
  """
  Whether the caller is listed on the members page.
  """
  listed: Boolean!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
The join request of the caller still waiting.
"""
type MyJoinRequest {
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The state of the my join request.
  """
  status: MyJoinRequestStatus!
}

"""
The state of the join request of the caller.
"""
enum MyJoinRequestStatus {
  WAITING
}

"""
A private universe of the caller, with its role.
"""
type MyUniverse {
  """
  Deleted: listed to its members until it is deleted for good (they export their posts).
  """
  deletedAt: AWSDateTime
  """
  When it is deleted for good unless the deletion is cancelled; null otherwise.
  """
  deletedForGoodAt: AWSDateTime
  """
  Its description; null when none.
  """
  description: String
  """
  Its image; null when none.
  """
  image: Image
  """
  When it joined.
  """
  joinedAt: AWSDateTime!
  """
  Its role.
  """
  role: UniverseRole!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A page of the private universes of the caller, the most recently joined first.
"""
type MyUniversePage {
  """
  The my universe items of this page.
  """
  items: [MyUniverse!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
A new resident on the welcome wall of a universe.
"""
type NewResident {
  """
  The account, as shown.
  """
  account: AccountRef!
  """
  When it joined.
  """
  joinedAt: AWSDateTime!
  """
  How many welcomed the resident.
  """
  welcomeCount: Int!
  """
  Whether the caller welcomed the resident.
  """
  welcomedByMe: Boolean!
}

"""
A poll of a public universe.
"""
type Poll {
  """
  Its author, as shown.
  """
  author: AccountRef!
  """
  Whether the leadership created it (at once, without support).
  """
  byLeadership: Boolean!
  """
  Its choices, in order.
  """
  choices: [String!]!
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  When it ends.
  """
  endsAt: AWSDateTime
  """
  The identifier of the poll.
  """
  id: ID!
  """
  The index of the choice of the caller; null when none.
  """
  myChoice: Int
  """
  When it opens; null before it is scheduled.
  """
  opensAt: AWSDateTime
  """
  Its question.
  """
  question: String!
  """
  The state of the poll.
  """
  status: PollStatus!
  """
  Whether the caller supports it.
  """
  supportedByMe: Boolean!
  """
  The residents who support it.
  """
  supporters: Int!
  """
  The votes of each choice; null while hidden.
  """
  totals: [Int!]
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A page of polls, the most recent first.
"""
type PollPage {
  """
  The poll items of this page.
  """
  items: [Poll!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
A poll of a public universe (polls.feature): "totals" one per choice, while it is open to a reader
who picked a choice and to its author only (null for the others, a visitor included: v51.0.0,
D-07), once closed to every reader; "myChoice" the caller's own; CLOSED 7 days after "opensAt".
"""
enum PollStatus {
  CLOSED
  OPEN
  WAITING_SUPPORT
}

"""
The settings of a private universe to change (changePrivateUniverse, since v78.0.0 in one input, P-5): a field
not given stays. display: the display case of its name (the same name); joinMode; legalSpace (always refused:
LEGAL_SPACE_NEVER_CHANGES); automaticAlt and automaticSubtitles (since v78.0.0, D-214): the automatic
alternative texts (off: no suggested alternative text either) and the automatic subtitles of its posts.
"""
input PrivateUniverseChangeInput {
  automaticAlt: Boolean
  automaticSubtitles: Boolean
  display: String
  joinMode: PrivateUniverseJoinMode
  legalSpace: String
}

"""
The creation of a private universe: created, or waiting for the DNS proof of its own domain.
"""
type PrivateUniverseCreation {
  """
  The DNS record to publish for an own domain; null otherwise.
  """
  dnsProof: DnsProof
  """
  The state of the private universe creation.
  """
  status: PrivateUniverseCreationStatus!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: Universe
}

"""
Whether a private universe is created, or waits for the DNS proof of its own domain.
"""
enum PrivateUniverseCreationStatus {
  CREATED
  DNS_PROOF_REQUIRED
}

"""
A private universe to create (createPrivateUniverse): a hosted name (hostedName, created at once) or an own
domain (domain: its token is valid 7 days, the universe created by checkDnsProof once its DNS TXT record is
found); its legal space; its join mode; its member tier (required but for a universe joined by
subscription, which gives its first tier in subscriptionTier); a declaration as an association or an
open-source project (declarationKind, declarationReference). An own domain without a declaration:
OWN_DOMAIN_NOT_FREE.
"""
input PrivateUniverseInput {
  hostedName: String
  domain: String
  legalSpace: String!
  joinMode: PrivateUniverseJoinMode!
  memberTier: Int
  subscriptionTier: SubscriptionTierOfferInput
  declarationKind: UniverseDeclarationKind
  declarationReference: String
}

"""
Private universes (features/universes/; docs/architecture.md § Univers privés).
SUBSCRIPTION since specs v68.3.0 (D-186): joined by paying a subscription tier.
"""
enum PrivateUniverseJoinMode {
  INVITATION
  REQUEST
  SUBSCRIPTION
}

"""
Why a private universe is read-only for its members (since v56.0.0).
"""
enum PrivateUniverseReadOnly {
  ARCHIVED
  BEYOND_MEMBER_TIER
}

"""
The reputation of a private universe (since v56.0.0, D-140; contracts/living-universes.md § The
reputation of a private universe): turned on or off (off by default; "turnedOn": the contract's
"on", a name AppSync's parser refuses), the moment it applies from once
turned on (the next midnight UTC; null while off), the coefficient of its folding threshold set
by its owner within the bounds of the social platform, and the threshold now (its members count
as its residents).
"""
type PrivateUniverseReputation {
  """
  When a change applies; null when in force.
  """
  appliesFrom: AWSDateTime
  """
  The coefficient of the folding threshold.
  """
  foldingCoefficient: Float!
  """
  The highest coefficient the social platform allows.
  """
  maxCoefficient: Float!
  """
  The lowest coefficient the social platform allows.
  """
  minCoefficient: Float!
  """
  The threshold.
  """
  threshold: Int!
  """
  Whether the reputation is on in the private universe.
  """
  turnedOn: Boolean!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A sub-universe and its activity.
"""
type SubUniverse {
  """
  When its last post was written; null when none.
  """
  lastPostAt: AWSDateTime
  """
  The name of the sub universe.
  """
  name: String!
  """
  The number of its posts.
  """
  postCount: Int!
}

"""
The sub-universe map of a universe (sub-universe-map.feature): its direct sub-universes with posts in the last
24 hours, the most first.
"""
type SubUniverseMap {
  """
  Its tiles, one per sub-universe.
  """
  tiles: [SubUniverseTile!]!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
  """
  When it was last updated.
  """
  updatedAt: AWSDateTime!
}

"""
The order of a list of sub-universes. The values stay in lowercase, as stored.
"""
enum SubUniverseOrder {
  name
  posts
  recent
}

"""
A page of sub-universes, in the order asked.
"""
type SubUniversePage {
  """
  The sub universe items of this page.
  """
  items: [SubUniverse!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
A tile of a sub-universe map: a direct sub-universe and its posts of the last 24 hours (the size of its tile).
"""
type SubUniverseTile {
  """
  Its number of posts, which sizes its tile.
  """
  posts: Int!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A summary written by a platform AI agent, with its time.
"""
type Summary {
  """
  When it was written.
  """
  at: AWSDateTime!
  """
  The text as written.
  """
  text: String!
}

"""
The time column of a public universe (universe-page.feature, universe-layouts.feature, since
v46.0.0): what is under way, each kind the closest deadline first, 3 at most, with how many there
are in all; sorted by the apps (24 hours first, then the order of the kinds of the field). On the
page of a sub-universe: the votes, the projects, the polls and the level goal of its first level,
its own debates and universe events. "votes": the votes open on proposals ("result" the totals so
far, "quorum" the share needed); "events": those under way or starting within 7 days; "projects":
the projects in progress with a target date (past dates first); "levelGoal": below the governance
level "federation" and below the threshold of the next level, null once above it.
"""
type TimeColumn {
  """
  The open debates.
  """
  debates: [Debate!]!
  """
  The universe events to come.
  """
  events: [UniverseEvent!]!
  """
  The collective goal of the next level; null at the federation.
  """
  levelGoal: LevelGoal
  """
  The number of open debates.
  """
  openDebates: Int!
  """
  The number of open polls.
  """
  openPolls: Int!
  """
  The open votes.
  """
  openVotes: Int!
  """
  The open polls.
  """
  polls: [Poll!]!
  """
  The projects in progress.
  """
  projects: [Proposal!]!
  """
  The number of projects in progress.
  """
  projectsInProgress: Int!
  """
  The second round under way; null otherwise.
  """
  secondRound: SecondRound
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
  """
  The number of universe events to come.
  """
  upcomingEvents: Int!
  """
  The votes.
  """
  votes: [Proposal!]!
}

"""
A universe: a place where posts are written, named by its address ("%paris"). themeRef: its universe theme,
its own or of its nearest universe above that has one (themeOf), or Socle; imageOf, watermarkOf, bannerOf: the
universe the image (its logo), the watermark and the banner come from; description and image: its own. A
private universe (private): every account sees its name, description, image, join mode, conditions version
and legal space (its applicable law); access says what the caller may do in it (MEMBER, the access of an
exposed part, or NONE); the other fields are for its members only (null or empty otherwise); root is the
private universe of the first level.
"""
type Universe {
  """
  Its address, with its sign.
  """
  name: String!
  """
  False for an address where no universe was created yet.
  """
  exists: Boolean!
  """
  When it was created.
  """
  createdAt: AWSDateTime
  """
  Its description; null when none.
  """
  description: String
  """
  The number of residents of its first level; null for a private universe and the root universe.
  """
  residentCount: Int
  """
  Its posts, newest first, by pages: after is the cursor of the previous page (its next), limit the
  size of the page, from 1 to 50 (20 by default; LIMIT_INVALID otherwise). Counted by the usage step as
  the posts of the universe; read for every universe of a request in one call. Null only with an error
  (a navigable field is a root of its own call).
  """
  posts(after: String, limit: Int): PostPage
  """
  What the caller may do in a private universe: MEMBER, the access of an exposed part, or NONE; null for a
  public universe.
  """
  access: UniverseAccess
  """
  The number of admins of a private universe (members only); null otherwise.
  """
  adminCount: Int
  """
  Archived (members only): since when, and when it is deleted unless its owner reactivates it.
  """
  archivedAt: AWSDateTime
  """
  When an archived private universe is deleted unless its owner reactivates it; null otherwise.
  """
  archivedDeletionAt: AWSDateTime
  """
  The universe banner (universe-identity.feature: 3:1, at least 1,500 × 500) and its night variant: its own,
  or of its nearest universe above ("bannerOf").
  """
  banner: Image
  """
  The night variant of its banner: its own, or of its nearest universe above; null when none.
  """
  bannerNight: Image
  """
  The universe its banner comes from; null when its own or none.
  """
  bannerOf: String
  """
  A public universe, for a human who left it (its first level), or whose presence ended, less than 7 days ago:
  when it can join again; null when it can join now.
  """
  canJoinAt: AWSDateTime
  """
  Whether the caller accepted the current conditions of a private universe; false otherwise.
  """
  conditionsAccepted: Boolean!
  """
  The version of the conditions of a private universe; null otherwise.
  """
  conditionsVersion: Int
  """
  Whether the images of the posts of the universe get an automatic alternative text
  (automatic-alternative-text.feature, since v78.0.0, D-214): always true for a public universe; for a private
  universe, on by default, turned off or back on by its owner (changePrivateUniverse).
  """
  automaticAlt: Boolean!
  """
  Whether the clips of the posts of the universe get automatic subtitles (automatic-subtitles.feature, since
  v78.0.0, D-214): always true for a public universe; for a private universe, on by default, turned off or
  back on by its owner (changePrivateUniverse).
  """
  automaticSubtitles: Boolean!
  """
  A public universe of the first level below the governance level "village", other than the root universe: its
  conversation starters on (the default) or turned off by a proposal (conversation-starters.feature, since
  v77.1.0, D-213); null elsewhere.
  """
  conversationStarters: Boolean
  """
  A public universe of the first level: its daily digest on (the default) or turned off by a proposal; null
  elsewhere.
  """
  dailyDigest: Boolean
  """
  A public universe: its proposal summaries and vote minutes on (the default) or turned off by a proposal
  (proposal-summaries.feature, since v77.1.0, D-213), written from the governance level "village"; null for a
  private universe.
  """
  proposalSummaries: Boolean
  """
  Declared as an association or an open-source project (members only).
  """
  declaration: UniverseDeclaration
  """
  Deleted (to its owner only): when, and when it is deleted for good unless cancelled.
  """
  deletedAt: AWSDateTime
  """
  When it is deleted for good unless the deletion is cancelled; null otherwise.
  """
  deletedForGoodAt: AWSDateTime
  """
  The DNS name of a private universe of an own domain; null otherwise.
  """
  dnsName: String
  """
  What a non-member may do in this exposed part; null when not exposed.
  """
  exposedAccess: ExposedAccess
  """
  The exposed parts of a private universe (members only).
  """
  exposedParts: [ExposedPart!]!
  """
  The field of its universe of the first level, set or suggested (fieldSuggested); null: none, a private
  universe, the root universe.
  """
  field: UniverseField
  """
  Whether its field is only suggested.
  """
  fieldSuggested: Boolean!
  """
  Its first focus (universe-layouts.feature, since v46.0.0), set by the leadership with its
  showcase, or of its nearest universe above that has one; null: the one of its field
  (client configuration "universePages"), else POSTS. Null for a private universe and the root universe.
  Since v79.0.0 (D-217), POSTS, CLIPS, MAP or DEBATES: a first focus stored with AGENDA, GOVERNANCE,
  SHOWCASE or SUB_UNIVERSES is served null.
  """
  firstFocus: UniverseFocus
  """
  The universe image, its logo (a square of at least 512 × 512): its own, or of its nearest universe above
  ("imageOf").
  """
  image: Image
  """
  The universe its image comes from; null when its own or none.
  """
  imageOf: String
  """
  How a private universe is joined; null for a public universe.
  """
  joinMode: PrivateUniverseJoinMode
  """
  The code joinUniverse answers now (REJOIN_TOO_SOON); null when the caller can join now.
  """
  joinRefusal: String
  """
  The newest clip of the universe: the news badge of the focus clips (a dot, since v79.0.0) when it is later
  than the last reading of the clips on the device; null when none.
  """
  lastClipAt: AWSDateTime
  """
  The universe its default layout comes from; null when its own or none.
  """
  layoutOf: String
  """
  Its default layout: its own or of its nearest universe above that has one (layoutOf); version read with the
  universe: the apps read appliedLayout again when it changed. G-8: defaultLayout is gone.
  """
  layoutRef: LayoutRef
  """
  The legal space of a private universe (its applicable law); null otherwise.
  """
  legalSpace: String
  """
  The number of members.
  """
  memberCount: Int
  """
  The member tier of a private universe (members only); null otherwise.
  """
  memberTier: Int
  """
  After a declaration found false (members only): the end of the 30 days to choose a member tier; no new
  member until a choice.
  """
  memberTierChoiceUntil: AWSDateTime
  """
  The draft preview of the caller on this universe (since v54.0.0), while it runs; null otherwise. Read by
  universe(name) only.
  """
  myDraftPreview: DraftPreview
  """
  The caller's join request waiting (a non-member), or null.
  """
  myJoinRequest: MyJoinRequest
  """
  The reader's last visit (since v69.0.0, D-188): its landing in the universe before the current visit, on any
  device (markLanding); null before a second visit. Read by universe(name) only. Read in the cell of the
  caller (its own data); phase 1 of the cells: null for a universe of another cell.
  """
  myLastVisitAt: AWSDateTime
  """
  The caller's role on the page of a public universe other than the root universe (since
