"""
The bounds of the area of the map shown (WGS 84).
"""
input BoundsInput {
  east: Float!
  north: Float!
  south: Float!
  west: Float!
}

"""
The last position of a live share.
"""
type LivePosition {
  """
  Since v84.0.0 (D-248): its map avatar; null without one (the profile picture is shown).
  """
  mapAvatar: MapAvatar
  """
  Since v84.0.0 (D-248): the state of its map avatar.
  """
  state: MapAvatarState
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  When the position was taken.
  """
  at: AWSDateTime!
  """
  The point (WGS 84); since v94.0.0 (D-288), for a minor sharer, the center of its map cell (mapCell), never the
  point sent.
  """
  point: Point!
  """
  Since v94.0.0 (D-288): the map cell of resolution 8 (about 1 kilometre) the position lies in, for a minor sharer,
  turned by the backend before any recipient reads it; null for an adult sharer.
  """
  mapCell: String
  """
  The time to arrival at the meeting point, in seconds; null when unknown.
  """
  secondsToMeetingPoint: Int
  """
  The time to arrival at the place of the meet-up the live share is for, in seconds (0 to 86,400), computed by the sharer's app; null when unknown or when the live share is not for a meet-up. Kept with the last position only.
  """
  secondsToMeetUp: Int
  """
  How the sharer travels to the meet-up (FOOT or BICYCLE); null with secondsToMeetUp.
  """
  meetUpMode: RouteMode
  """
  The live share.
  """
  shareId: ID!
}

"""
A live share in progress: its sharer (accountId), its discussion (a conversation or a group chat), its
start and end, the event or the meet-up it lasts until, the meeting point of its group chat (or of the
route of its event).
"""
type LiveShare {
  """
  The identifier of the live share.
  """
  id: ID!
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  The discussion of the live share: a conversation or a group chat.
  """
  discussion: DiscussionRef!
  """
  When it started.
  """
  startedAt: AWSDateTime!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  The universe event it lasts until; null otherwise.
  """
  eventId: ID
  """
  The message of the meet-up it lasts until 15 minutes after; null otherwise.
  """
  meetUpId: ID
  """
  The meeting point; null when none.
  """
  meetingPoint: Place
}

"""
A locatable resident: its map cell (H3, resolution 8, about 1 kilometre across; never its position), its
activity, its end; "account" its display copy.
"""
type Locatable {
  """
  Since v84.0.0 (D-248): its map avatar; null without one (the profile picture is shown).
  """
  mapAvatar: MapAvatar
  """
  Since v84.0.0 (D-248): the state of its map avatar.
  """
  state: MapAvatarState
  """
  The account, as shown.
  """
  account: AccountRef
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  The activity it is locatable for.
  """
  activity: String!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  Its map cell (H3, resolution 8, about 1 kilometre across), never its position.
  """
  mapCell: String!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
  """
  When it was last updated.
  """
  updatedAt: AWSDateTime!
}

"""
How close the phone estimates a person: IMMEDIATE under about 10 cm, NEAR to about 2 m, FAR beyond.
"""
enum NearbyCloseness {
  FAR
  IMMEDIATE
  NEAR
}

"""
A person in mutual discovery with the caller; "label": their nearby label (the handle with its
"@", or the text they chose); "lastSeenAt": the last time the caller's phone saw them.
"""
type NearbyPerson {
  """
  The account, as shown.
  """
  account: AccountRef!
  """
  How close the person is.
  """
  closeness: NearbyCloseness!
  """
  Whether the caller and the person are connected.
  """
  connected: Boolean!
  """
  Its nearby label: the text it chose, or its handle.
  """
  label: String!
  """
  When the person was last seen around.
  """
  lastSeenAt: AWSDateTime!
  """
  The nearby token seen.
  """
  token: String!
}

"""
A request to connect through Nearby, with the status the caller sees; it expires 2 minutes
after it was sent. "fromLabel", "toLabel": the nearby labels of the two people when it was sent.
"""
type NearbyRequest {
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The sender, as shown.
  """
  from: AccountRef!
  """
  The nearby label of the sender.
  """
  fromLabel: String!
  """
  The identifier of the nearby request.
  """
  id: ID!
  """
  The state of the nearby request.
  """
  status: NearbyRequestStatus!
  """
  The recipient, as shown.
  """
  to: AccountRef!
  """
  The nearby label of the recipient.
  """
  toLabel: String!
}

"""
WAITING (both; the sender also while refused), CONNECTED (both), REFUSED (the recipient only), NO_ANSWER (the
sender, once expired).
"""
enum NearbyRequestStatus {
  CONNECTED
  NO_ANSWER
  REFUSED
  WAITING
}

"""
A nearby token seen around, and its closeness.
"""
input NearbySightingInput {
  closeness: NearbyCloseness!
  """
  The token.
  """
  token: String!
}

"""
A place: its name and its point (WGS 84). G-8: lat and lon were the same as point.
"""
type Place {
  """
  The name of the place.
  """
  name: String!
  """
  The point (WGS 84).
  """
  point: Point!
}

"""
A place as an argument: its name (1 to 100 visible characters) and its point (PLACE_INVALID).
"""
input PlaceInput {
  name: String!
  point: PointInput!
}

"""
A place found by the cartography (places): "id" its open data id (the "boundaryId" of a
universe territory), "kind" its kind (a city, a station…), "universes" the public universes
whose universe territory holds it, of any field (a circle by its distance to the center, a
boundary when the place is the boundary).
"""
type PlaceMatch {
  """
  Its postal address, when the cartography gives one; null otherwise.
  """
  address: String
  """
  The identifier of the place match.
  """
  id: String
  """
  The kind of the place match.
  """
  kind: String
  """
  Its local name (since v63.2.0, D-170: contracts/map.md): the name of the place in its own language, beside
  "name" in the language asked; null when the same, or not given by the cartography yet.
  """
  localName: String
  """
  The name of the place match.
  """
  name: String!
  """
  The point (WGS 84).
  """
  point: Point!
  """
  The addresses of the universes, with their sign.
  """
  universes: [String!]!
}

"""
A point of the map (as an argument: PointInput): a latitude of -90 to 90, a longitude of -180 to 180.
"""
type Point {
  """
  Its latitude.
  """
  lat: Float!
  """
  Its longitude.
  """
  lon: Float!
}

"""
A point (WGS 84).
"""
input PointInput {
  lat: Float!
  lon: Float!
}

"""
A position of a live share: when, where, and the seconds to the meeting point.
"""
input PositionInput {
  """
  When.
  """
  at: AWSDateTime!
  lat: Float!
  lon: Float!
  secondsToMeetingPoint: Int
  """
  The time to arrival at the place of the meet-up, in seconds, 0 to 86,400; only for the live share of a meet-up. Out of range, or without meetUpMode, POSITIONS_INVALID.
  """
  secondsToMeetUp: Int
  """
  How the sharer travels to the meet-up: FOOT or BICYCLE only. Any other value, POSITIONS_INVALID.
  """
  meetUpMode: RouteMode
}

"""
The route of a universe event: its 2 to 100 points as drawn, its mode, whether it is snapped to
the streets and paths ("snapped"; its "line" then the line through them, 2,000 points at most;
null: the points drawn are the line), its stages, its meeting point (null: its start), its length
(metres), duration (seconds) and elevation. As an argument (RouteInput): "points", "mode",
"snap", "stages", "meetingPoint" (the others ignored).
"""
type Route {
  """
  Its ascent, in metres; null when unknown.
  """
  ascent: Int
  """
  Its descent, in metres; null when unknown.
  """
  descent: Int
  """
  Its line, point by point; null when drawn by hand.
  """
  line: [Point!]
  """
  The meeting point; null when none.
  """
  meetingPoint: Place
  """
  Its length, in metres; null when unknown.
  """
  metres: Int
  """
  How it is travelled.
  """
  mode: RouteMode!
  """
  Its points as placed.
  """
  points: [Point!]!
  """
  Its time, in seconds; null when unknown. Since v101.2.0 (routes.feature): when the route does not follow the ways
  (snapped false) and seconds is null, the apps show an estimated duration, its metres at 5 km/h on foot and 15 km/h
  by bicycle, told "estimated".
  """
  seconds: Int
  """
  Whether it was asked to follow the ways.
  """
  snap: Boolean!
  """
  Whether it follows the ways (false when the routing was starting: kept as drawn).
  """
  snapped: Boolean!
  """
  Its stages; null when none.
  """
  stages: [Stage!]
  """
  Whether it is a loop, its end joined to its start (since v92.1.0); false otherwise.
  """
  loop: Boolean!
}

"""
A route as drawn or snapped (route), to keep with a universe event.
"""
input RouteInput {
  ascent: Int
  descent: Int
  line: [PointInput!]
  """
  The meeting point; null when none.
  """
  meetingPoint: PlaceInput
  metres: Int
  mode: RouteMode!
  points: [PointInput!]!
  seconds: Int
  snap: Boolean
  snapped: Boolean
  stages: [StageInput!]
  """
  Since v92.1.0: a loop (false when not given). A line drawn by hand is simplified by the app, keeping its shape (5
  metres by default, a setting of the platform team), to at most 1,000 points before it is sent, with handDrawn
  true (ROUTE_INVALID beyond; 100 points placed point by point).
  """
  loop: Boolean
  """
  Since v92.1.0: a line drawn by hand or imported, up to 1,000 points (false when not given: 2 to 100 points).
  """
  handDrawn: Boolean
}

"""
How a route is travelled: on foot or by bicycle.
"""
enum RouteMode {
  BICYCLE
  FOOT
}

"""
A stage of a route (as an argument: StageInput): at its point "index", named 1 to 60 visible characters.
"""
type Stage {
  """
  Its index among the points of the route.
  """
  index: Int!
  """
  The name of the stage.
  """
  name: String!
  """
  The post it holds (since v92.1.0: a video, an image or a text, that the caller reads); null when none.
  """
  postId: ID
}

"""
A stage of a route.
"""
input StageInput {
  index: Int!
  """
  The name of the stage input.
  """
  name: String!
  """
  Since v92.1.0: the post it holds (POST_NOT_FOUND).
  """
  postId: ID
}

"""
The universe territory of a public universe of the first level (contracts/map.md § The universe
territory): an open administrative boundary of the cartography ("id" the id of its PlaceMatch,
"kind" its kind such as "boundary:administrative") or a circle ("id" null, "kind" "circle",
"center" and "radius"; "name" the name of the place at its center).
"""
type Territory {
  """
  Its center.
  """
  center: Point
  """
  The identifier of the territory.
  """
  id: String
  """
  The kind of the territory.
  """
  kind: String!
  """
  The name of the territory.
  """
  name: String!
  """
  Its radius.
  """
  radius: TerritoryRadius
}

"""
A universe territory chosen: a boundary (boundaryId, the id of its place) or a circle (center and radius).
"""
input TerritoryChoiceInput {
  boundaryId: String
  """
  Its center.
  """
  center: PlaceInput
  """
  The kind of the territory choice input.
  """
  kind: String
  """
  The name of the territory choice input.
  """
  name: String
  """
  Its radius.
  """
  radius: TerritoryRadius
}

"""
The eight radii of a circle as a universe territory (since v49.8.0): 150 m to 25 km.
"""
enum TerritoryRadius {
  KM1
  KM10
  KM25
  KM2_5
  KM5
  M150
  M250
  M500
}

"""
The zone of a universe event: a circle around "center" of one of five radii, shown instead of the
point of its place until the place is revealed: at "revealAt" (before the start; at the start
when the start moved before it; without it, at the start), or at once to the attendees only
("revealToAttendees"). As an argument (ZoneInput): with the hidden "place" (its name) and its
"point" (within the circle), required there; served, "place" and "point" are always null.
"""
type Zone {
  """
  Its center.
  """
  center: Point!
  """
  The place.
  """
  place: String
  """
  The point (WGS 84).
  """
  point: Point
  """
  Its radius.
  """
  radius: ZoneRadius!
  """
  When its point is revealed; null when never or already.
  """
  revealAt: AWSDateTime
  """
  Whether its point is revealed to the attendees only.
  """
  revealToAttendees: Boolean!
}

"""
The zone of a universe event: its center, radius, place, and when its point is revealed.
"""
input ZoneInput {
  """
  Its center.
  """
  center: PointInput!
  """
  The place.
  """
  place: String
  """
  The point (WGS 84).
  """
  point: PointInput
  """
  Its radius.
  """
  radius: ZoneRadius!
  revealAt: AWSDateTime
  revealToAttendees: Boolean
}

"""
The radius of the zone of a universe event.
"""
enum ZoneRadius {
  KM1
  KM2_5
  M150
  M250
  M500
}

"""
Since v84.0.0 (D-248): a layer of a map avatar, one part per layer at most.
"""
enum AvatarLayer {
  ACCESSORY
  BODY
  CLOTHES
  FACE
  HAIR
}

"""
Since v84.0.0 (D-248): a part of the avatar catalog, a layered 2D image made by the platform or under the
CC0 licence, approved by the platform team.
"""
type AvatarPart {
  """
  The identifier of the part.
  """
  id: ID!
  """
  The layer it is drawn in.
  """
  layer: AvatarLayer!
  """
  Its name, in the language asked.
  """
  name: String!
  """
  The URL of its image (SVG) on the CDN.
  """
  imageUrl: AWSURL!
  """
  True for a free part, false for a paid cosmetic part.
  """
  free: Boolean!
  """
  True once the caller may wear it: a free part, or a paid cosmetic part bought.
  """
  owned: Boolean!
  """
  The price of a paid cosmetic part in the currency of the caller, in minor units; null for a free part.
  """
  priceMinor: Int
  """
  The currency of priceMinor (ISO 4217); null for a free part.
  """
  currency: String
}

"""
Since v84.0.0 (D-248): a page of the avatar catalog.
"""
type AvatarPartPage {
  """
  The parts of this page.
  """
  items: [AvatarPart!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
Since v84.0.0 (D-248): a map avatar, its parts by layer.
"""
type MapAvatar {
  """
  Its parts, one per layer at most.
  """
  parts: [AvatarPart!]!
  """
  When it was last changed.
  """
  updatedAt: AWSDateTime!
}

"""
Since v84.0.0 (D-248): the state of a map avatar on the map, computed by the platform from the map presence,
the live share or the locatable resident: MOVING beyond 100 metres in the last 10 minutes, AT_EVENT within the
place or the zone of a universe event in progress its owner attends, IDLE otherwise.
"""
enum MapAvatarState {
  AT_EVENT
  IDLE
  MOVING
}

"""
Since v84.0.0 (D-248): the precision a connected account sees a map presence at: NEIGHBOURHOOD (H3
resolution 8, about 1 kilometre, the default), CITY (H3 resolution 6, about 36 square kilometres), EXACT (the
point).
"""
enum MapPresencePrecision {
  CITY
  EXACT
  NEIGHBOURHOOD
}

"""
Since v84.0.0 (D-248): how long a map presence lasts.
"""
enum MapPresenceDuration {
  EIGHT_HOURS
  ONE_DAY
  ONE_HOUR
  SEVEN_DAYS
}

"""
Since v84.0.0 (D-248): a connected account of the audience of a map presence and its precision.
"""
type MapPresenceViewer {
  """
  The identifier of the connected account.
  """
  accountId: ID!
  """
  The precision it sees.
  """
  precision: MapPresencePrecision!
}

"""
Since v84.0.0 (D-248): a connected account of the audience, as an argument; precision by default the
precision of the audience.
"""
input MapPresenceViewerInput {
  accountId: ID!
  precision: MapPresencePrecision
}

"""
Since v84.0.0 (D-248): the audience of a map presence, as an argument: all the connected accounts
(allConnections) or those listed (viewers), at "precision" (NEIGHBOURHOOD by default), and the residents of
at most 3 public universes the caller is a resident of (universes, seeing groups only). A minor: universes
empty, else MAP_PRESENCE_CONNECTIONS_ONLY; since v94.0.0 (D-288), a minor never EXACT (precision nor a viewer),
else MAP_PRESENCE_PRECISION_NOT_ALLOWED; 4 universes or more: MAP_PRESENCE_UNIVERSE_LIMIT.
"""
input MapPresenceAudienceInput {
  allConnections: Boolean!
  precision: MapPresencePrecision
  viewers: [MapPresenceViewerInput!]!
  universes: [String!]!
}

"""
Since v84.0.0 (D-248): the map presence of the caller.
"""
type MyMapPresence {
  """
  True for all the connected accounts.
  """
  allConnections: Boolean!
  """
  The precision of the connected accounts not listed in viewers.
  """
  precision: MapPresencePrecision!
  """
  The connected accounts listed, with their precision.
  """
  viewers: [MapPresenceViewer!]!
  """
  The addresses of the universes whose residents see groups ("%paris").
  """
  universes: [String!]!
  """
  True in the ghost mode: nobody sees it.
  """
  ghost: Boolean!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  When its map cell or point was last updated.
  """
  updatedAt: AWSDateTime!
}

"""
Since v84.0.0 (D-248): the map presence of a connected account, as the caller may see it: its map cell at
its precision, or its point (EXACT only).
"""
type MapPresence {
  """
  The account, as shown.
  """
  account: AccountRef
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  The precision the caller sees.
  """
  precision: MapPresencePrecision!
  """
  The map cell (H3, resolution 8 or 6); null with EXACT.
  """
  mapCell: String
  """
  The point (WGS 84), EXACT only; null otherwise.
  """
  point: Point
  """
  Its map avatar; null without one (the profile picture is shown).
  """
  mapAvatar: MapAvatar
  """
  The state of its map avatar.
  """
  state: MapAvatarState!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  When it was last updated.
  """
  updatedAt: AWSDateTime!
}

"""
Since v84.0.0 (D-248): a group of map presence of the residents of a universe in a map cell (H3, resolution
8), from 3 residents; never a name, an avatar nor a point.
"""
type MapPresenceGroup {
  """
  The map cell (H3, resolution 8).
  """
  mapCell: String!
  """
  The number of people, 3 or more, each counted once (a map presence and a locatable resident of the same
  person count one).
  """
  count: Int!
}

"""
Since v84.0.0 (D-248): the place of a placed post: a point of interest of the cartography at its point
(pointOfInterest true, point set), or a map cell of about 1 kilometre (H3, resolution 8), point null.
"""
type PostPlace {
  """
  The name shown: the name of the point of interest, else the name of the district of the map cell.
  """
  name: String!
  """
  True for a point of interest.
  """
  pointOfInterest: Boolean!
  """
  The point of a point of interest; null otherwise.
  """
  point: Point
  """
  The map cell (H3, resolution 8) of the place, always set.
  """
  mapCell: String!
  """
  Since v86.3.0: the identifier of the point of interest (the placeId of PostPlaceInput); null otherwise.
  """
  placeId: String
  """
  Since v92.0.0 (D-285, placed-videos.feature): the precision of a placed video, EXACT (a point of interest, point set), NEIGHBOURHOOD
  or CITY (point null, mapCell the cell of resolution 8 at the center of the city); NEIGHBOURHOOD for a post
  without a video.
  """
  precision: PlacePrecision!
  """
  Since v92.0.0: the moment of the video its pin opens at, in milliseconds; null for its start.
  """
  atMs: Int
}

"""
The precision of the place of a placed video (since v92.0.0, D-285): the exact point (of a point of interest only), the
neighbourhood (the map cell of about 1 kilometre) or the city. A minor: CITY at most.
"""
enum PlacePrecision {
  CITY
  EXACT
  NEIGHBOURHOOD
}

"""
Since v84.0.0 (D-248): the place an author chooses for a post: a point of interest (placeId, from places)
kept at its point, or any point, rounded to its map cell by the platform before anything is kept.
POST_PLACE_NOT_ALLOWED in a private universe, a reply, a repost or a quote; since v92.0.0 (D-285), a post with a
clip or a long video is placed in a private universe too, seen by its members only. Since v92.0.0: precision (a
post with a video only, NEIGHBOURHOOD when not given; POST_PLACE_PRECISION_NOT_ALLOWED for a post without a video, and for EXACT without a point of interest (placeId);
EXACT and NEIGHBOURHOOD read as CITY for a minor); atMs (the moment its pin opens at, within the video);
recordingStartedAt (the start of the recording, read on the device and shown to the author, for the points of
view; never kept otherwise).
"""
input PostPlaceInput {
  placeId: String
  point: PointInput
  precision: PlacePrecision
  atMs: Int
  recordingStartedAt: AWSDateTime
}

"""
Since v84.0.0 (D-248): a placed post on the map: the post and its place.
"""
type MapPost {
  """
  The identifier of the post.
  """
  postId: ID!
  """
  The address of its universe ("%paris").
  """
  universe: String!
  """
  Its place.
  """
  place: PostPlace!
  """
  When it was published (the pulse ring under 1 hour).
  """
  createdAt: AWSDateTime!
  """
  Since v92.0.0 (D-285): whether it carries a clip or a long video (the layer "Videos").
  """
  video: Boolean!
}

"""
Since v84.1.0 (D-248, the pulse ring): a place with a placed post of less than 1 hour (mapRecentPlaces).
"""
type MapRecentPlace {
  """
  The map cell (H3, resolution 8) of the place, always set.
  """
  mapCell: String!
  """
  True for a point of interest.
  """
  pointOfInterest: Boolean!
  """
  The point of a point of interest; null otherwise.
  """
  point: Point
  """
  When its last placed post the caller may read was published, less than 1 hour ago.
  """
  lastPostAt: AWSDateTime!
}

"""
A point of view of a placed video (since v92.0.0, D-285, pointsOfView): another placed video of the same moment.
"""
type PointOfView {
  """
  The post with the video.
  """
  postId: ID!
  """
  Its place.
  """
  place: PostPlace!
  """
  The start of its recording minus the start of the recording of the video asked, in milliseconds: the instant to
  switch to is the instant shown minus offsetMs.
  """
  offsetMs: Int!
}

"""
A route as an object of its own (since v92.1.0, routes.feature): made by an account or the leadership of a universe,
its URL ("/a/<handle>/w/<name>", "/u/<path>/w/<name>"), its line (route), its visibility (that of a playlist,
PRIVATE when created; a universe route the visibility of its universe), and the original it was copied from. The
parts within the privacy zones of its author are left out of route for every caller but its author. Since v101.2.0
(D-288): its author receives the whole line and its app computes the part hidden to the others with
myRoutePrivacyZones, by the rule of contracts/map.md § Routes; no field carries it.
"""
type MapRoute {
  """
  The identifier of the route.
  """
  id: ID!
  """
  Its name, by the rules of a channel name, unique per owner.
  """
  name: String!
  """
  Its canonical URL.
  """
  url: AWSURL!
  """
  Its author, for the route of an account; null for a universe route.
  """
  owner: AccountRef
  """
  Its universe ("%paris"), for a universe route; null otherwise.
  """
  universe: String
  """
  Its visibility: PUBLIC, UNLISTED or PRIVATE (an account route); that of its universe for a universe route.
  """
  visibility: PlaylistVisibility!
  """
  Its line, its stages, its mode, its length and its elevation.
  """
  route: Route!
  """
  The URL of the route it was copied from ("Do this route"); null when it is an original, or once the original is
  no longer readable.
  """
  copiedFrom: AWSURL
  """
  The author of the original it was copied from; null otherwise.
  """
  copiedFromAuthor: AccountRef
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  Its free tags, 0 to 5 (since v101.0.0, D-300), in their canonical form, without "#".
  """
  tags: [String!]!
  """
  Its line as kept (since v101.0.0, contracts/map.md § Routes): the simplified line, at most 1,000 points, as an
  encoded polyline of precision 5, the parts its privacy zones hide left out for another reader than its author.
  """
  encodedLine: String!
}

"""
A page of routes, the most recent first (since v92.1.0).
"""
type MapRoutePage {
  """
  The routes of the page.
  """
  items: [MapRoute!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
A route to save (since v92.1.0, saveMapRoute): id to change one, none to create one; universe for a universe route,
by its leadership; visibility for an account route only (PRIVATE when not given).
"""
input MapRouteInput {
  id: ID
  name: String!
  universe: String
  visibility: PlaylistVisibility
  route: RouteInput!
  """
  Since v101.0.0 (D-300): its free tags, 0 to 5, replacing them (FREE_TAGS_TOO_MANY, TAG_INVALID); not given: kept.
  """
  tags: [String!]
}

"""
A privacy zone of an account (since v92.1.0): a private place and its radius, 200, 500 or 1,000 metres.
"""
type RoutePrivacyZone {
  """
  The private place.
  """
  point: Point!
  """
  Its radius, in metres.
  """
  metres: Int!
}

"""
A privacy zone to set (since v92.1.0).
"""
input RoutePrivacyZoneInput {
  point: PointInput!
  metres: Int!
}
