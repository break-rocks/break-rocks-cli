  startsAt: AWSDateTime
  """
  When it ends at the latest; when it ended, once ENDED; null for a route experience once started; for a visit
  experience, the end of its days while IN_PROGRESS (read by its experience participant), rounded up to the next
  quarter of an hour (since D-444 (4)), and still the end of its days during the grace period of 24 hours that follows
  when the completion threshold is not met (D-444 (9)): the experience result then ends at endsAt plus 24 hours at the
  latest; null once ENDED.
  """
  endsAt: AWSDateTime
  """
  Its day (in the time zone of its place, else of its experience organizer): the only date a route experience keeps;
  for a visit experience, the day it went in progress (with ExperienceParticipation.endedOn, its days).
  """
