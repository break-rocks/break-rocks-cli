"""
The bounds of the area of the map shown (WGS 84).
"""
input BoundsInput {
  east: Float!
  north: Float!
  south: Float!
  west: Float!
}

"""
The last position of a live share.
"""
type LivePosition {
  """
  Since v84.0.0 (D-248): its map avatar; null without one (the profile picture is shown).
  """
  mapAvatar: MapAvatar
  """
  Since v84.0.0 (D-248): the state of its map avatar.
  """
  state: MapAvatarState
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  When the position was taken.
  """
  at: AWSDateTime!
  """
  The point (WGS 84); since v94.0.0 (D-288), for a minor sharer, the center of its map cell (mapCell), never the
  point sent.
  """
  point: Point!
  """
  Since v94.0.0 (D-288): the map cell of resolution 8 (about 1 kilometre) the position lies in, for a minor sharer,
  turned by the backend before any recipient reads it; null for an adult sharer.
  """
  mapCell: String
  """
  The time to arrival at the meeting point, in seconds; null when unknown.
  """
  secondsToMeetingPoint: Int
  """
  The time to arrival at the place of the message meet-up the live share is for, in seconds (0 to 86,400), computed by the sharer's app; null when unknown, when the live share is not for a message meet-up, since D-348 when the estimate is above 86,400 seconds, and for a minor sharer. Kept with the last position only.
  """
  secondsToMeetUp: Int
  """
  How the sharer travels to the message meet-up (FOOT or BICYCLE); null with secondsToMeetUp.
  """
  meetUpMode: RouteMode
  """
  Since D-348: true when secondsToMeetUp is estimated on the sharer's device while the directions cannot be computed (shown "about N minutes"); false when secondsToMeetUp is the time of the directions or is null, and when the live share is not for a message meet-up. Always present.
  """
  meetUpEstimated: Boolean!
  """
  The live share.
  """
  shareId: ID!
}

"""
A live share in progress: its sharer (accountId), its discussion (a conversation or a group chat), its
start and end, the event or the message meet-up it lasts until, the meeting point of its group chat (or of the
route of its event).
"""
type LiveShare {
  """
  The identifier of the live share.
  """
  id: ID!
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  The discussion of the live share: a conversation or a group chat.
  """
  discussion: DiscussionRef!
  """
  When it started.
  """
  startedAt: AWSDateTime!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  The universe event it lasts until; null otherwise.
  """
  eventId: ID
  """
  The message of the message meet-up it lasts until 15 minutes after; null otherwise.
  """
  meetUpId: ID
  """
  The meeting point; null when none.
  """
  meetingPoint: Place
}

"""
A locatable resident: its map cell (H3, resolution 8, about 1 kilometre across; never its position), its
activity, its end; "account" its display copy.
"""
type Locatable {
  """
  Since v84.0.0 (D-248): its map avatar; null without one (the profile picture is shown).
  """
  mapAvatar: MapAvatar
  """
  Since v84.0.0 (D-248): the state of its map avatar.
  """
  state: MapAvatarState
  """
  The account, as shown.
  """
  account: AccountRef
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  The activity it is locatable for.
  """
  activity: String!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  Its map cell (H3, resolution 8, about 1 kilometre across), never its position.
  """
  mapCell: String!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
  """
  When it was last updated.
  """
  updatedAt: AWSDateTime!
}

"""
How close the phone estimates a person: IMMEDIATE under about 10 cm, NEAR to about 2 m, FAR beyond.
"""
enum NearbyCloseness {
  FAR
  IMMEDIATE
  NEAR
}

"""
A person in mutual discovery with the caller; "label": their nearby label (the handle with its
"@", or the text they chose); "lastSeenAt": the last time the caller's phone saw them.
"""
type NearbyPerson {
  """
  The account, as shown.
  """
  account: AccountRef!
  """
  How close the person is.
  """
  closeness: NearbyCloseness!
  """
  Whether the caller and the person are connected.
  """
  connected: Boolean!
  """
  Its nearby label: the text it chose, or its handle.
  """
  label: String!
  """
  When the person was last seen around.
  """
  lastSeenAt: AWSDateTime!
  """
  The nearby token seen.
  """
  token: String!
}

"""
A request to connect through Nearby, with the status the caller sees; it expires 2 minutes
after it was sent. "fromLabel", "toLabel": the nearby labels of the two people when it was sent.
"""
type NearbyRequest {
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The sender, as shown.
  """
  from: AccountRef!
  """
  The nearby label of the sender.
  """
  fromLabel: String!
  """
  The identifier of the nearby request.
  """
  id: ID!
  """
  The state of the nearby request.
  """
  status: NearbyRequestStatus!
  """
  The recipient, as shown.
  """
  to: AccountRef!
  """
  The nearby label of the recipient.
  """
  toLabel: String!
}

"""
WAITING (both; the sender also while refused), CONNECTED (both), REFUSED (the recipient only), NO_ANSWER (the
sender, once expired).
"""
enum NearbyRequestStatus {
  CONNECTED
  NO_ANSWER
  REFUSED
  WAITING
}

"""
A nearby token seen around, and its closeness.
"""
input NearbySightingInput {
  closeness: NearbyCloseness!
  """
  The token.
  """
  token: String!
}

"""
A place: its name and its point (WGS 84). G-8: lat and lon were the same as point.
"""
type Place {
  """
  The name of the place.
  """
  name: String!
  """
  The point (WGS 84).
  """
  point: Point!
}

"""
A place as an argument: its name (1 to 100 visible characters) and its point (PLACE_INVALID).
"""
input PlaceInput {
  name: String!
  point: PointInput!
}

"""
A place found by the cartography (places): "id" its open data id (the "boundaryId" of a
universe territory), "kind" its kind (a city, a station…), "universes" the public universes
whose universe territory holds it, of any field (a circle by its distance to the center, a
boundary when the place is the boundary).
"""
type PlaceMatch {
  """
  Its postal address, when the cartography gives one; null otherwise.
  """
  address: String
  """
  The identifier of the place match.
  """
  id: String
  """
  The kind of the place match.
  """
  kind: String
  """
  Its local name (since v63.2.0, D-170: contracts/map.md): the name of the place in its own language, beside
  "name" in the language asked; null when the same, or not given by the cartography yet.
  """
  localName: String
  """
  The name of the place match.
  """
  name: String!
  """
  The point (WGS 84).
  """
  point: Point!
  """
  The addresses of the universes, with their sign: the public universes whose universe territory holds the place. Since
  D-470 (map/map.feature), the apps show none of them: the search of a place offers places only; kept served until a
  later contract.
  """
  universes: [String!]!
}

"""
A point of the map (as an argument: PointInput): a latitude of -90 to 90, a longitude of -180 to 180.
"""
type Point {
  """
  Its latitude.
  """
  lat: Float!
  """
  Its longitude.
  """
  lon: Float!
}

"""
A point (WGS 84).
"""
input PointInput {
  lat: Float!
  lon: Float!
}

"""
A position of a live share: when, where, and the seconds to the meeting point.
"""
input PositionInput {
  """
  When.
  """
  at: AWSDateTime!
  lat: Float!
  lon: Float!
  secondsToMeetingPoint: Int
  """
  The time to arrival at the place of the message meet-up, in seconds, 0 to 86,400; only for the live share of a message meet-up. Out of range, or without meetUpMode, POSITIONS_INVALID. Since D-348, the app sends null for an estimate above 86,400 seconds (no time to arrival is shown), and the app of a minor always sends null.
  """
  secondsToMeetUp: Int
  """
  How the sharer travels to the message meet-up: FOOT or BICYCLE only. Any other value, POSITIONS_INVALID.
  """
  meetUpMode: RouteMode
  """
  Since D-348: true when secondsToMeetUp is estimated on the device while the directions cannot be computed, false or null when it is the time of the directions. True with secondsToMeetUp null, POSITIONS_INVALID.
  """
  meetUpEstimated: Boolean
}

"""
The route of a universe event: its 2 to 100 points as drawn (since v131.0.0, D-413, 2 to 2,000 points and at most
1,000 kilometres), its mode, whether it is snapped to
the streets and paths ("snapped"; its "line" then the line through them, 2,000 points at most;
null: the points drawn are the line), its stages, its meeting point (null: its start), its length
(metres), duration (seconds) and elevation. As an argument (RouteInput): "points", "mode",
"snap", "stages", "meetingPoint" (the others ignored).
"""
type Route {
  """
  Its ascent, in metres; null when unknown.
  """
  ascent: Int
  """
  Its descent, in metres; null when unknown. Since v131.0.0 (D-413), the elevation loss of the route.
  """
  descent: Int
  """
  Its line, point by point; null when drawn by hand.
  """
  line: [Point!]
  """
  The meeting point; null when none.
  """
  meetingPoint: Place
  """
  Its length, in metres; null when unknown.
  """
  metres: Int
  """
  How it is travelled. Since v131.0.0 (D-413, routes.feature): its main travel mode, the travel mode of the longest
  share of its length, its water crossings left out (of its longest segment for a route on water only).
  """
  mode: RouteMode!
  """
  Since v131.0.0 (D-413, routes.feature): its route segments, 1 to 100, in the order of its points, the first from the
  point 0; a route saved before v131.0.0 answers one segment, in its mode.
  """
  segments: [RouteSegment!]!
  """
  Since v131.0.0 (D-413): its elevation profile, at most 200 samples evenly spaced along the whole route, its start
  and its end included; from the routing for a route that follows the ways, from the elevation of the ground for a free
  line (contracts/map.md § Route recordings); empty when unknown. For another caller than its author, the samples within
  the parts its privacy zones hide are left out, as they are of its line (metres stays the distance from the start of the
  whole route).
  """
  profile: [ElevationSample!]!
  """
  Since v131.0.0 (D-413, route-recording.feature): the posts attached to its line at the save of its route recording, a
  photo or a clip taken during it, each at its index in points, 60 at most; served under the visibility of the route,
  except a post the caller may not read (deleted, removed, of an account blocked either way); for another caller than its
  author, none at a point that a privacy zone of its author hides; never the time a photo or a clip was taken. The one
  exception to the rounding of a placed post (placed-posts.feature): everywhere else the post stays rounded. Empty when
  none.
  """
  posts: [RoutePost!]!
  """
  Its points as placed.
  """
  points: [Point!]!
  """
  Its time, in seconds; null when unknown. Since v101.2.0 (routes.feature): when the route does not follow the ways
  (snapped false) and seconds is null, the apps show an estimated duration, its metres at 5 km/h on foot and 15 km/h
  by bicycle, told "estimated".
  """
  seconds: Int
  """
  Whether it was asked to follow the ways.
  """
  snap: Boolean!
  """
  Whether it follows the ways (false when the routing was starting: kept as drawn).
  """
  snapped: Boolean!
  """
  Its stages; null when none.
  """
  stages: [Stage!]
  """
  Whether it is a loop, its end joined to its start (since v92.1.0); false otherwise.
  """
  loop: Boolean!
  """
  Since v128.0.0 (D-408, routes.feature): its route difficulty, from its duration for its mode (seconds, else
  estimatedSeconds) and its ascent, the harder of both, by the thresholds map.routeDifficulty of the platform (on foot
  EASY up to 2 hours and 300 metres, MODERATE up to 5 hours and 900 metres; by bicycle 2 hours and 400 metres, 5 hours
  and 1,200 metres; DIFFICULT beyond); from its duration alone when ascent is null; null when its length is unknown.
  Since v131.0.0 (D-413): by the thresholds of its main travel mode (mode), from the duration of its segments
  together, its water crossings left out (RouteSegment.waterCrossing, each with its own difficulty).
  """
  difficulty: RouteDifficulty
  """
  Since v128.0.0 (D-408): its estimated duration, in seconds, when it does not follow the streets and paths (snapped
  false): its metres at 5 km/h on foot and 15 km/h by bicycle, told "estimated"; null when it follows them (seconds) or
  when its length is unknown. One name per concept: seconds is the duration measured along the ways. Since v131.0.0
  (D-413): the sum of the estimatedSeconds of its segments, its water crossings left out (the speeds map.routeSpeeds,
  contracts/map.md § Route recordings).
  """
  estimatedSeconds: Int
  """
  Since v128.0.0 (D-408): its route surfaces along the streets and paths it follows (snapped true), each with its
  metres, the longest first, from the routing (contracts/map.md § The explore filter); empty when it does not follow
  them.
  """
  surfaces: [RouteSurfaceShare!]!
}

"""
Since v128.0.0 (D-408, routes.feature): the route difficulty of a route.
"""
enum RouteDifficulty {
  DIFFICULT
  EASY
  MODERATE
}

"""
Since v128.0.0 (D-408, routes.feature): a route surface: PAVED (asphalt, concrete, paving), COBBLESTONES (cobblestones,
setts, rough paving), GRAVEL (gravel, compacted), UNPAVED (earth, grass, a path).
"""
enum RouteSurface {
  COBBLESTONES
  GRAVEL
  PAVED
  UNPAVED
}

"""
Since v128.0.0 (D-408): a route surface and its share of the length of a route.
"""
type RouteSurfaceShare {
  """
  The route surface.
  """
  surface: RouteSurface!
  """
  The metres of the route along it.
  """
  metres: Int!
}

"""
A route as drawn or snapped (route), to keep with a universe event. Since v131.0.0 (D-413): "segments" gives its route
segments (null: one segment in "mode"); "recorded" tells a line recorded on a phone (route-recording.feature),
simplified by the app as a line drawn by hand; "ascent" and "descent" sent by the app (the barometer of the phone) are
kept only where the elevation of the ground is not known (contracts/map.md § Route recordings).
"""
input RouteInput {
  ascent: Int
  descent: Int
  line: [PointInput!]
  """
  The meeting point; null when none.
  """
  meetingPoint: PlaceInput
  metres: Int
  mode: RouteMode!
  points: [PointInput!]!
  seconds: Int
  snap: Boolean
  snapped: Boolean
  stages: [StageInput!]
  """
  Since v92.1.0: a loop (false when not given). A line drawn by hand is simplified by the app, keeping its shape (5
  metres by default, a setting of the platform team), to at most 1,000 points before it is sent, with handDrawn
  true (ROUTE_INVALID beyond; 100 points placed point by point). Since v131.0.0 (D-413): at most 2,000 points, drawn
  by hand, recorded or placed point by point, and 1,000 kilometres.
  """
  loop: Boolean
  """
  Since v92.1.0: a line drawn by hand or imported, up to 1,000 points (false when not given: 2 to 100 points). Since
  v131.0.0 (D-413): up to 2,000 points either way.
  """
  handDrawn: Boolean
  """
  Since v131.0.0 (D-413): the route segments, 1 to 100, the first from the point 0, each "from" after the one before
  (ROUTE_INVALID otherwise); null: one segment in mode. snap true with a segment that is not on foot nor by bicycle:
  ROUTE_SNAP_NOT_OFFERED, on saveMapRoute and on the route of a universe event (createUniverseEvent,
  changeUniverseEvent) alike; a snapping that cannot be followed for a mode that offers it keeps the line as drawn
  (snapped false), as before.
  """
  segments: [RouteSegmentInput!]
  """
  Since v131.0.0 (D-413): a line recorded on a phone (route-recording.feature), a free line (false when not given).
  """
  recorded: Boolean
  """
  Since v131.0.0 (D-413, route-recording.feature): the posts of the owner attached to the line, 0 to 60, each at an
  index within points (ROUTE_INVALID otherwise; POST_NOT_FOUND for a post that is not the owner's); given only with the
  first save of a route recording (recorded true and no id: ROUTE_INVALID otherwise), the one moment a photo or a clip
  is attached; null: kept as they are when a route is changed, none for a new one.
  """
  posts: [RoutePostInput!]
}

"""
Since v131.0.0 (D-413, route-recording.feature): a post placed on the line of a route: the index, in Route.points, of
the point where its photo or its clip was taken, and the post. The post keeps its own place, rounded as any placed post
(placed-posts.feature); only the route knows that point, which its line already shows. As an argument:
RoutePostInput.
"""
type RoutePost {
  """
  The index of its point in Route.points.
  """
  index: Int!
  """
  The post.
  """
  postId: ID!
}

"""
Since v131.0.0 (D-413): a post placed on the line of a route, to save.
"""
input RoutePostInput {
  index: Int!
  postId: ID!
}

"""
Since v131.0.0 (D-413, routes.feature): a route segment, from its point "from" (an index in Route.points) up to the
next segment, in its travel mode; its length, its estimated duration (its metres at the speed of its travel mode, the
setting map.routeSpeeds; null when it follows the ways, its duration then in Route.seconds) and its route difficulty
by the thresholds of its travel mode; waterCrossing true for a segment on water (PADDLE, BOAT, SWIM) in a route that has
a segment on land, counted apart: Route.estimatedSeconds and Route.difficulty leave it out, and the apps show it apart.
"""
type RouteSegment {
  """
  The index, in Route.points, of its first point.
  """
  from: Int!
  """
  Its travel mode.
  """
  mode: RouteMode!
  """
  Its length, in metres; null when unknown.
  """
  metres: Int
  """
  Its estimated duration, in seconds; null when it follows the ways or when its length is unknown.
  """
  estimatedSeconds: Int
  """
  Its route difficulty for its travel mode; null when its length is unknown.
  """
  difficulty: RouteDifficulty
  """
  Whether it is a water crossing, counted apart.
  """
  waterCrossing: Boolean!
}

"""
Since v131.0.0 (D-413): a route segment to save: "from", the index in RouteInput.points of its first point, and its
travel mode "mode".
"""
input RouteSegmentInput {
  from: Int!
  mode: RouteMode!
}

"""
Since v131.0.0 (D-413): a sample of an elevation profile: its distance from the start of the route, in metres, and the
elevation there, in metres above the sea.
"""
type ElevationSample {
  """
  Its distance from the start, in metres.
  """
  metres: Int!
  """
  The elevation there, in metres above the sea.
  """
  elevation: Int!
}

"""
Since v131.0.0 (D-413, route-recording.feature): the figures of the route recording a route was saved from: its moving
time (its pauses left out) and its total time, in seconds; never when it started, which the platform does not keep.
Served to the owner of the route only.
"""
type RouteRecordingFigures {
  """
  Its moving time, in seconds.
  """
  movingSeconds: Int!
  """
  Its total time, in seconds, its pauses included (86,400 at most).
  """
  totalSeconds: Int!
}

"""
Since v131.0.0 (D-413): the figures of a route recording, sent with the route saved from it (MapRouteInput.recording):
movingSeconds 0 to totalSeconds, totalSeconds 1 to 86,400 (ROUTE_INVALID otherwise).
"""
input RouteRecordingFiguresInput {
  movingSeconds: Int!
  totalSeconds: Int!
}

"""
How a route is travelled: on foot or by bicycle. Since v131.0.0 (D-413, routes.feature), its travel mode: on foot
(FOOT without more, WALK, RUN, HIKE), by bicycle (BICYCLE without more, ROAD_BICYCLE, MOUNTAIN_BICYCLE, GRAVEL_BICYCLE),
HORSE (on horseback), WHEELCHAIR (in a wheelchair), on snow (ALPINE_SKI, CROSS_COUNTRY_SKI, SKI_TOURING, SNOWSHOES), on
water (PADDLE "kayak or paddle", BOAT "sail or boat", SWIM "open-water swim"); only the modes on foot and by bicycle
follow the streets and paths (snap). A client shows a value it does not know as FOOT. The live share of a message meet-up
(meetUpMode) takes FOOT and BICYCLE only, as before (POSITIONS_INVALID); route(snap: true) takes the modes on foot and
by bicycle only (ROUTE_SNAP_NOT_OFFERED).
"""
enum RouteMode {
  ALPINE_SKI
  BICYCLE
  BOAT
  CROSS_COUNTRY_SKI
  FOOT
  GRAVEL_BICYCLE
  HIKE
  HORSE
  MOUNTAIN_BICYCLE
  PADDLE
  ROAD_BICYCLE
  RUN
  SKI_TOURING
  SNOWSHOES
  SWIM
  WALK
  WHEELCHAIR
}

"""
A stage of a route (as an argument: StageInput): at its point "index", named 1 to 60 visible characters.
"""
type Stage {
  """
  Its index among the points of the route.
  """
  index: Int!
  """
  The name of the stage.
  """
  name: String!
  """
  The post it holds (since v92.1.0: a video, an image or a text, that the caller reads); null when none.
  """
  postId: ID
}

"""
A stage of a route.
"""
input StageInput {
  index: Int!
  """
  The name of the stage input.
  """
  name: String!
  """
  Since v92.1.0: the post it holds (POST_NOT_FOUND).
  """
  postId: ID
}

"""
The universe territory of a public universe of the first level (contracts/map.md § The universe
territory): an open administrative boundary of the cartography ("id" the id of its PlaceMatch,
"kind" its kind such as "boundary:administrative") or a circle ("id" null, "kind" "circle",
"center" and "radius"; "name" the name of the place at its center).
"""
type Territory {
  """
  Its center.
  """
  center: Point
  """
  The identifier of the territory.
  """
  id: String
  """
  The kind of the territory.
  """
  kind: String!
  """
  The name of the territory.
  """
  name: String!
  """
  Its radius.
  """
  radius: TerritoryRadius
}

"""
A universe territory chosen: a boundary (boundaryId, the id of its place) or a circle (center and radius).
"""
input TerritoryChoiceInput {
  boundaryId: String
  """
  Its center.
  """
  center: PlaceInput
  """
  The kind of the territory choice input.
  """
  kind: String
  """
  The name of the territory choice input.
  """
  name: String
  """
  Its radius.
  """
  radius: TerritoryRadius
}

"""
The eight radii of a circle as a universe territory (since v49.8.0): 150 m to 25 km.
"""
enum TerritoryRadius {
  KM1
  KM10
  KM25
  KM2_5
  KM5
  M150
  M250
  M500
}

"""
The zone of a universe event: a circle around "center" of one of five radii, shown instead of the
point of its place until the place is revealed: at "revealAt" (before the start; at the start
when the start moved before it; without it, at the start), or at once to the attendees only
("revealToAttendees"). As an argument (ZoneInput): with the hidden "place" (its name) and its
"point" (within the circle), required there; served, "place" and "point" are always null.
"""
type Zone {
  """
  Its center.
  """
  center: Point!
  """
  The place.
  """
  place: String
  """
  The point (WGS 84).
  """
  point: Point
  """
  Its radius.
  """
  radius: ZoneRadius!
  """
  When its point is revealed; null when never or already.
  """
  revealAt: AWSDateTime
  """
  Whether its point is revealed to the attendees only.
  """
  revealToAttendees: Boolean!
}

"""
The zone of a universe event: its center, radius, place, and when its point is revealed.
"""
input ZoneInput {
  """
  Its center.
  """
  center: PointInput!
  """
  The place.
  """
  place: String
  """
  The point (WGS 84).
  """
  point: PointInput
  """
  Its radius.
  """
  radius: ZoneRadius!
  revealAt: AWSDateTime
  revealToAttendees: Boolean
}

"""
