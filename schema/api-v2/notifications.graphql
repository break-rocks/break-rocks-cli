"""
A sanction received (SANCTION_POST_REMOVAL, SANCTION_POSTING_BAN): its id (mySanctions, where
it is appealed), the articles of the charter it cites (none for an automatic posting ban
without one), a posting ban's days and end, when its appeal closes.
A platform measure received (PLATFORM_MEASURE, since v49.8.0): what was done ("action":
UNIVERSE_TERRITORY_REMOVAL, the removal of the universe territory of "universe", named in
"subject"), the article of the platform rules applied, the statement of reasons, and whether it
was decided automatically (false: a human decided it).
"""
type NotificationMeasure {
  """
  The measure taken.
  """
  action: String!
  """
  The article of the platform rules cited; null when none.
  """
  article: Int
  """
  Whether the measure was taken by automated means.
  """
  automated: Boolean!
  """
  The statement of reasons.
  """
  statement: String!
}

"""
A meet-up where a notification tells it: its time, place and title; a change or a cancellation told as a
message.
"""
type NotificationMeetUp {
  """
  The time of the meet-up.
  """
  at: AWSDateTime!
  """
  Whether it is cancelled.
  """
  cancelled: Boolean!
  """
  Whether the meet-up was changed.
  """
  changed: Boolean!
  """
  The place of the meet-up.
  """
  place: Place!
  """
  Its title; null when none.
  """
  title: String
}

"""
The newest first; "unread": the notifications of the account not read.
"""
type NotificationPage {
  """
  The notification items of this page.
  """
  items: [Notification!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
  """
  The unread messages or items.
  """
  unread: Int!
}

"""
The sanction a notification tells about.
"""
type NotificationSanction {
  """
  APPEAL_DECIDED: what the appeal decided (the sanction as it is now: "days" and "endsAt" after a reduction).
  """
  appealOutcome: AppealOutcome
  """
  Until when the sanction can be appealed.
  """
  appealableUntil: AWSDateTime!
  """
  The articles of the charter cited, in increasing order.
  """
  articles: [Int!]!
  """
  Whether the platform gave it automatically.
  """
  automatic: Boolean!
  """
  The number of days.
  """
  days: Int
  """
  When it ends.
  """
  endsAt: AWSDateTime
  """
  Since v50.1.0: the hours of a writing ban in a public channel.
  """
  hours: Int
  """
  The identifier of the notification sanction.
  """
  id: ID!
  """
  The kind of the notification sanction.
  """
  kind: SanctionKind!
}

"""
The notification settings of the caller: its notification categories, the mentions and replies from followed
accounts only, the do-not-disturb hours, the email fallback.
"""
type NotificationSettings {
  """
  The setting of each notification category.
  """
  categories: [NotificationCategorySetting!]!
  """
  The do-not-disturb hours; null when none.
  """
  doNotDisturb: DoNotDisturb
  """
  The email fallback (since specs v64.0.0, D-168): false by default; set by setSettings.
  """
  emailFallback: Boolean!
  """
  Whether only the mentions and replies of the accounts the caller follows notify it.
  """
  mentionsAndRepliesFromFollowedOnly: Boolean!
}

"""
The notification settings to change; a field not given stays. Account security cannot be turned off
(NOTIFICATION_CATEGORY_MANDATORY), only its push. emailFallback: the direct messages and the invitations no
device received for 24 hours, summed up by email, 1 a day at most (a delegated agent:
DELEGATED_AGENT_NOT_ALLOWED).
"""
input NotificationSettingsInput {
  categories: [NotificationCategorySettingInput!]
  mentionsAndRepliesFromFollowedOnly: Boolean
  doNotDisturb: DoNotDisturbInput
  emailFallback: Boolean
}

"""
A copy of a post or a message where a notification shows it (the first 140 characters);
