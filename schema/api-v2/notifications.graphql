"""
The settings of the map of the reader (since D-350, map-markers.feature; Me › Privacy › the settings of the map), kept
with the account, the same on all its devices: densityMarkDisplay, how the density marks are drawn (GLOW_AND_KINDS by
default); placeNameDisplay, which places with a place experience show their name (BY_ZOOM by default); mapThumbnails, which
map markers with a photo are drawn with it (WITH_PHOTO by default since D-356). A person who is not signed in reads the map with
these defaults.
"""
type MapSettings {
  """
  How the density marks are drawn; GLOW_AND_KINDS by default.
  """
  densityMarkDisplay: DensityMarkDisplay!
  """
  Which places with a place experience show their name; BY_ZOOM by default.
  """
  placeNameDisplay: PlaceNameDisplay!
  """
  Which map markers with a photo are drawn with it; WITH_PHOTO by default since D-356 (a stored FIRST_ONES or ALL is
  read as WITH_PHOTO).
  """
  mapThumbnails: MapThumbnails!
}

"""
The settings of the map to change (setSettings map, since D-350): a field not given stays.
"""
input MapSettingsInput {
  densityMarkDisplay: DensityMarkDisplay
  placeNameDisplay: PlaceNameDisplay
  mapThumbnails: MapThumbnails
}

"""
The density mark display (since D-349, D-350; map-markers.feature): GLOW_AND_KINDS, the default, a density glow with
the label of its kinds from the glow threshold, its number below it; NUMBER, the number of every density mark,
without a density glow, whatever the glow threshold. An app that does not know a value reads GLOW_AND_KINDS.
"""
enum DensityMarkDisplay {
  GLOW_AND_KINDS
  NUMBER
}

"""
The place name display (since D-349, D-350; map-markers.feature): BY_ZOOM, the default (under the zoom 9 the first 5
places among the map highlights, from the zoom 9 to under 15 each map highlight with how lively it is, from the zoom
15 every place with the stack of its authors); ALL_FROM_ZOOM_9, the name of every place drawn from the zoom 9; NONE,
no name and no "very lively place" nor "lively place". An app that does not know a value reads BY_ZOOM.
"""
enum PlaceNameDisplay {
  ALL_FROM_ZOOM_9
  BY_ZOOM
  NONE
}

"""
The map thumbnails (since D-349, D-350, D-356; map-markers.feature): since D-356, two choices: WITH_PHOTO, the
default, each map marker the marker budget draws that has a photo drawn with it; NONE, each of them as a compact map
marker. A universe event, a public universe and a route have no photo and keep their own map marker. FIRST_ONES and
ALL, the choices before D-356, are deprecated (AppSync serves @deprecated on fields only) and kept until no app
writes them: the social platform stores and returns WITH_PHOTO in their place. An app that does not know a value reads
WITH_PHOTO.
"""
enum MapThumbnails {
  ALL
  FIRST_ONES
  NONE
  WITH_PHOTO
}

"""
A preset of the camera retouches (camera-filters.feature; skin smoothing, blemish removal, dark circle softening, eye
and teeth brightening, face slimming, from 0 to 100): OFF, every slider at 0; NATURAL, the default, 35, 60, 30, 15
and 0; GLOW, 50, 70, 40, 25 and 0 (contracts/media.md). Face slimming at most 15 for an adult, 0 for a minor.
"""
enum CameraRetouchPreset {
  GLOW
  NATURAL
  OFF
}

