  """
  openBillingPortal(returnPath: String, requestId: ID!): PaymentPage

  """
  A Stripe Checkout session paying a gift code of "months" (1, 3 or 12) of "tier" (X2, X10) once;
  the code is made when Stripe confirms the payment (myGiftCodes); back to "returnPath" (default
  /me/gift-codes). Errors: GIFT_CODE_NOT_OFFERED (no price), PROVIDER_NOT_AVAILABLE, RETURN_PATH_INVALID,
  GIFT_CODE_LIMIT_REACHED (since specs v61.0.0: a payer holds at most 500 euros, or 500 US dollars, of
  unused gift codes, the accounts paying with the same card counting as one payer).
  """
  buyGiftCode(currency: String, months: Int!, returnPath: String, tier: PaidTier!, requestId: ID!): PaymentPage

  """
  A larger plan applies at once, the difference paid pro rata for the rest of the paid period
  (PAYMENT_FAILED: unchanged); a smaller one from the end of the paid period, without refund, the
  delegated agents beyond it deactivated then; the plan in force again cancels a smaller one
  scheduled. Errors: PLAN_NOT_OFFERED, SUBSCRIPTION_NOT_FOUND, SUBSCRIPTION_PAST_DUE.
  """
  changeOperatorPlan(delegatedAgents: Int!, requestId: ID!): OperatorPlan

  """
  The owner changes a tier: a rise applies 30 days later, a decrease at once. Errors: as
  offerSubscriptionTier, SUBSCRIPTION_TIER_NOT_FOUND.
  """
  changeSubscriptionTier(input: SubscriptionTierOfferInput!, tierId: ID!, universe: String!, requestId: ID!): SubscriptionTier

  """
  The owner offers a subscription tier (at most 3). Errors: ONLY_OWNER_OFFERS_SUBSCRIPTION_TIERS,
  SUBSCRIPTION_TIERS_LIMIT, TIER_PRICE_OUT_OF_RANGE, TIER_PRICE_REQUIRED, CURRENCY_NOT_SUPPORTED.
  """
  offerSubscriptionTier(input: SubscriptionTierOfferInput!, universe: String!, requestId: ID!): SubscriptionTier

  """
  The reader uses a gift code, on the web or in the apps: its tier for its months; since specs
  v60.0.0 a gift code of the paid tier in force extends its paid period, one of a higher tier
  applies at once and the paid period in progress resumes after it; since v61.2.0 one of a lower
  tier waits for the end of the paid period in progress ("next"), and an automatic renewal is paused
  during the period the gift code gives. Returns the subscription in force. Errors:
  GIFT_CODE_NOT_FOUND, GIFT_CODE_ALREADY_USED, GIFT_CODE_EXPIRED, GIFT_CODE_REFUNDED,
  SUBSCRIPTION_EXISTS (a renewal waiting for its payment; a paid period already following the one in force).
  """
  redeemGiftCode(code: String!, requestId: ID!): PaidSubscription

  """
  Its payer asks for the refund of an unused gift code within 14 days of the purchase. Errors:
  GIFT_CODE_NOT_FOUND, GIFT_CODE_ALREADY_USED, REFUND_PERIOD_OVER.
  """
  refundGiftCode(code: String!, requestId: ID!): GiftCode

  """
  Off: the subscription ends at "paidUntil" (no refund); on again before then: it renews. Errors:
  SUBSCRIPTION_NOT_FOUND. The argument is "enabled" (contracts/payments.md says "on", which AppSync refuses as
  a name).
  """
  setAutomaticRenewal(enabled: Boolean!, requestId: ID!): PaidSubscription

  """
  The subscriber chooses the billing day of a subscription paid by card (once per paid period).
  Errors: BILLING_DAY_INVALID, BILLING_DAY_NOT_AVAILABLE, BILLING_DAY_ALREADY_CHANGED (errorInfo
  changeableFrom), BILLING_DAY_PAYMENT_FAILED, SUBSCRIPTION_NOT_FOUND.
  """
  setBillingDay(input: BillingDayChoiceInput!, subscription: SubscriptionRefInput!, requestId: ID!): BillingDay

  """
  Off: the plan ends at "paidUntil" (no refund); on again before then: it renews. Errors:
  SUBSCRIPTION_NOT_FOUND.
  """
  setOperatorPlanRenewal(enabled: Boolean!, requestId: ID!): OperatorPlan

  """
  Off: the subscription ends at "paidUntil", without refund; on again before then: it renews. Errors:
  SUBSCRIPTION_NOT_FOUND.
  """
  setTierSubscriptionRenewal(enabled: Boolean!, universe: String!, requestId: ID!): TierSubscription

  """
  A Stripe Checkout session for the plan of "delegatedAgents" (10, 100, 1,000 or, since specs
  v61.0.0, any multiple of 1,000, paid by blocks of 1,000), for "interval"
  (MONTH by default; YEAR, 10 times the monthly price, since specs v60.0.0): the command-line
  client opens "url" in the browser; the plan starts when Stripe confirms the payment (webhook),
  at once over a period paid with x402 (not refunded); a plan of more than 10,000 rises by 1,000
  delegated agents each hour beyond 10,000 (delegatedAgentAllowance). Errors: PLAN_NOT_OFFERED (another
  number), SUBSCRIPTION_EXISTS (a plan is live: changeOperatorPlan), PROVIDER_NOT_AVAILABLE,
  CURRENCY_NOT_SUPPORTED, RETURN_PATH_INVALID, INSTANT_PAYMENT_NOT_ALLOWED (a delegated agent).
  """
  startOperatorPlan(currency: String, delegatedAgents: Int!, interval: BillingInterval, returnPath: String, requestId: ID!): PaymentPage

  """
  A Stripe Checkout session (a subscription, the reader as payer and beneficiary): the app opens
  "url", Stripe comes back to "returnPath" (default /me/subscription) with "?checkout=success" or
  "cancel". The subscription starts when Stripe confirms the payment (webhook), never from the
  return page. Errors: SUBSCRIPTION_EXISTS, PROVIDER_NOT_AVAILABLE, CURRENCY_NOT_SUPPORTED,
  RETURN_PATH_INVALID.
  """
  startSubscription(automaticRenewal: Boolean!, currency: String, interval: BillingInterval!, returnPath: String, tier: PaidTier!, requestId: ID!): PaymentPage

  """
  A subscription to a tier, on the web (a Checkout of the payment provider): the membership starts
  when the payment is confirmed, never from the return page; without the express consent, the access
  and the first payment 14 days later ("accessFrom"). Errors: JOINS_BY_SUBSCRIPTION_ONLY (not joined by
  subscription), SUBSCRIPTION_TIER_NOT_FOUND, BANNED_FROM_UNIVERSE, TIER_SUBSCRIPTION_EXISTS,
  CONDITIONS_NOT_ACCEPTED, DELEGATED_AGENT_CANNOT_SUBSCRIBE, CURRENCY_NOT_SUPPORTED, PROVIDER_NOT_AVAILABLE,
  RETURN_PATH_INVALID.
  """
  startTierSubscription(input: TierSubscriptionStartInput!, universe: String!, requestId: ID!): PaymentPage

