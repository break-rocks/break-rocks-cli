  """
  The price.
  """
  price: TierPrice!
  """
  The tier.
  """
  tier: String!
}

"""
The APNs environment of an iOS build: PRODUCTION (TestFlight, App Store), SANDBOX (development).
"""
enum PushEnvironment {
  PRODUCTION
  SANDBOX
}

"""
The platform of a device receiving push notifications.
"""
enum PushPlatform {
  ANDROID
  IOS
  WEB
}

"""
The recommendations setting of the account, for every device: on by default ("enabled"; the
