# The place experiences, the first slice of the experiences (since v104.2.0, decided on 2026-11-11): additions only.
# features/experiences/experience-feats.feature; contracts/experiences.md (the template format breakrocks.experience/3,
# the states, the counts, the map layer); contracts/urls.md § Place experiences. The operations are in base.graphql (Query and
# Mutation, group "experiences"). Words: the glossary says "experience instance" and "experience feat"; the operations
# keep the word "run" of the experiences drafts (startPlaceFeatRun, endPlaceFeatRun), the types the glossary words.
# Cost at rest (expand only): a place experience is one item (its template in S3 when large); an experience instance one item
# holding its experience feat; a published experience feat one item in the gallery of its place experience (by date) plus its
# post; the place experience counts are sharded counters per place experience (people, today) and one marker per place experience and
# person (counted once); nothing is polled, nothing is pushed in real time in this slice.

"""
A place experience (glossary: place experience): an experience template of the template kind "place-feat", bound to one point of
interest, done by many people the same way (contracts/experiences.md § The template).
"""
type PlaceFeat {
  """
  Its identifier (<cell>-<UUIDv7>).
  """
  id: ID!
  """
  Its address ("%paris*arc-photo"): its host universe, "*" and its name.
  """
  address: String!
  """
  Its canonical URL ("/u/paris/e/arc-photo").
  """
  url: AWSURL!
  """
  Its name, by the rules of a channel name ("arc-photo").
  """
  name: String!
  """
  Its title in the language of the caller, else in English (since D-409, the source of its translation, PLACE_FEAT; until
  then, in its first language) ("A photo in front of the Arc de Triomphe").
  """
  title: String!
  """
  What to do, in the language of the caller, else in English (since D-409), at most 500 visible characters.
  """
  instruction: String!
  """
  The version of its template ("1.0"): an experience instance keeps the version it started with.
  """
  templateVersion: String!
  """
  Its place: the point of interest it is bound to.
  """
  place: PlaceFeatPlace!
  """
  The address of its host universe ("%paris"), where the platform team seeded it.
  """
  hostUniverse: String!
  """
  The addresses of the public universes that adopted it, the 20 most recent (display only; no limit to adopting).
  """
  adoptedBy: [String!]!
  """
  The number of the public universes that adopted it.
  """
  adoptedByCount: Int!
  """
  The media kinds its one step takes: IMAGE (a photo) and VIDEO (a clip, at most 3 minutes).
  """
  mediaKinds: [MediaKind!]!
  """
  The evidence policies it accepts: SELF_REPORTED (the default) and NEAR_PLACE.
  """
  evidencePolicies: [FeatProvenance!]!
  """
  The photo rules of its place, in the language of the caller, else in English (since D-409), shown before an experience instance starts; empty when
  none.
  """
  photoRules: [String!]!
  """
  The place warnings of its place (a road, a ledge), in the language of the caller, else in English (since D-409), shown before an experience instance
  starts; empty when none.
  """
  placeWarnings: [String!]!
  """
  Its place experience count.
  """
  counts: PlaceFeatCounts!
  """
  True once the platform team withdrew it: it starts no experience instance (PLACE_FEAT_WITHDRAWN); its published
  experience feats stay.
  """
  withdrawn: Boolean!
  """
  The experience instance of the caller in progress for this place experience; null when none.
  """
  myInstanceInProgress: ExperienceInstance
}

"""
The point of interest of a place experience.
"""
type PlaceFeatPlace {
  """
  The identifier of the point of interest in the cartography (the placeId of PostPlaceInput).
  """
  placeId: String!
  """
  Its name in the language of the caller, else its local name.
  """
  name: String!
  """
  Its point (WGS 84): where every experience feat of the place experience is shown, never the position of a person.
  """
  point: Point!
  """
  Its map cell (H3, resolution 8).
  """
  mapCell: String!
}

"""
The place experience count (glossary: place experience count): people counted once, whatever the visibility of their experience
feats, never named; a count under 3 people is null (k-anonymity, as a map presence group).
"""
type PlaceFeatCounts {
  """
  The people who hold an experience feat of the place experience, whatever its visibility, minors included (the decision
  D-332 stays open); a person whose experience feats of it are all deleted is no longer counted; null under 3.
  """
  people: Int
  """
  The people who completed an experience instance of it today (since midnight in the time zone of the place), each
  once, only humans whose account is at least 30 days old, never a minor; refreshed every hour; null under 3.
  """
  today: Int
  """
  How lively its place is (glossary: lively place).
  """
  liveliness: PlaceLiveliness!
}

"""
How lively a place is, from the distinct people who completed an experience instance of one of its place experiences today
(one marker per place, person and local day; only humans whose account is at least 30 days old, never a minor): NONE
under 3 people, LIVELY from 3, VERY_LIVELY from 20 (settings of the platform team, experiences.md § Counts).
"""
enum PlaceLiveliness {
  LIVELY
  NONE
  VERY_LIVELY
}

"""
The provenance of an experience feat, which is also the evidence policy that accepted it: SELF_REPORTED (the human says
so; always for a photo or a clip chosen among the photos of the phone), NEAR_PLACE (a capture of the app camera during
the experience instance, the app having found the position of the device within 300 metres of the point of interest,
on the device; the position never sent). Set once at completion, never upgraded afterwards. LANDMARK_PROPOSED comes
later.
"""
enum FeatProvenance {
  NEAR_PLACE
  SELF_REPORTED
}

"""
The state of an experience instance: IN_PROGRESS, COMPLETED (it holds its experience feat), ABANDONED (it holds none).
"""
enum ExperienceInstanceState {
  ABANDONED
  COMPLETED
  IN_PROGRESS
}

"""
An experience instance of a place experience (glossary: experience instance; "run" in the operations), read by its human; by
a feat invitee or a reader of the post of its published experience feat, the same without the fields kept for its
human (each description says). Whether its human is a minor is read at every reading, from their current status.
"""
type ExperienceInstance {
  """
  Its identifier (<cell>-<UUIDv7>), the id of its address ("%paris*arc-photo!id=<id>").
  """
  id: ID!
  """
  Its place experience; null for every reader but its human when its human is a minor (neither the place nor the date of a
  minor's experience feat is ever shown to another reader).
  """
  placeFeat: PlaceFeat
  """
  The version of the template it started with.
  """
  templateVersion: String!
  """
  Its human.
  """
  account: AccountRef!
  """
  Its state.
  """
  state: ExperienceInstanceState!
  """
  When it started; null for a reader other than its human.
  """
  startedAt: AWSDateTime
  """
  When it ended; null while in progress, and for a reader other than its human.
  """
  endedAt: AWSDateTime
  """
  Its experience feat; null unless COMPLETED.
  """
  feat: ExperienceFeat
}

"""
An experience feat (glossary: experience feat): the accepted result of a completed experience instance.
"""
type ExperienceFeat {
  """
  When it was accepted (the completion of its experience instance); null for a feat invitee, and for every reader but
  its human when its human is a minor.
  """
  acceptedAt: AWSDateTime
  """
  Its provenance.
  """
  provenance: FeatProvenance!
  """
  Its media kind: IMAGE or VIDEO.
  """
  mediaKind: MediaKind!
  """
  The URL of its media on the media CDN, signed for 1 hour while it is not published; for a published one, the media
  of its post.
  """
  mediaUrl: AWSURL!
  """
  Its visibility.
  """
  visibility: FeatVisibility!
  """
  Its feat invitees, 20 at most, each a connected account of its human (removed when the connection ends: removed, or a
  block); empty for a reader other than its human.
  """
  invitees: [AccountRef!]!
  """
  Its post once published; null otherwise.
  """
  postId: ID
  """
  The address of the universe of its post once published; null otherwise.
  """
  universe: String
  """
  Where its post is placed: POINT_OF_INTEREST, CITY or NONE; null unless published. Read as NONE for a
  POINT_OF_INTEREST once its human is a minor.
  """
  placement: FeatPlacement
  """
  The address of the universe whose monogram it carries: the universe of its post when it hosts or adopted the place
  feat; null otherwise.
  """
  monogramUniverse: String
  """
  True when its human said "I am in it" when publishing.
  """
  inIt: Boolean!
}

"""
The visibility of an experience feat: PRIVATE (its human only, the default), INVITED (its human and its invitees),
PUBLISHED (the readers of its post; its invitees too).
"""
enum FeatVisibility {
  INVITED
  PRIVATE
  PUBLISHED
}

"""
A published experience feat in a feat gallery.
"""
type PublishedFeat {
  """
  Its experience instance (its id, its human, its place experience, its experience feat).
  """
  instance: ExperienceInstance!
  """
  Its post (the photo, or the clip), as the caller reads it.
  """
  post: Post!
}

"""
A page of a feat gallery.
"""
type PublishedFeatPage {
  """
  The published experience feats of the page.
  """
  items: [PublishedFeat!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
A page of the experience instances of the caller (My feats).
"""
type ExperienceInstancePage {
  """
  The experience instances of the page.
  """
  items: [ExperienceInstance!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
The order of a feat gallery: NEWEST (by the date of publication, the default), MOST_REACTED (by the interest of the
post, then the newest).
"""
enum FeatGalleryOrder {
  MOST_REACTED
  NEWEST
}

"""
Where the post of a published experience feat is placed (experience-feats.feature): POINT_OF_INTEREST (an adult only,
the default for an adult: the point of interest of the place experience, in the feat gallery and the pin cluster; until D-393,
a clip also a placed video there; since D-393, never drawn as a placed post nor a placed video, its experience feat
showing by its place only), NONE ("not on the map": not placed, neither in the feat gallery nor the pin cluster, still
counted; the default for a minor) or CITY (a minor only: the city of the point of interest, never closer, never in the
feat gallery nor the pin cluster). Another combination: INVALID_REQUEST.
"""
enum FeatPlacement {
  CITY
  NONE
  POINT_OF_INTEREST
}

"""
A place of the experiences layer: a point of interest with a place experience, its pin cluster and how lively it is.
"""
type MapPlaceFeats {
  """
  The place.
  """
  place: PlaceFeatPlace!
  """
  The identifiers of its place experiences the layer shows (with a universe filter, those that universe hosts or adopted),
  5 at most.
  """
  placeFeatIds: [ID!]!
  """
  The number of the experience feats of its place experiences published in public universes at the point of interest (a
  minor's and one "not on the map" left out): the number of its pin cluster.
  """
  publishedCount: Int!
  """
  Since D-414 (map-markers.feature): the number its round carries: the largest place experience count among its place experiences
  (placeFeatIds), never a sum, as its place card shows them (the people who hold an experience feat of one, whatever its
  visibility); in the files of the map highlights too. The apps show it from 3 people, the display threshold of the
  place experience count, and no number below. 0 when none.
  """
  placeFeatCount: Int!
  """
  3 authors at most of those published experience feats, chosen among all their authors (since D-352): the connected
  accounts of the caller first, then the accounts the caller follows, then the most recent; never an account the
  caller blocked or that blocked the caller; empty when none (and for a caller not signed in: the most recent only).
  """
  preview: [FeatAuthorPreview!]!
  """
  How lively the place is.
  """
  liveliness: PlaceLiveliness!
  """
  Since v114.3.0 (map-markers.feature, D-349; contracts/map.md § "Since v114.3.0"): the photo of the last published
  experience feat of the place, drawn in its round with the place experience flag and shown on its place card. That experience feat
  is chosen among those publishedCount counts (published in public universes and placed at the point of interest),
  never one it does not count; read with universe, the last published experience feat of that universe at the place,
  as publishedCount; without universe, of the whole place. The photo is the first image of
  its post (Post.images, the first), on the media CDN, as the URL of one variant of that image that exists
  (<url>/<width>.webp, a width among its Image.widths): the smallest width served of at least 192 pixels (twice the 96
  pixels of a map marker), else, for an image narrower than that, the largest width served; when that experience feat
  is a clip, the poster of the clip. The client reads this URL as given and never builds a URL nor asks a width of its
  own. The same image the post shows (an area hidden after posting stays hidden), under the same visibility rules as
  the post. It follows the last published experience feat: once that one is unpublished, removed or deleted, the next
  read answers the photo of the new last one. Null when the last published experience feat has neither an image nor a
  poster, and for a place without a published experience feat.
  """
  photoUrl: AWSURL
  """
  Since D-393 (decided on 2026-11-16; map-markers.feature, contracts/map.md § One map marker per place): the number of its
  place-folded posts, the "+N" of its round: the placed posts and the placed videos of public universes at its point of
  interest (MapPost.foldedPlaceId, the placeId of this place), the posts of published experience feats left out (they
  are counted in publishedCount), a content of a minor never (never at a point); read with universe, those of that
  universe, as publishedCount; since D-395, a post of a private universe never (never a place-folded post). The same
  for every reader: it may count the posts of an account of hiddenAccounts of the caller (the files are the same for
  everyone, D-347), which the section "Also here" of the place card leaves out (PlaceCard.alsoHere). 0 when none.
  """
  foldedCount: Int!
  """
  Since D-393: among foldedCount, the placed videos, so that the apps take them out of the count "videos" of the density
  mark of its child cell while they draw its round (contracts/map.md § One map marker per place). 0 when none.
  """
  foldedVideoCount: Int!
  """
  Since D-393: among foldedVideoCount, the placed videos with a vertical clip (the "clips" of the label of a density
  glow). 0 when none.
  """
  foldedClipCount: Int!
}

"""
An author shown on a pin cluster of the experiences layer.
"""
type FeatAuthorPreview {
  """
  The author (its profile picture, else its monogram).
  """
  account: AccountRef!
  """
  Its map avatar; null without one (the profile picture, else the monogram, is shown).
  """
  mapAvatar: MapAvatar
}

"""
How an experience instance ends (endPlaceFeatRun): COMPLETED, with its media, or ABANDONED.
"""
enum RunOutcome {
  ABANDONED
  COMPLETED
}

"""
What ends an experience instance (endPlaceFeatRun): instanceId; outcome COMPLETED or ABANDONED; for COMPLETED, mediaId
(an IMAGE or a VIDEO uploaded with requestMediaUpload, destination EXPERIENCE_FEAT) and provenance (SELF_REPORTED, or
NEAR_PLACE for a capture of the app camera during the experience instance found within 300 metres of the point of
interest; a provenance not in PlaceFeat.evidencePolicies: INVALID_REQUEST); for ABANDONED, neither (INVALID_REQUEST
otherwise).
"""
input EndPlaceFeatRunInput {
  instanceId: ID!
  outcome: RunOutcome!
  mediaId: ID
  provenance: FeatProvenance
}

"""
What publishes an experience feat (publishFeat): instanceId; universe, the address of the universe of the post, within
the rules of posting there; text, the text of the post (the rules of the text of a post), optional; inIt, "I am in it";
peopleShownAgreed, true when its human confirms that the people shown, other than themselves, agreed to be shown
(FEAT_NOT_PUBLISHABLE otherwise); placement (FeatPlacement; none: POINT_OF_INTEREST for an adult, NONE for a minor).
The form of the post follows its media as for any post: a vertical or square clip is seen among the posts and the
clips; a photo or a horizontal clip among the posts.
"""
input PublishFeatInput {
  instanceId: ID!
  universe: String!
  text: String
  inIt: Boolean!
  peopleShownAgreed: Boolean!
  placement: FeatPlacement
}

# Since v136.2.0 (D-423, D-424, decided by the user on 2026-11-17): the common envelope and the first slice, the route
# experience (engine route/1) and the simple challenge (engine challenge/1), behind the switch experiences.open.
# features/experiences/experience-addresses.feature, experience-instances.feature, simple-challenges.feature,
# route-experiences.feature, experience-rankings.feature, experience-moderation.feature; contracts/experiences.md (the
# envelope, the registry of experience engines, the experience template breakrocks.experience/4 and its JSON Schema, the
# evaluators and the test vectors). The place experiences keep their types above (ExperienceInstance, presence/3). The
# operations take typed arguments; JSON only carries the experience template (P-15), never an operation. Cost at rest
# (expand only): contracts/experiences.md § At rest.

"""
Since v136.2.0: an experience engine of the registry of experience engines (contracts/experiences/engines.json) and its
version: presence 3 (the place experiences), route 1, challenge 1, and since v136.5.0 visit 1. An app runs only the engine
versions it implements.
"""
type ExperienceEngine {
  """
  The name of the engine.
  """
  name: ExperienceEngineName!
  """
  Its version (an integer from 1).
  """
  version: Int!
}

"""
Since v136.2.0: the names of the experience engines: PRESENCE (the place experiences), ROUTE (the route experience),
CHALLENGE (the simple challenge; since D-461, at the version 2 also the simple challenge measured by the device); since
v136.5.0, VISIT (the visit experience); since D-461, MEETUP (the attendance meetup, contracts/experiences.md
§ Attendance meetups and the organizer code); since D-467, MULTIDAY (the multi-day challenge), ROUNDS (the multi-round
challenge), TOURNAMENT (the simple tournament) (contracts/experiences.md § Multi-day challenges, § Multi-round
challenges, § Simple tournaments). Since D-498, CONTEST (the judged contest, § Judged contests (contest/1)).
"""
enum ExperienceEngineName {
  CHALLENGE
  CONTEST
  MEETUP
  MULTIDAY
  PRESENCE
  ROUNDS
  ROUTE
  TOURNAMENT
  VISIT
}

"""
Since v136.2.0: the visibility of an experience: PRIVATE (its owner, the leadership for a universe, and, while a group
experience instance of it lasts, who reads the place of that experience instance), UNLISTED (whoever has its address; never listed nor
searched), PUBLIC (listed with its owner, found by the search of Explore, copied; after its experience check).
"""
enum ExperienceVisibility {
  PRIVATE
  PUBLIC
  UNLISTED
}

"""
Since v136.2.0: the experience warnings its creator declares, shown before a person starts or joins an experience
instance: PHYSICAL_EFFORT, RISKY_PLACE.
"""
enum ExperienceWarning {
  PHYSICAL_EFFORT
  RISKY_PLACE
}

"""
Since v136.2.0: what a simple challenge measures, and the measure of its ranking: COUNT (a counter, in its unit, 0 to
100,000), TIME (a timer, in seconds, within the hours of the experience instance), NONE (the proof alone; never a
ranking measure).
"""
enum ExperienceMeasure {
  COUNT
  NONE
  TIME
}

"""
Since v136.2.0: the order of an experience ranking: HIGHER_FIRST, LOWER_FIRST (the earlier measure first between equal
values).
"""
enum ExperienceRankingOrder {
  HIGHER_FIRST
  LOWER_FIRST
}

"""
Since v136.2.0: who validates an experience proof of a simple challenge: ORGANIZER (the experience organizer of a group
experience instance), PARTICIPANT_VOTE (the other experience participants, a proof vote), SELF_REPORTED (nobody; the
proof is optional). Nobody validates their own proof: without another validator, a success is self-reported. Since
D-461, DEVICE_MEASURED (challenge/2 only: nobody, the count is measured by the device; a count entered or changed by
hand is self-reported).
"""
enum ProofValidation {
  DEVICE_MEASURED
  ORGANIZER
  PARTICIPANT_VOTE
  SELF_REPORTED
}

"""
Since v136.2.0: the experience check of an experience made public (the check of D-422 for proposals): CHECKING (after
publishExperience(PUBLIC); the experience keeps its former visibility), PASSED (it is public), REFUSED (it stays as it
was; explanation read by its owner).
"""
enum ExperienceCheckStatus {
  CHECKING
  PASSED
  REFUSED
}

"""
Since v136.2.0: the last experience check of an experience, read by its owner (the leadership for a universe
experience); null for anyone else.
"""
type ExperienceCheck {
  """
  Its status.
  """
  status: ExperienceCheckStatus!
  """
  Why it was refused, in the language of the caller, else in English; null unless REFUSED.
  """
  explanation: String
  """
  True when the check gave no answer within 10 minutes: the version is not published, flagged to review by the platform
  team, whose review publishes or refuses it.
  """
  reviewPending: Boolean!
  """
  The version of the experience template checked ("2.0").
  """
  version: String!
}

"""
Since v136.2.0: an experience parameter of an experience template: what a reuse (the sign ":") may change.
"""
type ExperienceParameter {
  """
  Its key in a reuse ("count"); never "id".
  """
  key: String!
  """
  The field of the engine block it sets: "target" or "endsWithinHours" (challenge/1); since v136.5.0, "atLeast"
  (visit/1: the completion threshold); since D-449, "spanDays" (visit/1: the number of days, 1 to 30); since D-467,
  "target" (the target of the day) or "days" (the number of challenge days, 1 to 30) of a multi-day challenge.
  """
  field: String!
  """
  Its lowest value.
  """
  min: Int!
  """
  Its highest value. Since v136.5.0, for the parameter bound to atLeast of a visit experience, capped to the number of
  visit stages the caller sees (a value of a reuse above it is read as it, never refused).
  """
  max: Int!
  """
  Its value when a reuse does not give it.
  """
  default: Int!
}

"""
Since v136.2.0: one value of an experience parameter, in a reuse or in an experience instance.
"""
type ExperienceParameterValue {
  """
  The key of the experience parameter.
  """
  key: String!
  """
  Its value, within the bounds of the experience parameter.
  """
  value: Int!
}

"""
Since v136.2.0: an experience reuse ("*squats-100:count=50"), as resolveAddress reads it: the values of its experience
parameters, keys sorted (a key that is not an experience parameter, given twice, or a value out of its bounds:
EXPERIENCE_PARAMETERS_INVALID, as at a start).
"""
type ExperienceReuse {
  """
  The values given, the others taking their defaults.
  """
  values: [ExperienceParameterValue!]!
}

"""
Since v136.2.0: the engine block of a simple challenge (challenge/1), contracts/experiences.md § The experience
template.
"""
type ChallengeSetup {
  """
  What it measures: COUNT, TIME or NONE (since D-461, COUNT only when measuredBy is not PERSON).
  """
  measure: ExperienceMeasure!
  """
  Since D-461 (contracts/experiences.md § Device measures): how it is measured: PERSON (by hand, challenge/1), or a
  measuring means of the device (challenge/2).
  """
  measuredBy: ExperienceMeasuringMeans!
  """
  What is counted ("squats"), in the language of the caller, else in English; null unless COUNT.
  """
  unit: String
  """
  The target "at least" (a count, or seconds to hold); null when none.
  """
  targetAtLeast: Int
  """
  The target "at most" (seconds within which to do it, TIME only); null when none.
  """
  targetAtMost: Int
  """
  The media kinds a proof may be: IMAGE, VIDEO (a clip, 3 minutes at most); since D-461, empty for a simple challenge
  measured by the device (it takes none).
  """
  proofMedia: [MediaKind!]!
  """
  Who validates a proof.
  """
  proofValidation: ProofValidation!
  """
  An experience instance ends at the latest this many hours after it went in progress (1 to 168).
  """
  endsWithinHours: Int!
}

"""
Since D-461 (device-measures.feature, contracts/experiences.md § Device measures): how a simple challenge is measured:
PERSON (by hand: the counter, the timer or nothing, challenge/1), HEALTH_STEPS (the steps the device and a watch
connected to it recorded, read from its health data with the health consent of the person, for that experience instance only or for always),
VOICE_COUNT (the numbers the person says aloud), SOUND_COUNT (the repetitions of a sound), CAMERA_COUNT (the repetitions
of a movement in front of the camera). Everything is measured on the device; only the count leaves it.
"""
enum ExperienceMeasuringMeans {
  CAMERA_COUNT
  HEALTH_STEPS
  PERSON
  SOUND_COUNT
  VOICE_COUNT
}

"""
Since D-461 (device-measures.feature): the source of a measure sent for a simple challenge measured by the device
(ExperienceMeasureInput.measuredBy): DEVICE (the count as the measuring means of the device measured it, sent as it
is), PERSON (a count entered or changed by hand, or the device could not count).
"""
enum MeasureSource {
  DEVICE
  PERSON
}

"""
Since D-467 (multi-day-challenges.feature, contracts/experiences.md § Multi-day challenges): the engine block of a
multi-day challenge (multiday/1).
"""
type MultiDaySetup {
  """
  The number of challenge days, 1 to 30 (the value of the reuse is in ExperienceRun.parameters).
  """
  days: Int!
  """
  What each challenge day measures: COUNT or NONE (done by saying so).
  """
  measure: ExperienceMeasure!
  """
  How a count is measured: PERSON (by hand), or a measuring means of the device.
  """
  measuredBy: ExperienceMeasuringMeans!
  """
