"""
The images of a theme of format 1.
"""
type ThemeImages {
  """
  Its background.
  """
  background: ThemeImage
  """
  Its banner.
  """
  banner: ThemeImage
  """
  Its pattern.
  """
  pattern: ThemeImage
  """
  Its texture.
  """
  texture: ThemeImage
  """
  Its wordmark.
  """
  wordmark: ThemeImage
}

"""
The image slots of a theme of format 2 (since v48.0.0).
"""
type ThemeImageSlots {
  """
  The texture of the cards.
  """
  cardTexture: ThemeImage
  """
  The header of the channels.
  """
  channelHeader: ThemeImage
  """
  The page.
  """
  page: ThemeImage
  """
  The header of the page.
  """
  pageHeader: ThemeImage
  """
  The background of the time column.
  """
  timeColumn: ThemeImage
}

"""
The motion of the personal theme.
"""
