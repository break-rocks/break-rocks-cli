"""
An account. Every read of an account fills the same fields (contracts/api-v2/README.md, ambiguity 3):
its profile and its public counts. What the reader did about it (followed, blocked, muted, connected) is
not a field of the account but of connectionStates and isFollowing, read in the cell of the reader (P-16).
"""
type Account {
  """
  The stable identifier of the account. Its prefix is the cell where it was born; its current cell
  may differ (contracts/cells.md).
  """
  id: ID!
  """
  The kind of the account.
  """
  kind: AccountKind!
  """
  The handle, without its sign.
  """
  handle: String!
  """
  Since when the account has this handle.
  """
  handleSince: AWSDateTime!
  """
  The display name.
  """
  displayName: String!
  """
  Its bio; null when none.
  """
  bio: String
  """
  Its avatar; null when it has none, and for a deleted account.
  """
  avatar: Image
  """
  Its profile links, in its order (5 at most); empty when it has none.
  """
  links: [ProfileLink!]!
  """
  The AI agent description of an agent operator; null for another account.
  """
  aiDescription: String
  """
  The organization name of an agent operator; null for another account.
  """
  organizationName: String
  """
  The accounts that follow it.
  """
  followerCount: Int!
  """
  The addresses it follows.
  """
  followingCount: Int!
  """
  A deleted account: handle and display name empty, no avatar; the apps show "deleted account".
  """
  deleted: Boolean!
  """
  When the interactions of a deleted account disappear (a human: 30 days after the deletion; an agent
  operator: at once); null for an account that is not deleted.
  """
  disappearsAt: AWSDateTime
  """
  The delegated agent that calls, read through me with its Agent JWT: its own restrictions. Null for a
  human, an agent operator, and on every other read of an account.
  """
  delegatedAgent: DelegatedAgentSelf
  """
  What only the account itself reads (C-8): null on the read of another account.
  """
  own: AccountOwn
  """
  Its series (since v86.0.0, playlists.feature) and its account playlists (since v86.2.0, kind ACCOUNT), the most
  recently changed first. limit: from 1 to 50 (20 by
  default; LIMIT_INVALID otherwise); after: the next of the page before. Since v86.1.0: the PUBLIC ones only, but
  for the account itself, which reads all of them with their visibility.
  """
  playlists(after: String, limit: Int): PlaylistPage
}

"""
The account deleted: at "deletedAt"; its interactions disappear at "disappearsAt" (30 days for a human, at
once for an agent operator).
"""
type AccountDeletion {
  """
  When it was deleted.
  """
  deletedAt: AWSDateTime!
  """
  When its interactions disappear (a human: 30 days after the deletion; an agent operator: at once).
  """
  disappearsAt: AWSDateTime!
}

"""
A deletion confirmation sent by email: its link works until "expiresAt" (24 hours).
"""
type AccountDeletionRequest {
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
}

"""
The next owner of a private universe of an account being deleted.
"""
input AccountDeletionSuccessorInput {
  """
  The identifier of the account.
  """
  accountId: ID!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
The kind of an account.
"""
enum AccountKind {
  human
  operator
  system
}

"""
The part of an account that only the account itself reads (Account.own).
"""
type AccountOwn {
  """
  The paid tier in force; null: the free tier.
  """
  paidTier: PaidTier
  """
  The end of its paid period (a human's subscription, an agent operator's plan); null without one.
  """
  paidUntil: AWSDateTime
  """
  The legal space of the country given at registration, when one is open ("fra", "usa";
  contracts/accounts.md § Minimum age); null where no legal space is open, and before the check.
  """
  legalSpace: String
  """
  The country given at registration (ISO 3166-1 alpha-2); null for an account registered before the
  country was asked.
  """
  country: String
  """
  The day a human's minimum age was checked at registration (never the date of birth); null before the
  check.
  """
  minimumAgeCheckedAt: AWSDate
  """
  Since v101.21.0 (D-288, D-317): true while the human is a minor, under the age of majority of its country
  (the same rule as the map presences and the camera filters: no face slimming offered to a minor); false for an
  adult and for an agent. On the account's own view only.
  """
  minor: Boolean!
  """
  The day the person who registered an agent operator confirmed being of full age; null for a human.
  """
  fullAgeConfirmedAt: AWSDate
  """
  Whether the identity of the account as a seller was verified by the payment provider (a private
  universe joined by subscription).
  """
  identityVerified: Boolean!
  """
  The personal theme of the account and its settings.
  """
  personalTheme: PersonalTheme
}

"""
A page of accounts.
"""
type AccountPage {
  """
  The account items of this page.
  """
  items: [Account!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
An account as shown next to what it wrote: enough to draw its name.
"""
type AccountRef {
  """
  The stable identifier of the account: links and copies use it, never the handle.
  """
  id: ID!
  """
  The handle, without its sign.
  """
  handle: String!
  """
  The display name.
  """
  displayName: String!
  """
  The kind of the account ref.
  """
  kind: AccountKind!
  """
  Its avatar (contracts/api-v2/migration.md: was avatarKey, a storage key); null when it has none, and for
  a deleted account.
  """
  avatar: Image
  """
  A deleted account: handle and display name empty, no avatar; the apps show "deleted account".
  """
  deleted: Boolean!
  """
  When the interactions of a deleted account disappear (a human: 30 days after the deletion; an agent
  operator: at once); null for an account that is not deleted.
  """
  disappearsAt: AWSDateTime
}

"""
Since D-474 (contracts/agents-acting-for-their-human.md): what a delegated agent of a human asked for an act confirmed
at each act, sent to the trusted devices of its human. The act is shown in the words of the social platform (summary,
details), made from the operation kept, never a text of the agent. One request is one act.
"""
type ActConfirmationRequest {
  """
  The identifier of the delegated agent that asked.
  """
  agentId: ID!
  """
  The name of that delegated agent when it asked.
  """
  agentName: String!
  """
  Whether that delegated agent was the personal agent of the human when it asked, shown on the trusted device.
  """
  agentPersonal: Boolean!
  """
  When it was answered or expired; null while it waits.
  """
  answeredAt: AWSDateTime
  """
  What the trusted device signs to confirm it, made for this request only, committing to the request, its operation
  and contentHash; null to the delegated agent, and once answered.
  """
  challenge: String
  """
  The hash of summary and details as shown (contracts/agents-acting-for-their-human.md § Act confirmation requests):
  at run time they are built again, and a difference fails the act (ACT_CONFIRMATION_STALE); null to the delegated
  agent.
  """
  contentHash: String
  """
  When it was made.
  """
  createdAt: AWSDateTime!
  """
  The details of the act in the words of the social platform, in the language of the human, in full (the choice, the
  amount and its currency, the text of a consent, every element of a text to publish, the new handle…); once a request
  of the kind VOTE is answered or expired, never the choice.
  """
  details: [String!]!
  """
  The trusted device that confirmed it; null otherwise, and to the delegated agent.
  """
  deviceId: ID
  """
  When it expires, 10 minutes after it was made.
  """
  expiresAt: AWSDateTime!
  """
  The code the act answered when it was run (ACT_CONFIRMATION_STALE when what would be done is no longer what was
  shown; a right lost meanwhile, a vote closed…), with status FAILED; null otherwise.
  """
  failure: String
  """
  The identifier of the act confirmation request.
  """
  id: ID!
  """
  The kind of the act.
  """
  kind: ConfirmedActKind!
  """
  The identifier of what the act made or changed (a vote, a payment, a post…), with status DONE; null otherwise.
  """
  resultId: ID
  """
  Where it stands.
  """
  status: ActConfirmationStatus!
  """
  The act in one sentence, in the words of the social platform, in the language of the human.
  """
  summary: String!
}

"""
The waiting ones first, then the newest; "next": the cursor of the next page, null at the end.
"""
type ActConfirmationRequestPage {
  """
  The act confirmation requests of this page.
  """
  items: [ActConfirmationRequest!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
Where an act confirmation request stands: WAITING its answer; REFUSED by the human; EXPIRED after 10 minutes without an
answer; WITHDRAWN (agents.actForHuman turned off while it waited, or the requests of its agent paused); DONE (confirmed and run); FAILED (confirmed, the act
refused when run: failure).
"""
enum ActConfirmationStatus {
  DONE
  EXPIRED
  FAILED
  REFUSED
  WAITING
  WITHDRAWN
}

"""
Since D-474: the agent act class of an act of the record of agent acts: under an agent mandate (MANDATE), or confirmed
at each act (CONFIRMED_EACH_ACT). The free acts are in the activity of a delegated agent.
"""
enum AgentActClass {
  CONFIRMED_EACH_ACT
  MANDATE
}

"""
Since D-474: one act of the record of agent acts. mandateKind for an act under an agent mandate, confirmedKind and
confirmationId for an act confirmed at each act.
"""
type AgentActRecordEntry {
  """
  The agent act class ("class" is a reserved word of Dart, Swift and Kotlin).
  """
  actClass: AgentActClass!
  """
  The identifier of the delegated agent that did it.
  """
  agentId: ID!
  """
  The name of that delegated agent then.
  """
  agentName: String!
  """
  When it was done.
  """
  at: AWSDateTime!
  """
  The act confirmation request, for an act confirmed at each act; null otherwise.
  """
  confirmationId: ID
  """
  The kind of an act confirmed at each act; null otherwise.
  """
  confirmedKind: ConfirmedActKind
  """
  The trusted device that confirmed it; null for an act under an agent mandate.
  """
  deviceId: ID
  """
  The identifier of the record of agent acts entry.
  """
  id: ID!
  """
  The kind of agent act of an act under an agent mandate; null otherwise.
  """
  mandateKind: AgentMandateKind
  """
  The act in one sentence, in the words of the social platform.
  """
  summary: String!
}

"""
The newest first; "next": the cursor of the next page, null at the end.
"""
type AgentActRecordPage {
  """
  The record of agent acts entries of this page.
  """
  items: [AgentActRecordEntry!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
Since D-474: how the personal agent of a human says it publishes or changes a text (createPost, replyTo, quote, repost,
changePost, publishPostDraft, schedulePostDraft, SendMessageInput.authorship, changeMessage; a personal agent only,
INVALID_REQUEST for another caller, required from a personal agent: PERSONAL_AGENT_AUTHORSHIP_REQUIRED). Only a hint.
DICTATED: published at once, with the Automated mark, under the bans on agents as any delegated agent.
DICTATED_CONFIRMED and COMPOSED: an act confirmation request of the kind PUBLICATION (ACT_CONFIRMATION_REQUIRED); the
trusted device, not the agent, asks the human "dictated by me" or "written by the agent": dictated, published without
the Automated mark; written by the agent, with it; either way exempt from the bans on agents. A change of a text so
confirmed needs a new confirmation, or it is published with the Automated mark, under the bans.
"""
enum AgentAuthorship {
  COMPOSED
  DICTATED
  DICTATED_CONFIRMED
}

"""
Since D-474: an agent mandate in force: the kind of agent act it covers, when and from which trusted device it was
given.
"""
type AgentMandate {
  """
  The trusted device it was given from.
  """
  deviceId: ID!
  """
  When it was given.
  """
  givenAt: AWSDateTime!
  """
  The kind of agent act.
  """
  kind: AgentMandateKind!
  """
  Whether it is suspended (its delegated agent suspended, deactivated, no longer the personal agent, or its credentials
  regenerated) until the human gives it again on a trusted device.
  """
  suspended: Boolean!
}

"""
Since D-474: what setAgentMandate changes. given true gives the agent mandate of kind to the delegated agent agentId
(or gives a suspended one again), with proof (an active trusted device's signature over a challenge of
startTrustedDeviceChallenge of purpose GIVE_MANDATE naming that agent and that kind: TRUSTED_DEVICE_CHALLENGE_MISMATCH
otherwise); false withdraws it, proof not needed.
"""
input AgentMandateInput {
  agentId: ID!
  kind: AgentMandateKind!
  given: Boolean!
  proof: TrustedDeviceProofInput
}

"""
Since D-474: the kinds of agent act an agent mandate covers (contracts/agents-acting-for-their-human.md § The kinds of
agent act): ACCOUNT_SECURITY (signing out everywhere, without resetAgentPowers), APPEALS, CONSENTS (the private analysis
consent, translation.privateByPlatform), DATA_REQUESTS (My data, but a bulk erasure and downloading a data copy),
DELEGATED_AGENTS (reading, suspending, narrowing the delegated agents of its human), EXPERIENCES (taking part, making
public, the experience feats), JOINING_UNIVERSES (joining; leaving is confirmed at each act), MEET_UPS (the message
meet-ups), NEARBY (answering, the nearby label, leaving), SHARING_MY_PLACES, SHARING_POSITION (starting and stopping a
live share, the map presence, a route group session; the positions from the human's own device only).
"""
enum AgentMandateKind {
  ACCOUNT_SECURITY
  APPEALS
  CONSENTS
  DATA_REQUESTS
  DELEGATED_AGENTS
  EXPERIENCES
  JOINING_UNIVERSES
  MEET_UPS
  NEARBY
  SHARING_MY_PLACES
  SHARING_POSITION
}

"""
What a bulk erasure erases (contracts/accounts.md § My data); LOCATION since v84.3.0; HEALTH_MEASURES since D-461 (the
experience results measured by the steps of the health data); AFFINITIES since D-476 (the expressed affinities, the
affinity scores and the affinity consent, contracts/affinity.md § Erasure).
"""
enum BulkErasureScope {
  AFFINITIES
  CLIP_PLAYS
  HEALTH_MEASURES
  INTEREST_PROFILE
  LIKES_AND_REPOSTS
  LOCATION
  POSTS_AND_REPLIES
  SENT_MESSAGES
}

"""
A command-line sign-in code (features/cli/browser-sign-in.feature; contracts/accounts.md § The
command-line client signed in from the browser): for one use until "expiresAt" (5 minutes), with
the verifier of its challenge; "username" is the user name of the account in the user pool (its
"sub"), the USERNAME of the custom authentication.
"""
type CliSignInCode {
  """
  The command-line sign-in code, one-time, 5 minutes.
  """
  code: String!
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The user name of the sign-in identity, passed as it is to InitiateAuth (USERNAME): the one piece of the
  identity provider kept in the contract, on purpose (P-12).
  """
  username: String!
}

"""
Since D-474: the kind of an act confirmed at each act: VOTE (every act that counts in a governance or moderation count:
a vote, leaving a universe, a proposal, an appeal jury duty, a sanction, a contribution vote, a poll, a feed removal review, an
experience opinion, a proof, a tournament match), LEADERSHIP (the acts of the leadership and of the owner of a
universe), MONEY (any spending or commitment of money: buying AI credits, the daily AI credit cap, a scheduled AI task,
a subscription, a campaign, an x402 payment of a delegated agent other than the personal agent), HEALTH (the health
consent), HANDLE (a change of handle), ACCOUNT_DELETION, DELETION (a bulk erasure, a route version, the whole of My
places, any irreversible deletion), PUBLICATION (a text of the personal agent to publish or change).
"""
enum ConfirmedActKind {
  ACCOUNT_DELETION
  DELETION
  HANDLE
  HEALTH
  LEADERSHIP
  MONEY
  PUBLICATION
  VOTE
}

"""
Where the caller stands with an account (connectionStates): the reading that gathers the relation of the
caller to other accounts, served by the cell of the caller (P-16). Phase 1 of the cells: an account of
another cell is never connected nor requested (every field false, declinedReason null) but blockedByMe and
mutedByMe, read in the cell of the caller.
"""
type ConnectionState {
  """
  The account the state is about.
  """
  accountId: ID!
  """
  Whether the two accounts are connected.
  """
  connected: Boolean!
  """
  Whether the caller can send it a connection request now.
  """
  canRequest: Boolean!
  """
  Whether the caller can write to it at once, without a connection request (it accepts automatically).
  """
  canWriteAtOnce: Boolean!
  """
  Whether the caller can invite it to a group chat (its invitePolicy and its exceptions).
  """
  canInvite: Boolean!
  """
  A connection request of the caller waits for its answer.
  """
  requestSent: Boolean!
  """
  A connection request of it waits for the caller's answer.
  """
  requestReceived: Boolean!
  """
  Its last connection request of the caller was declined openly.
  """
  declinedOpenly: Boolean!
  """
  The reason given with an open decline; null otherwise.
  """
  declinedReason: String
  """
  The caller blocked it.
  """
  blockedByMe: Boolean!
  """
  The caller muted it.
  """
  mutedByMe: Boolean!
}

"""
A token to connect with a person close by: by Nearby (createNearbyToken) or by NFC (createNfcToken). The
two keep their own rules (contracts/nearby.md, contracts/invitations.md).
"""
type ConnectionToken {
  """
  The token to advertise or to write on the NFC tag.
  """
  token: String!
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
}

"""
The link to a part, valid 5 minutes, to the account of the request only (never sent by email).
"""
type DataCopyDownload {
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  Its URL.
  """
  url: AWSURL!
}

"""
A part of a data copy: its number (1, 2…) and its size, at most 2 GB (2,147,483,648 bytes).
"""
type DataCopyPart {
  """
  Its size, in bytes.
  """
  bytes: Float!
  """
  The number of the part (from 1).
  """
  number: Int!
}

"""
A data request: "scope" for a bulk erasure only; "dueAt" requestedAt plus 1 calendar month;
"cancellableUntil" a bulk erasure's 24 hours; "expiresAt" a data copy's 7 days once ready;
"parts" a data copy READY only (500 at most); "kept" what a legal obligation keeps (empty: nothing);
"rectification" (since specs v103.4.0) what a rectification request asks, served to its account only.
Since D-394 (decided on 2026-11-16; contracts/accounts.md § My data): a data copy or a bulk erasure the platform team
recorded from a contact message is AWAITING_CONFIRMATION until its account confirms it (confirmDataRequest), its
requestedAt and dueAt counted from the receipt of the contact message; "confirmBy" the end of its 30 days.
"""
type DataRequest {
  """
  A bulk erasure: until when it can be cancelled (24 hours); null otherwise.
  """
  cancellableUntil: AWSDateTime
  """
  When the platform must have answered it.
  """
  dueAt: AWSDateTime!
  """
  Since D-394: for a data request AWAITING_CONFIRMATION, until when its account can confirm it (30 days after the
  invitation); then it is NOT_CONFIRMED. Null otherwise.
  """
  confirmBy: AWSDateTime
  """
  When it expires.
  """
  expiresAt: AWSDateTime
  """
  When it was finished; null before.
  """
  finishedAt: AWSDateTime
  """
  The identifier of the data request.
  """
  id: ID!
  """
  What is kept after a bulk erasure, and why.
  """
  kept: [KeptData!]!
  """
  The kind of the data request.
  """
  kind: DataRequestKind!
  """
  The parts of a data copy ready; null otherwise.
  """
  parts: [DataCopyPart!]
  """
  Since specs v103.4.0: what a rectification request asks (its field, the value asked, the text, the comment); null for
  a data copy, a bulk erasure, and a rectification request answered before v103.4.0.
  """
  rectification: DataRequestRectification
  """
  When it was asked.
  """
  requestedAt: AWSDateTime!
  """
  The scope of a bulk erasure; null otherwise.
  """
  scope: BulkErasureScope
  """
  The state of the data request.
  """
  status: DataRequestStatus!
}

"""
The kind of a data request of My data (contracts/accounts.md § My data): a data copy, a bulk erasure, a
rectification.
"""
enum DataRequestKind {
  BULK_ERASURE
  DATA_COPY
  RECTIFICATION
}

"""
A page of the data requests of the caller, the most recent first.
"""
type DataRequestPage {
  """
  The data request items of this page.
  """
  items: [DataRequest!]!
  """
  The cursor of the next page (the argument after); null on the last page.
  """
  next: String
}

"""
Since specs v103.4.0: what a rectification request asks, as its account sent it (RectificationInput), served to that
account only (myDataRequests, requestRectification). field, the field to correct (OTHER for a request sent without one);
value, the value asked of a named field, null for OTHER and always null for BIRTH_DATE (the date of birth is never kept, nor
served back); text, the text of OTHER, null otherwise; comment, null without one. Kept with the request until it is
answered: then value, text and comment are deleted (null), the field stays.
"""
type DataRequestRectification {
  """
  The comment sent with the request; null without one, and once the request is answered.
  """
  comment: String
  """
  The field the request names.
  """
  field: RectificationField!
  """
  The text of a request of another field (OTHER); null otherwise, and once the request is answered.
  """
  text: String
  """
  The value asked for a named field; null for OTHER, for BIRTH_DATE, and once the request is answered.
  """
  value: String
}

"""
IN_PROGRESS (a data copy prepared, a rectification request waiting, a bulk erasure past its 24 hours being
erased), CANCELLABLE (a bulk erasure within its 24 hours), READY (a data copy, 7 days), DONE, CANCELLED,
EXPIRED (a data copy past its 7 days). Since D-394: AWAITING_CONFIRMATION (a data copy or a bulk erasure recorded by
the platform team from a contact message, waiting for its account to confirm it: nothing runs), NOT_CONFIRMED (not
confirmed within 30 days of the invitation: closed without running, kept in the register of data requests).
"""
enum DataRequestStatus {
  AWAITING_CONFIRMATION
  CANCELLABLE
  CANCELLED
  DONE
  EXPIRED
  IN_PROGRESS
  NOT_CONFIRMED
  READY
}

"""
A delegated agent as its operator sees it; interactions or universes null: no restriction.
"""
type DelegatedAgent {
  """
  Since D-474: whether its human paused its act confirmation requests (setAgentConfirmationsPaused).
  """
  confirmationsPaused: Boolean!
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  When its credentials were last made.
  """
  credentialsUpdatedAt: AWSDateTime!
  """
  When it was deactivated (beyond the allowance; since D-454, once the offer of the default limits of a delegated agent
  of a human is on sale, a delegated agent of a human without a paid period in progress: its creation until its first
  paid period, or the end of its paid period, never deleted for it); null otherwise.
  """
  deactivatedAt: AWSDateTime
  """
  The identifier of the delegated agent.
  """
  id: ID!
  """
  The kinds of interaction it is restricted to; null: no restriction.
  """
  interactions: [DelegatedAgentInteraction!]
  """
  Since D-474: the agent mandates its human gave it, suspended ones included; empty without one, and while
  agents.actForHuman is off.
  """
  mandates: [AgentMandate!]!
  """
  The name of the delegated agent.
  """
  name: String!
  """
  Since D-454: the end of the paid period in progress of a delegated agent of a human (its default limits or a paid
  tier); null without one (before the offer of its default limits is on sale, during its year of grace, or unpaid:
  then deactivated) and for a delegated agent of an agent operator, whose plan pays it (payments.md § Delegated agents
  of humans).
  """
  paidUntil: AWSDateTime
  """
  Since D-474: whether it is the personal agent of its human (free, within the limits of its human); false while
  agents.actForHuman is off, and for a delegated agent of an agent operator.
  """
  personal: Boolean!
  """
  The state of the delegated agent.
  """
  status: DelegatedAgentStatus!
  """
  When its operator suspended it; null otherwise.
  """
  suspendedAt: AWSDateTime
  """
  The addresses of the universes, with their sign.
  """
  universes: [String!]
}

"""
An action of a delegated agent: postId the post it wrote (a post, a reply, a repost, a quote); subjectPostId
the post it replied to, reposted, quoted or liked; messageId the message it sent, to conversationWith (a
direct message), in groupChatId (a group chat, its name groupChatName as it was) or in channel (its address);
snippet a copy of the text (140 characters); universe the universe of the post.
"""
type DelegatedAgentAction {
  """
  When it acted.
  """
  at: AWSDateTime!
  """
  The address of the channel ("%team-fra./tech&dev").
  """
  channel: String
  """
  The other participant of the conversation; null otherwise.
  """
  conversationWith: ID
  """
  The group chat, for a group message; null otherwise.
  """
  groupChatId: ID
  """
  The name of the group chat, as shown; null otherwise.
  """
  groupChatName: String
  """
  The identifier of the delegated agent action.
  """
  id: ID!
  """
  The kind of the delegated agent action.
  """
  kind: DelegatedAgentActionKind!
  """
  The identifier of the message.
  """
  messageId: ID
  """
  The identifier of the post.
  """
  postId: ID
  """
  The content in short, 140 visible characters at most; null once the content is deleted or ended.
  """
  snippet: String
  """
  The post it liked, reposted, quoted or replied to; null otherwise.
  """
  subjectPostId: ID
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String
}

