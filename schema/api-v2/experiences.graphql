  discussion: DiscussionRef
  """
  Its universe event; null otherwise.
  """
  eventId: ID
  """
  Its experience organizer: who started it.
  """
  organizer: AccountRef!
  """
  Its state.
  """
  state: ExperienceRunState!
  """
  When it went or goes in progress; null for a route experience and a visit experience once started (they keep their
  day only).
