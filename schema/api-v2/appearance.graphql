"""
The appearance editor (since v87.4.0, D-267, customize-universe.feature; contracts/themes.md § Customize): its three gestures (one image with its focal point and its subtle background, one accent color, one
appearance character) and its options (the logo, the watermark), read by buildUniverseAppearance and
applyUniverseAppearance. imageId: an image uploaded with requestMediaUpload (IMAGE, destination THEME), JPEG,
PNG or WebP, at least 1,500 × 500 pixels (APPEARANCE_IMAGE_INVALID; IMAGE_NOT_FOUND, IMAGE_NOT_READY,
THEME_IMAGE_TOO_LARGE); null: no image, a flat universe sky. focalPoint: { 0.5, 0.5 } by default. ground: the
subtle background, false by default. accent: "#RRGGBB" (APPEARANCE_ACCENT_INVALID); null: the proposed accent of
the image, or without an image the primary of the default colors of the universe. character: PLACE by
default. logo, clear (LOGO): as setUniverseIdentity (UNIVERSE_LOGO_TOO_SMALL); ignored by
buildUniverseAppearance, which builds the theme only. watermark and clear WATERMARK: ignored since v96.0.0
(D-289, the watermark is gone). layout (since v96.0.0): the default layout the appearance sets, "feed-first",
"village-square" or "hud" (UNIVERSE_LAYOUT_NOT_OFFERED otherwise); null: unchanged; carried in the block
"appearance" of the document, so that a trial and a draft preview apply it too. ground: true by default since
v96.0.0 (the subtle background); deprecated since v99.1.0, read only when imageShows is null (true reads SUBTLE,
false reads NONE). imageShows (since v99.1.0, D-293, contracts/themes.md): how the image shows, NONE, SUBTLE
or THROUGH; null: ground as above, else SUBTLE; carried in the block "appearance" of the document as
"imageShows" ("none", "subtle", "through"). With an image, the publication computes the readability mask
("scrims.mask" of the document, contracts/themes.md).
"""
input UniverseAppearanceInput {
  imageId: ID
  focalPoint: FocalPointInput
  ground: Boolean
  imageShows: ImageShows
  accent: String
  character: AppearanceCharacter
  logo: ImageAttachmentInput
  watermark: WatermarkSettingInput
  clear: [UniverseIdentityPart!]
  layout: String
}

"""
How the image of an appearance shows (since v99.1.0, D-293; contracts/themes.md § How the image of an appearance
shows): NONE, the slot page empty; SUBTLE, the subtle background (the slot page behind the page on a tablet and a
desktop, the default; the page over it at the page opacity of the reader, 64 % by default, since v100.0.0, D-299); THROUGH, the slot page behind the page at every breakpoint, the blocks at the block
opacity, every text and control of a block or of a post on the readability mask.
"""
enum ImageShows {
  NONE
  SUBTLE
  THROUGH
}

"""
The focal point of an image (since v87.4.0): x from the start edge, y from the top, each from 0 to 1
(APPEARANCE_FOCAL_POINT_INVALID otherwise); every crop of the image holds it.
"""
input FocalPointInput {
  x: Float!
  y: Float!
}

"""
An appearance character (since v87.4.0): the title typeface and, until v99.0.0 (D-293: the radii are fixed by
the social platform), the shape of an appearance. Since v96.0.0
(D-289) shown by its tone, the values unchanged: PLACE "Calm" (Sora, soft); AGORA "Editorial" (Fraunces,
soft); GALLERY "Lively" (Figtree, sharp); STAGE "Playful" (Bebas Neue, round); TERMINAL "Precise" (JetBrains
Mono, sharp); shown in this order: Calm, Editorial, Lively, Playful, Precise. The body text stays the readable
typeface of Socle.
"""
enum AppearanceCharacter {
  AGORA
  GALLERY
  PLACE
  STAGE
  TERMINAL
}

"""
The side of the universe sky where the name of the universe is laid out (since v87.4.0): the least busy half
of the image, chosen by the social platform; START without an image or on a tie.
"""
enum AppearanceNameSide {
  END
  START
}

"""
An appearance built from its gestures (buildUniverseAppearance, since v87.4.0): nothing stored.
"""
type UniverseAppearanceBuild {
  """
  The theme document derived, of the format "break-rocks-theme/2", with its block "appearance"; the apps draw
  the preview from it. Since v99.1.0 (D-293): its block "appearance" carries "imageShows", and with an image its
  "scrims" carry "mask" { night, dim, day }, the readability mask: the lowest opacity of the color of the page
  over the image that keeps AA for every text and control in that display mode, from 0.6 to 1, computed by the
  social platform (never given: THEME_SCRIMS_COMPUTED).
  """
  document: AWSJSON!
  """
  Since v99.1.0 (D-293): how the image of the appearance shows.
  """
  imageShows: ImageShows!
  """
  The contrast report: the colors adjusted to reach AA, in each variant.
  """
  contrast: AppearanceContrastReport!
  """
  The side of the universe sky where the name of the universe is laid out.
  """
  nameSide: AppearanceNameSide!
}

"""
The contrast report of an appearance (since v87.4.0): AA in the day and the night variants; a color that falls
short is adjusted by the social platform, never refused, and the adjustment is told here.
"""
type AppearanceContrastReport {
  """
  The accent color as asked (or proposed), "#RRGGBB".
  """
  accentAsked: String!
  """
  The accent color kept in the day variant.
  """
  accentDay: String!
  """
  The accent color kept in the night variant.
  """
  accentNight: String!
  """
  Every color adjusted, empty when none was.
  """
  adjustments: [AppearanceAdjustment!]!
}

"""
A color of an appearance adjusted to reach the contrast AA (since v87.4.0).
"""
type AppearanceAdjustment {
  """
  The token adjusted, as named in the theme document ("palette.primary", "surfaces.primaryButton.background"…).
  """
  token: String!
  """
  The variant where it was adjusted.
  """
  variant: ThemeVariant!
  """
  The color derived before the adjustment, "#RRGGBB".
  """
  asked: String!
  """
  The color kept, "#RRGGBB".
  """
  kept: String!
  """
  The contrast ratio reached by the color kept (4.5 for 4.5:1).
  """
  ratio: Float!
  """
  Why it was adjusted (since v96.0.0, D-289): CONTRAST to reach AA, SIGN to stay distinct from the color of a
  reserved sign ("Adjusted to stay distinct from the signs").
  """
  reason: AppearanceAdjustmentReason!
}

"""
Why a color of an appearance was adjusted (since v96.0.0, D-289): CONTRAST, to reach the contrast AA; SIGN, to
stay at a distance of at least 0.08 in OKLab from the color of every reserved sign.
"""
enum AppearanceAdjustmentReason {
  CONTRAST
  SIGN
}

"""
The candidate colors of an image (imagePalette, since v87.4.0): 5 colors at most, ordered by the share of the
image they cover, and the one proposed as the accent color.
"""
type ImagePalette {
  """
  The candidate colors, "#RRGGBB", from 1 to 5.
  """
  colors: [String!]!
  """
  The candidate proposed as the accent color: the one of highest chroma among those that cover at least 5 % of
  the image, else the first.
  """
  proposedAccent: String!
  """
  The color name of each candidate, in the order of colors (since v96.0.0, D-289): the nearest by distance in
  OKLab among a fixed list of about 40 English color names published with the design system, which the apps
  translate; shown in the step "Color", in the appearance history and in a proposal.
  """
  names: [String!]!
}

"""
What applying an appearance did (applyUniverseAppearance, since v87.4.0): the theme published and set at once
