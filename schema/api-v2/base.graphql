  Since v84.0.0 (D-248): changes the audience of the map presence of the caller, 30 times in 24 hours at most
  (MAP_AUDIENCE_RATE_LIMITED); the same refusals as startMapPresence.
  """
  setMapPresenceAudience(audience: MapPresenceAudienceInput!, requestId: ID!): MyMapPresence

