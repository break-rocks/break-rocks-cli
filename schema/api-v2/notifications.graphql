  JUROR_DRAWN
  LIKE
  LINKED_ROUTE_CHANGED
  LINKED_ROUTE_DETACHED
  MAP_STALKING_ALERT
  MASK_REQUESTED
  MEET_UP_SOON
  MESSAGE_PUBLICATION_FAILED
  MENTION
  MODERATOR_DESIGNATED
