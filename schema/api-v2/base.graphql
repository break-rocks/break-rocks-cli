  otherwise, nothing chosen). A delegated agent: DELEGATED_AGENT_NOT_ALLOWED. Usage category OTHER.
  """
  chooseFields(consented: [UniverseField!], fields: [UniverseField!]!, requestId: ID!): InterestProfile

