  Web Push subscription (JSON); environment: iOS only; timeZone: the IANA time zone of the device, its
  do-not-disturb hours follow it (TIME_ZONE_INVALID). registered true without platform: INVALID_REQUEST. A
  token belongs to one account. Returns true.
  """
  setPushDevice(token: String!, registered: Boolean!, platform: PushPlatform, environment: PushEnvironment, appVersion: String, locale: String, timeZone: String, requestId: ID!): Boolean

  """
  The Stripe Customer Portal (payment methods, invoices), back to "returnPath". Errors: SUBSCRIPTION_NOT_FOUND
