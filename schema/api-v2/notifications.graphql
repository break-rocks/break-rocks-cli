null without (and on a notification written before 2026-10-15).
"""
type NotificationSnippet {
  """
  The text as shown, its signs resolved (contracts/text.md).
  """
  display: String!
  """
  The identifier of the notification snippet.
  """
  id: ID!
  """
  The media of the content, as counts; null when none.
  """
  media: ContentMedia
}

"""
TIER_PRICE_CHANGE: the subscription tier ("tier", its name), its new price and when it applies.
"""
type NotificationTierPrice {
  """
  When it applies.
  """
