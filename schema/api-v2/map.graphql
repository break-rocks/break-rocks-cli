"""
A route as an object of its own (since v92.1.0, routes.feature): made by an account or the leadership of a universe,
its URL ("/a/<handle>/w/<name>", "/u/<path>/w/<name>"), its line (route), its visibility (that of a playlist,
PRIVATE when created; a universe route the visibility of its universe), and the original it was copied from. The
parts within the privacy zones of its author are left out of route for every caller but its author. Since v101.2.0
(D-288): its author receives the whole line and its app computes the part hidden to the others with
myRoutePrivacyZones, by the rule of contracts/map.md § Routes; no field carries it.
"""
type MapRoute {
  """
  The identifier of the route.
  """
  id: ID!
  """
  Its name, by the rules of a channel name, unique per owner.
  """
  name: String!
  """
  Its canonical URL.
  """
  url: AWSURL!
  """
  Its author, for the route of an account; null for a universe route.
  """
  owner: AccountRef
  """
  Its universe ("%paris"), for a universe route; null otherwise.
  """
  universe: String
  """
  Its visibility: PUBLIC, UNLISTED or PRIVATE (an account route); that of its universe for a universe route.
  """
  visibility: PlaylistVisibility!
  """
  Its line, its stages, its mode, its length and its elevation.
  """
  route: Route!
  """
  The URL of the route it was copied from ("Do this route"); null when it is an original, or once the original is
  no longer readable.
  """
  copiedFrom: AWSURL
  """
  The author of the original it was copied from; null otherwise.
  """
  copiedFromAuthor: AccountRef
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  Its free tags, 0 to 5 (since v101.0.0, D-300), in their canonical form, without "#".
  """
  tags: [String!]!
  """
  Its line as kept (since v101.0.0, contracts/map.md § Routes): the simplified line, at most 1,000 points (since
  v131.0.0, D-413, 2,000 points), as an encoded polyline of precision 5, the parts its privacy zones hide left out for
  another reader than its author.
  """
  encodedLine: String!
  """
  Since v131.0.0 (D-413, route-recording.feature): the figures of the route recording it was saved from (its moving
  time and its total time, never when it started), for its owner only; null for any other caller, and for a route that was not
  recorded. A route joined from routes (joinMapRoutes) has none.
  """
  recording: RouteRecordingFigures
  """
  Since D-415 (map/route-findability.feature): its route description, 0 to 500 visible characters of plain text, line
  breaks kept, without formatting (its addresses and links stay text); null when none. Served to whoever may read the
  route.
  """
  description: String
  """
  Since D-415: the delegated agent that wrote its route description last, for the Automated mark ("via scribe ·
  Automated"), with the name it had then; null when written by the owner or the leadership itself, or when there is no
  route description.
  """
  descriptionAgent: String
  """
  Since D-415: its route accessibility, the route accessibility boxes its owner (the leadership for a universe route)
  ticked, in the order of RouteAccess; empty when none. Never ticked by the platform; the apps tell them "declared by
  the author".
  """
  access: [RouteAccess!]!
  """
  Since D-415: its route context, computed by the platform from its line as another reader than its author sees it
  (contracts/map.md § The route context), the same for every caller who may read the route, its author included (but
  computedAt, its owner only); null
  while it is not computed yet, or while it is computed again after a change of the privacy zones of its author.
  """
  context: RouteContext
  """
  Since D-415 (map/route-findability.feature), for its owner only (the leadership for a universe route): when its name
  is a prefilled name its owner never changed and names a crossed place or a route start area that the privacy zones of
  its author now hide, the prefilled name of its route context computed again, which the apps offer as a rename in one
  gesture (saveMapRoute with its id and that name); the name never changes by itself. Null otherwise, and for any other
  caller. Since D-418, offered in the same gesture as titleSuggestion when both are set.
  """
  renameSuggestion: String
  """
  Since D-418 (map/route-findability.feature): its route title, 0 to 80 visible characters of plain text on one line,
  without formatting (its addresses and links stay text), distinct from its name, which stays the identifier of its
  URL; not unique. Served as written, never translated, to whoever may read the route; the apps show it in place of the
  name wherever the route is named (contracts/map.md § The route title), and the name when it is null. Null when
  none: a route saved with a name typed, a copy, an import, a join, or a route title emptied.
  """
  title: String
  """
  Since D-418: the delegated agent that wrote its route title last, for the Automated mark ("via scribe · Automated"),
  with the name it had then; null when written by the owner or the leadership itself, prefilled by the platform, or
  when there is no route title.
  """
  titleAgent: String
  """
  Since D-418, for its owner only (the leadership for a universe route): when its route title is a prefilled route title
  its owner never changed and names a crossed place or a route start area that the privacy zones of its author now
  hide, the prefilled route title of its route context computed again, which the apps offer in the same gesture as
  renameSuggestion (saveMapRoute with its id and that title); the route title never changes by itself. Null otherwise,
  and for any other caller.
  """
  titleSuggestion: String
  """
  Since D-420 (map/route-versions.feature), for its owner only (the leadership for a universe route): the number of its
  latest route version, from 1 (a route made before D-420 is at 1); null for any other caller, who never learns that a
  route has route versions. An update from a follow and record (updateMapRouteFromRecording), a restore
  (restoreMapRouteVersion) and, since D-421, a change of its line by saveMapRoute make a route version; the other
  changes of saveMapRoute change the latest one in place.
  """
  version: Int
  """
  Since D-420 (map/follow-and-record.feature): the URL of the route it was saved "after", from a follow and record of
  that route; served only while that route is readable through its own visibility, PUBLIC (or a universe route of a
  public universe): null when none, when its owner removed it (MapRouteInput.removeAfter), and while that route is
  UNLISTED, PRIVATE, of a private universe, deleted or removed, whatever the caller may read through a route group
  session or a universe event. The author of that route is never told.
  """
  after: AWSURL
  """
  Since D-420: the author of the route of after, for a route of an account; null otherwise (a universe route: its URL
  names its universe), and whenever after is null.
  """
  afterAuthor: AccountRef
}

"""
Since D-420 (map/route-versions.feature): a route version of a route, as its owner reads it (the leadership for a
universe route; mapRouteVersions): its line, its route segments, its stages, its attached posts and its figures, whole,
the parts its privacy zones hide included, as the owner reads the route. Never served to another caller.
"""
type MapRouteVersion {
  """
  Its number, from 1.
  """
  version: Int!
  """
  When it was made (the save of the route for the route version 1 of a route made before D-420).
  """
  createdAt: AWSDateTime!
  """
  Whether it is the latest route version, the one published.
  """
  latest: Boolean!
  """
  The route version it restores (restoreMapRouteVersion); null for a route version made otherwise.
  """
  restoredFrom: Int
  """
  Its line, its route segments, its stages, its attached posts (those the owner may still read), its length and its
  elevation.
  """
  route: Route!
  """
  Its line as kept, an encoded polyline of precision 5, at most 2,000 points, whole.
  """
  encodedLine: String!
  """
  The figures of the route recording it was made from (its moving time and its total time); null when it was not made
  from a route recording.
  """
  recording: RouteRecordingFigures
}

"""
Since D-420 (map/follow-and-record.feature): an update of a route of the caller (the leadership for a universe route)
from the route recording of a follow and record (updateMapRouteFromRecording): id, the route; route, its new line, its
route segments, its stages and the posts attached at this save, with route.recorded true (ROUTE_INVALID otherwise; the
rules of RouteInput, posts included, as for the first save of a route recording); recording, the figures of the route
recording. The name, the route title, the free tags, the route description, the route accessibility boxes and the
visibility are not given: they stay. version: the route version followed (MapRoute.version as the caller read it when
the route guidance started); sessionId: instead, the route group session it was followed in, whose copy holds its
route version; exactly one of both (INVALID_REQUEST otherwise); ROUTE_VERSION_STALE when the route has a later route
version than the one followed. For a universe route, the backend cuts out the parts of the route recording within the
privacy zones of the caller (myRoutePrivacyZones), at its start and at its end, whatever the app sent: the cut made by
the app is only a preview.
"""
input MapRouteUpdateInput {
  id: ID!
  route: RouteInput!
  recording: RouteRecordingFiguresInput!
  version: Int
  sessionId: ID
}

"""
Since D-415 (map/route-findability.feature; contracts/map.md § The route context): what the platform computes by itself
about a route, with nothing asked of its owner, from its line without the parts the privacy zones of its author hide.
"""
type RouteContext {
  """
  Its crossed places, 20 at most, in their order along the line: each a named place whose part outside every privacy
  zone of the author lies within 50 metres of the line served to another reader; empty when none.
  """
  places: [CrossedPlace!]!
  """
  Its route start area, at the point where its route start marker stands for another reader than its author; null
  when the reverse geocoding finds no city.
  """
  startArea: RouteStartArea
  """
  Its route environments, each covering at least 20 % of the length of the line served to another reader (the parts
  hidden by the privacy zones of the author left out), in the order of RouteEnvironment; empty when none.
  """
  environments: [RouteEnvironment!]!
  """
  The public universes of the first level whose universe territory its line crosses ("%cergy"), 10 at most, the
  longest share of its line first; empty when none.
  """
  universes: [String!]!
  """
  When it was computed, for the owner of the route (the leadership for a universe route) only; null for any other
  caller.
  """
  computedAt: AWSDateTime
}

"""
Since D-415: a crossed place of a route.
"""
type CrossedPlace {
  """
  Its kind.
  """
  kind: CrossedPlaceKind!
  """
  Its name in the language of the caller when the map knows it, else its local name.
  """
  name: String!
  """
  Its local name, the name of the place in its own language; null when the same as name.
  """
  localName: String
  """
  The identifier of its point of interest in the cartography, as PlaceMatch.id; null when none.
  """
  placeId: String
  """
  For a place with a place experience (PLACE_FEAT), the address of its place experience ("%paris*arc-photo"); null otherwise.
  """
  placeFeat: String
}

"""
Since D-415: the kind of a crossed place: WATER (a lake, a pond, a reservoir), PARK (a park, a garden, a nature reserve),
MONUMENT (a monument, a memorial, a castle, a historic site), PLACE_FEAT (a place with a place experience, whatever its kind
in the cartography).
"""
enum CrossedPlaceKind {
  MONUMENT
  PARK
  PLACE_FEAT
  WATER
}

"""
Since D-415: the route start area of a route: its city and its neighbourhood, each named in the language of the caller
when the map knows it, else by its local name.
"""
type RouteStartArea {
  """
  The city (the municipality).
  """
  city: String!
  """
  The neighbourhood; null when the reverse geocoding gives none.
  """
  neighbourhood: String
}

"""
Since D-415: a route environment: TOWN (built-up land), FOREST (woods), WATERSIDE (within 50 metres of the water of a
lake, a river or the sea), MOUNTAIN (ground above 1,000 metres of elevation); the apps name it in the language of the
reader.
"""
enum RouteEnvironment {
  FOREST
  MOUNTAIN
  TOWN
  WATERSIDE
}

"""
Since D-415: a route accessibility box: PRAM (pram), WHEELCHAIR (wheelchair), DOG (dog), CHILD_BIKE (child's bike), SHADE
(shaded), WATER_POINT (water point).
"""
enum RouteAccess {
  CHILD_BIKE
  DOG
  PRAM
  SHADE
  WATER_POINT
  WHEELCHAIR
}

"""
A route in its light form, for the map (since D-374, routes.feature, mapRouteMarkers): what its route start marker,
its route end marker and its route marker card need, never its line nor its stages. Its points depend on the reader
(since D-375): for another reader than its author, where a privacy zone of its author hides its start or its end, the
point where its line leaves or enters that privacy zone; for its author, its start and its end.
"""
type MapRouteMarker {
  """
  The identifier of the route (mapRoute(id) reads its line).
  """
  id: ID!
  """
  Its name.
  """
  name: String!
  """
  Since D-418 (map/route-findability.feature): its route title (MapRoute.title), shown on its route marker card, its
  result card and the nearby routes in place of its name; null when none, the name then shown.
  """
  title: String
  """
  How it is travelled: on foot or by bicycle (the icon of its route start marker). Since v131.0.0 (D-413): its main
  travel mode (Route.mode).
  """
  mode: RouteMode!
  """
  Its length, in metres, of the whole route, the parts its privacy zones hide included, as the route shows it (since
  D-375, the length of its route marker card); null when unknown.
  """
  metres: Int
  """
  The point of its route start marker: for another reader than its author, its first point that no privacy zone of its
  author hides; for its author, its first point (since D-375).
  """
  start: Point!
  """
  The point of its route end marker: for another reader than its author, its last point that no privacy zone of its
  author hides; for its author, its last point (since D-375); null for a loop, which has its route start marker only.
  """
  end: Point
  """
  Its free tags, 0 to 5, in their canonical form, without "#" (since D-375, contracts/map.md § Routes): the map filter
  counts them.
  """
  tags: [String!]!
  """
  Since v128.0.0 (D-408, routes.feature): its duration for its mode, in seconds, of the whole route, measured along the
  streets and paths it follows (Route.seconds); null when it does not follow them (estimatedSeconds).
  """
  seconds: Int
  """
  Since v128.0.0 (D-408): its estimated duration, in seconds, of the whole route, when it does not follow the streets
  and paths (Route.estimatedSeconds): the route marker card tells it "estimated"; null otherwise.
  """
  estimatedSeconds: Int
  """
  Since v128.0.0 (D-408): its elevation gain, in metres, of the whole route (Route.ascent); null when unknown.
  """
  ascent: Int
  """
  Since v128.0.0 (D-408): its route difficulty (Route.difficulty); null when its length is unknown.
  """
  difficulty: RouteDifficulty
  """
  Since v128.0.0 (D-408): its 2 route surfaces with the longest share of its length (Route.surfaces), the longest
  first; empty when it does not follow the streets and paths.
  """
  surfaces: [RouteSurfaceShare!]!
  """
  Since D-415 (map/route-findability.feature): its route accessibility (MapRoute.access), for the route accessibility
  filter computed on the device without words; empty when none.
  """
  access: [RouteAccess!]!
}

"""
A page of routes, the most recent first (since v92.1.0).
"""
type MapRoutePage {
  """
  The routes of the page.
  """
  items: [MapRoute!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
A route to save (since v92.1.0, saveMapRoute): id to change one, none to create one; universe for a universe route,
by its leadership; visibility for an account route only (PRIVATE when not given). name: required until D-415; since
D-415 (map/route-findability.feature), a new route without a name takes its prefilled name (contracts/map.md § The route
context), and a route changed without a name keeps its own; a new name moves its URL. description: since D-415, its
route description, 0 to 500 visible characters (ROUTE_DESCRIPTION_TOO_LONG), "" to remove it, not given: kept. access:
since D-415, its route accessibility, replacing it, each box once (ROUTE_INVALID for a box sent twice), not given:
kept. title: since D-418 (map/route-findability.feature), its route title, 0 to 80 visible characters
(ROUTE_TITLE_TOO_LONG), a line break turned into a space and the spaces at both ends removed, "" to remove it, not
given: kept; a new route without a name and without a title takes its prefilled route title beside its prefilled name
(contracts/map.md § The route title); a new route with a name and without a title has none.
"""
input MapRouteInput {
  id: ID
  name: String
  universe: String
  visibility: PlaylistVisibility
  route: RouteInput!
  """
  Since v101.0.0 (D-300): its free tags, 0 to 5, replacing them (FREE_TAGS_TOO_MANY, TAG_INVALID); not given: kept.
  """
  tags: [String!]
  """
  Since v131.0.0 (D-413, route-recording.feature): the figures of the route recording the route is saved from, with
  route.recorded true (ROUTE_INVALID otherwise); kept when the route is changed and not given; ignored for a universe
  route.
  """
  recording: RouteRecordingFiguresInput
  description: String
  access: [RouteAccess!]
  title: String
  """
  Since D-420 (map/follow-and-record.feature): the route the new route is saved "after", from a follow and record of
  it, a route the caller may read (ROUTE_NOT_FOUND otherwise) and readable through its own visibility, PUBLIC or a
  universe route of a public universe (ROUTE_INVALID otherwise); given only with a new route (no id) and route.recorded
  true (ROUTE_INVALID otherwise); not given: none. Since D-421, with universe too, a new universe route recorded by its
  leadership after one of its universe routes, the backend then cutting out the parts of the line within the privacy
  zones of the caller at its start and at its end, as for updateMapRouteFromRecording.
  """
  after: ID
  """
  Since D-420: true removes after from a route of the caller (never added back afterwards); not given: kept.
  """
  removeAfter: Boolean
}

"""
A privacy zone of an account (since v92.1.0): a private place and its radius, 200, 500 or 1,000 metres.
"""
type RoutePrivacyZone {
  """
  The private place.
  """
  point: Point!
  """
  Its radius, in metres.
  """
  metres: Int!
}

"""
A privacy zone to set (since v92.1.0).
"""
input RoutePrivacyZoneInput {
  point: PointInput!
  metres: Int!
}

"""
A map kind, among the choices of what since D-410 (map.kinds, map-highlights.feature): POSTS "Posts and photos", VIDEOS "Videos", FEATS
"Feats", EVENTS "Events", PEOPLE "People", UNIVERSES "Universes" (the map of Explore only), ROUTES "Routes". Since D-437
(posts/explore-things-to-do.feature): EXPERIENCES "Experiences" (the map of Explore only, a signed-in caller, while the
experiences are open: the public route experiences and the group experience instances of universe events, mapExperiences);
the apps offer them in two what families, "To do" (EVENTS, EXPERIENCES, FEATS, ROUTES) and "To see" (POSTS, VIDEOS, PEOPLE,
UNIVERSES). Since D-478 (map/map-universe-filter.feature, map-highlights.feature): UNIVERSES is offered on no map and the
apps never send it; kept served (expand then contract) for the apps built before D-478.
"""
enum MapKind {
  EVENTS
  EXPERIENCES
  FEATS
  PEOPLE
  POSTS
  ROUTES
  UNIVERSES
  VIDEOS
}

"""
Since D-355 (nearestActivity): the nearest activity of an empty area: what it is, the point its distance is measured to
(the apps show its direction and its distance from the center of the area, and move the map over it at the zoom 12).
"""
type NearestActivity {
  """
  Its map kind: POSTS, VIDEOS, FEATS, EVENTS, UNIVERSES, ROUTES or, since D-437, EXPERIENCES (never PEOPLE). Since
  D-478, UNIVERSES only to an app that sent it among kinds, which an app built since never does.
  """
  kind: MapKind!
  """
  Its id: the postId of a placed post or a placed video, the placeId of a place with a place experience, the id of a universe
  event or of a route, the key of a public universe (its name in lowercase, without "%"); since D-437, for EXPERIENCES,
  the id of the experience (a route experience, measured to its route start as the readers other than its author see
  it, or the experience of a group experience instance whose universe event the caller does not attend) or of the
  experience instance (a group experience instance whose universe event the caller attends, measured to the point of its
  universe event), as resultKind says.
  """
  id: ID!
  """
  The point its distance is measured to: the point of a content, the start of a route, the nearest point of the universe
  territory of a public universe (the center of the area shown when it lies within it).
  """
  point: Point!
  """
  Its distance from the center of the area shown, in metres (0 to 500,000).
  """
  metres: Int!
  """
  Since D-437 (posts/explore-things-to-do.feature): for EXPERIENCES, what id is: EXPERIENCE (the experience: a route
  experience, or the experience of a group experience instance whose universe event the caller does not attend, never
  the id of an experience instance the caller may not read) or EXPERIENCE_RUN (a group experience instance whose universe
  event the caller attends); null for the other kinds.
  """
  resultKind: ExploreResultKind
  """
  Since D-437: for EXPERIENCES, the title of the experience in the language of the caller, else in English, which the
  to-do row and the list of results name ("canal-banks"); null for the other kinds.
  """
  title: String
}

"""
Since D-414 (pointAddress): what the cartography knows of a point the reader chose by a long press or a secondary click, shown at the
head of the actions at that point.
"""
type PointAddress {
  """
  Its postal address as one line ("12 Rue de Turenne, 75003 Paris"), copied by "Copy the address"; null when the
  cartography gives none (the apps then copy the coordinates).
  """
  address: String
  """
  The name of its street, shown when address is null; null when none.
  """
  street: String
  """
  The name of its district (the boundary the title of the map names from the zoom 13); null when none.
  """
  district: String
}

"""
Since D-358 (placeCard): the place card of a place without a place experience.
"""
type PlaceCard {
  """
  The id of its point of interest.
  """
  placeId: String!
  """
  The name of the place.
  """
  name: String!
  """
  Its point.
  """
  point: Point!
  """
  Since D-362: its postal address as one line ("172 Boulevard Saint-Germain, 75006 Paris"), read from the cartography at
  the time of the read, never kept by the social platform; null when the cartography gives none or does not cover the
  place.
  """
  address: String
  """
  Its contents, 20 at most: the universe events to come first, then the placed posts and placed videos.
  """
  contents: [PlaceContent!]!
  """
  Since D-395 (decided on 2026-11-16; map-markers.feature, contracts/map.md § One map marker per place): for a place with a
  place experience, the section "Also here" of its place card: its place-folded posts (MapPost.foldedPlaceId, the placeId of
  this place), the placed posts (kind POSTS) and the placed videos (kind VIDEOS), 20 at most, in the order of the map
  highlights, with the exclusions of the map (never a content of an account blocked either way, applied by the read for
  the caller; the app also leaves out the accounts of hiddenAccounts by MapPost.authorId); never a universe event. Empty
  for a place without a place experience and for a place without a place-folded post.
  """
  alsoHere: [PlaceContent!]!
}

"""
Since D-358: a content of a place card: a universe event (kind EVENTS, event set) or a placed post (kind POSTS, post set) or a
placed video, a vertical clip or a long video (kind VIDEOS, post set). Since D-368, a content of a gathering sheet too
(mapGathering, MapGatheringKind.contents), with the kind FEATS: a place with a place experience (place set) or a published
experience feat (post set, its post, MapPost.placeFeatId set); placeCard never answers FEATS. Since D-393 (contracts/map.md
§ One map marker per place), the post of a published experience feat is never answered with the kind POSTS nor VIDEOS.
"""
type PlaceContent {
  """
  EVENTS, POSTS or VIDEOS; since D-368, FEATS (mapGathering only).
  """
  kind: MapKind!
  """
  The universe event as the caller reads it; null for a placed post.
  """
  event: UniverseEvent
  """
  The placed post or placed video (since D-368, or the post of a published experience feat, kind FEATS); null for a
  universe event and for a place.
  """
  post: MapPost
  """
  Since D-368 (mapGathering): a place with a place experience, kind FEATS, with its name (place.name), its place experience count
  (publishedCount) and its photo (photoUrl), as mapPlaceFeats answers it; null otherwise.
  """
  place: MapPlaceFeats
  """
  Since D-369 (mapGathering, gathering-sheet.feature, decided on 2026-11-15): for a published experience feat (kind
  FEATS, post set, MapPost.placeFeatId set), its experience instance, as the feat gallery answers it
  (PublishedFeat.instance); null otherwise.
  """
  featInstance: ExperienceInstance
  """
  Since D-369 (mapGathering): for a published experience feat, the title of its place experience (PlaceFeat.title), in the
  language of the caller, else in its first language; null otherwise.
  """
  featTitle: String
}

"""
Since D-368 (mapGathering, gathering-sheet.feature; contracts/map.md § The gathering sheet): the things of one map kind
that a touched map marker gathers: a gathering filter, its count and its first 20 gathering thumbnails.
"""
type MapGatheringKind {
  """
  POSTS (the gathering filter "Posts": the placed posts, with or without a photo), VIDEOS ("Clips": every placed video),
  FEATS ("Feats": the places with a place experience and the published experience feats) or EVENTS ("Events"). Each thing in
  one kind only: a published experience feat in FEATS, never in POSTS nor VIDEOS.
  """
  kind: MapKind!
  """
  The number of the things of that kind the map marker gathers that the caller may see, 1 or more (a kind with nothing
  is not answered): the count of its gathering filter; the gathering sheet shows "+N" after the contents, N this count
  less the number of the contents. "All" counts the sum of the kinds (and the people the app holds).
  """
  count: Int!
  """
  Its first 20 contents at most, in the order of the map highlights (each by its rank, contracts/map.md § The map
  highlights and the map kinds: a placed post or a placed video by its highlight score, a place by how lively it is then
  its place experience count, a universe event in progress first, then the next 7 days by attendees, then the soonest).
  """
  contents: [PlaceContent!]!
}

"""
Since v130.0.0 (D-412, route-guidance.feature): an entry of the route log of the caller, one route guidance of a route,
alone or in a route group session: created by its first stage check-in or stage skipped (checkInRouteStage), read by
its account only (myRouteLog), kept until its account deletes it (deleteRouteLogEntry), erases its location data (bulk
erasure LOCATION) or is deleted. Since the rulings of 2026-11-17, the backend keeps only the route, the day, done or not,
the number of stages skipped and whether it was made in a route group session: never a stage, a time of a stage
check-in nor the route group session, which stay on the phone that made them, or are erased (contracts/map.md § Route
guidance).
"""
type RouteLogEntry {
  """
  Its identifier: the UUIDv7 the app made when the route guidance started (RouteCheckInInput.guidanceId).
  """
  id: ID!
  """
  The route followed; null once the route is deleted or the caller may no longer read it (name stays).
  """
  routeId: ID
  """
  The name of the route, read by the backend from the route when the entry was created.
  """
  name: String!
  """
  How the route is travelled, read from the route when the entry was created.
  """
  mode: RouteMode!
  """
  The day the route guidance started, in the time zone of its startedAt as the app sent it.
  """
  day: AWSDate!
  """
  Whether the route was done: every stage the caller could check, checked or skipped, at least 1 checked.
  """
  done: Boolean!
  """
  The number of stages skipped ("done with <N> stages skipped").
  """
  skippedCount: Int!
  """
  Whether it was made in a route group session; which one is never kept.
  """
  inGroup: Boolean!
}

"""
Since v130.0.0 (D-412): the stage a member of a route group session reached, as the caller may see it: its name taken
by the backend from the copy of the route of the route group session, never from the app. A route without a stage the
caller sees has its start and its end as its stages ("Start", "End", the first and the last point of the line the caller
sees).
"""
type RouteCheckIn {
  """
  The stage, by its index among the points of the route of the route group session (Stage.index).
  """
  stage: Int!
  """
  The name of the stage in the route of the route group session; empty for a start or an end, which the app names in
  the language of the person.
  """
  name: String!
  """
  When the member checked in, on their device (made without network too).
  """
  at: AWSDateTime!
}

"""
Since v130.0.0 (D-412): a page of the route log of the caller, the latest route guidance first.
"""
type RouteLogPage {
  """
  The route log entries of the page.
  """
  items: [RouteLogEntry!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
}

"""
Since v130.0.0 (D-412, route-guidance.feature): a stage check-in or a stage skipped to record (checkInRouteStage), sent at
the touch, or once the network is back with the time of the touch. guidanceId: the UUIDv7 the app made when the route
guidance started, the identifier of its route log entry; routeId: the route followed (read by the backend when the
entry is created, ROUTE_NOT_FOUND when the caller may not read it then); startedAt: when the route guidance started,
at most 24 hours before the first stage check-in of the entry; sessionId: the route group session the caller joined, if
any; stage: the stage (Stage.index; for a route without a stage the caller sees, the first or the last point of the
line the caller sees); skipped: true for "Skip this stage" (false when not given); done: true when this settles the
last stage the caller could check (false when not given); at: the time of the touch, on the device. No name is taken
from the app. Since v136.2.0 (route-experiences.feature): runId, the experience instance of a route experience this
route guidance belongs to (its guidanceId or its route group session), if any: done ends the experience result of the
caller SUCCESS (DEVICE_CHECKED, with the stages skipped); nothing more is kept than the route log keeps: done or
not, the stages skipped and the day, never a time (EXPERIENCE_RUN_NOT_FOUND when the caller takes no part in it).
"""
input RouteCheckInInput {
  guidanceId: ID!
  routeId: ID!
  startedAt: AWSDateTime!
  sessionId: ID
  stage: Int!
  skipped: Boolean
  done: Boolean
  at: AWSDateTime!
  runId: ID
}

"""
Since v130.0.0 (D-412, route-group-sessions.feature): a route group session, as the caller reads it: the line and the
stages of its route as they were when it started (route), served with the privacy zones of its author as they are now
(the parts and the stages they hide left out for every caller but its author), its group chat (discussion) or its
universe event (eventId, universe), who started it, its end, and its members with the stage each reached, between two
members where one blocked the other left out. Hidden from a caller in a block with who started it
(ROUTE_SESSION_NOT_FOUND). Erased at its end (contracts/map.md § Route guidance).
"""
type RouteGroupSession {
  """
  The identifier of the route group session.
  """
  id: ID!
  """
  The line and the stages of the route as they were when the route group session started, as the caller reads them
  now (the privacy zones of its author as they are now).
  """
  route: Route!
  """
  The name of the route when the route group session started.
  """
  name: String!
  """
  The route; null once deleted or no longer readable by the caller (route stays).
  """
  routeId: ID
  """
  The group chat it was started from; null for a universe event.
  """
  discussion: DiscussionRef
  """
  The universe event it was started from; null for a group chat.
  """
  eventId: ID
  """
  The universe of its universe event ("%paris"); null for a group chat.
  """
  universe: String
  """
  The member who started it (who ends it for everyone, with the event organizer of its universe event).
  """
  startedBy: AccountRef!
  """
  When it started.
  """
  startedAt: AWSDateTime!
  """
  When it ends: 8 hours after startedAt, or the end of its universe event when that comes first (a universe event moved
  moves it, never beyond 8 hours after startedAt).
  """
  endsAt: AWSDateTime!
  """
  The number of its members, 1 to 50.
  """
  memberCount: Int!
  """
  Its members and the stage each reached, the earliest joined first, 50 at most: for a member only (empty for a caller
  who did not join it: a member of its group chat, an attendee, the event organizer of its universe event, who read it
  as a card), without the members the caller blocked or who blocked the caller.
  """
  members: [RouteSessionMember!]!
  """
  Whether the caller is a member of it.
  """
  joined: Boolean!
}

"""
Since v130.0.0 (D-412): a member of a route group session and the stage they reached.
"""
type RouteSessionMember {
  """
  The member.
  """
  account: AccountRef!
  """
  When they joined.
  """
  joinedAt: AWSDateTime!
  """
  The last stage they checked that the caller sees, with its time, never a stage skipped nor a stage (or a start or an
  end) that the privacy zones of the author of the route hide from the caller; null when there is none.
  """
  reached: RouteCheckIn
}

"""
Since v130.0.0 (D-412, route-group-sessions.feature): a route group session to start (startRouteGroupSession): exactly
one of discussion (a group chat the caller is a member of, with routeId, a route the caller may read) and eventId (a
universe event the caller attends, on its day, that carries a route; routeId not given); INVALID_REQUEST otherwise.
"""
input RouteGroupSessionInput {
  discussion: DiscussionRefInput
  eventId: ID
  routeId: ID
}

"""
Since v130.0.0 (D-412): the marker a route group session started from a group chat leaves in it (a message), its card
for every member of the group chat: its route, its number of members, from when to when; "ended" once over, "endsAt"
then when it ended. Never who reached which stage. Nothing else of the route group session stays.
"""
type RouteSessionMarker {
  """
  The identifier of the route group session (routeGroupSession(id) while it is in progress).
  """
  id: ID!
  """
  The name of its route.
  """
  name: String!
  """
  When it started.
  """
  startedAt: AWSDateTime!
  """
  When it ends, or when it ended.
  """
  endsAt: AWSDateTime!
  """
  Whether it ended.
  """
  ended: Boolean!
  """
  Its number of members (a ruling of 2026-11-17): as it is when the message is read, the number at its end once ended.
  """
  memberCount: Int!
}

"""
The nature of a saved item of My places (since v129.1.0, D-411, map/my-places.feature; contracts/map.md § My places):
PLACE, a point of interest of the cartography, with or without a place experience (targetId: its placeId); FEAT, a published
experience feat (targetId: the id of its experience instance); EVENT, a universe event (targetId: its id); ROUTE, a
route (targetId: its id). Never a post. A client shows an unknown nature as a PLACE.
"""
enum SavedItemKind {
  EVENT
  FEAT
  PLACE
  ROUTE
}

"""
The color of a My places tag (since v129.1.0, D-411): one of the 8 ambiance colors of the social platform
(customize-universe.feature), a color token of the design system. A client shows an unknown color as SLATE.
"""
enum MyPlacesTagColor {
  AUBERGINE
  BRICK
  FOREST
  INK
  LAGOON
  MUSTARD
  OLIVE
  SLATE
}

"""
A starting My places tag (since v129.1.0, D-411): TO_TRY ("To try") and DONE ("Done"), which every account has from
the start; the apps show them in the language of the reader until they are renamed.
"""
enum MyPlacesStarterTag {
  DONE
  TO_TRY
}

"""
A My places tag of the caller (since v129.1.0, D-411, map/my-places.feature): a label of My places that plays the
role of a list; read by its owner only.
"""
type MyPlacesTag {
  """
  The identifier of the My places tag.
  """
  id: ID!
  """
  Its name, in its canonical form, without "#" (the rules of a tag: TAG_INVALID); for a starting tag never renamed,
  its English name ("to-try", "done"), shown translated (starter).
  """
  name: String!
  """
  Its color, one of the 8 ambiance colors; AUBERGINE (magenta) for "To try" and FOREST (green) for "Done" at the
  start.
  """
  color: MyPlacesTagColor!
  """
  TO_TRY or DONE for a starting tag never renamed (the apps show it in the language of the reader); null for another
  tag and once renamed.
  """
  starter: MyPlacesStarterTag
  """
  The number of saved items that carry it ("To try · 14").
  """
  itemCount: Int!
  """
  The playlist of the playlist form MAP that shares it (shareMyPlaces); null when it is not shared.
  """
  playlist: Playlist
}

"""
A saved item of My places of the caller (since v129.1.0, D-411, map/my-places.feature): what it saved from a card or
a sheet of the map, read by its owner only.
"""
type SavedItem {
  """
  The identifier of the saved item.
  """
  id: ID!
  """
  The nature of the thing saved.
  """
  kind: SavedItemKind!
  """
  The identifier of the thing saved, by its nature (SavedItemKind).
  """
  targetId: String!
  """
  Whether the thing still exists for the caller: false once deleted by its author, removed by the moderation or by
  the platform team, or no longer readable by the caller; the apps then show "no longer exists", with its tags and
  its note only, and draw it on no map.
  """
  exists: Boolean!
  """
  The name of the thing (the name of a place or of a route, the title of a universe event, the place experience of an
  experience feat), as the caller may read it when read; null when it no longer exists. Since D-418, for a route, its
  route title, else its name (map/route-findability.feature).
  """
  name: String
  """
  Its point on the map, read when read: the point of interest of a place, the place of an experience feat, the point of
  a universe event (the center of its zone without one), the route start marker of a route as the caller sees it; null
  when it no longer exists or has no point. The apps compute the distance from it on the device.
  """
  point: Point
  """
  The H3 cell of resolution 9 of its point, as point; null with it.
  """
  mapCell: String
  """
  For a universe event, its end, so that the proximity alert leaves it out once over; null otherwise.
  """
  endsAt: AWSDateTime
  """
  When the starting tag DONE ("Done", renamed or not) was put on it: the row shows "done on <date>"; null when it
  does not carry it.
  """
  doneAt: AWSDateTime
  """
  Its My places tags, 0 to 5, in the order put.
  """
  tags: [MyPlacesTag!]!
  """
  Its My places note, 0 to 500 visible characters; an empty string when none. Never shared.
  """
  note: String!
  """
  When it was saved.
  """
  savedAt: AWSDateTime!
}

"""
A page of saved items (since v129.1.0, D-411).
"""
type SavedItemPage {
  """
  The saved items of the page.
  """
  items: [SavedItem!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
  """
  The number of saved items the read answers in all, every page together ("In the area · 4", "In common with @alice ·
  3").
  """
  total: Int!
}

"""
A saved item of a playlist of the playlist form MAP, as its reader may read it (since v129.1.0, D-411): never its My
places note nor its other My places tags.
"""
type MapPlaylistItem {
  """
  The nature of the thing saved.
  """
  kind: SavedItemKind!
  """
  The identifier of the thing saved.
  """
  targetId: String!
  """
  Its name, as the reader may read it.
  """
  name: String!
  """
  Its point as the reader sees it, as SavedItem.point: for a route, its route start marker for that reader, at the
  edge of the privacy zones of its author (routes.feature); null when it has none.
  """
  point: Point
  """
  Whether the reader saved it too (In common), for a playlist the reader opened or follows; false otherwise.
  """
  inCommon: Boolean!
}

"""
A page of the saved items of a playlist of the playlist form MAP (since v129.1.0, D-411).
"""
type MapPlaylistItemPage {
  """
  The saved items of the page, the latest saved first.
  """
  items: [MapPlaylistItem!]!
  """
  The cursor of the next page; null on the last.
  """
  next: String
  """
  The number of saved items the read answers in all.
  """
  total: Int!
}

"""
What to save to My places (since v129.1.0, D-411, saveToMyPlaces): the nature and the identifier of the thing, its My
places tags (0 to 5, by id; none by default) and its My places note (none by default).
"""
input SaveToMyPlacesInput {
  kind: SavedItemKind!
  targetId: String!
  tagIds: [ID!]
  note: String
}

"""
The changes of a saved item (since v129.1.0, D-411, updateSavedItem): a field not given stays; tagIds replaces its My
places tags, 0 to 5 (MY_PLACES_TAGS_TOO_MANY); note, 0 to 500 visible characters (MY_PLACES_NOTE_TOO_LONG), an empty
string removes it.
"""
input SavedItemChangeInput {
  tagIds: [ID!]
  note: String
}
