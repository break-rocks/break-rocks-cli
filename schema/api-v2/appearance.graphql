argument (ThemeRefInput): { universe, name }, "version" and "deleted" ignored.
"""
type ThemeRef {
  """
  Whether it is deleted.
  """
  deleted: Boolean!
  """
  The name of the theme ref.
  """
  name: String!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String
  """
  Its version, which grows at each publication.
  """
  version: Int
}

"""
A theme by its universe and its name (and a version).
"""
input ThemeRefInput {
  """
  Whether it is deleted.
  """
  deleted: Boolean
  """
  The name of the theme ref input.
  """
  name: String!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String
  """
  Its version, which grows at each publication.
  """
  version: Int
}

"""
The typefaces of a theme: its title typeface and its accent typeface.
"""
type ThemeTypography {
  """
  The accent color.
  """
  accent: String
  """
  Its title.
  """
  title: String!
}

"""
What a theme of the catalog is used for: a personal theme or a universe theme.
"""
enum ThemeUse {
  PERSONAL
  UNIVERSE
}

"""
The variant of a theme: day or night.
"""
enum ThemeVariant {
  DAY
  NIGHT
}

"""
Themes (themes.feature; contracts/themes.md). A title typeface approved by the social platform
(Google Fonts, free: OFL-1.1 or Apache-2.0), with its category and scripts.
"""
type Typeface {
  """
  Its category (serif, sans-serif, display…).
  """
  category: String!
  """
  Its license.
  """
  license: String!
  """
  The name of the typeface.
  """
  name: String!
  """
  The scripts it covers.
  """
  scripts: [String!]!
  """
  Where the typeface is served from.
  """
  source: AWSURL!
}

"""
A universe theme trial (since v54.0.0, contracts/themes.md § Universe theme trials and draft
previews): the studio draft of a theme served to every reader of "universe" (and of its
sub-universes that take its theme) for 24 hours, validated as at publication: "document" the
theme object (format 2, its scrims and text scrims computed) with "imageMeta" (the widths of its
images by upload id); "version" changes at each valid save (the key of the caches).
"""
type UniverseThemeTrial {
  """
  Its document (JSON), as published.
  """
  document: AWSJSON!
  """
  The identifier of the studio draft.
  """
  draftId: ID!
  """
  When it ends.
  """
  endsAt: AWSDateTime!
  """
  When it started.
  """
  startedAt: AWSDateTime!
  """
  Who started it, as shown.
  """
  startedBy: AccountRef!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
  """
  Its version, which grows at each publication.
  """
  version: Int!
}

"""
The watermark of a universe (universe-identity.feature): its universe image (LOGO) or a text (the name of the
universe by default); as an argument: WatermarkInput.
"""
type Watermark {
  """
  The kind of the watermark.
  """
  kind: WatermarkKind!
  """
  Its orientation.
  """
  orientation: WatermarkOrientation!
  """
  The text as written.
  """
  text: String
}

"""
What the watermark of a universe shows: its logo or a text.
"""
enum WatermarkKind {
  LOGO
  TEXT
}

"""
The orientation of a watermark.
"""
enum WatermarkOrientation {
  HORIZONTAL
  VERTICAL
}

"""
A watermark: a logo or a text, and its orientation.
"""
input WatermarkSettingInput {
  """
  The kind of the watermark setting input.
  """
  kind: WatermarkKind!
  """
  Its orientation.
  """
  orientation: WatermarkOrientation
  """
  The text as written.
  """
  text: String
}
