  Since v87.3.0 (D-266, contracts/advertising.md § Declared ad interests): a human of full age turns its declared
  ad interests on with 0 to 10 of them, or off, which erases them at once ("interests" then ignored). Errors:
  ADS_NOT_OPEN (ads.declaredInterests off), AD_INTERESTS_NOT_ALLOWED (a minor), AD_INTEREST_INVALID (more than 10,
  or one twice).
  """
  setAdInterests(enabled: Boolean!, interests: [AdInterest!]!, requestId: ID!): AdInterestSettings

  """
  Advertising: send a campaign to the review of creatives. Errors: AD_CAMPAIGN_NOT_FOUND, AD_BUDGET_REQUIRED,
  IDENTITY_NOT_VERIFIED.
  """
  submitAdCampaign(campaignId: ID!, requestId: ID!): AdCampaign

