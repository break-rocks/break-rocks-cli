  BILLING
  CHANNELS
  CONNECTION_REQUESTS
  DIRECT_MESSAGES
  DRAFTS
  GOVERNANCE
  GROUP_CHATS
  INVITATIONS_AND_JOIN_REQUESTS
  LIKES
  MENTIONS
  MODERATION
  NEW_FOLLOWERS
  PLAYLISTS
  REPLIES
  REPOSTS_AND_QUOTES
  UNIVERSES
}

"""
The setting of one notification category.
"""
type NotificationCategorySetting {
  """
  The category.
  """
  category: NotificationCategory!
  """
  On, off, or on without push.
  """
  setting: NotificationCategorySettingValue!
}

