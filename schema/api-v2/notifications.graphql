"""
What becomes of the connection requests sent for agent operators: answered by the person, accepted, or
declined silently. The values stay in lowercase, as stored.
"""
enum AgentRequests {
  answer
  accept
  decline
}

"""
The screen mode chosen on one device (since v80.0.0, universe-frame-modes.feature).
"""
type DeviceFrameMode {
  """
  The device (its identifier, the header x-device-id).
  """
  device: String!
  """
  The screen mode.
  """
  frameMode: FrameMode!
}

"""
Do-not-disturb hours: no push from "start" (included) to "end" (excluded), "HH:MM" in the IANA time zone
"timeZone".
"""
type DoNotDisturb {
  """
  When they end (HH:mm).
  """
  end: String!
  """
  When they start (HH:mm).
  """
  start: String!
  """
  The IANA time zone.
  """
  timeZone: String!
}

"""
The do-not-disturb hours: start and end (HH:mm), in a time zone.
"""
input DoNotDisturbInput {
  end: String!
  start: String!
  """
  The IANA time zone.
  """
  timeZone: String!
}

"""
The screen mode of the universe screen (since v80.0.0, universe-frame-modes.feature, contracts/layouts.md §
The screen modes): STANDARD (the default), IMMERSIVE, READING, since v80.2.0, ONE_HAND (drawn as STANDARD
on a tablet and a desktop) and, since v80.4.0, CUSTOM (the frame document UniverseFrameSettings.frame,
contracts/layouts.md § The custom mode). Since v96.0.0 (D-289) the custom mode is withdrawn: the apps no longer
send CUSTOM and read it as STANDARD; the backend answers a stored CUSTOM as STANDARD. An app that receives a
value it does not know draws STANDARD.
"""
enum FrameMode {
  STANDARD
  IMMERSIVE
  READING
  ONE_HAND
  CUSTOM
}

"""
Who can invite the caller to group chats: the accounts connected with it, nobody, or the connected accounts
except a list (myAccounts(list: INVITE_EXCEPTIONS)). The values stay in lowercase, as stored.
"""
enum InvitePolicy {
  connections
  nobody
  except
}

"""
The settings of direct messages and group chats: who can send connection requests, whether they are
accepted automatically, what becomes of those sent for agent operators, the default silent decline (the
connection requests and invitations the settings refuse are declined silently instead), who can invite to
group chats, and the read receipts.
"""
type MessagingSettings {
  """
  Who can send connection requests.
  """
  requestPolicy: RequestPolicy!
  """
  Whether connection requests are accepted automatically.
  """
  autoAccept: Boolean!
  """
  What becomes of the connection requests sent for agent operators.
  """
  agentRequests: AgentRequests!
  """
  Whether the requests and invitations the settings refuse are declined silently.
  """
  silentDecline: Boolean!
  """
  Who can invite to group chats.
  """
  invitePolicy: InvitePolicy!
  """
  Read receipts, for direct messages and group chats: on by default; off, neither sent nor seen.
  """
  readReceipts: Boolean!
  """
  "Universe discussions in Messages" (since v101.0.0, D-302): ALL (by default), SOME (the universes of
  universesInMessages) or NONE.
  """
  universeDiscussions: UniverseDiscussionsInMessages!
  """
  The universes whose universe discussions are in Messages with SOME (since v101.0.0); empty otherwise.
  """
  universesInMessages: [String!]!
  """
  The universes the caller blocked in Messages (since v101.0.0, setUniverseBlockedInMessages), the most recent first.
  """
  blockedUniverses: [String!]!
}

"""
Which universes have their universe discussions in the Universes section of Messages (since v101.0.0, D-302).
"""
enum UniverseDiscussionsInMessages {
  ALL
  NONE
  SOME
}

"""
The settings of direct messages and group chats to change; a field not given stays.
"""
input MessagingSettingsInput {
  requestPolicy: RequestPolicy
  autoAccept: Boolean
  agentRequests: AgentRequests
  silentDecline: Boolean
  invitePolicy: InvitePolicy
  readReceipts: Boolean
  universeDiscussions: UniverseDiscussionsInMessages
  """
  Since v101.0.0: the universes kept with SOME, replacing them; its bound is not written yet (README.md § To settle).
  """
  universesInMessages: [String!]
}

"""
A notice to the account. "actors": who did it, the latest first (3 at most), "count" of them
in all (likes, reposts and new followers grouped within 1 hour; 1 otherwise; none for account
security). "post": the post the actor wrote (the reply, the quote, the post that mentions);
"subject": the account's own post concerned (liked, reposted, quoted, replied to);
"message": a direct or group chat message, or the first message of a connection request;
"link": the path the notification opens in the apps. "mandatory": kept even when its category
is turned off.
"""
type Notification {
  """
  For an answer (a join request, a repost request, a transfer): whether it was accepted; null for the other
  kinds.
  """
  accepted: Boolean
  """
  FOLLOW: whether the account follows the latest actor (to follow back); false for the other kinds.
  """
  actorFollowedByMe: Boolean!
  """
  The accounts that acted, as shown, the most recent first.
  """
  actors: [AccountRef!]!
  """
  The category.
  """
  category: NotificationCategory!
  """
  CHANNEL_MESSAGE, CHANNEL_MENTION: the channel, its address as shown ("%team-fra./tech&dev").
  """
  channel: String
  """
  The other participant of the conversation; null otherwise.
  """
  conversationWith: ID
  """
  How many events it groups.
  """
  count: Int!
  """
  When it was created.
  """
  createdAt: AWSDateTime!
  """
  DATA_COPY_READY, BULK_ERASURE_DONE, DATA_REQUEST_ANSWERED (since v68.1.0): the data request.
  """
  dataRequest: NotificationDataRequest
  """
  Days left: before a deleted private universe is deleted for good, before an inactive one is
  deleted; SUBSCRIPTION_ENDS_SOON: before the due date of the subscription (7 or 1).
  """
  days: Int
  """
  POST_DRAFT_EXPIRES_SOON, SCHEDULED_POST_FAILED (since v85.1.0): the post draft.
  """
  draftId: ID
  """
  SCHEDULED_POST_FAILED (since v85.1.0): the error code of the failure (PostDraft.failure.code).
  """
  draftFailure: String
  """
  UNIVERSE_DEBATE_OPENED: the debate, its address ("%paris&quiet-nights"; its subject is "subject").
  """
  debate: String @deprecated(reason: "Use discussion (since v84.4.0, D-222).")
  """
  UNIVERSE_DEBATE_OPENED (since v84.4.0, D-222): the temporary universe discussion opened, its address
  ("%paris&quiet-nights"; its subject is "subject"); the same value as debate.
  """
  discussion: String
  """
  EVENT_REMINDER, EVENT_CHANGED, EVENT_CANCELLED: the universe event (its title is "subject"; none once
  cancelled); EVENT_CHANGED: its start and place now.
  """
  eventId: ID
  """
  The place of the universe event; null otherwise.
  """
  eventPlace: String
  """
  When the universe event starts; null otherwise.
  """
  eventStartsAt: AWSDateTime
  """
  EVENT_CHANGED (since v47.1.0): the zone of the event while it hides its place (never the hidden place);
  EVENT_PLACE_REVEALED: the place revealed is "eventPlace".
  """
  eventZone: Zone
  """
  The group chat, as shown; null otherwise.
  """
  group: GroupRef
  """
  The identifier of the notification.
  """
  id: ID!
  """
  The kind of the notification.
  """
  kind: NotificationKind!
  """
  The governance level.
  """
  level: GovernanceLevel
  """
  Where it leads in the app (a path).
  """
  link: String!
  """
  Whether it cannot be turned off (account security, moderation).
  """
  mandatory: Boolean!
  """
  PLATFORM_MEASURE (since v49.8.0): the measure and its statement of reasons ("universe" its universe,
  "subject" what it concerned).
  PLATFORM_APPEAL_DECIDED (since v85.0.0, D-250): the measure appealed (measureId, kind), the outcome and its
  reasons (appealOutcome, appealReasons).
  PLATFORM_APPEAL_OVERDUE (since v99.1.0, M-12): the measure appealed (measureId, kind), when it was appealed
  (appealedAt) and since when its platform appeal has waited 14 days without a decision (overdueSince).
  """
  measure: NotificationMeasure
  """
  Since v49.16.0: MEET_UP_SOON, the meet-up (its title, or its place, is "message"); a
  DIRECT_MESSAGE or GROUP_MESSAGE of a meet-up sent, changed or cancelled, the same.
  """
  meetUp: NotificationMeetUp
  """
  The message it tells about; null otherwise.
  """
  message: NotificationSnippet
  """
  The note; null when none.
  """
  note: String
  """
  The post.
  """
  post: NotificationSnippet
  """
  UNIVERSE_ANNOUNCEMENT: the announcement (its start is "subject", its author the actor).
  """
  postId: ID
  """
  A universe alert: the proposal (its vote, its second round, its result), the new governance level.
  """
  proposalId: ID
  """
  The rank reached (a vote, a milestone); null otherwise.
  """
  rank: Int
  """
  Whether the caller read it.
  """
  read: Boolean!
  """
  REPORT_DECIDED (since v99.1.0, M-09): the decision of the platform team on a report of the reader ("subject"
  the content as reported); null otherwise.
  """
  report: NotificationReport
  """
  SANCTION_POST_REMOVAL, SANCTION_POSTING_BAN and, since v92.0.0, SANCTION_MEDIA_MASK: the sanction (the removed
  or masked post is "subject"; the universe is "universe").
  """
  sanction: NotificationSanction
  """
  MASK_REQUESTED (since v92.0.0, D-284): the mask request to answer (answerMaskRequest); null otherwise.
  """
  maskRequestId: ID
  """
  PROJECT_NOTE (since v46.0.0): the status the leadership set and its note ("subject": the title of the
  project, "proposalId" its proposal).
  """
  status: ProjectStatus
  """
  The subject.
  """
  subject: NotificationSnippet
  """
  TIER_PRICE_CHANGE (since v68.3.0): the tier, its new price, when it applies ("universe" its universe).
  """
  tierPrice: NotificationTierPrice
  """
  Private universes: the universe (its display name; for PRIVATE_POST_REPOSTED, the public
  universe of the repost), the rank of a successor, the answer to a repost request.
  """
  universe: String
  """
  When it was last updated.
  """
  updatedAt: AWSDateTime!
  """
  CONNECTION_REQUEST, GROUP_INVITATION: still waiting for the account's answer (it can accept it); false for
  the other kinds.
  """
  waiting: Boolean!
}

