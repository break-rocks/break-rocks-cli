"""
What can be written. Every root field is a line of the operation table of the backend, counted by the usage
step. Every mutation takes requestId: ID!, the idempotency key of the request: a UUIDv7 made by the app
(REQUEST_ID_INVALID when it is not a UUID, before any function runs), but the four ephemeral signals
typing, sendLivePositions, recordClipPlays and watch, which take none (README.md § Idempotency). A creation
played again with the same requestId answers what it created the first time and creates nothing more; a
toggle or a setting writes the state wanted, so playing it again gives the same state.
"""
type Mutation {
  """
  Cancels a bulk erasure within its 24 hours. Errors: BULK_ERASURE_NOT_CANCELLABLE, DATA_REQUEST_NOT_FOUND.
  """
  cancelBulkErasure(dataRequestId: ID!, requestId: ID!): DataRequest

  """
  Changes the handle of the caller, at most once every 24 hours (HANDLE_CHANGED_RECENTLY); the former handle
  is set aside for its holder 7 days. The handle codes. Returns the account.
  """
  changeHandle(handle: String!, requestId: ID!): Account

  """
  Changes the password (the current one checked by Cognito, its rules applied): every session of
  the account ends ("session.ended", PASSWORD_CHANGED, with "exceptSession" the origin_jti of the
  caller's token): the calling app signs in again with the new password, the others sign out.
  Errors: PASSWORD_WRONG, PASSWORD_INVALID, TOO_MANY_ATTEMPTS.
  """
  changePassword(currentPassword: String!, newPassword: String!, requestId: ID!): Boolean

  """
  The secret of the link of the deletion confirmation ("token" of /me/account/delete), by the
  account signed in: deleted at once and for good, every session ends ("session.ended",
  ACCOUNT_DELETED). Errors: DELETION_CONFIRMATION_EXPIRED (after 24 hours), DELETION_CONFIRMATION_INVALID.
  """
  confirmAccountDeletion(token: String!, requestId: ID!): AccountDeletion

  """
  The code received at the new address: it becomes the account's email address. Errors:
  EMAIL_CHANGE_CODE_INVALID, EMAIL_CHANGE_CODE_EXPIRED, TOO_MANY_ATTEMPTS (5 wrong codes: ask
  again), EMAIL_UNAVAILABLE (another account took it meanwhile).
  """
  confirmEmailChange(code: String!, requestId: ID!): Boolean

  """
  Connects with the account of the NFC token read from its phone (contracts/invitations.md). Returns the state
  of the connection.
  """
  confirmNfcConnection(token: String!, requestId: ID!): NfcConnection

  """
  A command-line sign-in code for the command-line client of the same computer (a human signed
  in: Cognito token): one-time, 5 minutes, bound to the account, its cell and "challenge" (the S256
  of the verifier the command-line client keeps: 43 characters base64url); "label" (at most 64
  visible characters, longer cut) names the device. The command-line client exchanges it through
  the CUSTOM_AUTH flow of the user pool client: InitiateAuth (USERNAME) then RespondToAuthChallenge
  (CUSTOM_CHALLENGE, ANSWER "<code>.<verifier>"); 3 wrong answers invalidate the code; the session
  is an ordinary one (signOutEverywhere closes it). Errors: CLI_CHALLENGE_INVALID,
  TOO_MANY_REQUESTS (10 codes in any hour).
  """
  createCliSignInCode(challenge: String!, label: String, requestId: ID!): CliSignInCode

  """
  An agent operator creates a delegated agent with a name and its restrictions, within its allowance
  (DELEGATED_AGENT_ALLOWANCE_REACHED, DELEGATED_AGENT_CREATIONS_REACHED). Returns its credentials: the private
  key is shown once.
  """
  createDelegatedAgent(interactions: [DelegatedAgentInteraction!], name: String!, universes: [String!], requestId: ID!): DelegatedAgentCredentials

  """
  An agent operator deletes one of its delegated agents (agentId). Returns it as it was.
  """
  deleteDelegatedAgent(agentId: ID!, requestId: ID!): DelegatedAgent

  """
  HELP_GETTING_STARTED_OPENED (the article "getting-started" opened) completes DISCOVER_THE_PLATFORM;
  ADDRESS_VISITED changes nothing since v41.0.0.
  """
  recordOnboardingActivity(address: String, kind: OnboardingActivity!, requestId: ID!): Onboarding

  """
  An agent operator replaces the credentials of one of its delegated agents (agentId): the former key stops
  working. Returns the new credentials: the private key is shown once.
  """
  regenerateDelegatedAgentCredentials(agentId: ID!, requestId: ID!): DelegatedAgentCredentials

  """
  Replaces the personal invitation link of the caller: the former link no longer works. Returns the new link.
  """
  renewPersonalInvitationLink(requestId: ID!): PersonalInvitationLink

  """
  A human asks for the deletion, naming its handle (any case, with or without "@") and, for each
  private universe it owns, the member it appoints as next owner (none: that universe is deleted
  like a private universe deleted by its owner); a deletion confirmation goes to its email
  address, in "locale" (the app's language) when given. Errors: HANDLE_NOT_YOURS,
  NEW_OWNER_MUST_BE_MEMBER, ONLY_OWNER_TRANSFERS, PRIVATE_UNIVERSE_NOT_FOUND, TRANSFER_TO_SELF,
  PRIVATE_UNIVERSES_OWNED_LIMIT, SUCCESSORS_INVALID. An agent operator deletes its account on the agents host.
  """
  requestAccountDeletion(handle: String!, locale: String, successors: [AccountDeletionSuccessorInput!], requestId: ID!): AccountDeletionRequest

  """
  A signed form to upload the avatar of the caller: a JPEG, PNG or WebP image (AVATAR_TYPE_NOT_SUPPORTED);
  then updateProfile with its id as avatar.
  """
  requestAvatarUpload(contentType: String!, requestId: ID!): MediaUpload

  """
  Asks for the bulk erasure of a scope: hidden at once, cancellable 24 hours, then erased for good.
  Errors: RECENT_SIGN_IN_REQUIRED, BULK_ERASURE_IN_PROGRESS (one of the same scope still cancellable).
  """
  requestBulkErasure(scope: BulkErasureScope!, requestId: ID!): DataRequest

  """
  Asks for a data copy, prepared apart; "locale" (BCP 47) the language of its viewer and of its
  email. Errors: RECENT_SIGN_IN_REQUIRED, DATA_COPY_IN_PROGRESS, DATA_COPY_TOO_SOON (errorInfo.availableAt).
  """
  requestDataCopy(locale: String, requestId: ID!): DataRequest

  """
  A new email address: a 6-digit code goes to it (valid 24 hours); the current address stays the
  one that signs in until the code is confirmed. The same answer when another account uses the
  address (its holder is warned by email). Errors: EMAIL_INVALID.
  Since specs v67.0.0 (D-177 (1)): "challenge", the S256 challenge of the verifier the device keeps:
  the email carries the email code link (/auth/change-email#…), and the code is answered
  "<code>.<verifier>" by the session that asked.
  """
  requestEmailChange(challenge: String, email: String!, locale: String, requestId: ID!): Boolean

  """
  A rectification request to the platform team, answered within 1 month. Errors: RECTIFICATION_TEXT_EMPTY,
  RECTIFICATION_TEXT_TOO_LONG.
  """
  requestRectification(input: RectificationInput!, requestId: ID!): DataRequest

  """
  Every session of the caller ends (a human only: Cognito token; delegated agents' sessions
  are not concerned): signed out everywhere, its refresh tokens revoked, and every app of the
  account told by the real-time updates ("session.ended") to close and sign out.
  """
  signOutEverywhere(requestId: ID!): Boolean

  """
  The caller skips the onboarding. Returns the onboarding.
  """
  skipOnboarding(requestId: ID!): Onboarding

  """
  The caller starts the onboarding. Returns the onboarding.
  """
  startOnboarding(requestId: ID!): Onboarding

  """
  Changes the profile of the caller (input), checked against the values the app started from (expected:
  CHANGED_MEANWHILE for a field changed meanwhile, the others change). The profile codes. Returns the account.
  """
  updateProfile(expected: ProfileExpectedInput, input: ProfileUpdateInput!, requestId: ID!): Account

  """
  Follows an address (following true: an account everywhere "@bob", an account in a universe "@bob%paris",
  a universe) or stops (false) (C-2). FOLLOW_SELF, FOLLOW_TAG, FOLLOW_UNIVERSE_ALONE, FOLLOW_NOT_ALLOWED,
  ADDRESS_TWO_UNIVERSES, UNBLOCK_FIRST, INTERACTION_BLOCKED, PRIVATE_UNIVERSE_MEMBERS_ONLY, the universe
  name codes. Returns the follow; null once stopped.
  """
  setFollow(address: String!, following: Boolean!, requestId: ID!): Follow

  """
  Blocks an account (blocked true) or unblocks it (C-2). BLOCK_SELF, ACCOUNT_NOT_FOUND. Returns where the
  caller stands with it.
  """
  setBlock(accountId: ID!, blocked: Boolean!, requestId: ID!): ConnectionState

  """
  Mutes an account (muted true) or unmutes it (C-2): its posts, reposts and replies hidden from the caller
  only. MUTE_SELF, ACCOUNT_NOT_FOUND. Returns where the caller stands with it.
  """
  setMute(accountId: ID!, muted: Boolean!, requestId: ID!): ConnectionState

  """
  Adds an account to the exceptions of who can invite the caller (excepted true; invitePolicy "except",
  1,000 at most) or removes it (C-2). Returns the account.
  """
  setInviteException(accountId: ID!, excepted: Boolean!, requestId: ID!): AccountRef

  """
  Changes a delegated agent of the caller (C-7): its name (the delegated agent name codes), suspended or
  reactivated, its restrictions (DELEGATED_AGENT_UNIVERSES_TOO_MANY). DELEGATED_AGENT_NOT_FOUND,
  DELEGATED_AGENT_DEACTIVATED, DELEGATED_AGENT_CANNOT_MANAGE_AGENTS. Returns the delegated agent.
  """
  changeDelegatedAgent(agentId: ID!, input: DelegatedAgentChangeInput!, requestId: ID!): DelegatedAgent

  """
  A token to connect by NFC (P-2, G-13: was nfcConnectionToken), valid until expiresAt
  (contracts/invitations.md).
  """
  createNfcToken(requestId: ID!): ConnectionToken

  """
  The moderation of a universe answers a request to repost a post of a private universe into it
  (repostRequestId): accept true reposts it. Returns the request.
  """
  answerRepostRequest(accept: Boolean!, repostRequestId: ID!, universe: String!, requestId: ID!): RepostRequest

  """
  A moderator approves the post of a restricted author waiting for approval: it is published. Returns the
  post.
  """
  approvePost(postId: ID!, requestId: ID!): Post

  """
  The author changes the text of its post, as the edit window and its versions allow (versions keeps the
  former texts). images (since v78.0.0, D-214, automatic-alternative-text.feature): the alternative texts of
  its images to change (id: Image.id; alt: its new text, none to erase it), the others unchanged; within the
  same edit window, the post then shown as changed, versions keeping the former alternative texts
  (PostVersion.images); IMAGE_NOT_FOUND (not an image of the post), IMAGE_ALT_TOO_LONG. Returns the post.
  """
  changePost(images: [ImageAttachmentInput!], postId: ID!, text: String!, requestId: ID!): Post

  """
  Posts a text, images (at most 4) or a clip (never both: POST_IMAGES_AND_CLIP), or both a text and media, in
  a universe (universe: a posting address; none: the personal space). clip: a video uploaded with
  requestMediaUpload (VIDEO); images: uploaded with requestMediaUpload (IMAGE); link: the link whose preview
  the author accepted; replyPolicy: who can reply; announcement: an announcement of the leadership. requestId
  is the idempotency key, and the post is "<cell>-<requestId>" (Post.id). The posting codes
  (contracts/errors.md). Returns the post.
  """
  createPost(announcement: Boolean, clip: ID, images: [ImageAttachmentInput!], link: String, replyPolicy: ReplyPolicy, text: String!, universe: String, requestId: ID!): Post

  """
  The author deletes its post (or the moderation, which answers its reports "content removed"). Returns the
  post, deleted.
  """
  deletePost(postId: ID!, requestId: ID!): Post

  """
  Moves a pinned post before another (before: null, to the end), with the rights of setPinnedPost. Returns the
  universe.
  """
  movePinnedPost(before: ID, postId: ID!, universe: String!, requestId: ID!): Universe

  """
  Quotes a post (postId) with a text and media, in a universe; requestId is the idempotency key, and the quote
  is "<cell>-<requestId>" (Post.id). Returns the quote.
  """
  quote(clip: ID, postId: ID!, images: [ImageAttachmentInput!], link: String, replyPolicy: ReplyPolicy, text: String!, universe: String, requestId: ID!): Post

  """
  Replies to a post or a reply (postId) with a text and media; requestId is the idempotency key, and the reply
  is "<cell>-<requestId>" (Post.id). Returns the reply.
  """
  replyTo(clip: ID, postId: ID!, images: [ImageAttachmentInput!], link: String, text: String!, requestId: ID!): Post

  """
  Reposts a post (postId), in its universe or in another one the caller may post in. Returns the repost.
  """
  repost(postId: ID!, universe: String, requestId: ID!): Post

  """
  A member asks to repost a post (postId) of its private universe into targetUniverse (a posting address),
  with text for a quote (its own text). Returns the request.
  """
  requestRepost(postId: ID!, targetUniverse: String, text: String, requestId: ID!): RepostRequest

  """
  The author of a post sets who can reply to it. Returns the post.
  """
  setReplyPolicy(postId: ID!, policy: ReplyPolicy!, requestId: ID!): Post

  """
  The author of a post, a reply or a quote writes the alternative text of one of its images (imageId) in place
  of its automatic alternative text, at any time, without the post being shown as changed
  (automatic-alternative-text.feature, since v78.0.0, D-214): it becomes the alternative text of the image
  (Image.alt, marked as changed: Image.altChanged) and Image.automaticAlt is null from then on, the automatic
  alternative text kept in the post history (Post.mediaVersions, ALT). Once per image: an image that has had an
  alternative text of its author, even erased since, answers IMAGE_ALT_ALREADY_WRITTEN (its alternative text
  changes with changePost, within the edit window). As a change of the post: POST_NOT_AUTHOR, POST_NOT_FOUND,
  POST_NOT_CHANGEABLE, POSTING_BANNED, CONDITIONS_NOT_ACCEPTED; IMAGE_NOT_FOUND (not an image of the post),
  IMAGE_ALT_TOO_LONG. Returns the post.
  """
  setImageAlt(alt: String!, imageId: ID!, postId: ID!, requestId: ID!): Post

  """
  The author of a post, a reply or a quote with a clip turns its automatic subtitles off (automaticSubtitles
  false: the clip shows no subtitles, corrected or not) or back on (automatic-subtitles.feature, since v78.0.0,
  D-214), at any time, without the post being shown as changed. As a change of the post: POST_NOT_AUTHOR,
  POST_NOT_FOUND, POST_NOT_CHANGEABLE, POSTING_BANNED, CONDITIONS_NOT_ACCEPTED; POST_WITHOUT_CLIP. Returns the
  post.
  """
  setAutomaticSubtitles(automaticSubtitles: Boolean!, postId: ID!, requestId: ID!): Post

  """
  The author of a post, a reply or a quote corrects the subtitles of its clip (cues: every subtitle cue, in the
  order of the clip), at any time, without the post being shown as changed (automatic-subtitles.feature, since
  v78.0.0, D-214): each cue changed is the text of the author, marked as corrected (SubtitleCue.corrected), the
  others staying marked as written by a platform AI agent; translated again; each correction is a version of
  the post history (Post.mediaVersions, SUBTITLES). As a change of the post: POST_NOT_AUTHOR, POST_NOT_FOUND,
  POST_NOT_CHANGEABLE, POSTING_BANNED, CONDITIONS_NOT_ACCEPTED; SUBTITLES_NOT_FOUND, SUBTITLE_CUES_INVALID,
  SUBTITLE_TOO_LONG, SUBTITLES_TOO_MANY, SUBTITLES_TOO_LONG. Returns the post.
  """
  correctSubtitles(cues: [SubtitleCueInput!]!, postId: ID!, requestId: ID!): Post

  """
  The leadership in place (or the governance of the sub-universe) unpins a pinned announcement, those of a
  former leadership included.
  """
  unpinAnnouncement(postId: ID!, universe: String!, requestId: ID!): Universe

  """
  Likes a post (liked true) or takes the like back (liked false): writes the state wanted, so playing
  it again changes nothing (api-design.md P-4). requestId is the idempotency key of the request, a
  UUID (REQUEST_ID_INVALID otherwise). Returns the post as it is now.
  """
  setLike(postId: ID!, liked: Boolean!, requestId: ID!): Post

  """
  Dislikes a post (disliked true) or takes it back (C-2): no effect on the visibility of the post nor the
  reputation of its author; its author alone sees the number. Returns the post as it is now.
  """
  setDislike(postId: ID!, disliked: Boolean!, requestId: ID!): Post

  """
  The author of a post hides a reply of its thread (hidden true) or shows it again (C-2): readable behind
  a link. NOT_A_REPLY, NOT_THREAD_AUTHOR. Returns the reply as it is now.
  """
  setReplyHidden(postId: ID!, hidden: Boolean!, requestId: ID!): Post

  """
  Pins a post (pinned true, at the end, 5 at most) or unpins it (G-9). A private universe: its owner and
  admins, a post of the universe or of a sub-universe. A public universe: its leadership from the governance
  level "village", a post or a quote of the universe or of its public sub-universes (a sub-universe: its
  governance with the power PINNED_POSTS). ALREADY_PINNED, PIN_LIMIT, NOT_PINNABLE, PIN_NOT_IN_UNIVERSE,
  ONLY_OWNER_OR_ADMINS_PIN, LEADERSHIP_ONLY, PINNED_POSTS_FROM_VILLAGE, SUB_UNIVERSE_POWER_MISSING. Returns
  the universe with its pinned posts.
  """
  setPinnedPost(postId: ID!, universe: String!, pinned: Boolean!, requestId: ID!): Universe

  """
  A signed form to upload a media (C-11), size in bytes: IMAGE (a post, a message, a universe: JPEG, PNG,
  WebP or GIF, 10 MB at most; IMAGE_TYPE_NOT_SUPPORTED), VIDEO (a clip: MP4, QuickTime or WebM, the video
  limits of the posts, 512 MB and 3 minutes; CLIP_TOO_LARGE), VOICE (audio/mp4, audio/webm or audio/ogg,
  20 MB, 15 minutes; VOICE_TOO_LARGE, VOICE_TYPE_NOT_SUPPORTED). 24 hours to use it: a media not used is then
  deleted, with the suggested alternative text of an image. The avatar keeps requestAvatarUpload. Since
  v78.0.0 (D-214), its arguments in one input (MediaUploadInput) with its media destination, kept with the
  media: the media is attached to that media destination only, and for POST in the universe declared
  (MEDIA_DESTINATION_MISMATCH otherwise, from the operation that attaches it); MEDIA_DESTINATION_INVALID.
  """
  requestMediaUpload(input: MediaUploadInput!, requestId: ID!): MediaUpload

  """
  Admins only; a description "" removes it. "expected": the values the app started from; a
  field changed meanwhile is refused (CHANGED_MEANWHILE, errorInfo.fields) while the others
  change, and the answer shows the group chat as it is.
  """
  changeGroupChat(announcement: Boolean, description: String, expected: GroupChatExpectedInput, groupChatId: ID!, membersCanInvite: Boolean, name: String, requestId: ID!): GroupChat

  """
  The owner and the admins; the members too when allowed (setChannelCreation). "name": with or without "&".
  """
  createChannel(name: String!, universe: String!, requestId: ID!): Channel

  """
  Creates a group chat with a name, a description and the accounts invited at once (invite: 19 at most, the
  creator and duplicates ignored), each invited as inviteToGroupChat invites; those refused are told in a
  partial answer (GROUP_INVITATIONS_REFUSED, errorInfo.refused: [{ accountId, code }]). Humans and delegated
  agents allowed group chats; never an agent operator itself. Returns the group chat.
  """
  createGroupChat(description: String, invite: [ID!], name: String!, requestId: ID!): GroupChat

  """
  The owner or an admin deletes a channel of a private universe, with its messages (the general channel
  stays). True once done.
  """
  deleteChannel(channel: String!, requestId: ID!): Boolean

  """
  Deletes a conversation on the side of the caller only (the other participant keeps it). True once done.
  """
  deleteConversation(accountId: ID!, requestId: ID!): Boolean

  """
  A member invites a connected account to a group chat (an admin only unless membersCanInvite), unblocking it
  first with unblock. NOT_CONNECTED, INVITATIONS_NOT_ACCEPTED, UNBLOCK_FIRST, GROUP_FULL. Returns the
  invitation.
  """
  inviteToGroupChat(accountId: ID!, groupChatId: ID!, unblock: Boolean, requestId: ID!): GroupInvitation

  """
  A member of a private universe joins one of its channels. Returns the channel.
  """
  joinChannel(channel: String!, requestId: ID!): Channel

  """
  The caller leaves a channel it joined (the general channel stays joined). Returns the channel.
  """
  leaveChannel(channel: String!, requestId: ID!): Channel

  """
  The caller leaves a group chat; when the last admin leaves, the member who joined first becomes admin. True
  once done.
  """
  leaveGroupChat(groupChatId: ID!, requestId: ID!): Boolean

  """
  The leadership orders the channels of a public universe: "name" (at the level "universe") before "before" (a
  name at that level, or an address), null: last; "&general" stays first (CHANNEL_GENERAL_FIRST, since
  v76.0.0), and moving "&general" itself changes nothing.
  """
  moveChannel(before: String, name: String!, universe: String!, requestId: ID!): Channel

  """
  The leadership of a public universe of the first level opens a channel in it or in one of its
  public sub-universes ("universe"), from the governance level "village" (CHANNEL_LEVEL_TOO_LOW),
  10 at most across its levels, archived ones included (PUBLIC_CHANNELS_LIMIT), its name free among
  the channels and the debates of the level (CHANNEL_NAME_TAKEN); LEADERSHIP_ONLY otherwise, or a
  channel proposal (fileProposal, kind CHANNEL). A private universe: as createChannel.
  """
  openChannel(name: String!, universe: String!, requestId: ID!): Channel

  """
  A moderator of the universe removes a message of a public channel, citing "article" of the charter
  (SANCTION_ARTICLE_REQUIRED, MODERATOR_ONLY): a sanction CHANNEL_MESSAGE_REMOVAL, in the moderation
  log and appealed; the message shows "deleted by a moderator". Its author deletes it with deleteMessage.
  """
  removeChannelMessage(article: Int, channel: String!, messageId: ID!, requestId: ID!): ModerationLogEntry

  """
  Either of two connected accounts ends their connection, without telling the other: the
  conversation stays readable, nobody writes in it nor changes a message (NOT_CONNECTED) until
  they connect again (the same conversation). NOT_CONNECTED when they are not connected.
  """
  removeConnection(accountId: ID!, requestId: ID!): ConnectionState

  """
  An admin removes a member from a group chat. Returns the group chat.
  """
  removeGroupChatMember(accountId: ID!, groupChatId: ID!, requestId: ID!): GroupChat

  """
  Sends a connection request to an account with a first message (text), unblocking it first with unblock;
  requestId is the idempotency key and the identifier of its message (a UUIDv7, as sendMessage). Humans and
  delegated agents allowed direct messages; never an agent operator itself. Returns where the caller stands
  with it.
  """
  requestConnection(accountId: ID!, text: String!, unblock: Boolean, requestId: ID!): ConnectionState

  """
  The owner and the admins forbid delegated agents in a channel (or allow them again).
  """
  setChannelAgents(channel: String!, forbidden: Boolean!, requestId: ID!): Channel

  """
  The owner and the admins let the members create channels (false by default). Returns the channels of the
  universe with membersCreate.
  """
  setChannelCreation(membersCreate: Boolean!, universe: String!, requestId: ID!): ChannelList

  """
  A channel moderator, the owner or an admin sets the slow mode of a channel: seconds 10, 60 or 300; 0 turns
  it off. Returns the channel.
  """
  setChannelSlowMode(channel: String!, seconds: Int!, requestId: ID!): Channel

  """
  Either participant, while connected (NOT_CONNECTED otherwise), makes the new messages of the
  conversation ephemeral (24 hours, 7 days) or not (OFF); the messages sent before keep their
  "expiresAt". Both see it (MessagePage.ephemeral; "conversation.changed" to both).
  """
  setConversationEphemeral(accountId: ID!, duration: EphemeralDuration!, requestId: ID!): Boolean

  """
  Admins only (GROUP_ADMINS_ONLY): the new messages of the group chat ephemeral (24 hours, 7
  days) or not (OFF); the messages sent before keep their "expiresAt". Every member sees it
  (GroupChat.ephemeral; "group.changed").
  """
  setGroupChatEphemeral(duration: EphemeralDuration!, groupChatId: ID!, requestId: ID!): GroupChat

  """
  The meeting point of a group chat, kept 24 hours; null removes it; an admin only in announcement mode.
  """
  setMeetingPoint(groupChatId: ID!, place: PlaceInput, requestId: ID!): GroupChat

  """
  The pinned channels of a private universe (since v49.9.0): the owner and the admins set the whole list in
  its order, by channel
  address, at most 5 ([] unpins every channel); the universe as it is now. In a public universe, the
  leadership; its "&general" first (CHANNEL_GENERAL_FIRST, since v76.0.0).
  """
  setPinnedChannels(channels: [String!]!, universe: String!, requestId: ID!): Universe

  """
  An admin steps down to member; when the last admin steps down, the member who joined first becomes admin.
  Returns the group chat.
  """
  stepDownAsGroupChatAdmin(groupChatId: ID!, requestId: ID!): GroupChat

  """
  Answers the connection request of an account (C-4): accept true connects them; accept false declines,
  silently, or openly with a reason (openly true). Returns where the caller stands with it.
  """
  answerConnectionRequest(accountId: ID!, accept: Boolean!, openly: Boolean, reason: String, requestId: ID!): ConnectionState

  """
  Sends a message (C-3, G-2) to a conversation, a group chat or a channel: a text with images, a clip or a
  link, a voice message alone, a place, a meet-up (a human, in a conversation or a group chat) or an arrival
  notice. requestId is the idempotency key and the identifier of the message: a UUIDv7 dated less than 24
  hours ago and at most 1 minute ahead (MESSAGE_ID_INVALID; MESSAGE_ID_TAKEN for another message). The
  refusals of each discussion and content stay (contracts/errors.md § Messages, Channels, The map).
  Returns the message.
  """
  sendMessage(input: SendMessageInput!, requestId: ID!): Message

  """
  Changes the text of a message of the caller (C-3), within 15 minutes of sending it
  (MESSAGE_CHANGE_WINDOW_PASSED); not a voice message (VOICE_NOT_CHANGEABLE), a meet-up (changeMeetUp), a
  place or an arrival (MESSAGE_NOT_CHANGEABLE). MESSAGE_NOT_AUTHOR, MESSAGE_NOT_FOUND, MESSAGE_DELETED.
  Returns the message.
  """
  changeMessage(discussion: DiscussionRefInput!, messageId: ID!, text: String!, requestId: ID!): Message

  """
  Deletes a message (C-3): for everyone (its author; a group chat admin; a channel moderator), or for the
  caller only (forMe true: either participant of a conversation, any of its messages; a member of a group
  chat, any message since it joined; again: nothing changes). Returns the message as the caller sees it now.
  """
  deleteMessage(discussion: DiscussionRefInput!, messageId: ID!, forMe: Boolean, requestId: ID!): Message

  """
  The caller types in a conversation or a group chat (G-1; DISCUSSION_TARGET_INVALID for a channel):
  published at once to the other participants, not stored. An app sends it at most every 3 seconds while
  typing; it shows 5 seconds after the last one. The platform publishes at most one per caller and
  discussion every 3 seconds (the others answer true). Ephemeral: no requestId, no replay (I13).
  """
  typing(discussion: DiscussionRefInput!): Boolean

  """
  A participant answers a meet-up (ACCEPTED, DECLINED) until its time (MEET_UP_PAST), again to change the
  answer. MEET_UP_NOT_PARTICIPANT, MEET_UP_NOT_FOUND, MEET_UP_CANCELLED. Returns the meet-up.
  """
  answerMeetUp(discussion: DiscussionRefInput!, messageId: ID!, answer: MeetUpAnswerKind!, requestId: ID!): MeetUp

  """
  Its author, or a group chat admin, changes a meet-up: the whole place, time and title
  (MEET_UP_CHANGE_NOT_ALLOWED, MEET_UP_PAST; never a delegated agent). A change of the day clears every
  answer but the author's. Returns the meet-up.
  """
  changeMeetUp(discussion: DiscussionRefInput!, messageId: ID!, meetUp: MeetUpInput!, requestId: ID!): MeetUp

  """
  Its author, or a group chat admin, cancels a meet-up until its time: it stays as a message, cancelled
  true, no longer answered. Returns the meet-up.
  """
  cancelMeetUp(discussion: DiscussionRefInput!, messageId: ID!, requestId: ID!): MeetUp

  """
  Answers an invitation to a group chat (C-4): accept true joins it (GROUP_FULL, GROUP_INVITATION_EXPIRED);
  accept false declines, silently, or openly with a reason. Returns the invitation.
  """
  answerGroupChatInvitation(groupChatId: ID!, accept: Boolean!, openly: Boolean, reason: String, requestId: ID!): GroupInvitation

  """
  A group chat admin names a member admin (admin true) or removes the role (C-9). GROUP_ADMINS_ONLY.
  Returns the member.
  """
  setGroupChatAdmin(groupChatId: ID!, accountId: ID!, admin: Boolean!, requestId: ID!): GroupMember

  """
  Mutes a group chat (muted true; mentions true mutes its mentions of the caller too) or unmutes it (C-2).
  Returns the group chat.
  """
  setGroupChatMuted(groupChatId: ID!, muted: Boolean!, mentions: Boolean, requestId: ID!): GroupChat

  """
  Archives a channel (archived true) or unarchives it (C-2): the channel managers of a private universe
  (CHANNEL_MANAGERS_ONLY); the general channel stays (CHANNEL_GENERAL_STAYS). Returns the channel.
  """
  setChannelArchived(channel: String!, archived: Boolean!, requestId: ID!): Channel

  """
  Mutes a joined channel (muted true; mentions true mutes its mentions of the caller too) or unmutes it
  (C-2). CHANNEL_NOT_JOINED. Returns the channel.
  """
  setChannelMuted(channel: String!, muted: Boolean!, mentions: Boolean, requestId: ID!): Channel

  """
  The owner or an admin of a private universe names a member channel moderator (moderator true) or removes
  the role (C-9). CHANNEL_MODERATORS_MANAGERS_ONLY, NOT_A_MEMBER, PUBLIC_CHANNEL_NO_MODERATORS. Returns the
  channel.
  """
  setChannelModerator(channel: String!, accountId: ID!, moderator: Boolean!, requestId: ID!): Channel

  """
  A channel moderator, the owner or an admin gives a member a writing ban (banned true, for hours 1, 24 or
  168 in a public channel, citing article when the moderation asks it) or lifts it (banned false; none in
  force: nothing changes) (C-9). CHANNEL_MODERATORS_ONLY, NOT_A_MEMBER, WRITING_BAN_DURATION_INVALID,
  WRITING_BAN_NOT_ALLOWED, SANCTION_ARTICLE_REQUIRED; banned true without hours: INVALID_REQUEST. Returns the
  writing ban in force; null once lifted.
  """
  setWritingBan(channel: String!, accountId: ID!, banned: Boolean!, hours: Int, article: Int, requestId: ID!): ChannelWritingBan

  """
  The Event API channels of a reading, leased until until (G-14): an address and a thread
  (watchLive), or a channel (watchChannel). Call it again every 5 minutes while reading (a channel: it
  counts the live readers). LIVE_TARGET_INVALID, the address codes. Ephemeral: no requestId (a lease
  renewed every 5 minutes; playing it again renews it again).
  """
  watch(address: String, threadId: ID, channel: String): LiveWatch

  """
  A member after the conditions changed, or a non-member before replying or posting in an exposed part.
  """
  acceptUniverseConditions(conditionsVersion: Int!, universe: String!, requestId: ID!): Universe

  """
  Every waiting request at once: accepted up to the member tier (the others stay waiting), or refused.
  """
  answerAllJoinRequests(accept: Boolean!, universe: String!, requestId: ID!): JoinRequestsAnswer

  """
  The leadership, within 24 hours of the end: approved, the summary is posted at once (or as soon as it is
  written); declined, never.
  """
  answerDebateSummary(approve: Boolean!, name: String!, universe: String!, requestId: ID!): Post

  """
  The owner or an admin of a private universe answers the join request of an account: accept true makes it a
  member (MEMBER_TIER_FULL, NON_PAYING_MEMBERS_LIMIT), false refuses it. Returns how many requests are
  answered and how many still wait.
  """
  answerJoinRequest(accept: Boolean!, accountId: ID!, universe: String!, requestId: ID!): JoinRequestsAnswer

  """
  The account a private universe is transferred to accepts (accept true: it becomes its owner) or declines.
  Returns the universe.
  """
  answerUniverseTransfer(accept: Boolean!, universe: String!, requestId: ID!): Universe

  """
  An account asks to join a private universe joined by request, with the version of its conditions it accepts
  (CONDITIONS_NOT_ACCEPTED). Returns the join request.
  """
  askToJoinUniverse(conditionsVersion: Int, universe: String!, requestId: ID!): JoinRequest

  """
  A resident attends a universe event (attending true) or no longer. Returns the event.
  """
  attendUniverseEvent(attending: Boolean!, eventId: ID!, requestId: ID!): UniverseEvent

  """
  The owner cancels the deletion of its private universe before it is deleted for good. Returns the deletion
  as it stands.
  """
  cancelUniverseDeletion(universe: String!, requestId: ID!): UniverseDeletion

  """
  The owner changes the settings of its private universe (since v78.0.0, in one input, P-5:
  PrivateUniverseChangeInput): the display case ("display", the same name), the join mode; "legalSpace" is
  always refused; since v78.0.0 (D-214), the automatic alternative texts ("automaticAlt": off, no suggested
  alternative text either) and the automatic subtitles ("automaticSubtitles") of the posts of the universe, on
  by default, turned off or back on (turned back on, only what is posted from then on gets them);
  ONLY_OWNER_CHANGES_AUTOMATIC_ALT, ONLY_OWNER_CHANGES_AUTOMATIC_SUBTITLES. A field not given stays.
  """
  changePrivateUniverse(input: PrivateUniverseChangeInput!, universe: String!, requestId: ID!): Universe

  """
  Looks for the DNS TXT record of an own domain: found, the private universe is created. Returns the creation.
  """
  checkDnsProof(domain: String!, requestId: ID!): PrivateUniverseCreation

  """
  After a declaration found false (since v56.0.0): the owner chooses the free member tier of a team,
  10 members (a hosted name only: TEAM_TIER_HOSTED_NAME_ONLY); its members all stay, read-only beyond 10.
  """
  chooseTeamMemberTier(universe: String!, requestId: ID!): Universe

  """
  Its opener or the leadership closes a debate before its end. Returns the debate.
  """
  closeDebate(name: String!, universe: String!, requestId: ID!): Debate

  """
  Creates a poll in a public universe: the leadership at once, a resident at the support of 5 residents.
  Returns the poll.
  """
  createPoll(choices: [String!]!, question: String!, universe: String!, requestId: ID!): Poll

  """
  The owner declares an association (its registration number) or an open-source project (the
  https URL of its public repository): the member tier goes to 1,000 at once, free.
  """
  declareUniverse(kind: UniverseDeclarationKind!, reference: String!, universe: String!, requestId: ID!): Universe

  """
  Only the owner: hidden at once, deleted for good 30 days later unless cancelled meanwhile.
  """
  deletePrivateUniverse(universe: String!, requestId: ID!): UniverseDeletion

  """
  The leadership, or whoever asked for it, deletes a universe event (eventId); the attendees are told. True
  once done.
  """
  deleteUniverseEvent(eventId: ID!, requestId: ID!): Boolean

  """
  A sub-universe (never the first level) and everything below it; "access": READ by default.
  """
  exposeUniverse(access: ExposedAccess, universe: String!, requestId: ID!): Universe

  """
  Its opener or the leadership extends a debate by hours, once (extended). Returns the debate.
  """
  extendDebate(hours: Int!, name: String!, universe: String!, requestId: ID!): Debate

  """
  The owner or an admin hides the exposed parts of a private universe again. Returns the universe.
  """
  hideUniverse(universe: String!, requestId: ID!): Universe

  """
  The owner and the admins: an account ("accountId") or an email address ("email"), one of the two.
  "unblock": an inviter that blocked the account unblocks it at the same time. An email address is
  always answered "sent" (WAITING, no invitee), whatever becomes of it.
  """
  inviteToUniverse(accountId: ID, email: String, unblock: Boolean, universe: String!, requestId: ID!): UniverseInvitation

  """
  A human joins a public universe of the first level (its presence covers its sub-universes), for 30 days
  renewed by its activity; REJOIN_TOO_SOON within 7 days of leaving. Returns its residence and, since
  v76.0.0 (D-208), "&general" to offer to join.
  """
