"""
The folding of the posts of a public universe (universe-reputation.feature): its folding
threshold now ("threshold": the larger of 3 and "coefficient" times the square root of its
residents, rounded up; twice it removes a post from feeds), the coefficient in force (one half
by default, changed by a proposal of kind FOLDING_COEFFICIENT) and the bounds the social
platform sets for it.
"""
type UniverseFolding {
  """
  The coefficient of the folding threshold.
  """
  coefficient: Float!
  """
  The highest coefficient the social platform allows.
  """
  maxCoefficient: Float!
  """
  The lowest coefficient the social platform allows.
  """
  minCoefficient: Float!
  """
  The threshold.
  """
  threshold: Int!
}

"""
The caller's reputation in a public universe: "share" of weighted likes (null while neutral, below 10 weighted
