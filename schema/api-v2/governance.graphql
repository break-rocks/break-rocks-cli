  governor: AccountRef!
  """
  Its powers.
  """
  powers: [SubUniversePower!]!
  """
  Since when.
  """
  since: AWSDateTime!
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
}

"""
A power given to the governance of a sub-universe.
"""
enum SubUniversePower {
  ANNOUNCEMENTS
  MODERATION
  PINNED_POSTS
}

"""
An appeal waiting in a universe, for its leadership: the sanction (without the resident), who decides it, the
juries drawn.
"""
type UniverseAppeal {
  """
  The articles of the charter cited, in increasing order.
  """
  articles: [Int!]!
  """
  The number of days.
  """
  days: Int
  """
  Who decides it.
  """
  decider: AppealDecider!
  """
  The juries drawn.
  """
  juries: Int!
  """
  The kind of the universe appeal.
  """
  kind: SanctionKind!
  """
  When it was opened.
  """
  openedAt: AWSDateTime!
  """
  The reasons given.
  """
  reasons: [ReportReason!]!
  """
  The identifier of the sanction.
  """
  sanctionId: ID!
  """
  When the sanction was given.
  """
  sanctionedAt: AWSDateTime!
  """
  The content in short, 140 visible characters at most; null once the content is deleted or ended.
  """
  snippet: String
  """
  The address of the universe, with its sign ("%paris").
  """
  universe: String!
