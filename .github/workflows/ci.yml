name: CI

# Lint, types, unit tests, the build, the executable, its completion scripts and its MCP server on
# stdio, on Linux, macOS and Windows (the CLI runs wherever Node 24 runs: README § Systèmes), on
# every push to main and every pull request.
# No AWS credentials, no network: the CLI is tested against fakes, and against the versioned copy of
# the schema of the platform (schema/schema.graphql). The job "check" is the one status main requires:
# it fails if any system fails.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The executable answers
        shell: bash
        env:
          BREAKROCKS_CONFIG_DIR: ${{ runner.temp }}/breakrocks-config
        run: |
          test "$(node bin/breakrocks.js --version)" = "$(node -p "require('./package.json').version")"
          node bin/breakrocks.js help --json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!j.commands.length) process.exit(1)"
          node bin/breakrocks.js schema all --json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!j.every((c)=>c.input.type==='object')) process.exit(1)"
          node bin/breakrocks.js theme prompt --field sport --mood "stadium at night" --name stade-nuit --universe %football | grep -q 'break-rocks-theme/2'
          node bin/breakrocks.js --env dev operator keygen --json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!j.fingerprint || JSON.stringify(j).includes('PRIVATE KEY')) process.exit(1)"
          node bin/breakrocks.js nope && exit 1 || test $? -eq 2
      - name: The completion scripts
        shell: bash
        env:
          BREAKROCKS_CONFIG_DIR: ${{ runner.temp }}/breakrocks-config
        run: |
          npm run gen:completions
          for f in bash zsh fish ps1; do test -s "completions/breakrocks.$f"; done
          test "$(node bin/breakrocks.js __complete posts list --k)" = "--kind"
          node bin/breakrocks.js completion pwsh | grep -q 'Register-ArgumentCompleter'
          if [ "$RUNNER_OS" != Windows ]; then bash -n completions/breakrocks.bash; fi
      - name: The npm package (what npm publish would send)
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e "const [p]=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); const f=p.files.map((x)=>x.path); for (const need of ['bin/breakrocks.js','dist/index.js','dist/cli.js','completions/breakrocks.bash','README.md']) if (!f.includes(need)) { console.error('missing', need); process.exit(1); } const bad=f.filter((x)=>/^(src|test|scripts|schema)\//.test(x)); if (bad.length) { console.error('unexpected', bad); process.exit(1); } console.log(p.name, p.version, f.length, 'files', p.size, 'bytes')" "$RUNNER_TEMP/pack.json"
      - name: The MCP server on stdio
        shell: bash
        env:
          BREAKROCKS_CONFIG_DIR: ${{ runner.temp }}/breakrocks-config
        run: |
          node test/smoke/mcp-stdio.mjs
          node test/smoke/mcp-stdio.mjs breakrocks_posts_list '{"address":"%test-village-sport","limit":2}' --expect-error SIGN_IN_REQUIRED -- --env dev
          node test/smoke/mcp-stdio.mjs breakrocks_inbox '{"unread":true}' --expect-error SIGN_IN_REQUIRED -- --env dev

  check:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every system passed
        run: test "${{ needs.test.result }}" = "success"
