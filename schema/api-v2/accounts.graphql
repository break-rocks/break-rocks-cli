  The pending trusted device it names (APPROVE_DEVICE); null otherwise.
  """
  deviceId: ID
  """
  When it expires.
  """
  expiresAt: AWSDateTime!
  """
  The kind of agent act it names (GIVE_MANDATE); null otherwise.
  """
  kind: AgentMandateKind
  """
  What it is for.
  """
  purpose: TrustedDeviceChallengePurpose!
}

