  name: String!
  """
  Its document (JSON), as published.
  """
  document: AWSJSON!
  """
  When it was last updated.
  """
  updatedAt: AWSDateTime!
}

"""
A screenshot at a breakpoint: url the day variant, urlNight the night one; widths the widths served
